const IDLE=['The machine is awake. No patient on the table.','Admit a track: press the button or drop a file anywhere.','Philosophy: let the track breathe. Let the track hit.','Loudness is an outcome, never the objective.','I will measure first, decide second, and explain only what I did.','Doing nothing is a valid treatment.','Hover the glyphs. The cypher will teach you.','Every note I write will correspond to a real measurement.'];
const RDY=['Switch between ORIGINAL and MASTERED. Level match keeps the comparison honest.','Watch the red cursor on the waveform; the numbers below follow it.','Treated regions are marked on the spectrum in red and gold.','Satisfied? Discharge writes a 16-bit WAV with dither.','Not satisfied? Admit another patient. The log resets.'];
say(IDLE[0],'amb');setInterval(()=>{if(loading||S.play)return;say(S.A?RDY[ii++%RDY.length]:IDLE[++ii%IDLE.length],'amb')},4200);
