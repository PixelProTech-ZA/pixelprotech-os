<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PixelProTech OS</title>
<meta name="theme-color" content="#07070A">
<meta name="description" content="PixelProTech OS — a browser-native operating environment built by PixelProTech Solutions.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070A; --bg2:#0b0b11; --bg3:#101018;
  --glass:rgba(255,255,255,0.035); --glass2:rgba(255,255,255,0.06);
  --br:rgba(255,255,255,0.08); --br2:rgba(255,255,255,0.16); --br3:rgba(255,255,255,0.26);
  --pp:#7B2FFF; --tl:#00D4AA; --gd:#D8B96A; --rd:#FF4D4D; --wh:#FFFFFF;
  --tx:#F1EEFA; --tx2:#9A90B8; --tx3:#5B5476;
  --pp-a:rgba(123,47,255,.18); --tl-a:rgba(0,212,170,.16); --gd-a:rgba(216,185,106,.16);
  --disp:'Orbitron',sans-serif; --body:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
  --taskbar-h:56px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx); font-family:var(--body);
  overflow:hidden; position:relative; -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; user-select:none;
}
input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text}
::selection{background:var(--pp); color:#fff}
button{font-family:inherit; cursor:pointer}
::-webkit-scrollbar{width:8px; height:8px}
::-webkit-scrollbar-thumb{background:var(--br2); border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ================= BOOT ================= */
#boot{
  position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  transition:opacity .5s ease, visibility .5s;
}
#boot.hidden{opacity:0; visibility:hidden; pointer-events:none}
.boot-mark{width:74px; height:74px; position:relative}
.boot-mark svg{width:100%; height:100%}
.boot-word{font-family:var(--disp); font-weight:900; font-size:15px; letter-spacing:.42em; color:var(--tx)}
.boot-word span{color:var(--tl)}
.boot-log{width:min(360px,80vw); font-family:var(--mono); font-size:10.5px; color:var(--tx2); display:flex; flex-direction:column; gap:6px}
.boot-log div{display:flex; justify-content:space-between; opacity:0; transform:translateY(4px); animation:bootRow .35s forwards}
.boot-log div b{color:var(--tl); font-weight:500}
@keyframes bootRow{to{opacity:1; transform:none}}
.boot-bar{width:min(360px,80vw); height:2px; background:var(--br); border-radius:2px; overflow:hidden}
.boot-bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--pp),var(--tl)); transition:width .3s linear}

/* ================= DESKTOP ================= */
#desktop{position:fixed; inset:0; overflow:hidden}
#wallpaper{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(680px 460px at 14% 8%, var(--pp-a), transparent 60%),
    radial-gradient(620px 460px at 88% 92%, var(--tl-a), transparent 60%),
    var(--bg);
}
.wallpaper-grid{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 40%, #000 40%, transparent 85%);
}
#workspace{position:absolute; left:0; right:0; top:0; bottom:var(--taskbar-h); overflow:hidden}
.desktop-icons{position:absolute; top:18px; left:18px; display:flex; flex-direction:column; gap:4px; z-index:1}
#deskMark{
  position:absolute; left:50%; bottom:64px; transform:translateX(-50%); z-index:0; pointer-events:none;
  font-family:var(--mono); font-size:11px; letter-spacing:.22em; color:var(--tx3); white-space:nowrap;
  text-transform:uppercase; opacity:.55;
}
.dm-cursor{color:var(--tl); margin-left:2px; animation:dmBlink 1s step-end infinite}
@keyframes dmBlink{50%{opacity:0}}
@media(max-width:720px){ #deskMark{font-size:9px; bottom:80px; letter-spacing:.14em} }
.dicon{
  width:78px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 4px;
  border-radius:10px; border:1px solid transparent; background:transparent;
}
.dicon:hover{background:var(--glass); border-color:var(--br)}
.dicon .dicon-badge{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--glass2); border:1px solid var(--br2); position:relative}
.dicon svg{width:20px; height:20px}
.dicon span{font-size:9.5px; letter-spacing:.03em; color:var(--tx2); text-align:center; line-height:1.3}

/* ================= TASKBAR ================= */
#taskbar{
  position:absolute; left:0; right:0; bottom:0; height:var(--taskbar-h); z-index:500;
  display:flex; align-items:center; gap:10px; padding:0 12px;
  background:rgba(10,10,15,.82); backdrop-filter:blur(16px) saturate(140%);
  border-top:1px solid var(--br);
}
#launcherBtn{
  width:38px; height:38px; border-radius:9px; border:1px solid var(--br2); background:var(--glass2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.15s;
}
#launcherBtn svg{width:19px; height:19px}
#launcherBtn:hover{border-color:var(--pp); box-shadow:0 0 0 3px var(--pp-a)}
#launcherBtn.on{border-color:var(--tl); box-shadow:0 0 0 3px var(--tl-a)}
#taskbarApps{display:flex; gap:6px; align-items:center; flex:1; overflow-x:auto; height:100%}
.tb-app{
  height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--br); background:var(--glass);
  display:flex; align-items:center; gap:7px; color:var(--tx2); font-size:11px; flex-shrink:0; white-space:nowrap;
}
.tb-app svg{width:14px; height:14px; flex-shrink:0}
.tb-app.active{border-color:var(--tl); color:var(--tx); background:var(--tl-a)}
.tb-app .tb-x{opacity:.5; padding:2px}
.tb-app .tb-x:hover{opacity:1; color:var(--rd)}
#tb-right{display:flex; align-items:center; gap:10px; flex-shrink:0}
#tb-net{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--tx2)}
#tb-net .dot{width:6px; height:6px; border-radius:50%; background:var(--tl); box-shadow:0 0 6px var(--tl)}
#tb-net.off .dot{background:var(--rd); box-shadow:0 0 6px var(--rd)}
#tb-clock{font-family:var(--mono); font-size:12px; color:var(--tx); text-align:right; line-height:1.15; cursor:default}
#tb-clock b{display:block; font-size:9px; color:var(--tx3); font-weight:400; letter-spacing:.06em}

/* ================= LAUNCHER ================= */
#launcher{
  --lc:#00D4AA;
  position:absolute; left:12px; bottom:calc(var(--taskbar-h) + 10px); width:min(600px,92vw);
  max-height:min(600px,74vh);
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(123,47,255,.26), transparent 55%),
    radial-gradient(90% 70% at 100% 100%, rgba(0,212,170,.14), transparent 60%),
    linear-gradient(160deg,#272047 0%,#1c1838 55%,#181531 100%);
  border:1px solid rgba(190,170,255,.42); border-radius:18px; z-index:600; padding:16px;
  display:flex; flex-direction:column; gap:12px;
  box-shadow:0 0 0 1px rgba(123,47,255,.25), 0 22px 60px rgba(0,0,0,.55), 0 0 40px rgba(123,47,255,.18);
  transform:translateY(12px) scale(.98); opacity:0; pointer-events:none; transition:.18s ease;
}
#launcher.open{transform:none; opacity:1; pointer-events:auto}
#launcher-search{
  background:rgba(255,255,255,.10); border:1px solid rgba(210,195,255,.40); border-radius:10px; padding:10px 13px;
  color:#fff; font-size:13.5px; font-family:var(--body); outline:none;
}
#launcher-search:focus{border-color:#00D4AA; box-shadow:0 0 0 3px rgba(0,212,170,.22); background:rgba(255,255,255,.14)}
#launcher-search::placeholder{color:#B9AEDD}
.launcher-cat{
  --lc:#00D4AA; display:flex; align-items:center; gap:9px;
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.18em; color:var(--lc); margin:8px 0 0;
}
.launcher-cat::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--lc),transparent); opacity:.55}
#launcher-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; overflow-y:auto; padding-right:4px; scrollbar-color:#7B2FFF #1c1838}
.lgrid-item{
  --lc:#00D4AA;
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 6px; border-radius:12px;
  border:1px solid transparent; background:transparent; color:#EDE8FB; text-align:center; transition:.14s;
}
.lgrid-item:hover,.lgrid-item:focus-visible{background:rgba(255,255,255,.11); border-color:var(--lc); color:#fff; outline:none; transform:translateY(-2px)}
.lgrid-badge{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--lc) 22%, #1c1838); border:1px solid color-mix(in srgb,var(--lc) 65%, transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--lc) 28%, transparent), inset 0 0 10px color-mix(in srgb,var(--lc) 14%, transparent);
}
.lgrid-badge svg{width:22px; height:22px; color:var(--lc)}
.lgrid-badge svg, .lgrid-badge svg *{stroke:var(--lc)}
.lgrid-item span{font-size:11px; line-height:1.25; font-weight:500}
[data-cat="Company"]{--lc:#F0CE7A} [data-cat="System"]{--lc:#B79CFF} [data-cat="Tools"]{--lc:#2EF0C4}
[data-cat="Office"]{--lc:#6DBBFF} [data-cat="Field Tech"]{--lc:#FFAE5C} [data-cat="Network"]{--lc:#55E6FF}
[data-cat="Internet"]{--lc:#7CF0B0} [data-cat="Media"]{--lc:#FF7CC2} [data-cat="Learn"]{--lc:#FFD86B}
[data-cat="Audio"]{--lc:#D08CFF} [data-cat="Life"]{--lc:#98EE98} [data-cat="Security"]{--lc:#FF7D7D}
[data-cat="Dev"]{--lc:#86AEFF} [data-cat="Hardware"]{--lc:#FFC27A} [data-cat="Visual Lab"]{--lc:#FF6CE6}
[data-cat="Games"]{--lc:#FF8566}

/* ================= WINDOWS ================= */
.win-busy iframe{pointer-events:none}
.pwin-body.game{padding:0; overflow:hidden; background:#000}
.pwin-body.game iframe{width:100%; height:100%; border:0; display:block; background:#000}
.pwin{
  position:absolute; min-width:280px; min-height:200px; background:rgba(13,13,19,.97);
  border:1px solid var(--br2); border-radius:13px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 50px rgba(0,0,0,.5); backdrop-filter:blur(10px);
}
.pwin.focused{border-color:var(--br3); box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 1px var(--pp-a)}
.pwin.minimized{display:none}
.pwin.maximized{border-radius:0}
.pwin-tb{
  height:38px; flex-shrink:0; display:flex; align-items:center; gap:8px; padding:0 8px 0 12px;
  background:linear-gradient(90deg, var(--bg3), #0d0d14); border-bottom:1px solid var(--br); cursor:grab;
}
.pwin-tb:active{cursor:grabbing}
.pwin-tb svg{width:14px; height:14px; flex-shrink:0; color:var(--tl)}
.pwin-title{font-size:11px; letter-spacing:.03em; color:var(--tx2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pwin-ctrl{display:flex; gap:6px}
.pwin-ctrl button{
  width:22px; height:22px; border-radius:6px; border:1px solid var(--br); background:var(--glass);
  color:var(--tx3); display:flex; align-items:center; justify-content:center;
}
.pwin-ctrl button:hover{color:var(--tx); border-color:var(--br2)}
.pwin-ctrl button.close:hover{color:#fff; background:var(--rd); border-color:var(--rd)}
.pwin-ctrl svg{width:11px; height:11px}
.pwin-body{flex:1; overflow:auto; padding:16px; font-size:12.5px; color:var(--tx)}
.pwin-resize{position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize}
.pwin-resize::after{content:''; position:absolute; right:4px; bottom:4px; width:7px; height:7px; border-right:2px solid var(--br3); border-bottom:2px solid var(--br3)}

/* ================= SHARED APP UI ================= */
.app-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--br); font-size:11.5px}
.app-row:last-child{border-bottom:none}
.app-row span:first-child{color:var(--tx2)}
.tag{font-family:var(--mono); font-size:9.5px; padding:2px 7px; border-radius:5px; letter-spacing:.03em}
.tag.ok{background:var(--tl-a); color:var(--tl)}
.tag.warn{background:var(--gd-a); color:var(--gd)}
.tag.no{background:rgba(255,77,77,.14); color:var(--rd)}
.app-section-h{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--tx3); margin:14px 0 4px}
.app-section-h:first-child{margin-top:0}
.btn{background:var(--glass2); border:1px solid var(--br2); color:var(--tx); padding:7px 13px; border-radius:8px; font-size:11.5px; transition:.15s}
.btn:hover{border-color:var(--tl); color:var(--tl)}
.btn.primary{background:linear-gradient(90deg,var(--pp),var(--tl)); border:none; color:#0a0a0f; font-weight:600}
.btn.primary:hover{filter:brightness(1.08); color:#0a0a0f}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0}
.mono{font-family:var(--mono)}
.dim{color:var(--tx3)}

/* ---- calculator ---- */
.calc-screen{background:var(--bg2); border:1px solid var(--br); border-radius:9px; padding:14px; text-align:right; margin-bottom:10px}
.calc-hist{font-family:var(--mono); font-size:10px; color:var(--tx3); min-height:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.calc-val{font-family:var(--mono); font-size:26px; color:var(--tx); word-break:break-all}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.calc-grid button{padding:12px 0; border-radius:8px; border:1px solid var(--br2); background:var(--glass); color:var(--tx); font-size:14px}
.calc-grid button:hover{border-color:var(--tl)}
.calc-grid button.op{color:var(--tl)}
.calc-grid button.eq{background:linear-gradient(90deg,var(--pp),var(--tl)); color:#0a0a0f; font-weight:700; border:none}

/* ---- clock ---- */
.clock-big{font-family:var(--disp); font-size:44px; font-weight:700; text-align:center; margin:6px 0}
.clock-date{text-align:center; color:var(--tx2); font-size:12px; margin-bottom:14px}
.clock-tz{text-align:center; color:var(--tx3); font-size:10px; font-family:var(--mono); margin-bottom:16px}
.stopwatch-time{font-family:var(--mono); font-size:30px; text-align:center; margin:10px 0}
.tab-row{display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--br); padding-bottom:8px}
.tab-btn{background:transparent; border:1px solid var(--br); color:var(--tx3); padding:5px 12px; border-radius:7px; font-size:10.5px}
.tab-btn.active{border-color:var(--tl); color:var(--tl); background:var(--tl-a)}
.lap-list{max-height:100px; overflow-y:auto; font-family:var(--mono); font-size:10.5px; color:var(--tx2)}
.lap-list div{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--br)}

/* ---- camera / recorder ---- */
.media-frame{width:100%; aspect-ratio:16/10; background:var(--bg2); border:1px solid var(--br2); border-radius:10px; overflow:hidden; position:relative; margin-bottom:10px}
.media-frame video, .media-frame img{width:100%; height:100%; object-fit:cover}
.media-frame canvas{width:100%; height:100%}
.status-pill{position:absolute; top:8px; left:8px; font-family:var(--mono); font-size:9.5px; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.55); color:var(--tx2); border:1px solid var(--br2)}
.status-pill.live{color:var(--rd); border-color:var(--rd)}
.thumb-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.thumb{width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--br2); position:relative}
.thumb img,.thumb audio{width:100%}
.thumb a{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); opacity:0; font-size:14px}
.thumb:hover a{opacity:1}

/* ---- terminal ---- */
.term{background:#050508; border:1px solid var(--br2); border-radius:9px; height:280px; display:flex; flex-direction:column; font-family:var(--mono); font-size:11.5px}
.term-out{flex:1; overflow-y:auto; padding:10px 12px; white-space:pre-wrap; word-break:break-word; color:var(--tl)}
.term-out .cmd{color:var(--tx)}
.term-out .err{color:var(--rd)}
.term-in{display:flex; align-items:center; border-top:1px solid var(--br); padding:8px 12px}
.term-in span{color:var(--tl); margin-right:6px}
.term-in input{flex:1; background:transparent; border:none; color:var(--tx); font-family:var(--mono); font-size:11.5px; outline:none}

/* ---- files ---- */
.drop{border:1.5px dashed var(--br2); border-radius:10px; padding:26px 14px; text-align:center; color:var(--tx3); font-size:11.5px; margin-bottom:12px}
.drop.over{border-color:var(--tl); color:var(--tl); background:var(--tl-a)}
.file-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--br); font-size:11px}
.file-row .fname{color:var(--tx); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%}
.file-row .fmeta{color:var(--tx3); font-family:var(--mono); font-size:9.5px}

/* ---- settings ---- */
.set-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--br)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:11.5px}
.set-label small{display:block; color:var(--tx3); font-size:9.5px; margin-top:2px}
.swatch-row{display:flex; gap:8px}
.swatch{width:26px; height:26px; border-radius:7px; border:2px solid transparent}
.swatch.active{border-color:#fff}
.toggle{width:38px; height:21px; border-radius:11px; background:var(--br2); position:relative; border:none; flex-shrink:0}
.toggle.on{background:var(--tl)}
.toggle::after{content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2.5px; left:3px; transition:.15s}
.toggle.on::after{left:19px}
select{background:var(--glass2); border:1px solid var(--br2); color:var(--tx); padding:6px 9px; border-radius:7px; font-size:11px; font-family:inherit}

/* ---- diagnostics ---- */
.diag-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--br); font-size:11.5px}

/* ---- notifications ---- */
#notif-stack{position:absolute; top:14px; right:14px; z-index:9000; display:flex; flex-direction:column; gap:8px; width:280px}
.notif{
  background:rgba(15,15,22,.96); border:1px solid var(--br2); border-left:3px solid var(--tl); border-radius:9px;
  padding:10px 12px; font-size:11px; color:var(--tx2); box-shadow:0 10px 26px rgba(0,0,0,.4);
  animation:notifIn .25s ease;
}
.notif b{color:var(--tx); display:block; margin-bottom:2px; font-size:11.5px}
@keyframes notifIn{from{opacity:0; transform:translateX(20px)} to{opacity:1; transform:none}}

@media(max-width:720px){
  .pwin{min-width:0 !important}
  #launcher{width:calc(100vw - 24px); left:12px; right:12px}
  #notif-stack{width:calc(100vw - 28px)}
  .clock-big{font-size:34px}
}
</style>

</head>
<body>

<!-- ================= BOOT ================= -->
<div id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 100 100"><polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#D8B96A" stroke-width="2"/><polygon points="50,50 50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke="#7B2FFF" stroke-width="1.4"/><polygon points="50,20 68,50 50,80 32,50" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B2FFF"/><stop offset="1" stop-color="#00D4AA"/></linearGradient></defs><rect x="46" y="38" width="4" height="24" fill="#07070A"/><ellipse cx="50" cy="50" rx="3" ry="2" fill="#fff"/></svg>
  </div>
  <div class="boot-word">PIXELPROTECH<span> OS</span></div>
  <div class="boot-log" id="bootLog"></div>
  <div class="boot-bar"><i id="bootBar"></i></div>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop">
  <div id="wallpaper"></div>
  <div class="wallpaper-grid"></div>
  <div id="workspace">
    <div class="desktop-icons" id="desktopIcons"></div>
    <div id="deskMark" aria-hidden="true"><span id="deskMarkText"></span><span class="dm-cursor">_</span></div>
  </div>

  <div id="notif-stack"></div>

  <div id="launcher">
    <input id="launcher-search" placeholder="Search Pixel apps…" autocomplete="off">
    <div id="launcher-grid"></div>
  </div>

  <div id="taskbar">
    <button id="launcherBtn" title="Launcher">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
    </button>
    <div id="taskbarApps"></div>
    <div id="tb-right">
      <div id="tb-net"><span class="dot"></span><span id="tb-net-label">ONLINE</span></div>
      <div id="tb-clock"><b id="tb-date">--</b><span id="tb-time">--:--:--</span></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   PIXEL CORE
   ========================================================= */
const PixelOS = {
  version: "0.8.0",
  core: { eventBus: new EventTarget() },
  apps: {},        // registry: id -> definition
  windows: new Map(), // winId -> record
  zTop: 10,
  storageKey: "pixelos.settings.v1",
  settings: { clock24: true, accent: "pp", reduceMotion: false, launcherPinned: [], fx: true, fxQuality: "auto" },
  desktopIcons: ["commandcentre","pp-profile","pp-engine","pp-coverage","pp-reactor","terminal","files","settings","hamba-rides","orchard-shift","homebase"],
};

function emit(name, detail){ PixelOS.core.eventBus.dispatchEvent(new CustomEvent(name, {detail})); }
function on(name, fn){ PixelOS.core.eventBus.addEventListener(name, fn); }

/* ---- persistent settings ---- */
function loadSettings(){
  try{
    const raw = localStorage.getItem(PixelOS.storageKey);
    if(raw) Object.assign(PixelOS.settings, JSON.parse(raw));
  }catch(e){ /* storage unavailable — settings stay in-memory defaults */ }
}
function saveSettings(){
  try{ localStorage.setItem(PixelOS.storageKey, JSON.stringify(PixelOS.settings)); }
  catch(e){ notify("Storage unavailable", "Settings will not persist across reloads."); }
}
loadSettings();

/* ---- notifications (real: fired by actual app/system events only) ---- */
function notify(title, body){
  const stack = document.getElementById("notif-stack");
  const el = document.createElement("div");
  el.className = "notif";
  el.innerHTML = `<b>${escapeHtml(title)}</b>${escapeHtml(body||"")}`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),320); }, 4200);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getBrowserLabel(){
  const ua = navigator.userAgent;
  const order = [["Edg","Edge"],["OPR","Opera"],["Chrome","Chrome"],["Firefox","Firefox"],["Safari","Safari"]];
  for(const [token,label] of order){
    const m = ua.match(new RegExp(token+"/([\\d.]+)"));
    if(m) return `${label}/${m[1]}`;
  }
  return ua.slice(0,40);
}

/* ---- icon helper (each app gets a distinct geometric glyph, not text) ---- */
function svgIcon(paths, stroke){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke||'currentColor'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
}
const ICONS = {
  commandcentre: svgIcon('<path d="M12 3l7 4v10l-7 4-7-4V7z"/><circle cx="12" cy="12" r="3"/>'),
  time:      svgIcon('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/>'),
  calc:      svgIcon('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h2M8 15h2M12 15h2M16 15h2v4"/>'),
  camera:    svgIcon('<path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/>'),
  recorder:  svgIcon('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4M9 21h6"/>'),
  files:     svgIcon('<path d="M4 6h5l2 2h9v11H4z"/>'),
  terminal:  svgIcon('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>'),
  network:   svgIcon('<path d="M4 8.5a12 12 0 0116 0M7 12a7.5 7.5 0 0110 0M10 15.5a3 3 0 014 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>'),
  settings:  svgIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9c.14.36.5.6 1.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.51 1z"/>'),
  diagnostics: svgIcon('<path d="M3 12h4l2-7 4 14 2-7h6"/>'),
};

/* =========================================================
   WINDOW MANAGER
   ========================================================= */
let winCounter = 0;
function openWindow(appId){
  const app = PixelOS.apps[appId];
  if(!app){ return; }
  // if already open and not multi-instance, focus it
  const existing = [...PixelOS.windows.values()].find(w=>w.appId===appId && !app.multiInstance);
  if(existing){ focusWindow(existing.id); if(existing.minimized) toggleMinimize(existing.id); return existing.id; }

  const id = "w"+(++winCounter);
  const isMobile = window.innerWidth < 720;
  const w = isMobile ? window.innerWidth - 20 : (app.width||420);
  const h0 = isMobile ? Math.min(window.innerHeight - 130, app.height||480) : (app.height||480);
  const x = isMobile ? 10 : 60 + (winCounter%6)*26;
  const y = isMobile ? 10 : 40 + (winCounter%6)*22;
  const hFit = Math.max(240, window.innerHeight - 56 - y - 10);
  const h = Math.min(h0, hFit);

  const el = document.createElement("div");
  el.className = "pwin";
  el.style.cssText = `left:${x}px; top:${y}px; width:${w}px; height:${h}px; z-index:${++PixelOS.zTop}`;
  el.innerHTML = `
    <div class="pwin-tb" data-drag>
      ${app.icon}<span class="pwin-title">${escapeHtml(app.name)}</span>
      <div class="pwin-ctrl">
        <button data-act="min" title="Minimize">${svgIcon('<path d="M5 12h14"/>')}</button>
        <button data-act="max" title="Maximize">${svgIcon('<rect x="5" y="5" width="14" height="14" rx="1.5"/>')}</button>
        <button data-act="close" class="close" title="Close">${svgIcon('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
      </div>
    </div>
    <div class="pwin-body"></div>
    <div class="pwin-resize"></div>
  `;
  document.getElementById("workspace").appendChild(el);

  const rec = { id, appId, el, x, y, w, h, minimized:false, maximized:false, prev:null, cleanups:[] };
  PixelOS.windows.set(id, rec);

  const body = el.querySelector(".pwin-body");
  const winApi = {
    setTitle: t=>{ el.querySelector(".pwin-title").textContent = t; },
    close: ()=>closeWindow(id),
    notify,
    onClose: fn=>rec.cleanups.push(fn),
  };
  rec.winApi = winApi;
  try{ app.launch(body, winApi); }
  catch(err){ body.innerHTML = `<div class="tag no">APP ERROR</div><p class="dim" style="margin-top:8px">${escapeHtml(err.message)}</p>`; }

  bindWindowChrome(el, id);
  focusWindow(id);
  renderTaskbarApps();
  if(PixelOS.fx) PixelOS.fx.winOpen(el, rec);
  return id;
}
function taskbarTarget(id){
  const b = document.querySelector('#taskbarApps [data-win="'+id+'"]') || document.getElementById("launcherBtn");
  if(!b) return null;
  const r = b.getBoundingClientRect();
  return { cx:r.left+r.width/2, cy:r.top+r.height/2 };
}
function closeWindow(id){
  const rec = PixelOS.windows.get(id);
  if(!rec || rec.closing) return;
  rec.closing = true;
  const target = taskbarTarget(id);
  PixelOS.windows.delete(id);
  try{ if(rec.winApi && rec.winApi._cleanup) rec.winApi._cleanup(); rec.cleanups.forEach(f=>{ try{f();}catch(e){} }); }catch(e){}
  renderTaskbarApps();
  const done = ()=>rec.el.remove();
  if(PixelOS.fx) PixelOS.fx.winClose(rec.el, target, done); else done();
}
function focusWindow(id){
  const rec = PixelOS.windows.get(id);
  if(!rec) return;
  document.querySelectorAll(".pwin").forEach(w=>w.classList.remove("focused"));
  rec.el.classList.add("focused");
  rec.el.style.zIndex = ++PixelOS.zTop;
  PixelOS.focused = id;
  renderTaskbarApps();
}
function toggleMinimize(id){
  const rec = PixelOS.windows.get(id);
  if(!rec) return;
  rec.minimized = !rec.minimized;
  if(PixelOS.fx){
    const target = taskbarTarget(id);
    if(rec.minimized) PixelOS.fx.winMinimize(rec.el, target, ()=>{ if(rec.minimized) rec.el.classList.add("minimized"); });
    else { rec.el.classList.remove("minimized"); PixelOS.fx.winRestore(rec.el, target); }
  } else rec.el.classList.toggle("minimized", rec.minimized);
  renderTaskbarApps();
}
function toggleMaximize(id){
  const rec = PixelOS.windows.get(id);
  if(!rec) return;
  const el = rec.el;
  if(!rec.maximized){
    rec.prev = {left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
    el.style.left="0"; el.style.top="0"; el.style.width="100%"; el.style.height="100%";
    el.classList.add("maximized"); rec.maximized = true;
  } else {
    Object.assign(el.style, rec.prev);
    el.classList.remove("maximized"); rec.maximized = false;
  }
}
function bindWindowChrome(el, id){
  el.addEventListener("mousedown", ()=>focusWindow(id));
  el.querySelector('[data-act="min"]').onclick = e=>{ e.stopPropagation(); toggleMinimize(id); };
  el.querySelector('[data-act="max"]').onclick = e=>{ e.stopPropagation(); toggleMaximize(id); };
  el.querySelector('[data-act="close"]').onclick = e=>{ e.stopPropagation(); closeWindow(id); };

  const tb = el.querySelector(".pwin-tb");
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  tb.addEventListener("mousedown", e=>{
    if(e.target.closest("button")) return;
    const rec = PixelOS.windows.get(id); if(rec.maximized) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    ox = el.offsetLeft; oy = el.offsetTop;
    document.body.style.userSelect="none";
  });
  window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    el.style.left = Math.max(0, ox + (e.clientX-sx)) + "px";
    el.style.top = Math.max(0, oy + (e.clientY-sy)) + "px";
  });
  window.addEventListener("mouseup", ()=>{ dragging=false; document.body.style.userSelect=""; });
  // iframes swallow mouse events: shield them while dragging/resizing a window
  tb.addEventListener("mousedown", ()=>document.body.classList.add("win-busy"));
  window.addEventListener("mouseup", ()=>document.body.classList.remove("win-busy"));
  tb.addEventListener("dblclick", ()=>toggleMaximize(id));

  const rez = el.querySelector(".pwin-resize");
  let resizing=false, rsx=0, rsy=0, rw=0, rh=0;
  rez.addEventListener("mousedown", e=>{
    document.body.classList.add("win-busy");
    resizing=true; rsx=e.clientX; rsy=e.clientY; rw=el.offsetWidth; rh=el.offsetHeight; e.stopPropagation();
  });
  window.addEventListener("mousemove", e=>{
    if(!resizing) return;
    el.style.width = Math.max(280, rw + (e.clientX-rsx)) + "px";
    el.style.height = Math.max(200, rh + (e.clientY-rsy)) + "px";
  });
  window.addEventListener("mouseup", ()=>{ resizing=false; });
}

function renderTaskbarApps(){
  const bar = document.getElementById("taskbarApps");
  bar.innerHTML = "";
  PixelOS.windows.forEach(rec=>{
    const app = PixelOS.apps[rec.appId];
    const b = document.createElement("div");
    b.dataset.win = rec.id;
    b.className = "tb-app" + (PixelOS.focused===rec.id && !rec.minimized ? " active" : "");
    b.innerHTML = `${app.icon}<span>${escapeHtml(app.name)}</span><span class="tb-x">${svgIcon('<path d="M6 6l12 12M18 6L6 18"/>')}</span>`;
    b.onclick = (e)=>{
      if(e.target.closest(".tb-x")){ closeWindow(rec.id); return; }
      if(rec.minimized){ toggleMinimize(rec.id); focusWindow(rec.id); }
      else if(PixelOS.focused===rec.id){ toggleMinimize(rec.id); }
      else { focusWindow(rec.id); }
    };
    bar.appendChild(b);
  });
}

/* =========================================================
   APP REGISTRY
   ========================================================= */
function registerApp(def){ PixelOS.apps[def.id] = def; }

/* =========================================================
   CAPABILITY DETECTION (honest — matches spec section 7/17)
   ========================================================= */
function detectCapabilities(){
  const hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const c = {};
  c.camera        = hasGUM ? "AVAILABLE WITH PERMISSION" : "NOT AVAILABLE";
  c.microphone    = hasGUM ? "AVAILABLE WITH PERMISSION" : "NOT AVAILABLE";
  c.mediaRecorder = (typeof MediaRecorder !== "undefined") ? "AVAILABLE" : "NOT AVAILABLE";
  c.audioContext  = (window.AudioContext || window.webkitAudioContext) ? "AVAILABLE" : "NOT AVAILABLE";
  c.midi          = navigator.requestMIDIAccess ? "AVAILABLE WITH PERMISSION" : "NOT AVAILABLE";
  c.fullscreen    = (document.fullscreenEnabled || document.webkitFullscreenEnabled) ? "AVAILABLE" : "NOT AVAILABLE";
  c.notifications = ("Notification" in window) ? (Notification.permission==="granted" ? "AVAILABLE" : "AVAILABLE WITH PERMISSION") : "NOT AVAILABLE";
  c.indexedDB     = ("indexedDB" in window) ? "AVAILABLE" : "NOT AVAILABLE";
  c.localStorage  = (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return "AVAILABLE"; }catch(e){ return "BLOCKED"; } })();
  c.serviceWorker = ("serviceWorker" in navigator) ? "AVAILABLE" : "NOT AVAILABLE";
  c.fileSystemAccess = ("showOpenFilePicker" in window) ? "AVAILABLE" : "LIMITED — using File API fallback";
  c.webRTC        = (typeof RTCPeerConnection !== "undefined") ? "AVAILABLE" : "NOT AVAILABLE";
  c.geolocation   = ("geolocation" in navigator) ? "AVAILABLE WITH PERMISSION" : "NOT AVAILABLE";
  c.secureContext = window.isSecureContext ? "YES" : "NO — some APIs require HTTPS";
  return c;
}

/* =========================================================
   BOOT SEQUENCE
   ========================================================= */
const bootSteps = ["Pixel Core", "Desktop Shell", "Application Registry", "Capability Detection", "System Services"];
function runBoot(cb){
  if(PixelOS.fx && PixelOS.fx.boot && PixelOS.fx.boot(cb)) return;
  defaultBoot(cb);
}
function defaultBoot(cb){
  const log = document.getElementById("bootLog");
  const bar = document.getElementById("bootBar");
  let i=0;
  const step = ()=>{
    if(i>=bootSteps.length){ setTimeout(()=>{ document.getElementById("boot").classList.add("hidden"); cb(); }, 260); return; }
    const row = document.createElement("div");
    row.style.animationDelay = (i*0.05)+"s";
    row.innerHTML = `<span>${bootSteps[i]}</span><b>OK</b>`;
    log.appendChild(row);
    bar.style.width = Math.round(((i+1)/bootSteps.length)*100) + "%";
    i++;
    setTimeout(step, 220);
  };
  step();
}

/* =========================================================
   TASKBAR CLOCK + NETWORK STATE (real values only)
   ========================================================= */
function tickClock(){
  const d = new Date();
  const h24 = PixelOS.settings.clock24;
  let hh = d.getHours();
  const suffix = h24 ? "" : (hh>=12?" PM":" AM");
  if(!h24){ hh = hh%12; if(hh===0) hh=12; }
  const mm = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  document.getElementById("tb-time").textContent = `${String(hh).padStart(2,"0")}:${mm}:${ss}${suffix}`;
  document.getElementById("tb-date").textContent = d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
setInterval(tickClock, 1000); tickClock();

function updateNetState(){
  const el = document.getElementById("tb-net");
  const label = document.getElementById("tb-net-label");
  if(navigator.onLine){ el.classList.remove("off"); label.textContent = "ONLINE"; }
  else{ el.classList.add("off"); label.textContent = "OFFLINE"; }
}
window.addEventListener("online", ()=>{ updateNetState(); notify("Network", "Connection restored — back online."); });
window.addEventListener("offline", ()=>{ updateNetState(); notify("Network", "Connection lost — running offline."); });
updateNetState();

/* =========================================================
   LAUNCHER
   ========================================================= */
function renderLauncher(filter){
  const grid = document.getElementById("launcher-grid");
  grid.innerHTML = "";
  const f = (filter||"").toLowerCase();
  const order = ["Company","System","Tools","Office","Field Tech","Network","Internet","Media","Learn","Audio","Life","Security","Dev","Hardware","Visual Lab","Games"];
  const rank = c=>{ const i=order.indexOf(c); return i<0 ? order.length : i; };
  const apps = Object.values(PixelOS.apps).filter(a=>!f || a.name.toLowerCase().includes(f) || a.category.toLowerCase().includes(f) || (a.desc||"").toLowerCase().includes(f));
  const cats = [...new Set(apps.map(a=>a.category))].sort((a,b)=>rank(a)-rank(b) || a.localeCompare(b));
  cats.forEach(cat=>{
    const h = document.createElement("div");
    h.className = "launcher-cat"; h.dataset.cat = cat; h.style.gridColumn = "1/-1"; h.textContent = cat.toUpperCase();
    grid.appendChild(h);
    apps.filter(a=>a.category===cat).forEach(app=>{
      const it = document.createElement("button");
      it.className = "lgrid-item"; it.dataset.cat = cat;
      it.innerHTML = `<div class="lgrid-badge">${app.icon}</div><span>${escapeHtml(app.name)}</span>`;
      it.onclick = ()=>{ openWindow(app.id); closeLauncher(); };
      grid.appendChild(it);
    });
  });
}
function openLauncher(){ document.getElementById("launcher").classList.add("open"); document.getElementById("launcherBtn").classList.add("on"); document.getElementById("launcher-search").focus(); }
function closeLauncher(){ document.getElementById("launcher").classList.remove("open"); document.getElementById("launcherBtn").classList.remove("on"); document.getElementById("launcher-search").value=""; renderLauncher(); }
document.getElementById("launcherBtn").onclick = ()=>{
  const open = document.getElementById("launcher").classList.contains("open");
  open ? closeLauncher() : openLauncher();
};
document.getElementById("launcher-search").addEventListener("input", e=>renderLauncher(e.target.value));
document.addEventListener("mousedown", e=>{
  const l = document.getElementById("launcher");
  if(l.classList.contains("open") && !l.contains(e.target) && e.target.id!=="launcherBtn" && !e.target.closest("#launcherBtn")) closeLauncher();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLauncher(); });

function renderDesktopIcons(){
  const wrap = document.getElementById("desktopIcons");
  wrap.innerHTML = "";
  PixelOS.desktopIcons.forEach(id=>{
    const app = PixelOS.apps[id]; if(!app) return;
    const d = document.createElement("button");
    d.className = "dicon";
    d.innerHTML = `<div class="dicon-badge">${app.icon}</div><span>${escapeHtml(app.name)}</span>`;
    d.ondblclick = ()=>openWindow(id);
    d.onclick = (e)=>{ if(e.detail===2) openWindow(id); };
    wrap.appendChild(d);
  });
}

/* ---- desktop wallpaper mark: brand typography, no mascots, honors reduce-motion ---- */
function runDeskMark(){
  const el = document.getElementById("deskMarkText");
  const lines = ["PIXELPROTECH SOLUTIONS", "TECHNOLOGY SHOULD WORK.", "WHEN IT DOESN'T, WE FIND OUT WHY.", "FIELD IT ENGINEERING & DIGITAL SYSTEMS", "BUILD · DEPLOY · REPEAT", "WE CREATE. WE DON'T COPY."];
  if(PixelOS.settings.reduceMotion){ el.textContent = lines[0]; return; }
  let li=0, ci=0, deleting=false;
  function tick(){
    const line = lines[li];
    el.textContent = line.slice(0, ci);
    if(!deleting){
      if(ci < line.length){ ci++; setTimeout(tick, 55); }
      else { deleting = true; setTimeout(tick, 1800); }
    } else {
      if(ci > 0){ ci--; setTimeout(tick, 22); }
      else { deleting = false; li = (li+1)%lines.length; setTimeout(tick, 260); }
    }
  }
  tick();
}

/* =========================================================
   APPS
   ========================================================= */

/* ---- PIXEL COMMAND CENTRE ---- */
registerApp({
  id:"commandcentre", name:"Command Centre", category:"System", icon:ICONS.commandcentre,
  width:440, height:520,
  launch(body, win){
    const c = detectCapabilities();
    const row = (k,v,ok)=>`<div class="app-row"><span>${k}</span><span class="tag ${ok}">${v}</span></div>`;
    const tagFor = v => v.startsWith("AVAILABLE") ? (v.includes("PERMISSION")?"warn":"ok") : (v.startsWith("LIMITED")?"warn":"no");
    body.innerHTML = `
      <div class="app-section-h">PIXELPROTECH SOLUTIONS (PTY) LTD</div>
      <div class="app-row"><span>Registration</span><span class="mono">2026/622131/07</span></div>
      <div class="app-row"><span>Operating base</span><span class="mono">Centurion, Gauteng, ZA</span></div>
      <div class="app-section-h">PIXELPROTECH OS</div>
      <div class="app-row"><span>Version</span><span class="mono">${PixelOS.version}</span></div>
      <div class="app-row"><span>Runtime</span><span class="mono">Browser-native (no kernel/native bridge)</span></div>
      <div class="app-row"><span>Browser</span><span class="mono">${escapeHtml(getBrowserLabel())}</span></div>
      <div class="app-row"><span>Viewport</span><span class="mono" id="cc-viewport"></span></div>
      <div class="app-row"><span>Online</span><span class="tag ${navigator.onLine?'ok':'no'}">${navigator.onLine?"ONLINE":"OFFLINE"}</span></div>
      <div class="app-row"><span>Secure context</span><span class="tag ${c.secureContext==="YES"?"ok":"warn"}">${c.secureContext}</span></div>
      <div class="app-row"><span>Storage estimate</span><span class="mono" id="cc-storage">checking…</span></div>

      <div class="app-section-h">CAPABILITIES</div>
      ${row("Camera", c.camera, tagFor(c.camera))}
      ${row("Microphone", c.microphone, tagFor(c.microphone))}
      ${row("MediaRecorder", c.mediaRecorder, tagFor(c.mediaRecorder))}

          <input id="tm-min" type="number" min="0" max="180" value="5" style="width:64px; background:var(--glass); border:1px solid var(--br2); color:var(--tx); border-radius:7px; padding:8px; text-align:center">
          <span class="dim" style="align-self:center">minutes</span>
        </div>
        <div class="stopwatch-time" id="tm-time">05:00</div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn primary" id="tm-start">Start</button>
          <button class="btn" id="tm-reset">Reset</button>
        </div>
        <div class="dim" id="tm-status" style="text-align:center"></div>
      </div>
    `;
    body.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{
      body.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      body.querySelectorAll("[data-pane]").forEach(p=>p.style.display = p.dataset.pane===b.dataset.tab ? "" : "none");
    });

    function paint(){
      const d = new Date();
      let hh = d.getHours(); const h24 = PixelOS.settings.clock24; let suf="";
      if(!h24){ suf = hh>=12?" PM":" AM"; hh = hh%12 || 12; }
      body.querySelector("#pt-clock").textContent = `${String(hh).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}${suf}`;
      body.querySelector("#pt-date").textContent = d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
      body.querySelector("#pt-tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone + " · UTC" + (-d.getTimezoneOffset()/60>=0?"+":"") + (-d.getTimezoneOffset()/60);
    }
    paint(); const clockIv = setInterval(paint, 1000);
    body.querySelector("#pt-24").onclick = ()=>{
      PixelOS.settings.clock24 = !PixelOS.settings.clock24; saveSettings();
      body.querySelector("#pt-24").classList.toggle("on", PixelOS.settings.clock24);
      paint(); tickClock();
    };

    /* stopwatch */
    let swRunning=false, swStart=0, swElapsed=0, swIv=null, laps=[];
    function swPaint(){
      const t = swElapsed + (swRunning ? Date.now()-swStart : 0);
      const mm = String(Math.floor(t/60000)).padStart(2,"0");
      const ss = String(Math.floor((t%60000)/1000)).padStart(2,"0");
      const cs = String(Math.floor((t%1000)/10)).padStart(2,"0");
      body.querySelector("#sw-time").textContent = `${mm}:${ss}.${cs}`;
    }
    body.querySelector("#sw-start").onclick = e=>{
      swRunning = !swRunning;
      if(swRunning){ swStart = Date.now(); swIv = setInterval(swPaint, 30); e.target.textContent="Pause"; body.querySelector("#sw-lap").disabled=false; }
      else{ swElapsed += Date.now()-swStart; clearInterval(swIv); e.target.textContent="Resume"; }
    };
    body.querySelector("#sw-lap").onclick = ()=>{
      laps.unshift(body.querySelector("#sw-time").textContent);
      body.querySelector("#sw-laps").innerHTML = laps.map((l,i)=>`<div><span>Lap ${laps.length-i}</span><span>${l}</span></div>`).join("");
    };
    body.querySelector("#sw-reset").onclick = ()=>{
      swRunning=false; swElapsed=0; clearInterval(swIv); laps=[];
      body.querySelector("#sw-start").textContent="Start"; body.querySelector("#sw-lap").disabled=true;
      body.querySelector("#sw-laps").innerHTML=""; swPaint();
    };

    /* timer */
    let tmRemaining=300, tmIv=null, tmRunning=false;
    function tmPaint(){ const mm=String(Math.floor(tmRemaining/60)).padStart(2,"0"), ss=String(tmRemaining%60).padStart(2,"0"); body.querySelector("#tm-time").textContent=`${mm}:${ss}`; }
    body.querySelector("#tm-min").oninput = e=>{ if(!tmRunning){ tmRemaining = Math.max(0,parseInt(e.target.value||0))*60; tmPaint(); } };
    body.querySelector("#tm-start").onclick = e=>{
      tmRunning = !tmRunning;
      if(tmRunning){
        e.target.textContent="Pause"; body.querySelector("#tm-status").textContent="";
        tmIv = setInterval(()=>{
          tmRemaining--; tmPaint();
          if(tmRemaining<=0){ clearInterval(tmIv); tmRunning=false; e.target.textContent="Start"; body.querySelector("#tm-status").textContent="Time's up."; notify("Pixel Time", "Timer finished."); }
        }, 1000);
      } else { clearInterval(tmIv); e.target.textContent="Resume"; }
    };
    body.querySelector("#tm-reset").onclick = ()=>{ tmRunning=false; clearInterval(tmIv); tmRemaining=(parseInt(body.querySelector("#tm-min").value)||5)*60; body.querySelector("#tm-start").textContent="Start"; body.querySelector("#tm-status").textContent=""; tmPaint(); };
    tmPaint();

    return ()=>{ clearInterval(clockIv); clearInterval(swIv); clearInterval(tmIv); };
  }
});

registerApp({
  id:"calc", name:"Pixel Calculator", category:"Tools", icon:ICONS.calc,
  width:300, height:460,
  launch(body){
    body.innerHTML = `
      <div class="calc-screen"><div class="calc-hist" id="c-hist">&nbsp;</div><div class="calc-val" id="c-val">0</div></div>
      <div class="calc-grid" id="c-grid"></div>
    `;
    const keys = ["C","←","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","="];
    const grid = body.querySelector("#c-grid");
    let expr = "", justEq = false;
    function render(){ body.querySelector("#c-val").textContent = expr===""?"0":expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−"); }
    function safeEval(e){
      const clean = e.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");
      if(!/^[0-9+\-*/.() ]+$/.test(clean)) throw new Error("bad expr");
      // eslint-disable-next-line no-new-func
      return Function(`"use strict"; return (${clean})`)();
    }
    keys.forEach(k=>{
      const b = document.createElement("button");
      b.textContent = k;
      if(["÷","×","−","+","%"].includes(k)) b.classList.add("op");
      if(k==="=") b.classList.add("eq");
      if(k==="0") b.style.gridColumn = "span 2";
      b.onclick = ()=>{
        if(k==="C"){ expr=""; justEq=false; body.querySelector("#c-hist").innerHTML="&nbsp;"; }
        else if(k==="←"){ expr = expr.slice(0,-1); }
        else if(k==="="){
          try{
            const res = safeEval(expr);
            body.querySelector("#c-hist").textContent = expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−") + " =";
            expr = String(Math.round(res*1e10)/1e10);
            justEq = true;
          }catch(e){ body.querySelector("#c-hist").textContent = "Error"; }
        }
        else{
          if(justEq && !isNaN(k)){ expr = ""; }
          justEq = false;
          expr += k;
        }
        render();
      };
      grid.appendChild(b);
    });
    render();
    const keyHandler = e=>{
      if(!document.body.contains(body)) return;
      if(/[0-9.+\-*/]/.test(e.key)){ expr += e.key; render(); }
      else if(e.key==="Enter"){ const eqBtn=[...grid.children].find(b=>b.textContent==="="); if(eqBtn) eqBtn.click(); }
      else if(e.key==="Backspace"){ expr = expr.slice(0,-1); render(); }
      else if(e.key==="Escape"){ expr=""; render(); }
    };
    window.addEventListener("keydown", keyHandler);
    return ()=>window.removeEventListener("keydown", keyHandler);
  }
});

registerApp({
  id:"recorder", name:"Pixel Recorder", category:"Hardware", icon:ICONS.recorder,
  width:400, height:460,
  launch(body, win){
    body.innerHTML = `
      <div class="media-frame"><canvas id="rec-wave"></canvas><span class="status-pill" id="rec-status">READY</span></div>
      <div class="stopwatch-time" id="rec-timer" style="font-size:20px; margin:8px 0">00:00</div>
      <div class="btn-row">
        <button class="btn primary" id="rec-start">Start Recording</button>
        <button class="btn" id="rec-stop" disabled>Stop</button>
      </div>
      <div class="thumb-row" id="rec-list"></div>
    `;
    const hasGUM = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    const hasMR = typeof MediaRecorder !== "undefined";
    if(!hasGUM || !hasMR){
      body.querySelector("#rec-status").textContent = !window.isSecureContext ? "SECURE CONTEXT REQUIRED" : "BROWSER DOES NOT SUPPORT RECORDING";
      body.querySelectorAll("button").forEach(b=>b.disabled=true);
      return;
    }
    const canvas = body.querySelector("#rec-wave"); canvas.width=380; canvas.height=170;
    const ctx = canvas.getContext("2d");
    const statusEl = body.querySelector("#rec-status");
    let stream=null, recorder=null, chunks=[], analyser=null, audioCtx=null, rafId=null, startT=0, timerIv=null, count=0;

    function drawIdle(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle="#5B5476"; ctx.beginPath(); ctx.moveTo(0,85); ctx.lineTo(380,85); ctx.stroke(); }
    drawIdle();
    function drawWave(){
      if(!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = "#00D4AA"; ctx.lineWidth = 1.5; ctx.beginPath();
      const slice = canvas.width/data.length;
      data.forEach((v,i)=>{ const y = (v/255)*canvas.height; i===0?ctx.moveTo(i*slice,y):ctx.lineTo(i*slice,y); });
      ctx.stroke();
      rafId = requestAnimationFrame(drawWave);
    }
    async function start(){
      statusEl.textContent = "REQUESTING MICROPHONE";
      try{
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
        src.connect(analyser);
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = e=>chunks.push(e.data);
        recorder.onstop = ()=>{
          const blob = new Blob(chunks, {type: recorder.mimeType||"audio/webm"});
          const url = URL.createObjectURL(blob);
          count++;
          const item = document.createElement("div"); item.className="thumb"; item.style.width="100%"; item.style.height="auto"; item.style.padding="8px";
          item.innerHTML = `<div class="mono dim" style="font-size:9.5px; margin-bottom:4px">Clip ${count}</div><audio controls src="${url}"></audio><a href="${url}" download="pixel-recording-${count}.webm" style="opacity:1; position:static; background:none; display:inline-block; margin-top:4px; color:var(--tl); font-size:10px">Download</a>`;
          body.querySelector("#rec-list").prepend(item);
          notify("Pixel Recorder", "Recording stopped and ready.");
        };
        recorder.start();
        startT = Date.now();
        timerIv = setInterval(()=>{
          const s = Math.floor((Date.now()-startT)/1000);
          body.querySelector("#rec-timer").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
        }, 250);
        statusEl.textContent = "RECORDING"; statusEl.classList.add("live");
        body.querySelector("#rec-start").disabled=true; body.querySelector("#rec-stop").disabled=false;
        drawWave();
        notify("Pixel Recorder", "Recording started.");
      }catch(err){
        statusEl.textContent = err.name==="NotAllowedError" ? "MICROPHONE PERMISSION DENIED" : "MICROPHONE NOT AVAILABLE";
      }
    }
    function stop(){
      if(recorder && recorder.state!=="inactive") recorder.stop();
      if(stream) stream.getTracks().forEach(t=>t.stop());
      if(audioCtx) audioCtx.close();
      cancelAnimationFrame(rafId); clearInterval(timerIv);
      drawIdle();
      statusEl.textContent = "READY"; statusEl.classList.remove("live");
      body.querySelector("#rec-start").disabled=false; body.querySelector("#rec-stop").disabled=true;
    }
    body.querySelector("#rec-start").onclick = start;
    body.querySelector("#rec-stop").onclick = stop;
    win._cleanup = stop;
  }
});

registerApp({
  id:"terminal", name:"Pixel Terminal", category:"System", icon:ICONS.terminal,
  width:420, height:400,
  launch(body){
    body.innerHTML = `<div class="term"><div class="term-out" id="tm-out"></div><div class="term-in"><span>&gt;</span><input id="tm-cmd" autocomplete="off" spellcheck="false"></div></div>`;
    const out = body.querySelector("#tm-out");
    const inp = body.querySelector("#tm-cmd");
    function print(html, cls){ const d=document.createElement("div"); if(cls) d.className=cls; d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; }
    print("Pixel Terminal — type <b>help</b> for commands.");
    const blocked = ["sudo","apt","rm","systemctl","ls","cd","chmod","kill"];
    function run(raw){
      const parts = raw.trim().split(/\s+/);
      const cmd = (parts[0]||"").toLowerCase();
      const arg = parts.slice(1).join(" ");
      print("&gt; "+escapeHtml(raw), "cmd");
      if(!cmd) return;
      if(blocked.includes(cmd)){ print(`'${escapeHtml(cmd)}' addresses the host operating system, which this terminal does not control. This is a browser-native Pixel OS shell — it exposes Pixel OS state only, not your device's OS.`, "err"); return; }
      switch(cmd){
        case "help": print("Commands: help, clear, apps, open &lt;app&gt;, close &lt;app&gt;, status, time, about, system, capabilities"); break;
        case "clear": out.innerHTML=""; break;
        case "apps": print(Object.values(PixelOS.apps).map(a=>a.id).join(", ")); break;
        case "open": {
          const app = PixelOS.apps[arg]; 
          if(app){ openWindow(arg); print(`Launched ${app.name}.`); }
          else print(`No app registered with id '${escapeHtml(arg)}'. Try: apps`, "err");
          break;
        }
        case "close": {
          const rec = [...PixelOS.windows.values()].find(w=>w.appId===arg);
          if(rec){ closeWindow(rec.id); print(`Closed ${PixelOS.apps[arg].name}.`); }
          else print(`No open window for '${escapeHtml(arg)}'.`, "err");
          break;
        }
        case "status": print(`Windows open: ${PixelOS.windows.size} · Online: ${navigator.onLine} · Focused: ${PixelOS.focused||"none"}`); break;
        case "time": print(new Date().toString()); break;
        case "about": print(`PixelProTech OS v${PixelOS.version} — a browser-native operating environment built by PixelProTech Solutions. Hardware and system capabilities are provided through supported web APIs and browser permissions.`); break;
        case "system": print(`PixelProTech OS v${PixelOS.version} · Runtime: browser · UA: ${escapeHtml(navigator.userAgent)}`); break;
        case "capabilities": {
          const c = detectCapabilities();
          Object.entries(c).forEach(([k,v])=>print(`${k}: ${v}`));
          break;
        }
        default: print(`Unknown command: '${escapeHtml(cmd)}'. Type help.`, "err");
      }
    }
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && inp.value.trim()!==""){ run(inp.value); inp.value=""; } });
    setTimeout(()=>inp.focus(), 60);
  }
});

registerApp({

  width:380, height:460,
  launch(body){
    body.innerHTML = `
      <div class="app-section-h">TIME</div>
      <div class="set-row"><div class="set-label">24-hour clock<small>Applies to taskbar and Pixel Time</small></div><button class="toggle ${PixelOS.settings.clock24?'on':''}" id="s-24"></button></div>
      <div class="app-section-h">APPEARANCE</div>
      <div class="set-row"><div class="set-label">Accent color<small>Applied to window highlights and controls</small></div>
        <div class="swatch-row">
          <button class="swatch ${PixelOS.settings.accent==='pp'?'active':''}" data-a="pp" style="background:#7B2FFF"></button>
          <button class="swatch ${PixelOS.settings.accent==='tl'?'active':''}" data-a="tl" style="background:#00D4AA"></button>
          <button class="swatch ${PixelOS.settings.accent==='gd'?'active':''}" data-a="gd" style="background:#D8B96A"></button>
        </div>
      </div>
      <div class="app-section-h">VISUALS</div>
      <div class="set-row"><div class="set-label">Cinematic effects<small>Shader wallpaper, window de-rez, X-ray loupe</small></div><button class="toggle ${PixelOS.settings.fx!==false?'on':''}" id="s-fx"></button></div>
      <div class="set-row"><div class="set-label">Wallpaper quality<small>Auto adapts to your frame rate</small></div><select id="s-fxq"><option value="auto">Auto</option><option value="high">High</option><option value="low">Low</option></select></div>
      <div class="set-row"><div class="set-label">Reduce motion<small>Turns off boot, shader animation and window effects</small></div><button class="toggle ${PixelOS.settings.reduceMotion?'on':''}" id="s-motion"></button></div>
      <div class="app-section-h">NOTIFICATIONS</div>
      <div class="set-row"><div class="set-label">Browser notifications<small id="s-notif-state">${Notification && Notification.permission==="granted"?"Granted":"Not requested"}</small></div><button class="btn" id="s-notif-req">Request permission</button></div>
      <div class="app-section-h">STORAGE</div>
      <div class="set-row"><div class="set-label">Local settings storage</div><span class="tag ok" id="s-storage-tag">checking…</span></div>
      <div class="set-row"><div class="set-label">Offline apps<small id="s-off-state">Apps are saved for offline use the first time you open them</small></div><button class="btn" id="s-off">Download all apps</button></div>
      <div class="btn-row"><button class="btn" id="s-reset">Reset all Pixel OS settings</button></div>
      <div class="app-section-h">ABOUT</div>
      <p class="dim" style="line-height:1.6">PixelProTech OS v${PixelOS.version} runs as a browser-native operating environment. Hardware and system capabilities are provided through supported web APIs and browser permissions. Built by PixelProTech Solutions.</p>
    `;
    body.querySelector("#s-24").onclick = e=>{ PixelOS.settings.clock24=!PixelOS.settings.clock24; saveSettings(); e.target.classList.toggle("on"); tickClock(); };
    body.querySelectorAll(".swatch").forEach(s=>s.onclick=()=>{
      PixelOS.settings.accent = s.dataset.a; saveSettings();
      body.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active")); s.classList.add("active");
      applyAccent();
    });
    body.querySelector("#s-motion").onclick = e=>{ PixelOS.settings.reduceMotion=!PixelOS.settings.reduceMotion; saveSettings(); e.target.classList.toggle("on"); runDeskMark(); PixelOS.fx && PixelOS.fx.refresh(); };
    body.querySelector("#s-fx").onclick = e=>{ PixelOS.settings.fx = PixelOS.settings.fx===false; saveSettings(); e.target.classList.toggle("on", PixelOS.settings.fx!==false); PixelOS.fx && PixelOS.fx.refresh(); };
    const fq = body.querySelector("#s-fxq"); fq.value = PixelOS.settings.fxQuality||"auto";
    fq.onchange = ()=>{ PixelOS.settings.fxQuality = fq.value; saveSettings(); PixelOS.fx && PixelOS.fx.refresh(); };
    body.querySelector("#s-notif-req").onclick = async ()=>{
      if(!("Notification" in window)){ body.querySelector("#s-notif-state").textContent="Not supported in this browser"; return; }
      const perm = await Notification.requestPermission();
      body.querySelector("#s-notif-state").textContent = perm==="granted"?"Granted":"Denied";
    };
    body.querySelector("#s-off").onclick = async ()=>{
      const st = body.querySelector("#s-off-state"), bt = body.querySelector("#s-off");
      if(!("serviceWorker" in navigator)){ st.textContent="Not supported in this browser"; return; }
      bt.disabled = true; st.textContent = "Starting…";
      try{
        const r = await PixelOS.api.cacheAllApps(p=>{ st.textContent = "Saved "+p.done+" of "+p.total+(p.failed?" ("+p.failed+" failed)":""); });
        st.textContent = r.failed ? "Done — "+r.done+" saved, "+r.failed+" failed (run again to retry)" : "All "+r.done+" files saved for offline use";
      }catch(e){ st.textContent = "Could not finish: "+(e&&e.message||e); }
      bt.disabled = false;
    };
    body.querySelector("#s-reset").onclick = ()=>{
      Object.assign(PixelOS.settings, {clock24:true, accent:"pp", reduceMotion:false, launcherPinned:[], fx:true, fxQuality:"auto"});
      saveSettings(); PixelOS.fx && PixelOS.fx.refresh(); notify("Pixel Settings", "Settings reset to defaults.");
    };
    (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); body.querySelector("#s-storage-tag").textContent="AVAILABLE"; }catch(e){ body.querySelector("#s-storage-tag").textContent="BLOCKED"; body.querySelector("#s-storage-tag").className="tag no"; } })();
  }
});

/* ---- PIXEL DIAGNOSTICS ---- */
registerApp({
  id:"diagnostics", name:"Pixel Diagnostics", category:"System", icon:ICONS.diagnostics,
  width:380, height:480,
  launch(body){
    body.innerHTML = `<div class="btn-row"><button class="btn primary" id="dg-run">Run Diagnostics</button></div><div id="dg-list"></div>`;
    const list = body.querySelector("#dg-list");
    async function test(name, fn){
      try{ const r = await fn(); return {name, result:r}; }
      catch(e){ return {name, result:"BLOCKED"}; }
    }
    body.querySelector("#dg-run").onclick = async ()=>{
      list.innerHTML = `<div class="dim">Running…</div>`;
      const tests = [
        test("Camera", async ()=> (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? "PASS (permission required to confirm)" : "UNSUPPORTED"),
        test("Microphone", async ()=> (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? "PASS (permission required to confirm)" : "UNSUPPORTED"),
        test("MediaRecorder", async ()=> typeof MediaRecorder!=="undefined" ? "PASS" : "UNSUPPORTED"),
        test("Web Audio", async ()=> (window.AudioContext||window.webkitAudioContext) ? "PASS" : "UNSUPPORTED"),
        test("MIDI", async ()=> navigator.requestMIDIAccess ? "PASS (permission required)" : "UNSUPPORTED"),
        test("Notifications", async ()=> ("Notification" in window) ? (Notification.permission==="granted"?"PASS":"LIMITED (permission not granted)") : "UNSUPPORTED"),
        test("Fullscreen", async ()=> document.fullscreenEnabled ? "PASS" : "UNSUPPORTED"),
        test("localStorage", async ()=>{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return "PASS"; }),
        test("IndexedDB", async ()=> ("indexedDB" in window) ? "PASS" : "UNSUPPORTED"),
        test("File API", async ()=> (window.File && window.FileReader) ? "PASS" : "UNSUPPORTED"),
        test("File System Access API", async ()=> ("showOpenFilePicker" in window) ? "PASS" : "LIMITED (fallback available)"),
        test("Web Audio Analyser", async ()=> (window.AudioContext||window.webkitAudioContext) ? "PASS" : "UNSUPPORTED"),
        test("WebRTC", async ()=> typeof RTCPeerConnection!=="undefined" ? "PASS" : "UNSUPPORTED"),
        test("Network status", async ()=> "PASS"),
      ];
      const results = await Promise.all(tests);
      list.innerHTML = results.map(r=>{
        const tagClass = r.result.startsWith("PASS") ? "ok" : r.result.startsWith("LIMITED") ? "warn" : "no";
        return `<div class="diag-row"><span>${r.name}</span><span class="tag ${tagClass}">${escapeHtml(r.result)}</span></div>`;
      }).join("");
    };
  }
});

    id:def.id, name:def.name, category:"Games", icon:def.icon,

    launch(body, win){

      const win_ = body.closest(".pwin");
      win_.addEventListener("mousedown", ()=>setTimeout(()=>{ try{ frame.focus(); frame.contentWindow.focus(); }catch(e){} }, 0));
      frame.addEventListener("load", ()=>{ try{ frame.contentWindow.focus(); }catch(e){} });
    }
  });
}

/* =========================================================
   INIT
   ========================================================= */
window.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); document.getElementById("launcher").classList.contains("open") ? closeLauncher() : openLauncher(); }
});

async function cacheAllApps(onProgress){
  const reg = await navigator.serviceWorker.ready;
  const list = await (await fetch("os-files.json", {cache:"no-store"})).json();
  const sw = reg.active; if(!sw) throw new Error("service worker not active yet — reload once");
  return new Promise((resolve,reject)=>{
    const ch = new MessageChannel();
    ch.port1.onmessage = e=>{ const d=e.data; if(d.type==="progress") onProgress&&onProgress(d); else if(d.type==="done") resolve(d); };
    sw.postMessage({type:"PRECACHE", urls:list.files}, [ch.port2]);
    setTimeout(()=>reject(new Error("timed out")), 10*60*1000);
  });
}
PixelOS.api = { cacheAllApps, registerApp, svgIcon, ICONS, openWindow, closeWindow, focusWindow, notify, escapeHtml, detectCapabilities, getBrowserLabel, saveSettings, renderLauncher, renderDesktopIcons };

function startOS(){
  runBoot(()=>{
    renderLauncher();
    renderDesktopIcons();
    runDeskMark();
    openWindow("commandcentre");
  });
}
// extension scripts (pixel-apps.js / pixel-fx.js) load after this one and register before boot finishes
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", startOS); else startOS();

// expose for debugging / future native bridge integration
window.PixelOS = PixelOS;

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{ /* offline shell unavailable — app still runs online */ });
  });
}
