<meta name="theme-color" content="#0b1521">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1521;
    --bg-panel:#101f31;
    --bg-block:#0e1a2b;
    --line:#3d5975;
    --line-bright:#8fd8d2;
    --amber:#e8a33d;
    --amber-soft:#f3d9ad;
    --paper:#ede3d0;
    --paper-ink:#241d12;
    --text:#eef2f4;
    --text-dim:#8399ac;
    --radius-note: 4px 14px 4px 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:-1px -1px;
    background-blend-mode:overlay;
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% -10%, rgba(19,45,68,0.55), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--line-bright);}

  header.top{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:18px 24px; border-bottom:1px solid var(--line);
    background:rgba(11,21,33,0.75); backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{width:36px; height:36px; border-radius:9px; display:block;}
  .brand .names{display:flex; flex-direction:column; line-height:1.15;}
  .brand h1{font-size:1.05rem; letter-spacing:0.01em;}
  .brand .sub{font-size:0.7rem; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;}

  nav.tabs{display:flex; gap:2px; background:var(--bg-block); border:1px solid var(--line); border-radius:8px; padding:3px;}
  nav.tabs button{
    background:transparent; border:none; color:var(--text-dim);
    padding:7px 14px; border-radius:6px; font-size:0.82rem; font-weight:600;
  }
  nav.tabs button.active{background:var(--line); color:var(--text);}

  .clock{font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--amber-soft); text-align:right;}
  .clock .val{font-size:0.95rem; color:var(--amber); font-weight:600;}

  main{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:22px 20px 60px;}

  .layout{display:grid; grid-template-columns:230px 1fr; gap:20px;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  .case-rail{display:flex; flex-direction:column; gap:8px;}
  .case-tab{
    text-align:left; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--text); padding:11px 12px; border-radius:3px 10px 3px 3px;
    position:relative; overflow:hidden; width:100%;
  }
  .case-tab:hover{border-color:var(--line-bright);}
  .case-tab.active{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset;}
  .case-tab .code{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--text-dim); display:block;}
  .case-tab .title{font-size:0.86rem; font-weight:600; margin-top:2px; display:block; padding-right:56px;}
  .case-tab .status{
    position:absolute; top:9px; right:10px; font-size:0.62rem; font-family:'IBM Plex Mono',monospace;
    padding:2px 6px; border-radius:3px; letter-spacing:0.03em;
  }
  .status.open{color:var(--text-dim); border:1px solid var(--line);}
  .status.solved{color:var(--bg); background:var(--line-bright);}

  .workbench{display:flex; flex-direction:column; gap:16px;}

  .ticket{
    background:var(--paper); color:var(--paper-ink); border-radius:var(--radius-note);
    padding:16px 18px; box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .ticket .num{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; opacity:0.65;}
  .ticket h2{font-size:1.15rem; margin:3px 0 8px;}
  .ticket p{font-size:0.9rem; line-height:1.5; margin:0;}

  .board-wrap{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; position:relative;
  }
  .board-wrap .hint{
    font-size:0.74rem; color:var(--text-dim); margin:0 0 10px; font-family:'IBM Plex Mono', monospace;
  }
  svg.board{width:100%; height:auto; display:block;}

  .block-shape{fill:var(--bg-block); stroke:var(--line); stroke-width:2; transition:stroke 0.15s, fill 0.15s;}
  .hotspot{cursor:pointer; outline:none;}
  .hotspot:hover .block-shape, .hotspot:focus-visible .block-shape{stroke:var(--line-bright);}
  .hotspot .tag{fill:var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:11px;}
  .hotspot .label{fill:var(--text); font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600;}
  .trace{stroke:var(--line); stroke-width:2;}

  .hotspot.wrong .block-shape{stroke:var(--amber); stroke-dasharray:4 3;}
  .hotspot.cleared .block-shape{stroke:var(--line); opacity:0.55;}
  .hotspot.cleared .label, .hotspot.cleared .tag{opacity:0.55;}
  .hotspot.found .block-shape{stroke:var(--amber); fill:#20140a; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{filter:drop-shadow(0 0 0 rgba(232,163,61,0));} 50%{filter:drop-shadow(0 0 6px rgba(232,163,61,0.8));} }

  .findings{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    min-height:64px; font-size:0.86rem; line-height:1.55;
  }
  .findings .placeholder{color:var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:0.78rem;}
  .findings .confirmed-tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem;
    color:var(--bg); background:var(--amber); padding:2px 7px; border-radius:3px; margin-bottom:8px;
  }
  .findings .wrong-tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem;
    color:var(--amber-soft); border:1px solid var(--amber); padding:2px 7px; border-radius:3px; margin-bottom:8px;
  }

  .guide-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .guide-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:3px 12px 3px 3px;
    padding:14px 15px; min-height:150px;
  }
  .guide-card .tag{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--text-dim);}
  .guide-card h3{font-size:0.98rem; margin:3px 0 8px;}
  .guide-card p{font-size:0.82rem; line-height:1.5; color:var(--text-dim); margin:0 0 10px;}
  .guide-card ul{margin:0; padding-left:16px; font-size:0.78rem; color:var(--text-dim); line-height:1.6;}
  .guide-card.locked{opacity:0.45;}
  .guide-card.locked h3{color:var(--text-dim);}
  .guide-card.locked p{font-style:italic;}

  footer.brandfoot{
    max-width:1180px; margin:30px auto 0; padding:16px 20px 0; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--text-dim);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .reset-btn{background:none; border:1px solid var(--line); color:var(--text-dim); padding:4px 10px; border-radius:4px; font-size:0.68rem; font-family:'IBM Plex Mono', monospace;}
  .reset-btn:hover{border-color:var(--amber); color:var(--amber-soft);}
</style>
</head>

      brief:"Fine for the first ten or fifteen minutes, then it slows to a crawl and eventually powers itself off. It needs to cool down for a while before it'll turn back on.",
      resolution:"Confirmed: fan and heatsink. Dust has packed the fins tight enough that almost no air gets through. The processor throttles, then shuts down, before real damage happens." },
    { id:"E", code:"CASE 05", ticket:"#1103", title:"Screen's Black, But It's Not Dead", fault:"display_cable",
      brief:"Everything about this machine seems to work — you can hear the startup chime, and plugging it into a TV over HDMI shows a perfectly normal desktop. The built-in screen just never lights up.",
      resolution:"Confirmed: the display cable. Video reaches the board fine and goes out over HDMI — it's the run up through the hinge to the panel itself that's broken. Thousands of open-and-close cycles finally cracked a wire inside." }
  ];

  const STORE_KEY = "pixelDiagnoseState_v1";
  let state = loadState();
  let currentCaseId = CASES[0].id;
  let testedWrongThisCase = new Set();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) throw 0;
      const parsed = JSON.parse(raw);
      return {
        solvedCases: new Set(parsed.solvedCases || []),
        unlockedParts: new Set(parsed.unlockedParts || []),
        totalMinutes: parsed.totalMinutes || 0
      };
    }catch(e){
      return { solvedCases:new Set(), unlockedParts:new Set(), totalMinutes:0 };
    }
  }
  function saveState(){
    localStorage.setItem(STORE_KEY, JSON.stringify({
      solvedCases:[...state.solvedCases],
      unlockedParts:[...state.unlockedParts],
      totalMinutes:state.totalMinutes
    }));
    renderClock();
  }

  function renderClock(){
    const h = Math.floor(state.totalMinutes/60);
    const m = state.totalMinutes%60;
    document.getElementById("clockVal").textContent = h+"h "+String(m).padStart(2,"0")+"m";
  }

  function getCase(id){ return CASES.find(c=>c.id===id); }

  function renderCaseRail(){
    const rail = document.getElementById("caseRail");
    rail.innerHTML = "";
    CASES.forEach(c=>{
      const solved = state.solvedCases.has(c.id);
      const btn = document.createElement("button");
      btn.className = "case-tab" + (c.id===currentCaseId ? " active" : "");
      btn.innerHTML = '<span class="code">'+c.code+' &middot; '+c.ticket+'</span>'+
                      '<span class="title">'+c.title+'</span>'+
                      '<span class="status '+(solved?"solved":"open")+'">'+(solved?"SOLVED":"OPEN")+'</span>';
      btn.addEventListener("click", ()=>{ currentCaseId = c.id; testedWrongThisCase = new Set(); renderAll(); });
      rail.appendChild(btn);
    });
  }

  function renderTicket(){
    const c = getCase(currentCaseId);
    const ticket = document.getElementById("ticket");
    ticket.innerHTML = '<span class="num">TICKET '+c.ticket+'</span><h2>'+c.title+'</h2><p>'+c.brief+'</p>';
  }

  function blockSvg(id, p, extraClass){
    return '<g class="hotspot'+(extraClass?" "+extraClass:"")+'" tabindex="0" role="button" aria-label="Test '+p.label+'" data-part="'+id+'" '+
           'transform="translate('+p.pos.x+','+p.pos.y+')">'+
           '<rect class="block-shape" width="150" height="90" rx="6"></rect>'+
           '<text class="tag" x="10" y="20">'+p.tag+'</text>'+
           '<text class="label" x="10" y="42">'+p.label+'</text>'+
           '</g>';
  }

  function renderBoard(){
    const svg = document.getElementById("board");
    const solvedThisCase = state.solvedCases.has(currentCaseId) ? getCase(currentCaseId).fault : null;

    let traces = "";
    Object.values(PARTS).forEach(p=>{
      const cx = p.pos.x+75;
      if(p.pos.y===100) traces += '<line class="trace" x1="'+cx+'" y1="190" x2="'+cx+'" y2="295"></line>';
      if(p.pos.y===465) traces += '<line class="trace" x1="'+cx+'" y1="385" x2="'+cx+'" y2="465"></line>';
    });
    traces += '<line class="trace" x1="175" y1="340" x2="825" y2="340"></line>';

    let blocks = "";
    Object.entries(PARTS).forEach(([id,p])=>{
      let extra = "";
      if(id === solvedThisCase) extra = "found";
      else if(testedWrongThisCase.has(id)) extra = "cleared";
      blocks += blockSvg(id,p,extra);
    });

    svg.innerHTML =
      '<rect x="40" y="40" width="880" height="480" rx="20" fill="none" stroke="#3d5975" stroke-width="2" stroke-dasharray="2 6"></rect>'+
      traces + blocks;

    svg.querySelectorAll(".hotspot").forEach(el=>{
      el.addEventListener("click", ()=>handlePartTest(el.getAttribute("data-part")));
      el.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); handlePartTest(el.getAttribute("data-part")); } });
    });
  }

  function handlePartTest(partId){
    const c = getCase(currentCaseId);
    const alreadySolved = state.solvedCases.has(currentCaseId);

    if(!state.unlockedParts.has(partId)){
      state.unlockedParts.add(partId);
    }

    if(alreadySolved){
      showFindings("info", PARTS[partId]);
      saveState();
      renderBoard();
      return;
    }

    if(partId === c.fault){
      state.solvedCases.add(c.id);
      saveState();
      showFindings("confirmed", PARTS[partId], c.resolution);
    } else {
      if(!testedWrongThisCase.has(partId)){
        testedWrongThisCase.add(partId);
        state.totalMinutes += 15;
      }
      saveState();
      showFindings("wrong", PARTS[partId]);
    }
    renderBoard();
    renderCaseRail();
  }

  function showFindings(kind, part, resolution){
    const box = document.getElementById("findings");
    if(kind==="confirmed"){
      box.innerHTML = '<span class="confirmed-tag">FAULT CONFIRMED — '+part.tag+'</span>'+
        '<p style="margin:0 0 8px;">'+resolution+'</p>'+
        '<p style="margin:0; color:var(--text-dim); font-size:0.8rem;">Added to your Field Guide.</p>';
    } else if(kind==="wrong"){
      box.innerHTML = '<span class="wrong-tag">RULED OUT — '+part.tag+'</span>'+
        '<p style="margin:0;">'+part.label+' checks out. '+part.info+'</p>'+
        '<p style="margin:8px 0 0; color:var(--amber-soft); font-size:0.78rem;">+15 min on the shop clock.</p>';
    } else {
      box.innerHTML = '<span class="wrong-tag" style="border-color:var(--line); color:var(--text-dim);">'+part.tag+'</span>'+
        '<p style="margin:0;">'+part.label+' — '+part.info+'</p>';
    }
  }

  function renderGuide(){
    const grid = document.getElementById("guideGrid");
    grid.innerHTML = "";
    Object.entries(PARTS).forEach(([id,p])=>{
      const unlocked = state.unlockedParts.has(id);
      const card = document.createElement("div");
      card.className = "guide-card"+(unlocked?"":" locked");
      if(unlocked){
        card.innerHTML = '<span class="tag">'+p.tag+'</span><h3>'+p.label+'</h3>'+
          '<p>'+p.info+'</p>'+
          '<ul>'+p.signs.map(s=>'<li>'+s+'</li>').join("")+'</ul>';
      } else {
        card.innerHTML = '<span class="tag">'+p.tag+'</span><h3>???</h3>'+
          '<p>Not yet inspected. Investigate a case to learn this part.</p>';
      }
      grid.appendChild(card);
    });
  }

  function renderFindingsReset(){
    if(state.solvedCases.has(currentCaseId)){
      const c = getCase(currentCaseId);
      showFindings("confirmed", PARTS[c.fault], c.resolution);
    } else {
      document.getElementById("findings").innerHTML = '<span class="placeholder">No tests run yet on this case.</span>';
    }
  }

  function renderAll(){
    renderCaseRail();
    renderTicket();
    renderBoard();
    renderFindingsReset();
    renderGuide();
    renderClock();
  }

  document.querySelectorAll("nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const v = btn.getAttribute("data-view");
      document.getElementById("view-cases").style.display = v==="cases" ? "grid" : "none";
      document.getElementById("view-guide").style.display = v==="guide" ? "block" : "none";
      if(v==="guide") renderGuide();
    });
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Reset all Pixel Diagnose progress? This can't be undone.")){
      localStorage.removeItem(STORE_KEY);
      state = loadState();
      currentCaseId = CASES[0].id;
      testedWrongThisCase = new Set();
      renderAll();
    }
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }

  renderAll();
})();
</script>
</body>
</html>
