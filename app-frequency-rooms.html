<style>/* ============================================================
   FREQUENCY OASIS — DESIGN SYSTEM
   Black glass studio + gold instrumentation
   ============================================================ */

@font-face {
  font-family: 'Oasis Display';
  src: local('Georgia');
}

:root{
  --black: #050505;
  --black-2: #0b0a08;
  --panel: #100e0a;
  --panel-glass: rgba(20,18,14,0.72);
  --hairline: rgba(212,175,55,0.16);
  --hairline-strong: rgba(212,175,55,0.34);
  --gold: #D4AF37;
  --gold-bright: #F1D879;
  --bronze: #8B6914;
  --bronze-shadow: rgba(139,105,20,0.35);
  --purple-mist: rgba(88,60,120,0.10);
  --text: #EDE6D6;
  --text-dim: #948a72;
  --text-faint: #5c563f;
  --danger: #b4453a;
  --radius: 14px;
  --radius-sm: 8px;
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'Courier New', monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}

*{ box-sizing: border-box; }
html,body{
  margin:0; padding:0; height:100%;
  background: var(--black);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button{ font-family: inherit; }
::selection{ background: var(--bronze-shadow); color: var(--gold-bright); }
.hidden{ display:none !important; }

/* atmosphere: subtle purple wash + gold vignette, everywhere */
body{
  background:
    radial-gradient(ellipse 900px 500px at 20% -10%, var(--purple-mist), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(212,175,55,0.05), transparent 60%),
    var(--black);
}

/* ============================================================
   BOOT SEQUENCE
   ============================================================ */
.boot{
  position:fixed; inset:0; z-index:999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px;
  background: radial-gradient(ellipse 800px 600px at 50% 40%, rgba(88,60,120,0.14), transparent 65%), var(--black);
  transition: opacity .9s var(--ease);
}
.boot.fade-out{ opacity:0; pointer-events:none; }
.boot-particles{ position:absolute; inset:0; overflow:hidden; }
.boot-particles span{
  position:absolute; width:2px; height:2px; border-radius:50%;
  background: var(--gold); opacity:0; box-shadow: 0 0 6px 1px var(--gold);
  animation: rise linear infinite;
}
@keyframes rise{
  0%{ transform: translateY(0) scale(1); opacity:0; }
  10%{ opacity:.8; }
  90%{ opacity:.3; }
  100%{ transform: translateY(-120vh) scale(.4); opacity:0; }
}
.boot-ring{ position:relative; }
.boot-ring-track{ fill:none; stroke: var(--hairline); stroke-width:1.5; }
.boot-ring-progress{
  fill:none; stroke: var(--gold); stroke-width:2;
  stroke-linecap: round; stroke-dasharray: 540;
  stroke-dashoffset: 540;
  transform-origin: center; transform: rotate(-90deg);
  animation: ringfill 3.2s var(--ease) forwards;
  filter: drop-shadow(0 0 6px rgba(212,175,55,.6));
}
@keyframes ringfill{ to{ stroke-dashoffset: 60; } }
.boot-wave{ opacity:.85; }
.boot-title{
  font-family: var(--serif); letter-spacing: 0.35em; font-size: 20px;
  color: var(--gold-bright); margin:0; font-weight:400;
  text-shadow: 0 0 18px rgba(212,175,55,.35);
}
.boot-line{
  font-family: var(--mono); font-size: 11px; letter-spacing:.18em;
  color: var(--text-dim); margin:0; text-transform:uppercase;
  animation: pulse-text 1.4s ease-in-out infinite;
}
@keyframes pulse-text{ 0%,100%{opacity:.5;} 50%{opacity:1;} }

/* ============================================================
   APP SHELL / LAYOUT
   ============================================================ */
.app{ display:flex; min-height:100vh; }

.sidebar{
  display:none;
  width:248px; flex-shrink:0;
  background: linear-gradient(180deg, var(--panel), var(--black-2));
  border-right: 1px solid var(--hairline);
  padding: 28px 18px;
  flex-direction:column; gap:26px;
  position:sticky; top:0; height:100vh;
}
.brand{ display:flex; align-items:center; gap:12px; padding:0 6px; }
.brand-mark{ color: var(--gold); font-size:22px; text-shadow:0 0 12px rgba(212,175,55,.5); }
.brand-name{ font-family: var(--serif); font-size:13px; letter-spacing:.18em; line-height:1.35; color:var(--gold-bright); }

.side-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.side-link{
  display:flex; align-items:center; gap:12px;
  background:none; border:none; color: var(--text-dim);
  padding:11px 12px; border-radius: var(--radius-sm);
  font-size:13.5px; text-align:left; cursor:pointer;
  transition: all .18s var(--ease);
  border-left: 2px solid transparent;
}
.side-link .ic{ font-size:14px; width:16px; color:var(--bronze); text-align:center; }
.side-link:hover{ color: var(--text); background: rgba(212,175,55,0.05); }
.side-link.active{
  color: var(--gold-bright); background: rgba(212,175,55,0.08);
  border-left-color: var(--gold);
}
.side-link.active .ic{ color: var(--gold); }
.sidebar-status{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-faint); padding: 0 6px; }
.dot{ width:6px; height:6px; border-radius:50%; background: var(--text-faint); }
.dot.online{ background:#7fae6d; box-shadow:0 0 6px #7fae6d; }
.dot.offline{ background: var(--danger); box-shadow:0 0 6px var(--danger); }

.main{ flex:1; min-width:0; padding-bottom: 90px; }
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px;
  padding: 16px 20px;
  background: rgba(5,5,5,0.82); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
}
.menu-btn{ background:none; border:none; color: var(--gold); font-size:18px; cursor:pointer; display:block; }
.topbar-title{ font-family: var(--serif); letter-spacing:.06em; font-size:17px; color:var(--text); flex:1; }
.topbar-signal{
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color: var(--gold); border:1px solid var(--hairline-strong); border-radius:20px;
  padding:5px 12px; background: rgba(212,175,55,0.06);
}
.view{ padding: 20px; max-width: 1080px; margin: 0 auto; animation: viewfade .35s var(--ease); }
@keyframes viewfade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

/* bottom nav (mobile) */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; justify-content:space-around; align-items:center;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: rgba(8,7,5,0.92); backdrop-filter: blur(16px);
  border-top: 1px solid var(--hairline);
}
.bn{
  background:none; border:none; color: var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; letter-spacing:.03em; padding:4px 10px; cursor:pointer;
}
.bn-ic{ font-size:19px; filter: grayscale(1) opacity(.6); }
.bn.active{ color: var(--gold-bright); }
.bn.active .bn-ic{ filter:none; text-shadow:0 0 8px rgba(212,175,55,.6); }
.bn-create .bn-ic{
  background: linear-gradient(145deg, var(--gold), var(--bronze));
  border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  filter:none; margin-top:-18px; box-shadow: 0 4px 16px rgba(212,175,55,.4);
  color:#050505; font-size:16px;
}

.offline-banner{
  position:fixed; left:12px; right:12px; bottom:74px; z-index:40;
  background: var(--panel); border:1px solid var(--hairline-strong);
  border-radius: var(--radius-sm); padding:10px 14px;
  font-size:11.5px; color: var(--text-dim); display:flex; flex-direction:column; gap:2px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.offline-banner strong{ color: var(--gold-bright); font-size:11px; letter-spacing:.06em; }

@media (min-width: 900px){
  .sidebar{ display:flex; }
  .bottom-nav{ display:none; }
  .menu-btn{ display:none; }
  .main{ padding-bottom:0; }
  .offline-banner{ left:auto; right:24px; bottom:24px; width:320px; }
}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.section-label{
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color: var(--bronze); margin: 0 0 10px;
  display:flex; align-items:center; gap:8px;
}
.section-label::after{ content:''; flex:1; height:1px; background: var(--hairline); }

.card{
  background: var(--panel-glass);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 18px;
  backdrop-filter: blur(6px);
  transition: border-color .2s var(--ease), transform .2s var(--ease);
}
.card:hover{ border-color: var(--hairline-strong); }
.card + .card{ margin-top:12px; }

.grid{ display:grid; gap:12px; }
.grid-2{ grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius: 999px; padding: 10px 20px; font-size:13px; letter-spacing:.03em;
  cursor:pointer; border:1px solid var(--hairline-strong); background: transparent; color: var(--text);
  transition: all .18s var(--ease);
}
.btn:hover{ border-color: var(--gold); color: var(--gold-bright); }
.btn-gold{
  background: linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--bronze));
  color: #0a0805; border:none; font-weight:600;
  box-shadow: 0 4px 20px rgba(212,175,55,.25);
}
.btn-gold:hover{ filter: brightness(1.08); color:#0a0805; }
.btn-ghost{ border-color: var(--hairline); color: var(--text-dim); }
.btn-sm{ padding:6px 14px; font-size:11.5px; }
.btn-block{ width:100%; }

.tag{
  display:inline-flex; align-items:center; font-size:10.5px; letter-spacing:.04em;
  padding:4px 10px; border-radius:20px; border:1px solid var(--hairline);
  color: var(--text-dim); background: rgba(255,255,255,0.02);
}
.tag.gold{ color: var(--gold-bright); border-color: var(--hairline-strong); background: rgba(212,175,55,0.07); }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; }

.avatar{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--serif); font-size:15px; color: var(--gold-bright);
  background: radial-gradient(circle at 30% 20%, rgba(212,175,55,0.28), rgba(20,18,14,1));
  border:1px solid var(--hairline-strong);
}

h1,h2,h3{ font-family: var(--serif); font-weight:400; color: var(--text); margin:0 0 6px; }
.page-title{ font-size:24px; color: var(--gold-bright); letter-spacing:.01em; }
.page-sub{ color: var(--text-dim); font-size:13px; margin:0 0 22px; }
p{ line-height:1.55; color: var(--text-dim); font-size:13.5px; }

.empty{
  text-align:center; padding: 48px 16px; color: var(--text-faint);
  border:1px dashed var(--hairline); border-radius: var(--radius);
}
.empty .glyph{ font-size:28px; color: var(--bronze); display:block; margin-bottom:10px; }

/* current signal selector */
.signal-select{ display:flex; flex-wrap:wrap; gap:8px; }
.signal-opt{
  border:1px solid var(--hairline); background:transparent; color: var(--text-dim);
  padding:8px 16px; border-radius:20px; cursor:pointer; font-size:12.5px;
}
.signal-opt.active{ border-color: var(--gold); color: var(--gold-bright); background: rgba(212,175,55,0.08); }

/* frequency match score ring */
.match-score{ display:flex; align-items:center; gap:14px; }
.match-ring{ position:relative; width:56px; height:56px; flex-shrink:0; }
.match-ring svg{ width:100%; height:100%; transform: rotate(-90deg); }
.match-ring circle{ fill:none; stroke-width:5; }
.match-ring .track{ stroke: var(--hairline); }
.match-ring .fill{ stroke: var(--gold); stroke-linecap:round; filter: drop-shadow(0 0 5px rgba(212,175,55,.5)); }
.match-ring .pct{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family: var(--mono); font-size:12px; color: var(--gold-bright);
}

/* waveform player */
.waveform-player{ border:1px solid var(--hairline); border-radius: var(--radius-sm); padding:12px; background: rgba(0,0,0,.25); }
.wp-row{ display:flex; align-items:center; gap:12px; }
.wp-play{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline-strong);
  background: rgba(212,175,55,0.06); color: var(--gold); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;
}
.wp-canvas-wrap{ flex:1; position:relative; height:44px; cursor:pointer; }
canvas.wp-canvas{ width:100%; height:100%; display:block; }
.wp-time{ font-family: var(--mono); font-size:10.5px; color: var(--text-faint); flex-shrink:0; }
.wp-comments{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.wp-comment{ display:flex; gap:8px; font-size:12px; color: var(--text-dim); }
.wp-comment .t{ color: var(--gold); font-family: var(--mono); font-size:10.5px; flex-shrink:0; }

.upload-drop{
  border: 1px dashed var(--hairline-strong); border-radius: var(--radius);
  padding: 26px; text-align:center; cursor:pointer; color: var(--text-dim); font-size:12.5px;
  transition: all .15s var(--ease);
}
.upload-drop:hover{ border-color: var(--gold); color: var(--gold-bright); background: rgba(212,175,55,0.03); }

/* form fields */
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color: var(--bronze); }
.field input, .field textarea, .field select{
  background: rgba(0,0,0,.3); border:1px solid var(--hairline); border-radius: var(--radius-sm);
  color: var(--text); padding:10px 12px; font-size:13.5px; font-family: inherit;
}
.field input:focus, .field textarea:focus, .field select:focus{
  outline:none; border-color: var(--gold);
}
.field textarea{ resize: vertical; min-height:70px; }

/* modal */
.modal-backdrop{
  position:fixed; inset:0; background: rgba(3,3,3,.72); backdrop-filter: blur(4px);
  z-index:200; display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background: linear-gradient(180deg, var(--panel), var(--black-2));
  border: 1px solid var(--hairline-strong); border-radius: 20px 20px 0 0;
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
  animation: sheetup .3s var(--ease);
}
@keyframes sheetup{ from{ transform: translateY(30px); opacity:0;} to{ transform:none; opacity:1;} }
@media (min-width:900px){
  .modal-backdrop{ align-items:center; }
  .modal-sheet{ border-radius:20px; }
}
.modal-close{ float:right; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }

/* progress bar (project) */
.progress-track{ height:5px; border-radius:4px; background: rgba(212,175,55,0.1); overflow:hidden; margin:8px 0; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--bronze), var(--gold)); border-radius:4px; }

/* discovery card grid */
.creator-card{ text-align:left; }

<script>/* ============================================================
   FREQUENCY OASIS — storage.js
   IndexedDB wrapper. Everything the app does is local-first:
   rooms, profiles, projects, messages, audio blobs all live here
   so the app keeps working with no connection.
   ============================================================ */

const OasisDB = (() => {
  const DB_NAME = 'frequency-oasis';
  const DB_VERSION = 1;
  const STORES = ['profile', 'rooms', 'roomPosts', 'creators', 'projects', 'messages', 'audio', 'meta'];
  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(name => {
          if (!db.objectStoreNames.contains(name)) {
            db.createObjectStore(name, { keyPath: 'id' });
          }
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function tx(storeName, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(storeName, mode);
      const store = t.objectStore(storeName);
      const result = fn(store);
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
    });
  }

  async function put(storeName, obj) {
    return tx(storeName, 'readwrite', store => { store.put(obj); return obj; });
  }
  async function putAll(storeName, arr) {
    return tx(storeName, 'readwrite', store => { arr.forEach(o => store.put(o)); return arr; });
  }
  async function getAll(storeName) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(storeName, 'readonly');
      const req = t.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function get(storeName, id) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(storeName, 'readonly');
      const req = t.objectStore(storeName).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function remove(storeName, id) {
    return tx(storeName, 'readwrite', store => { store.delete(id); });
  }

  function uid(prefix = 'id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  // -------- seed data (only written once) --------
  async function seedIfEmpty() {
    const meta = await get('meta', 'seeded');
    if (meta && meta.value) return;

    await put('profile', {
      id: 'me',
      name: 'Smokey Eye Beats',
      genre: ['Dark RNB', 'Experimental Soul', 'Cinematic'],
      energy: ['Dark', 'Emotional', 'Atmospheric'],
      skills: ['Producer', 'Sound Designer', 'Mix Engineer'],
      knownFor: ['Atmosphere', 'Sound Design', 'Rare Textures'],
      signal: 'Creating',
      bio: 'Building cinematic RNB textures. Looking for voices that live in the dark.'
    });

    const creators = [
      { id: uid('cr'), name: 'Nova Wren', genre: 'Neo Soul', skill: 'Vocalist', energy: 'Emotional', match: 91 },
      { id: uid('cr'), name: 'Glass Chapel', genre: 'Ambient', skill: 'Composer', energy: 'Dreamlike', match: 84 },
      { id: uid('cr'), name: 'Iron Atlas', genre: 'Trap', skill: 'Engineer', energy: 'Aggressive', match: 68 },
      { id: uid('cr'), name: 'Marrow', genre: 'Experimental', skill: 'Sound Designer', energy: 'Chaotic', match: 87 },
      { id: uid('cr'), name: 'Sable Ren', genre: 'Cinematic', skill: 'Visual Artist', energy: 'Dark', match: 93 },
      { id: uid('cr'), name: 'Hollow Coast', genre: 'Jazz', skill: 'Producer', energy: 'Peaceful', match: 61 }
    ];
    await putAll('creators', creators);

    const rooms = [
      { id: uid('rm'), icon: '🎹', name: 'Neo Soul Laboratory', desc: 'Warm chords, human groove, late-night vocals.', members: 34, working: 'Neo soul chord progressions for a summer EP' },
      { id: uid('rm'), icon: '🎛', name: 'Dark Sound Design Unit', desc: 'Textures, drones, cinematic tension.', members: 21, working: 'Dark cinematic RNB texture' },
      { id: uid('rm'), icon: '🥁', name: 'Underground Drum Surgery', desc: 'Drum programming and rhythm science.', members: 47, working: 'Broken-beat drum kits for trap-jazz fusion' },
      { id: uid('rm'), icon: '🎤', name: 'Vocal Atmosphere Room', desc: 'Layered vocals, harmony stacks, breath.', members: 29, working: 'Ambient vocal layering technique share' },
      { id: uid('rm'), icon: '🌌', name: 'Ambient Universe', desc: 'Slow, spacious, dreamlike world-building.', members: 18, working: 'A 40-minute ambient universe for a short film' }
    ];
    await putAll('rooms', rooms);

    await put('roomPosts', {
      id: uid('post'), roomId: rooms[1].id, creator: 'Smokey Eye Beats',
      workingOn: 'Dark cinematic RNB texture',
      lookingFor: ['Vocalist', 'Visual Artist', 'Mix Engineer'],
      text: 'Laying down a texture built from detuned strings and tape hiss. Need a voice that can sit inside the dark.',
      time: Date.now() - 1000 * 60 * 40
    });

    const projects = [
      { id: uid('proj'), name: 'Midnight Hospital', looking: ['Vocalist', 'Cover Artist', 'Mastering Engineer'], connected: 2, total: 4, desc: 'A concept EP about insomnia and recovery, told through dark RNB.' }
    ];
    await putAll('projects', projects);

    await put('messages', {
      id: uid('msg'), thread: 'Nova Wren',
      items: [
        { from: 'them', text: 'Your frequency matched at 91% — I think our worlds fit.', time: Date.now() - 1000 * 60 * 60 * 5 },
        { from: 'me', text: 'Heard your reference track. Want to try a verse over the Dark Sound Design texture?', time: Date.now() - 1000 * 60 * 60 * 4 }
      ]
    });

    await put('meta', { id: 'seeded', value: true });
  }

  return { open, put, putAll, getAll, get, remove, uid, seedIfEmpty };
})();

<script>/* ============================================================
   FREQUENCY OASIS — audio.js
   Web Audio API: decode uploaded audio, extract peaks for a
   waveform render, and drive play/pause + seek.
   ============================================================ */

const OasisAudio = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  async function decodeFile(file) {
    const buf = await file.arrayBuffer();
    const audioCtx = getCtx();
    return new Promise((resolve, reject) => {
      audioCtx.decodeAudioData(buf.slice(0), resolve, reject);
    });
  }

  // downsample a channel to `buckets` peak values (0..1)
  function extractPeaks(audioBuffer, buckets = 160) {
    const data = audioBuffer.getChannelData(0);
    const blockSize = Math.floor(data.length / buckets);
    const peaks = [];
    for (let i = 0; i < buckets; i++) {
      const start = i * blockSize;
      let max = 0;
      for (let j = 0; j < blockSize; j++) {
        const v = Math.abs(data[start + j] || 0);
        if (v > max) max = v;
      }
      peaks.push(max);
    }
    const norm = Math.max(...peaks, 0.01);
    return peaks.map(p => p / norm);
  }

  function drawWaveform(canvas, peaks, progress = 0) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const c = canvas.getContext('2d');
    c.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    c.clearRect(0, 0, w, h);
    const barW = w / peaks.length;
    peaks.forEach((p, i) => {
      const barH = Math.max(2, p * h * 0.9);
      const x = i * barW;
      const y = (h - barH) / 2;
      const played = (i / peaks.length) < progress;
      c.fillStyle = played ? '#D4AF37' : 'rgba(212,175,55,0.22)';
      c.fillRect(x, y, Math.max(1, barW - 1), barH);
    });
  }

  // simple decorative idle waveform for the boot screen (no file needed)
  function drawIdleWave(canvas, t) {
    const c = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    c.clearRect(0, 0, w, h);
    c.strokeStyle = '#D4AF37';
    c.lineWidth = 1.5;
    c.globalAlpha = 0.8;
    c.beginPath();
    for (let x = 0; x < w; x++) {
      const y = h / 2 + Math.sin(x * 0.06 + t) * (h * 0.28) * Math.sin(x * 0.01 + t * 0.5);
      x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke();
  }

  // Wire a waveform-player card: builds an <audio>, hooks play button + canvas
  function mountPlayer({ container, peaks, durationLabel = '00:00', objectUrl }) {
    const canvas = container.querySelector('.wp-canvas');
    const playBtn = container.querySelector('.wp-play');
    const timeEl = container.querySelector('.wp-time');
    let audioEl = objectUrl ? new Audio(objectUrl) : null;
    let playing = false;
    let raf = null;

    function render(progress) { drawWaveform(canvas, peaks, progress); }
    render(0);

    function tick() {
      if (!audioEl) return;
      const progress = audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
      render(progress);
      timeEl.textContent = formatTime(audioEl.currentTime) + ' / ' + formatTime(audioEl.duration || 0);
      if (playing) raf = requestAnimationFrame(tick);
    }

    playBtn.addEventListener('click', () => {
      if (!audioEl) { playBtn.textContent = '▶'; return; }
      if (playing) {
        audioEl.pause(); playing = false; playBtn.textContent = '▶';
        cancelAnimationFrame(raf);
      } else {
        audioEl.play(); playing = true; playBtn.textContent = '❚❚';
        tick();
      }
    });

    canvas.addEventListener('click', (e) => {
      if (!audioEl || !audioEl.duration) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audioEl.currentTime = ratio * audioEl.duration;
      render(ratio);
    });

    if (!objectUrl) timeEl.textContent = durationLabel;
  }

  function formatTime(sec) {
    if (!isFinite(sec)) return '00:00';
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  return { decodeFile, extractPeaks, drawWaveform, drawIdleWave, mountPlayer, formatTime };
})();
</script>
<script>/* ============================================================
   FREQUENCY OASIS — matching.js
   Frequency Compatibility Engine.
   No follower counts. Creators are scored on how their
   creative world overlaps: genre, energy, and complementary
   (not identical) skills.
   ============================================================ */

const OasisMatch = (() => {
  const GENRE_AFFINITY = {
    'RNB': ['Soul', 'Hip-Hop', 'Cinematic'],
    'Neo Soul': ['RNB', 'Soul', 'Jazz'],
    'Soul': ['RNB', 'Neo Soul', 'Jazz'],
    'Hip-Hop': ['Trap', 'RNB'],
    'Trap': ['Hip-Hop', 'Electronic'],
    'Jazz': ['Soul', 'Ambient', 'Neo Soul'],
    'Ambient': ['Cinematic', 'Jazz', 'Experimental'],
    'Experimental': ['Ambient', 'Electronic', 'Cinematic'],
    'Cinematic': ['Ambient', 'RNB', 'Experimental'],
    'Electronic': ['Trap', 'Experimental']
  };

  const ENERGY_AFFINITY = {
    'Dark': ['Emotional', 'Aggressive', 'Chaotic'],
    'Emotional': ['Dark', 'Peaceful', 'Dreamlike'],
    'Chaotic': ['Aggressive', 'Dark'],
    'Peaceful': ['Dreamlike', 'Emotional'],
    'Aggressive': ['Dark', 'Chaotic'],
    'Dreamlike': ['Peaceful', 'Emotional']
  };

  // skills that complement rather than duplicate — a producer + vocalist
  // is a stronger match than producer + producer
  const COMPLEMENTARY_SKILLS = {
    'Producer': ['Vocalist', 'Sound Designer', 'Mix Engineer', 'Composer'],
    'Vocalist': ['Producer', 'Composer', 'Engineer'],
    'Sound Designer': ['Producer', 'Vocalist', 'Visual Artist'],
    'Mix Engineer': ['Producer', 'Vocalist', 'Composer'],
    'Composer': ['Vocalist', 'Visual Artist', 'Engineer'],
    'Engineer': ['Producer', 'Vocalist', 'Composer'],
    'Visual Artist': ['Producer', 'Composer', 'Sound Designer']
  };

  function overlapScore(a = [], b = [], affinity = {}) {
    const A = Array.isArray(a) ? a : [a];
    const B = Array.isArray(b) ? b : [b];
    let best = 0;
    A.forEach(x => {
      B.forEach(y => {
        if (x === y) best = Math.max(best, 1);
        else if ((affinity[x] || []).includes(y)) best = Math.max(best, 0.6);
      });
    });
    return best;
  }

  function skillScore(mySkills = [], theirSkill) {
    let best = 0;
    mySkills.forEach(s => {
      if ((COMPLEMENTARY_SKILLS[s] || []).includes(theirSkill)) best = Math.max(best, 1);
      if (s === theirSkill) best = Math.max(best, 0.35); // same skill: some value, less than complementary
    });
    return best;
  }

  // Returns an integer 0-99 compatibility score.
  function compatibility(me, other) {
    const g = overlapScore(me.genre, [other.genre], GENRE_AFFINITY);
    const e = overlapScore(me.energy, [other.energy], ENERGY_AFFINITY);
    const s = skillScore(me.skills || [], other.skill);
    const raw = g * 0.4 + e * 0.3 + s * 0.3;
    const jitter = (hash(other.name || '') % 7); // small deterministic variance so scores feel organic
    return Math.min(99, Math.round(raw * 85 + 10 + jitter));
  }

  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 20;
  }

  function label(me, other) {
    const myPrimary = Array.isArray(me.genre) ? me.genre[0] : me.genre;
    return `${myPrimary} + ${other.genre}`;
  }

  return { compatibility, label, GENRE_AFFINITY, ENERGY_AFFINITY, COMPLEMENTARY_SKILLS };
})();
</script>
<script>/* ============================================================
   FREQUENCY OASIS — rooms.js
   Frequency Rooms (creative rooms) + Collaboration Projects.
   ============================================================ */

const OasisRooms = (() => {

  async function renderRoomsList(container) {
    const rooms = await OasisDB.getAll('rooms');
    container.innerHTML = `
      <h1 class="page-title">Frequency Rooms</h1>
      <p class="page-sub">Creative rooms built around sound and ideas — not timelines.</p>
      <div class="grid grid-2" id="roomsGrid"></div>
    `;
    const grid = container.querySelector('#roomsGrid');
    rooms.forEach(r => {
      const el = document.createElement('button');
      el.className = 'card';
      el.style = 'text-align:left; width:100%; cursor:pointer; border:1px solid var(--hairline); background:var(--panel-glass);';
      el.innerHTML = `
        <div style="display:flex; align-items:flex-start; gap:12px;">
          <div style="font-size:26px;">${r.icon}</div>
          <div style="flex:1; min-width:0;">
            <h3 style="font-size:15.5px;">${r.name}</h3>
            <p style="margin:2px 0 8px;">${r.desc}</p>
            <div class="tag-row">
              <span class="tag">${r.members} in room</span>
              <span class="tag gold">Working: ${truncate(r.working, 34)}</span>
            </div>
          </div>
        </div>`;
      el.addEventListener('click', () => OasisApp.navigate('room', { id: r.id }));
      grid.appendChild(el);
    });
  }

  async function renderRoomDetail(container, roomId) {
    const room = await OasisDB.get('rooms', roomId);
    if (!room) { container.innerHTML = `<div class="empty">Room not found.</div>`; return; }
    const allPosts = await OasisDB.getAll('roomPosts');
    const posts = allPosts.filter(p => p.roomId === roomId).sort((a, b) => b.time - a.time);

    container.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="backBtn">← Rooms</button>
      <div style="margin-top:14px; display:flex; align-items:center; gap:12px;">
        <div style="font-size:30px;">${room.icon}</div>
        <div>
          <h1 class="page-title" style="margin-bottom:2px;">${room.name}</h1>
          <p class="page-sub" style="margin:0;">${room.members} creators · ${room.desc}</p>
        </div>
      </div>

      <div class="section-label">Current Session</div>
      <div id="postsList"></div>

      <div class="section-label" style="margin-top:22px;">Reply to the room</div>
      <div class="card">
        <div class="field">
          <label>Text, voice idea, or audio</label>
          <textarea id="replyText" placeholder="Share a thought, an idea, or a collaboration offer…"></textarea>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-gold btn-sm" id="sendReply">Post to room</button>
          <button class="btn btn-ghost btn-sm" id="attachAudio">🎵 Attach audio idea</button>
        </div>
        <input type="file" id="roomAudioInput" accept="audio/*" class="hidden" />
      </div>
    `;

    container.querySelector('#backBtn').addEventListener('click', () => OasisApp.navigate('rooms'));

    const postsList = container.querySelector('#postsList');
    if (posts.length === 0) {
      postsList.innerHTML = `<div class="empty"><span class="glyph">∿</span>No sessions yet. Start the first one.</div>`;
    } else {
      posts.forEach(p => postsList.appendChild(renderPostCard(p)));
    }

    container.querySelector('#attachAudio').addEventListener('click', () => container.querySelector('#roomAudioInput').click());
    container.querySelector('#roomAudioInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await postToRoom(roomId, container.querySelector('#replyText').value || 'Shared an audio idea.', file);
      renderRoomDetail(container, roomId);
    });

    container.querySelector('#sendReply').addEventListener('click', async () => {
      const text = container.querySelector('#replyText').value.trim();
      if (!text) return;
      await postToRoom(roomId, text, null);
      renderRoomDetail(container, roomId);
    });
  }

  async function postToRoom(roomId, text, file) {
    const profile = await OasisDB.get('profile', 'me');
    const post = {
      id: OasisDB.uid('post'),
      roomId,
      creator: profile ? profile.name : 'You',
      workingOn: null,
      lookingFor: [],
      text,
      time: Date.now(),
      hasAudio: !!file
    };
    if (file) {
      try {
        const buf = await OasisAudio.decodeFile(file);
        const peaks = OasisAudio.extractPeaks(buf);
        post.peaks = peaks;
        post.duration = OasisAudio.formatTime(buf.duration);
      } catch (e) { /* non-audio or decode failure: skip waveform, keep the note */ }
    }
    await OasisDB.put('roomPosts', post);
  }

  function renderPostCard(p) {
    const el = document.createElement('div');
    el.className = 'card';
    const time = new Date(p.time).toLocaleString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
    el.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <div class="avatar">${initials(p.creator)}</div>
        <div>
          <div style="font-family:var(--serif); font-size:14px;">${p.creator}</div>
          <div style="font-size:10.5px; color:var(--text-faint);">${time}</div>
        </div>
      </div>
      ${p.workingOn ? `<div class="tag-row" style="margin-bottom:8px;"><span class="tag gold">Working on: ${p.workingOn}</span></div>` : ''}
      ${p.lookingFor && p.lookingFor.length ? `<div class="tag-row" style="margin-bottom:8px;">${p.lookingFor.map(s => `<span class="tag">Looking for: ${s}</span>`).join('')}</div>` : ''}
      <p>${escapeHtml(p.text)}</p>
      ${p.peaks ? renderWaveformMarkup() : ''}
    `;
    if (p.peaks) {
      requestAnimationFrame(() => {
        OasisAudio.mountPlayer({ container: el.querySelector('.waveform-player'), peaks: p.peaks, durationLabel: p.duration || '00:00' });
      });
    }
    return el;
  }

  function renderWaveformMarkup() {
    return `
      <div class="waveform-player" style="margin-top:10px;">
        <div class="wp-row">
          <button class="wp-play">▶</button>
          <div class="wp-canvas-wrap"><canvas class="wp-canvas"></canvas></div>
          <div class="wp-time">00:00</div>
        </div>
      </div>`;
  }

  // ---------------- Projects ----------------

  async function renderProjects(container) {
    const projects = await OasisDB.getAll('projects');
    container.innerHTML = `
      <h1 class="page-title">Collaboration Projects</h1>
      <p class="page-sub">Private workspaces built to finish something — not to post something.</p>
      <button class="btn btn-gold" id="newProjectBtn" style="margin-bottom:16px;">+ Start a project</button>
      <div id="projectsList"></div>
    `;
    const list = container.querySelector('#projectsList');
    if (projects.length === 0) {
      list.innerHTML = `<div class="empty"><span class="glyph">◆</span>No projects yet.</div>`;
    }
    projects.forEach(p => {
      const pct = Math.round((p.connected / p.total) * 100);
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="tag-row" style="margin-bottom:8px;">
          ${p.looking.map(s => `<span class="tag">✓ ${s}</span>`).join('')}
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="font-size:11px; color:var(--text-faint);">${p.connected} / ${p.total} creators connected</div>
      `;
      list.appendChild(el);
    });

    container.querySelector('#newProjectBtn').addEventListener('click', () => openNewProjectModal(container));
  }

  function openNewProjectModal(container) {
    const modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="mb">
        <div class="modal-sheet">
          <button class="modal-close" id="mc">✕</button>
          <h2>Start a project</h2>
          <p class="page-sub">Give it a name and say who you need.</p>
          <div class="field"><label>Project name</label><input id="pName" placeholder="e.g. Midnight Hospital" /></div>
          <div class="field"><label>What is it</label><textarea id="pDesc" placeholder="One or two sentences on the idea"></textarea></div>
          <div class="field"><label>Looking for (comma separated)</label><input id="pLooking" placeholder="Vocalist, Cover Artist, Mastering Engineer" /></div>
          <button class="btn btn-gold btn-block" id="pSave">Create project</button>
        </div>
      </div>`;
    document.getElementById('mc').addEventListener('click', () => modalRoot.innerHTML = '');
    document.getElementById('mb').addEventListener('click', (e) => { if (e.target.id === 'mb') modalRoot.innerHTML = ''; });
    document.getElementById('pSave').addEventListener('click', async () => {
      const name = document.getElementById('pName').value.trim();
      if (!name) return;
      const looking = document.getElementById('pLooking').value.split(',').map(s => s.trim()).filter(Boolean);
      await OasisDB.put('projects', {
        id: OasisDB.uid('proj'), name,
        desc: document.getElementById('pDesc').value.trim() || 'No description yet.',
        looking: looking.length ? looking : ['Collaborator'],
        connected: 1, total: Math.max(2, looking.length)
      });
      modalRoot.innerHTML = '';
      renderProjects(container);
    });
  }

  // ---------------- helpers ----------------

  function initials(name = '') {
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }
  function truncate(str = '', n) { return str.length > n ? str.slice(0, n - 1) + '…' : str; }
  function escapeHtml(s = '') {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  return { renderRoomsList, renderRoomDetail, renderProjects, renderPostCard };
})();
</script>
<script>/* ============================================================
   FREQUENCY OASIS — profile.js
   Frequency Profile (no follower counts) + Signal Discovery.
   ============================================================ */

const OasisProfile = (() => {

  async function renderProfile(container) {
    const profile = await OasisDB.get('profile', 'me');
    container.innerHTML = `
      <h1 class="page-title">Frequency Profile</h1>
      <p class="page-sub">No followers. Just what your world is made of.</p>

      <div class="card">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px;">
          <div class="avatar" style="width:60px; height:60px; font-size:20px;">${initials(profile.name)}</div>
          <div>
            <h2 style="font-size:19px;">${profile.name}</h2>
            <div class="signal-select" id="signalSelect">
              ${['Creating', 'Searching', 'Collaborating', 'Available'].map(s =>
                `<button class="signal-opt ${profile.signal === s ? 'active' : ''}" data-signal="${s}">${s}</button>`).join('')}
            </div>
          </div>
        </div>
        <p>${profile.bio}</p>

        <div class="section-label">Creative Identity</div>
        <div class="tag-row" style="margin-bottom:16px;">${profile.genre.map(g => `<span class="tag gold">${g}</span>`).join('')}</div>

        <div class="section-label">Energy</div>
        <div class="tag-row" style="margin-bottom:16px;">${profile.energy.map(g => `<span class="tag">${g}</span>`).join('')}</div>

        <div class="section-label">Skills</div>
        <div class="tag-row" style="margin-bottom:16px;">${profile.skills.map(g => `<span class="tag">${g}</span>`).join('')}</div>

        <div class="section-label">Known For</div>
        <div class="tag-row">${profile.knownFor.map(g => `<span class="tag gold">${g}</span>`).join('')}</div>
      </div>

      <div class="section-label" style="margin-top:20px;">Portfolio</div>
      <div class="card">
        <div class="upload-drop" id="portfolioUpload">Drop a demo, beat, or idea here — or tap to upload</div>
        <input type="file" id="portfolioFile" accept="audio/*" class="hidden" />
        <div id="portfolioList" style="margin-top:12px; display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    `;

    container.querySelectorAll('.signal-opt').forEach(btn => {
      btn.addEventListener('click', async () => {
        profile.signal = btn.dataset.signal;
        await OasisDB.put('profile', profile);
        OasisApp.updateSignalPill(profile.signal);
        renderProfile(container);
      });
    });

    const upload = container.querySelector('#portfolioUpload');
    const fileInput = container.querySelector('#portfolioFile');
    upload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await addPortfolioItem(container, file);
    });

    renderPortfolio(container);
  }

  async function addPortfolioItem(container, file) {
    const audio = await OasisDB.getAll('audio');
    try {
      const buf = await OasisAudio.decodeFile(file);
      const peaks = OasisAudio.extractPeaks(buf);
      const url = URL.createObjectURL(file);
      await OasisDB.put('audio', { id: OasisDB.uid('aud'), name: file.name, peaks, duration: OasisAudio.formatTime(buf.duration), url, time: Date.now() });
      renderPortfolio(container);
    } catch (e) {
      alert('Could not read that as audio. Try an mp3/wav/m4a file.');
    }
  }

  async function renderPortfolio(container) {
    const list = container.querySelector('#portfolioList');
    if (!list) return;
    const items = (await OasisDB.getAll('audio')).sort((a, b) => b.time - a.time);
    if (items.length === 0) { list.innerHTML = ''; return; }
    list.innerHTML = '';
    items.forEach(item => {
      const el = document.createElement('div');
      el.innerHTML = `
        <div style="font-size:12px; color:var(--text-dim); margin-bottom:4px;">${item.name}</div>
        <div class="waveform-player">
          <div class="wp-row">
            <button class="wp-play">▶</button>
            <div class="wp-canvas-wrap"><canvas class="wp-canvas"></canvas></div>
            <div class="wp-time">${item.duration}</div>
          </div>
        </div>`;
      list.appendChild(el);
      requestAnimationFrame(() => {
        OasisAudio.mountPlayer({ container: el.querySelector('.waveform-player'), peaks: item.peaks, objectUrl: item.url });
      });
    });
  }

  async function renderDiscover(container) {
    const [me, creators] = await Promise.all([OasisDB.get('profile', 'me'), OasisDB.getAll('creators')]);
    const scored = creators.map(c => ({ ...c, score: OasisMatch.compatibility(me, c) })).sort((a, b) => b.score - a.score);

    container.innerHTML = `
      <h1 class="page-title">Signal Discovery</h1>
      <p class="page-sub">Creators found by frequency compatibility — genre, energy, and complementary skill.</p>
      <div class="grid grid-2" id="discoverGrid"></div>
    `;
    const grid = container.querySelector('#discoverGrid');
    scored.forEach(c => grid.appendChild(renderCreatorCard(c, me)));
  }

  function renderCreatorCard(c, me) {
    const el = document.createElement('div');
    el.className = 'card creator-card';
    const circumference = 2 * Math.PI * 24;
    const offset = circumference - (c.score / 100) * circumference;
    el.innerHTML = `
      <div class="creator-card-head">
        <div class="avatar">${initials(c.name)}</div>
        <div>
          <div class="name">${c.name}</div>
          <div class="role">${c.skill}</div>
        </div>
      </div>
      <div class="tag-row" style="margin-bottom:10px;">
        <span class="tag gold">${c.genre}</span>
        <span class="tag">${c.energy}</span>
      </div>
      <div class="match-score">
        <div class="match-ring">
          <svg viewBox="0 0 60 60">
            <circle class="track" cx="30" cy="30" r="24"/>
            <circle class="fill" cx="30" cy="30" r="24" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="pct">${c.score}%</div>
        </div>
        <div>
          <div style="font-size:11px; color:var(--gold-bright); text-transform:uppercase; letter-spacing:.06em;">Frequency match</div>
          <div style="font-size:12.5px; color:var(--text-dim);">${OasisMatch.label(me, c)}</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px;">Send collaboration signal</button>
    `;
    el.querySelector('button').addEventListener('click', () => OasisApp.navigate('messages', { thread: c.name }));
    return el;
  }

  function initials(name = '') {
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  return { renderProfile, renderDiscover, renderCreatorCard };
})();
</script>
<script>/* ============================================================
   FREQUENCY OASIS — app.js
   Boot sequence, router, home dashboard, messages, audio lab,
   offline state, and service worker / install wiring.
   ============================================================ */

const OasisApp = (() => {
  const routeTitles = {
    oasis: 'Oasis', rooms: 'Frequency Rooms', room: 'Room', discover: 'Signal Discovery',
    projects: 'Projects', messages: 'Messages', lab: 'Audio Lab', profile: 'Profile', create: 'Create'
  };
  let currentRoute = 'oasis';
  let currentParams = {};

  // ---------------- BOOT SEQUENCE ----------------
  function boot() {
    const particlesWrap = document.getElementById('bootParticles');
    for (let i = 0; i < 34; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (4 + Math.random() * 5) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      particlesWrap.appendChild(s);
    }
    const waveCanvas = document.getElementById('bootWave');
    let t = 0, waveRaf;
    (function animateWave() { t += 0.06; OasisAudio.drawIdleWave(waveCanvas, t); waveRaf = requestAnimationFrame(animateWave); })();

    const lines = ['CONNECTING CREATIVE SIGNAL…', 'SEARCHING FREQUENCIES…', 'AUDIO NETWORK ONLINE'];
    const lineEl = document.getElementById('bootLine');
    let i = 0;
    const lineInterval = setInterval(() => {
      i++;
      if (i < lines.length) lineEl.textContent = lines[i];
    }, 1000);

    setTimeout(async () => {
      clearInterval(lineInterval);
      cancelAnimationFrame(waveRaf);
      await OasisDB.seedIfEmpty();
      const boot = document.getElementById('boot');
      boot.classList.add('fade-out');
      setTimeout(() => { boot.remove(); document.getElementById('app').classList.remove('hidden'); init(); }, 900);
    }, 3100);
  }

  // ---------------- ROUTER ----------------
  function navigate(route, params = {}) {
    currentRoute = route; currentParams = params;
    document.getElementById('topbarTitle').textContent = routeTitles[route] || 'Oasis';
    document.querySelectorAll('.side-link, .bn').forEach(b => {
      b.classList.toggle('active', b.dataset.route === route || (route === 'room' && b.dataset.route === 'rooms'));
    });
    render();
    document.getElementById('main').scrollTo({ top: 0, behavior: 'instant' });
  }

  async function render() {
    const view = document.getElementById('view');
    view.innerHTML = '';
    switch (currentRoute) {
      case 'oasis': return renderOasis(view);
      case 'rooms': return OasisRooms.renderRoomsList(view);
      case 'room': return OasisRooms.renderRoomDetail(view, currentParams.id);
      case 'discover': return OasisProfile.renderDiscover(view);
      case 'projects': return OasisRooms.renderProjects(view);
      case 'messages': return renderMessages(view, currentParams.thread);
      case 'lab': return renderLab(view);
      case 'profile': return OasisProfile.renderProfile(view);
      case 'create': return renderCreate(view);
      default: return renderOasis(view);
    }
  }

  // ---------------- HOME DASHBOARD ----------------
  async function renderOasis(view) {
    const profile = await OasisDB.get('profile', 'me');
    const rooms = await OasisDB.getAll('rooms');
    const projects = await OasisDB.getAll('projects');
    updateSignalPill(profile.signal);

    view.innerHTML = `
      <h1 class="page-title">Welcome back, ${profile.name.split(' ')[0]}</h1>
      <p class="page-sub">Your world, at a glance.</p>

      <div class="card">
        <div class="section-label" style="margin-bottom:12px;">Current Signal</div>
        <div class="signal-select" id="homeSignal">
          ${['Creating', 'Searching', 'Collaborating', 'Available'].map(s =>
            `<button class="signal-opt ${profile.signal === s ? 'active' : ''}" data-signal="${s}">${s}</button>`).join('')}
        </div>
      </div>

      <div class="section-label" style="margin-top:20px;">Your Frequency</div>
      <div class="card">
        <div class="tag-row" style="margin-bottom:10px;">${profile.genre.map(g => `<span class="tag gold">${g}</span>`).join('')}</div>
        <div class="tag-row" style="margin-bottom:10px;">${profile.energy.map(g => `<span class="tag">${g}</span>`).join('')}</div>
        <div class="tag-row">${profile.skills.map(g => `<span class="tag">${g}</span>`).join('')}</div>
      </div>

      <div class="section-label" style="margin-top:20px;">Rooms in motion</div>
      <div class="grid grid-2" id="homeRooms"></div>

      <div class="section-label" style="margin-top:20px;">Your projects</div>
      <div id="homeProjects"></div>
    `;

    view.querySelectorAll('#homeSignal .signal-opt').forEach(btn => {
      btn.addEventListener('click', async () => {
        profile.signal = btn.dataset.signal;
        await OasisDB.put('profile', profile);
        updateSignalPill(profile.signal);
        renderOasis(view);
      });
    });

    const roomsWrap = view.querySelector('#homeRooms');
    rooms.slice(0, 4).forEach(r => {
      const el = document.createElement('button');
      el.className = 'card';
      el.style = 'text-align:left; cursor:pointer; width:100%;';
      el.innerHTML = `<div style="font-size:20px; margin-bottom:6px;">${r.icon}</div><h3 style="font-size:14px;">${r.name}</h3><p style="margin:2px 0 0;">${r.members} in room</p>`;
      el.addEventListener('click', () => navigate('room', { id: r.id }));
      roomsWrap.appendChild(el);
    });

    const projWrap = view.querySelector('#homeProjects');
    if (projects.length === 0) {
      projWrap.innerHTML = `<div class="empty">No active projects yet. <br/><button class="btn btn-gold btn-sm" style="margin-top:10px;" id="startProjHome">Start one</button></div>`;
      projWrap.querySelector('#startProjHome').addEventListener('click', () => navigate('projects'));
    } else {
      projects.forEach(p => {
        const pct = Math.round((p.connected / p.total) * 100);
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<h3 style="font-size:14px;">${p.name}</h3><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px; color:var(--text-faint);">${p.connected}/${p.total} connected</div>`;
        projWrap.appendChild(el);
      });
    }
  }

  function updateSignalPill(signal) {
    document.getElementById('signalPill').textContent = signal;
  }

  // ---------------- MESSAGES ----------------
  async function renderMessages(view, openThread) {
    const threads = await OasisDB.getAll('messages');
    view.innerHTML = `
      <h1 class="page-title">Messages</h1>
      <p class="page-sub">Private, creation-focused conversation.</p>
      <div id="threadList" class="grid" style="grid-template-columns:1fr;"></div>
    `;
    const list = view.querySelector('#threadList');
    if (threads.length === 0 && !openThread) {
      list.innerHTML = `<div class="empty"><span class="glyph">✉</span>No conversations yet.</div>`;
    }
    threads.forEach(t => {
      const last = t.items[t.items.length - 1];
      const el = document.createElement('button');
      el.className = 'card';
      el.style = 'text-align:left; cursor:pointer; width:100%; display:flex; gap:12px; align-items:center;';
      el.innerHTML = `<div class="avatar">${initials(t.thread)}</div><div style="flex:1; min-width:0;"><div style="font-family:var(--serif); font-size:14px;">${t.thread}</div><div style="font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${last ? last.text : ''}</div></div>`;
      el.addEventListener('click', () => openThreadView(view, t.thread));
      list.appendChild(el);
    });

    if (openThread) {
      const exists = threads.find(t => t.thread === openThread);
      if (!exists) {
        await OasisDB.put('messages', { id: OasisDB.uid('msg'), thread: openThread, items: [] });
      }
      openThreadView(view, openThread);
    }
  }

  async function openThreadView(view, threadName) {
    const threads = await OasisDB.getAll('messages');
    const thread = threads.find(t => t.thread === threadName);
    view.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="backMsg">← Messages</button>
      <div style="margin-top:14px; display:flex; align-items:center; gap:10px;">
        <div class="avatar">${initials(threadName)}</div><h2>${threadName}</h2>
      </div>
      <div class="card" id="threadMsgs" style="max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input id="msgInput" placeholder="Write something creative…" style="flex:1; background:rgba(0,0,0,.3); border:1px solid var(--hairline); border-radius:20px; padding:10px 16px; color:var(--text);" />
        <button class="btn btn-gold btn-sm" id="msgSend">Send</button>
      </div>
    `;
    view.querySelector('#backMsg').addEventListener('click', () => navigate('messages'));
    const box = view.querySelector('#threadMsgs');
    (thread.items || []).forEach(m => box.appendChild(renderMsgBubble(m)));
    box.scrollTop = box.scrollHeight;

    view.querySelector('#msgSend').addEventListener('click', async () => {
      const input = view.querySelector('#msgInput');
      const text = input.value.trim();
      if (!text) return;
      thread.items.push({ from: 'me', text, time: Date.now() });
      await OasisDB.put('messages', thread);
      box.appendChild(renderMsgBubble({ from: 'me', text, time: Date.now() }));
      box.scrollTop = box.scrollHeight;
      input.value = '';
    });
  }

  function renderMsgBubble(m) {
    const el = document.createElement('div');
    el.style = `align-self:${m.from === 'me' ? 'flex-end' : 'flex-start'}; max-width:80%; background:${m.from === 'me' ? 'rgba(212,175,55,0.12)' : 'rgba(255,255,255,0.04)'}; border:1px solid var(--hairline); border-radius:12px; padding:8px 12px; font-size:13px;`;
    el.textContent = m.text;
    return el;
  }

  // ---------------- AUDIO LAB ----------------
  function renderLab(view) {
    view.innerHTML = `
      <h1 class="page-title">Audio Lab</h1>
      <p class="page-sub">Upload a demo, beat, loop, stem, or voice note. See its waveform. Play it back instantly — all processed on your device.</p>
      <div class="card">
        <div class="upload-drop" id="labUpload">Drop audio here, or tap to choose a file</div>
        <input type="file" id="labFile" accept="audio/*" class="hidden" />
        <div id="labResult" style="margin-top:14px;"></div>
      </div>
    `;
    const upload = view.querySelector('#labUpload');
    const fileInput = view.querySelector('#labFile');
    upload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const result = view.querySelector('#labResult');
      result.innerHTML = `<p style="color:var(--gold-bright);">Analyzing waveform…</p>`;
      try {
        const buf = await OasisAudio.decodeFile(file);
        const peaks = OasisAudio.extractPeaks(buf, 220);
        const url = URL.createObjectURL(file);
        result.innerHTML = `
          <div style="font-size:12px; color:var(--text-dim); margin-bottom:6px;">${file.name}</div>
          <div class="waveform-player">
            <div class="wp-row">
              <button class="wp-play">▶</button>
              <div class="wp-canvas-wrap"><canvas class="wp-canvas"></canvas></div>
              <div class="wp-time">${OasisAudio.formatTime(buf.duration)}</div>
            </div>
            <div class="wp-comments">
              <div class="wp-comment"><span class="t">00:00</span><span>Timeline comments will appear here as collaborators respond.</span></div>
            </div>
          </div>`;
        OasisAudio.mountPlayer({ container: result.querySelector('.waveform-player'), peaks, objectUrl: url });
      } catch (err) {
        result.innerHTML = `<p style="color:#c98;">Couldn't decode that file as audio.</p>`;
      }
    });
  }

  // ---------------- CREATE (mobile quick-create) ----------------
  function renderCreate(view) {
    view.innerHTML = `
      <h1 class="page-title">Create</h1>
      <p class="page-sub">What are you starting?</p>
      <div class="grid" style="grid-template-columns:1fr;">
        <button class="card" id="cRoom" style="text-align:left; cursor:pointer;"><h3>Reply in a Room</h3><p>Share an idea or session update in a Frequency Room.</p></button>
        <button class="card" id="cProject" style="text-align:left; cursor:pointer;"><h3>Start a Project</h3><p>Open a collaboration workspace and say who you're looking for.</p></button>
        <button class="card" id="cLab" style="text-align:left; cursor:pointer;"><h3>Upload to Audio Lab</h3><p>Analyze and preview a new idea.</p></button>
      </div>
    `;
    view.querySelector('#cRoom').addEventListener('click', () => navigate('rooms'));
    view.querySelector('#cProject').addEventListener('click', () => navigate('projects'));
    view.querySelector('#cLab').addEventListener('click', () => navigate('lab'));
  }

  function initials(name = '') { return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

  // ---------------- OFFLINE STATE ----------------
  function wireOfflineState() {
    const banner = document.getElementById('offlineBanner');
    const dot = document.querySelector('.sidebar-status .dot');
    const label = document.getElementById('netLabel');
    function update() {
      const offline = !navigator.onLine;
      banner.classList.toggle('hidden', !offline);
      if (dot) dot.classList.toggle('online', !offline);
      if (dot) dot.classList.toggle('offline', offline);
      if (label) label.textContent = offline ? 'Offline — saved locally' : 'Signal online';
    }
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  }

  // ---------------- NAV WIRING ----------------
  function wireNav() {
    document.querySelectorAll('#sideNav .side-link, #bottomNav .bn').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.route));
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.querySelector('.sidebar').classList.toggle('mobile-open');
    });
  }

  function init() {
    wireNav();
    wireOfflineState();
    navigate('oasis');
  }

  return { navigate, updateSignalPill, boot };
})();

// ---------------- SERVICE WORKER ----------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => { /* offline-first still works via IndexedDB */ });
  });
}

// PWA install prompt capture (used silently; browser shows its own install UI)
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__oasisInstallEvent = e; });

OasisApp.boot();
</script>
</body>
