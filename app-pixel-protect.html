h1,h2,h3{font-weight:800;letter-spacing:.01em;line-height:1.15}h1{font-size:2rem}h2{font-size:1.3rem;margin:22px 0 10px}h3{font-size:1.05rem}
.mu{color:var(--mu);font-size:.9rem}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.top img{width:40px;height:40px;border-radius:10px;cursor:pointer}
input{flex:1;min-width:0;background:var(--s1);border:1px solid var(--ln);color:var(--tx);padding:11px 14px;border-radius:2px;font:inherit}
button,.b{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);padding:10px 14px;border-radius:2px;cursor:pointer;text-align:left}
button:hover{border-color:var(--pu)}:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.pri{background:var(--pu);border-color:var(--pu);font-weight:700}.pri:hover{border-color:var(--te)}
.card{background:var(--s1);border:1px solid var(--ln);padding:14px;margin:10px 0;border-left:4px solid var(--pu)}
.opt{display:block;width:100%;margin:8px 0}.opt.ok{border-color:var(--te);background:#00d4aa14}.opt.no{border-color:var(--rd);background:#ff5c7a12}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0A0A0Fee;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav button{flex:1;border:0;border-top:3px solid transparent;text-align:center;font-weight:800;font-size:.78rem;letter-spacing:.06em;padding:14px 2px;background:none}
nav button.on{border-top-color:var(--te);color:var(--te)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{background:var(--s1);border:1px solid var(--ln);padding:12px;cursor:pointer;text-align:left}
.px{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}.px i{aspect-ratio:1;background:var(--s2)}.px i.f{background:var(--te)}.px.w i.f{background:var(--go)}.px.a i.f{background:var(--rd)}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.05em}.g{color:var(--te)}.w{color:var(--go)}.a{color:var(--rd)}
.phone{width:260px;max-width:100%;margin:12px auto;border:3px solid var(--ln);border-radius:26px;padding:14px;background:#0d0d14}
.bub{background:var(--s2);border-radius:14px;padding:12px;font-size:.92rem}.hot{border-bottom:2px dashed var(--go);cursor:pointer}.hot.seen{border-color:var(--te)}
.pc{border:2px solid var(--ln);background:#0d0d14;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc button{font-size:.85rem}.pc .seen{border-color:var(--te)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.flow span{padding:7px 10px;border:1px solid var(--rd);font-size:.8rem;font-weight:700;opacity:0;animation:in .5s forwards}.flow.safe span{border-color:var(--te)}.flow b{color:var(--mu)}
@keyframes in{to{opacity:1}}@media(prefers-reduced-motion:reduce){.flow span{animation:none;opacity:1}}
.step{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.step b{color:var(--go);letter-spacing:.06em}
.bar{height:6px;background:var(--s2);margin:6px 0}.bar i{display:block;height:100%;background:var(--pu)}
.lbl{color:var(--go);font-weight:800;font-size:.8rem;margin-top:8px}
.ft{margin-top:30px;color:var(--mu);font-size:.75rem;text-align:center}

<div class="mosaic">${Object.keys(AREAS).map(a=>{const s=st(a),c=cnt(a);return`<div class="area" role="button" tabindex="0" onclick="tab='protect';sub='${a}';go()"><b>${AREAS[a]}</b><div class="tag ${s[1]}">${s[0]}</div>${mos(a)}<span class="mu">${c[0]}/${c[1]} checks</span></div>`}).join('')}</div>
<h2>QUICK CHECK</h2><div class="card"><b>${QC[day%QC.length]}</b><p class="mu">If you hesitate, that is the skill working. Verify before you act.</p></div>
<h2>DAILY DEFENSE</h2>${daily()}
<h2>PROGRESS</h2>${Object.keys(AREAS).map(a=>{const c=cnt(a);return`<div class="mu">${AREAS[a].toUpperCase()} · ${c[0]}/${c[1]} checks</div><div class="bar"><i style="width:${c[0]/c[1]*100}%"></i></div>`}).join('')}
<div class="mu">THREAT RECOGNITION · ${rec()}% · ${Object.keys(S.sc).length}/${SC.length} scenarios · ${Object.keys(S.ls).length}/2 lessons</div>`}
function daily(){const i=day%TC.length;return`<div class="card"><div class="lbl">TODAY'S THREAT</div>${TC[i][0]}<div class="lbl">TODAY'S CHECK</div>${TC[i][1]}<div class="lbl">TODAY'S MOVE</div>${TC[i][2]}</div>`}
function learn(){return`<h1>LEARN</h1><p class="mu">See, understand, decide, practice, do it, check.</p>
<div class="card"><h3>Phishing ${S.ls.phish?'<span class="tag g">DONE</span>':''}</h3><p class="mu">Inspect a phone message, then decide.</p><button class="pri" onclick="phish()">Open phone simulator</button></div>
<div class="card"><h3>PC danger spotting ${S.ls.pc?'<span class="tag g">DONE</span>':''}</h3><p class="mu">Tap each item on a Windows desktop.</p><button class="pri" onclick="pcsim()">Open PC simulator</button></div>
<h2>SCENARIOS</h2>${SC.map((s,i)=>`<button class="opt" onclick="scen(${i})"><span class="tag w">${s[0]}</span> Scenario ${String(31+i).padStart(3,'0')} ${S.sc[i]!=null?'<span class="tag g">· answered</span>':''}</button>`).join('')}
<div id="lv"></div>`}
function V(h){$('#v').innerHTML=h}
function phish(){const E={s:['Sender','A random number, not your bank\'s short code. Verify the sender, never trust the name.'],w:['Wording','"Suspended" and "immediately" are pressure words. Banks do not threaten by SMS.'],l:['Link','A shortened or odd address hides where you land. Real banks do not ask you to log in via text.'],a:['Request','It wants you to "verify", meaning type your details into a page it controls.']};
V(`<h1>PHISHING</h1><p class="mu">Tap the underlined parts.</p><div class="phone"><div class="mu" style="font-size:.75rem"><span class="hot" data-k="s">+27 76 555 0188</span></div><div class="bub"><span class="hot" data-k="w">Your bank account has been suspended.</span> <span class="hot" data-k="a">Verify your details</span> <span class="hot" data-k="w">immediately</span> at <span class="hot" data-k="l">bit.ly/secure-bank-ver</span></div></div><div class="card" id="ex">Tap a highlighted part.</div><div id="dec"></div>`);
const seen=new Set;document.querySelectorAll('.hot').forEach(h=>h.onclick=()=>{h.classList.add('seen');seen.add(h.dataset.k);const e=E[h.dataset.k];$('#ex').innerHTML=`<b>${e[0]}</b><p>${e[1]}</p>`;if(seen.size==4)dec()})}
function dec(){$('#dec').innerHTML=`<h2>WHAT WOULD YOU DO?</h2>`+[['Click the link',0],['Reply to the sender',0],['Open the bank\'s official app on your own',1],['Forward it to someone',0]].map(o=>`<button class="opt" data-g="${o[1]}">${o[0]}</button>`).join('')+'<div id="out"></div>';
document.querySelectorAll('#dec .opt').forEach(b=>b.onclick=()=>{const g=b.dataset.g==1;document.querySelectorAll('#dec .opt').forEach(x=>x.disabled=true);b.classList.add(g?'ok':'no');S.ls.phish=1;save();
$('#out').innerHTML=`<p>${g?'Right. You verified through a channel the attacker does not control.':'Understandable, many people do. Here is what happens next:'}</p><div class="mu tag">THE ATTACK</div><div class="flow">${['Message','Suspicious link','Fake login page','Details exposed'].map((x,i)=>`<span style="animation-delay:${i*.5}s">${x}</span>${i<3?'<b>›</b>':''}`).join('')}</div><div class="mu tag">THE SAFE MOVE</div><div class="flow safe">${['Stop','Verify independently','Official app','Report','Protected'].map((x,i)=>`<span style="animation-delay:${2+i*.4}s">${x}</span>${i<4?'<b>›</b>':''}`).join('')}</div><button onclick="tab='check';go()">DO IT: open the Before you click checklist</button>`})}
function pcsim(){const I=[['invoice_final.pdf.exe','Danger. It is a program disguised as a document. Hidden file extensions are the trick. Delete it.',0],['Browser extension: FreeCoupons+','Warning. Extensions can read every page. Remove ones you did not choose.',0],['Pop-up: "PC infected, call 0800..."','Danger. Fake support pop-up. Close the browser, do not call.',0],['AnyDesk running, you never installed it','Danger. Someone may have remote access. Disconnect, uninstall, change passwords.',0],['Windows Update: restart to finish','Safe. Real updates are in Settings › Windows Update. Restart soon.',1],['Unknown USB stick found outside','Danger. Do not plug it in. Malware spreads this way.',0]];
V(`<h1>PC SIMULATOR</h1><p class="mu">Tap each item on this Windows desktop.</p><div class="pc">${I.map((x,i)=>`<button data-i="${i}">${x[0]}</button>`).join('')}</div><div class="card" id="ex">Tap an item.</div>`);
const s=new Set;document.querySelectorAll('.pc button').forEach(b=>b.onclick=()=>{const x=I[b.dataset.i];b.classList.add('seen');s.add(b.dataset.i);$('#ex').innerHTML=`<b>${x[0]}</b><p class="${x[2]?'g':'a'}">${x[1]}</p>`;if(s.size==I.length){S.ls.pc=1;save();$('#ex').innerHTML+='<p class="g">All reviewed. Now check your own PC in PROTECT › PC.</p>'}})}
function scen(i){const s=SC[i];V(`<h1>SCENARIO ${31+i}</h1><span class="tag w">${s[0]}</span><div class="phone"><div class="bub">${s[1]}</div></div><h2>${s[2]}</h2>`+s[3].map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join('')+'<div id="out"></div>');
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=s[3][b.dataset.j];document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(o[1]==2?'ok':o[1]?'':'no');S.sc[i]=o[1];save();$('#out').innerHTML=`<div class="card"><b>${['Not this one.','Close.','Strong move.'][o[1]]}</b><p>${o[2]}</p></div><button onclick="tab='learn';go()">Back to scenarios</button>`})}
function protect(){const L=P.filter(x=>x[0]==sub);return`<h1>PROTECT</h1><div class="row" style="margin:10px 0">${Object.keys(AREAS).map(a=>`<button class="${a==sub?'pri':''}" onclick="sub='${a}';go()">${AREAS[a]}</button>`).join('')}</div><p class="mu">${cnt(sub)[0]}/${cnt(sub)[1]} checked. Tick means you checked it yourself.</p>`+L.map(x=>`<div class="card"><h3>${x[2]}</h3><div class="lbl">WHAT IT IS</div>${x[3]}<div class="lbl">WHY IT MATTERS</div>${x[4]}<div class="lbl">WHAT TO CHECK</div>${x[5]}<div class="lbl">WHERE TO FIND IT</div>${sub=='phone'?`<b>Android:</b> ${x[6]}<br><b>iPhone:</b> ${x[7]}`:sub=='pc'?`Windows: ${x[7]}`:`${x[7]}`}<p class="mu" style="margin-top:6px">Menus differ by brand and software version.</p><button class="${S.d[x[1]]?'opt ok':'opt'}" onclick="S.d['${x[1]}']=!S.d['${x[1]}'];save();go()">${S.d[x[1]]?'Checked ✓':'Mark as checked'}</button></div>`).join('')}
function check(){const w=['today','week','month'],now=Date.now();return`<h1>ALWAYS CHECK</h1><p class="mu">A few habits beat a long list.</p>`+Object.keys(BEF).map(k=>`<h2>${k}</h2><div class="card">${BEF[k].map(x=>`<div>• ${x}</div>`).join('')}</div>`).join('')+`<h2>Regular device check</h2>`+w.map(c=>{const L=REG.filter(x=>x[1]==c);return L.length?`<div class="lbl">${c=='today'?'TODAY':c=='week'?'THIS WEEK':'THIS MONTH'}</div>`+L.map(x=>{const i=REG.indexOf(x),ms=c=='today'?864e5:c=='week'?6048e5:2592e6,on=S.t[i]&&now-S.t[i]<ms;return`<button class="${on?'opt ok':'opt'}" onclick="S.t[${i}]=${on?0:'Date.now()'};save();go()">${on?'✓ ':''}${x[0]}</button>`}).join(''):''}).join('')}
function threats(){return`<h1>THREATS</h1>`+T.map(t=>`<div class="card"><h3>${t[0]}</h3><div class="phone" style="width:auto"><div class="bub">${t[1]}</div></div><div class="lbl">WHAT YOU SEE</div>${t[1].length?'The example above.':''}<div class="lbl">WHAT IT MEANS</div>${t[2]}<div class="lbl">WARNING SIGNS</div>${t[3]}<div class="lbl">WHAT TO DO</div>${t[4]}<div class="lbl">WHAT NOT TO DO</div>${t[5]}</div>`).join('')}
function respond(){return`<h1>I THINK I'VE BEEN HACKED</h1><p class="mu">Breathe. Most of this is fixable. What happened?</p>`+R.map((r,i)=>`<button class="opt" onclick="pick(${i})">${r[0]}</button>`).join('')+'<div id="rp"></div>'}
function pick(i){const s=RS[R[i][1]],n=['STOP','CONTAIN','SECURE','VERIFY','RECOVER','REPORT'];$('#v').innerHTML=`<button onclick="go()">‹ Back</button><h2>${R[i][0]}</h2>`+s.map((x,j)=>`<div class="step"><b>${n[j]}</b><span>${x.split(': ').slice(1).join(': ')}</span></div>`).join('')+'<p class="mu">Always use official apps, sites and numbers you find yourself, never ones given in the suspicious message.</p>';scrollTo(0,0)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
go();
</script></body></html>
