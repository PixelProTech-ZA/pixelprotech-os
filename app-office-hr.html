<style>
:root{
  --bg:#EDEFF3;--surface:#FFFFFF;--surface2:#F6F7FA;--ink:#151A26;--ink2:#505869;--ink3:#8990A2;
  --line:#DBDFE7;--line2:#E8EBF1;
  --accent:#2340E0;--accent-ink:#FFFFFF;--accent-soft:#E2E7FD;
  --urgent:#D3302A;--urgent-soft:#FBE2E0;
  --high:#C25A00;--high-soft:#FBE8D5;
  --amber:#96700A;--amber-soft:#F8EDC6;
  --normal:#4A5A86;--normal-soft:#E5E9F3;
  --low:#7E8596;--low-soft:#ECEEF3;
  --wait:#6B45C7;--wait-soft:#EAE3F8;
  --ok:#1E8A57;--ok-soft:#D9F0E4;
  --av-l:88%;--av-t:26%;
  --shadow:0 1px 2px rgba(21,26,38,.06),0 12px 32px rgba(21,26,38,.12);
  --font-h:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --font:'Instrument Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E121B;--surface:#161B27;--surface2:#121723;--ink:#ECEFF6;--ink2:#A9B1C3;--ink3:#7D869A;
    --line:#262D3E;--line2:#1E2434;
    --accent:#8095FF;--accent-ink:#0B1030;--accent-soft:#1D2657;
    --urgent:#FF7B72;--urgent-soft:#3B1B19;
    --high:#F2A15A;--high-soft:#3A2614;
    --amber:#E8BC4C;--amber-soft:#342A0E;
    --normal:#9FB0DD;--normal-soft:#1F2740;
    --low:#98A0B2;--low-soft:#232839;
    --wait:#B79CF5;--wait-soft:#2A2145;
    --ok:#52C58B;--ok-soft:#14301F;
    --av-l:30%;--av-t:88%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121B;--surface:#161B27;--surface2:#121723;--ink:#ECEFF6;--ink2:#A9B1C3;--ink3:#7D869A;
  --line:#262D3E;--line2:#1E2434;
  --accent:#8095FF;--accent-ink:#0B1030;--accent-soft:#1D2657;
  --urgent:#FF7B72;--urgent-soft:#3B1B19;
  --high:#F2A15A;--high-soft:#3A2614;
  --amber:#E8BC4C;--amber-soft:#342A0E;
  --normal:#9FB0DD;--normal-soft:#1F2740;
  --low:#98A0B2;--low-soft:#232839;
  --wait:#B79CF5;--wait-soft:#2A2145;
  --ok:#52C58B;--ok-soft:#14301F;
  --av-l:30%;--av-t:88%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-h);margin:0}
.ic{flex:none}

/* layout */
#app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{display:block;font:700 15px/1.1 var(--font-h);letter-spacing:.02em}
.brand span{display:block;font-size:12px;color:var(--ink3)}
.navlist{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink2);font-weight:500;cursor:pointer}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;min-width:20px;text-align:center;padding:1px 6px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.nav em.hot{background:var(--urgent);color:#fff}
.sidefoot{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 8px}
.main{overflow-y:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 28px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.searchbtn{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;color:var(--ink3);cursor:pointer}
.topbar .grow{flex:1}
.hamb{display:none}
.content{padding:26px 28px 70px;max-width:1120px;margin:0 auto}
.nav-scrim{display:none}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:40;transform:translateX(-102%);transition:transform .18s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .nav-scrim.show{display:block;position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:35}
  .hamb{display:inline-flex}
  .topbar{padding:10px 14px}.content{padding:20px 14px 70px}
  .searchbtn span.lbl{display:none}.searchbtn{flex:none;padding:8px 10px}
  .topbar .grow{display:block}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--urgent);border-color:var(--urgent-soft)}
.btn.danger.solid{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;padding:0}
.ico:hover{border-color:var(--ink3)}
input:not([type=checkbox]),select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
textarea{resize:vertical}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none;margin:0}
label{font-weight:500;font-size:13px;color:var(--ink2)}
small{color:var(--ink3);font-size:12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
.lede{color:var(--ink2);margin:6px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input{flex:1;min-width:200px}.filters select{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chipb{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--ink2);font-weight:500}
.chipb.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chipb small{margin-left:5px;color:inherit;opacity:.7}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0}
.tab{border:0;background:none;padding:9px 12px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab small{margin-left:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h3{font-size:15px;margin:0 0 10px}
.card+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.empty{border:1px dashed var(--line);border-radius:8px;padding:26px;text-align:center;color:var(--ink2);background:var(--surface2)}
.empty p{margin:0 0 12px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:3px;background:var(--line2);color:var(--ink2)}
.chip.late{background:var(--urgent-soft);color:var(--urgent)}
.chip.now{background:var(--amber-soft);color:var(--amber)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.time{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:3px}
.p-urgent{background:var(--urgent-soft);color:var(--urgent)}
.p-high{background:var(--high-soft);color:var(--high)}
.p-normal{background:var(--normal-soft);color:var(--normal)}
.p-low{background:var(--low-soft);color:var(--low)}
.av{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font:700 14px var(--font-h);flex:none;background:hsl(var(--h) 45% var(--av-l));color:hsl(var(--h) 45% var(--av-t))}
.av.lg{width:64px;height:64px;font-size:22px;border-radius:8px}
.elink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.elink:hover{text-decoration-color:var(--accent);color:var(--accent)}

/* today */
.hello h1{font-size:clamp(28px,4.2vw,42px);line-height:1.05;letter-spacing:-.025em}
.hello p{margin:6px 0 0;color:var(--ink2)}
.daybar{margin:24px 0 10px;display:flex;flex-wrap:wrap;gap:3px}
.daybar i{width:15px;height:15px;background:var(--c);border-radius:2px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 26px}
.legend button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink2)}
.legend b{font:700 20px/1 var(--font-h);color:var(--ink)}
.legend i{width:11px;height:11px;border-radius:2px;background:var(--c)}
.s-urgent{--c:var(--urgent)}.s-overdue{--c:var(--high)}.s-due{--c:var(--amber)}.s-sched{--c:var(--accent)}.s-wait{--c:var(--wait)}.s-done{--c:var(--ok)}.s-up{--c:var(--normal)}.s-other{--c:var(--low)}
.todaygrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
@media (max-width:980px){.todaygrid{grid-template-columns:minmax(0,1fr)}}
.next{background:var(--ink);color:var(--surface);border-radius:8px;padding:18px 20px;margin-bottom:26px}
.next small{color:inherit;opacity:.7;font-size:13px}
.next h2{font-size:22px;margin:4px 0 2px;line-height:1.2}
.next p{margin:0 0 14px;opacity:.85}
.next .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.next .btn.plain{background:transparent;color:inherit;border-color:rgba(128,128,128,.6)}
.tsec{margin:0 0 26px;scroll-margin-top:70px}
.tsec>h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:17px;line-height:1.2}
.tsec>h3 i{width:11px;height:11px;border-radius:2px;background:var(--c);flex:none}
.tsec>h3 em{font:400 13px var(--font);font-style:normal;color:var(--ink3)}
.tsec details>summary{cursor:pointer;font:700 17px var(--font-h);margin-bottom:10px;list-style-position:inside}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:6px;cursor:pointer}
.row:hover{border-color:var(--ink3);border-left-color:var(--c,var(--ink3))}
.row.done .rt b{text-decoration:line-through;color:var(--ink3);font-weight:500}
.pr-urgent{--c:var(--urgent)}.pr-high{--c:var(--high)}.pr-normal{--c:var(--normal)}.pr-low{--c:var(--low)}
.rmain{flex:1;min-width:0}
.rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rt b{font-weight:600}
.stg{font-size:12px;color:var(--ink3);border:1px solid var(--line);padding:0 6px;border-radius:3px}
.rs{display:flex;gap:4px 14px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
.rc{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.rc:empty{display:none}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rside .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{flex-wrap:wrap}.rside{flex-direction:row;align-items:center;width:100%;justify-content:space-between}}
.pips{display:flex;gap:2px}
.pips i{width:8px;height:8px;background:var(--line);border-radius:1px;display:block}
.pips i.on{background:var(--accent)}
.pips i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 0 0 3px var(--accent)}
.tick{width:22px;height:22px;border-radius:5px;border:2px solid var(--ink3);background:transparent;display:grid;place-items:center;color:transparent;cursor:pointer;flex:none;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick:hover{border-color:var(--ok)}
.kico{width:22px;height:22px;display:grid;place-items:center;color:var(--ink3);flex:none}
.srow{display:flex;gap:14px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;cursor:pointer}
.srow.done{opacity:.55}
.srow time{font:600 17px var(--font-h);min-width:52px}
.taside .card{margin-bottom:14px}
.taside .card+.card{margin-top:0}
.li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
.li:first-of-type{border-top:0;padding-top:0}
.li small{display:block}
.start ol{padding-left:20px;color:var(--ink2)}
.start li{margin:8px 0}

/* people */
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;margin-bottom:6px}
.prow:hover{border-color:var(--ink3)}
.prow .who{display:flex;gap:12px;align-items:center;min-width:0}
.prow .who div{min-width:0}
.prow b{display:block;font-weight:600}
.prow span.sub{color:var(--ink2);font-size:13px}
.prow .pd{color:var(--ink2);font-size:14px;min-width:0}
@media (max-width:760px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .pd{display:none}}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:28px;line-height:1.1}
.phead .grow{flex:1;min-width:200px}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.kvi span{display:block;font-size:12px;color:var(--ink3)}
.kvi b{font-weight:500;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface2)}
.tag button{border:0;background:none;cursor:pointer;color:var(--ink3);padding:0 6px;font-size:16px;line-height:1}
.addrow{display:flex;gap:8px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:640px){.setgrid{grid-template-columns:1fr}}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:1px;background:var(--ink3)}
.timeline small{display:block}
.att{display:flex;gap:4px;flex-wrap:wrap}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.att button.on{color:#fff;border-color:transparent}
.att .present.on{background:var(--ok)}.att .remote.on{background:var(--accent)}.att .late.on{background:var(--amber)}.att .absent.on{background:var(--urgent)}.att .leave.on{background:var(--wait)}.att .off.on{background:var(--low)}
.arow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.arow .who{display:flex;gap:10px;align-items:center}
.day{margin-bottom:22px}
.day h3{font-size:16px;margin-bottom:8px}
.day h3 small{font:400 13px var(--font);margin-left:8px}

/* sheets */
#layer .scrim,#dlg .scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.sheet.enter{animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}.side{transition:none}}

<body>
<div id="app"></div>
<div id="layer"></div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   PIXEL OFFICE HR  -  PixelProTech product #3
   Everything on screen is computed from the records stored below.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const z2=n=>String(n).padStart(2,'0');
const z4=n=>String(n).padStart(4,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const stamp=()=>{const d=new Date();return ymd(d)+'T'+z2(d.getHours())+':'+z2(d.getMinutes())};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const isBiz=s=>{const w=parseD(s).getDay();return w!==0&&w!==6};
const bizDays=(a,b)=>{let n=0;for(let d=a;d<=b;d=addDays(d,1))if(isBiz(d))n++;return n};
const addBiz=(s,n)=>{let d=s;while(n>0){d=addDays(d,1);if(isBiz(d))n--}return d};
const fmtD=(s,yr)=>{if(!s)return '—';const d=parseD(s),o={weekday:'short',day:'numeric',month:'short'};if(yr||d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-GB',o)};
const fmtRange=(a,b)=>a===b?fmtD(a):`${fmtD(a)} to ${fmtD(b)}`;
const fmtStamp=s=>s?`${fmtD(s.slice(0,10))} ${s.slice(11)}`:'';
const rel=s=>{const n=diff(today(),s);return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?`in ${n} days`:`${-n} days ago`};
const tenure=s=>{if(!s)return '';const a=parseD(s),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;if(m<0)return 'starts '+rel(s);const y=Math.floor(m/12);m%=12;return [y?`${y} yr`:'',m?`${m} mo`:''].filter(Boolean).join(' ')||'under a month'};

/* ---------- icons ---------- */
const IC={
 today:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M14 17h6M17 14v6"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.1 4.5 1.9 4.5 4.8"/>',
 leave:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 onboarding:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 matters:'<path d="M4 5h16v11H9l-5 4z"/>',
 documents:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
 tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
 schedule:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 attendance:'<rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/>',
 settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const logo=(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="var(--accent)"/><g fill="var(--accent-ink)"><rect x="6" y="6" width="5" height="5"/><rect x="12.5" y="6" width="5" height="5" opacity=".55"/><rect x="19" y="6" width="5" height="5"/><rect x="6" y="12.5" width="5" height="5" opacity=".55"/><rect x="12.5" y="12.5" width="5" height="5"/><rect x="19" y="12.5" width="5" height="5" opacity=".3"/><rect x="6" y="19" width="5" height="5"/><rect x="12.5" y="19" width="5" height="5" opacity=".3"/><rect x="19" y="19" width="5" height="5" opacity=".55"/></g></svg>`;

/* ---------- constants ---------- */
const PR=['urgent','high','normal','low'],PRL={urgent:'Urgent',high:'High',normal:'Normal',low:'Low'},PRW={urgent:0,high:1,normal:2,low:3};
const STATUSES=['Active','Onboarding','On leave','Notice period','Exited'];
const EMP_TYPES=['Full-time','Part-time','Contract','Intern'];
const CASE_TYPES=['Query','Workplace concern','Grievance','Performance','Conduct','Absence','Accommodation','Exit / handover','Other'];
const EVENT_TYPES=['Meeting','Interview','Orientation','Review','Deadline','Other'];
const REQ_TYPES=['Employment letter','Details change','Policy question','Payroll query','Reference','Other'];
const WAIT_ON=['Manager approval','Employee response','Employee document','External party','Payroll / Finance','Other'];
const ATT=[['present','Present'],['remote','Remote'],['late','Late'],['absent','Absent'],['leave','Leave'],['off','Off']];
const KIND={leave:'Leave request',onboarding:'Onboarding',case:'Employee matter',doc:'Document',task:'Task'};
const KICON={leave:'leave',onboarding:'onboarding',case:'matters',doc:'documents'};
const KEYS={leave:'leave',onboarding:'onboarding',case:'cases',doc:'docs',task:'tasks'};
const NOUN={case:['employee matter','employee matters'],leave:['leave request','leave requests'],onboarding:['onboarding task','onboarding tasks'],doc:['document follow-up','document follow-ups'],task:['task','tasks'],request:['HR request','HR requests']};
const NAV=[['today','Today'],['people','People'],['leave','Leave'],['onboarding','Onboarding'],['matters','Matters'],['documents','Documents'],['tasks','Tasks and requests'],['schedule','Schedule'],['attendance','Attendance'],['settings','Settings']];

/* ---------- workflows ---------- */
const WF={
 leave:{term:6,stages:['Requested','Review','Check information','Decision','Record','Notify','Closed'],guide:[
  'The request is logged. Confirm who it is for and the dates asked for.',
  'Read the request: is the leave type right, are the dates complete, is anything else needed?',
  'Check the balance, overlaps in the same department and how much notice was given before you decide.',
  'Approve or decline. If the manager must weigh in first, mark this as waiting on manager approval.',
  'Record the outcome. Completing this stage writes approved leave into attendance.',
  'Tell the employee and their manager the outcome, then tick both below.',
  'Closed. The record stays on the employee profile.']},
 onboarding:{term:7,stages:['Start','Employee information','Documents','Verification','Orientation','Setup','Acknowledgements','Complete'],guide:[
  'Confirm the start date and open the employee record.',
  'Collect only what the role needs: contact details, an emergency contact and payroll set-up through the proper channel.',
  'Request and receive documents. You can raise the standard requests below.',
  'Verify the documents and eligibility to work against your policy.',
  'Run the welcome and orientation.',
  'Equipment, accounts and workspace ready.',
  'Collect acknowledgements of the key policies.',
  'Onboarding is complete and the employee is now Active.']},
 case:{term:5,stages:['Received','Review','Action','Follow-up','Outcome','Closed'],guide:[
  'The matter is received. Note who raised it, when, and how urgent it is.',
  'Review the facts, confidentiality and which policy or procedure applies.',
  'Take the agreed action and record it.',
  'Set a follow-up date and check that the action worked.',
  'Write the outcome in plain, factual words.',
  'Closed. The outcome stays on the record.']},
 doc:{term:3,stages:['Requested','Received','Verified','Filed','Review / Expiry'],guide:[
  'Waiting on the employee. Keep a due date and chase if it slips.',
  'Received. Check it is the right document, complete and legible.',
  'Verified. Record where it is stored, then file it.',
  'Filed. Add an expiry date if the document expires.',
  'Watching the expiry. It returns to your Today list 30 days before it expires.']}
};
const CHECKS={
 leave:{5:['Employee told the outcome','Manager told the outcome']},
 onboarding:{
  0:['Offer accepted and start date confirmed','Employee record created','Manager told about the start'],
  1:['Contact details captured','Emergency contact captured','Payroll set-up submitted through the payroll process'],
  2:['Identity document received','Signed employment contract received','Tax and statutory forms received'],
  3:['Documents checked against originals','Eligibility to work confirmed','References or checks done as policy requires'],
  4:['Welcome meeting held','Policies and handbook walked through','Introduced to the team and a buddy'],
  5:['Equipment issued','System accounts and access created','Workspace ready'],
  6:['Handbook acknowledged','Code of conduct acknowledged','Confidentiality agreement signed']},
 case:{1:['Facts gathered','Confidentiality considered','Relevant policy identified'],2:['Action agreed','Action carried out and noted']},
 doc:{1:['Correct document','Complete and legible','Name and dates match the employee']}
};

/* ---------- data ---------- */
const DEF_SETTINGS=()=>({company:'PixelProTech',hrName:'',empPrefix:'PX-',slaDays:2,
 departments:['Leadership','People and culture','Operations','Finance','Engineering','Sales','Customer support'],
 locations:['Head office','Remote','Hybrid'],
 leaveTypes:[{id:'annual',name:'Annual leave',allowance:15},{id:'sick',name:'Sick leave',allowance:10},{id:'family',name:'Family responsibility',allowance:3},{id:'study',name:'Study leave',allowance:5},{id:'unpaid',name:'Unpaid leave',allowance:null}],
 docTypes:['ID document','Employment contract','Tax form','Qualification','Proof of address','Bank confirmation','Medical certificate','Professional registration','Policy acknowledgement','Other'],
 customFields:[]});
const blank=()=>({v:1,employees:[],tasks:[],leave:[],onboarding:[],cases:[],docs:[],events:[],attendance:{},comms:[],history:[],seq:0,settings:DEF_SETTINGS()});
const KEY='pixelofficehr.v1';let memStore=null;
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return memStore}},set(v){try{localStorage.setItem(KEY,v)}catch(e){memStore=v}}};
function load(){try{const raw=store.get();if(raw){const d=JSON.parse(raw),b=blank();for(const k in b)if(d[k]===undefined)d[k]=b[k];d.settings={...b.settings,...d.settings};return d}}catch(e){}return blank()}
let db=load();
const save=()=>store.set(JSON.stringify(db));
const ui={route:['today'],q:'',fDept:'',fStatus:'active',leaveF:'open',obF:'open',caseF:'open',docF:'all',taskF:'open',taskC:'all',schedRange:14,attDate:today(),panel:null,form:null,nav:false};

const emp=id=>db.employees.find(e=>e.id===id);
const coll=k=>db[KEYS[k]];
const find=(k,id)=>coll(k).find(x=>x.id===id);
const log=(it,text,note)=>{(it.log=it.log||[]).push({ts:stamp(),text,note:!!note})};
const hist=(eid,text)=>{if(!eid)return;db.history.unshift({id:uid(),eid,ts:stamp(),text});if(db.history.length>3000)db.history.length=3000};
const leaveType=id=>db.settings.leaveTypes.find(t=>t.id===id)||{id,name:id,allowance:null};
const leaveDays=l=>bizDays(l.start,l.end);
const leaveUsed=(eid,type,ex)=>db.leave.filter(l=>l.employeeId===eid&&l.type===type&&l.decision==='approved'&&l.id!==ex&&l.stage>=4).reduce((a,l)=>a+leaveDays(l),0);
const leavePending=(eid,type,ex)=>db.leave.filter(l=>l.employeeId===eid&&l.type===type&&l.decision!=='declined'&&l.stage<4&&l.id!==ex).reduce((a,l)=>a+leaveDays(l),0);
const awayOn=(eid,d)=>db.leave.find(l=>l.employeeId===eid&&l.decision==='approved'&&l.start<=d&&l.end>=d);
function recordLeave(l){if(l.decision!=='approved')return;for(let d=l.start;d<=l.end;d=addDays(d,1))if(isBiz(d)){(db.attendance[d]=db.attendance[d]||{})[l.employeeId]={s:'leave',lid:l.id}}}
function unrecordLeave(l){for(const d in db.attendance){const r=db.attendance[d][l.employeeId];if(r&&r.lid===l.id)delete db.attendance[d][l.employeeId]}}
const itemTitle=(k,r)=>k==='leave'?`${leaveType(r.type).name}, ${fmtRange(r.start,r.end)}`:k==='onboarding'?'Onboarding':k==='case'?r.title:k==='doc'?r.type:r.title;
const obProgress=o=>{let total=0,done=0;for(const s in CHECKS.onboarding){CHECKS.onboarding[s].forEach((_,i)=>{total++;if(o.checks?.[s+':'+i])done++})}return{total,done}};

/* ---------- work items: the one engine behind Today ---------- */
function norm(kind,r,raw){
  const t=today();
  if(kind==='task')return{kind,id:r.id,title:r.title,eid:r.employeeId,pr:r.priority,due:r.due||null,time:r.time||'',state:r.done?'done':r.waiting?'waiting':'active',waitingOn:r.waiting,stage:r.cat==='request'?(r.reqType||'Request'):'Task',doneAt:r.completedAt,cat:r.cat,raw:r};
  const wf=WF[kind],si=r.stage,fin=si>=wf.term;
  const b={kind,id:r.id,eid:r.employeeId,pr:r.priority||'normal',due:r.due||null,stages:wf.stages,si,stage:wf.stages[si],doneAt:r.completedAt,raw:r,title:itemTitle(kind,r),state:fin?'done':r.waiting?'waiting':'active',waitingOn:r.waiting};
  if(kind==='doc'){
    if(si===0){b.state='waiting';b.waitingOn=r.waiting||'Employee document'}
    if(si>=3&&r.expiry&&!raw){const n=diff(t,r.expiry);if(n<=30)return{...b,title:'Expiry: '+r.type,state:'active',due:r.expiry,pr:n<=7?'high':'normal',stage:'Review / Expiry',stages:null,expiry:true}}
  }
  return b;
}
const items=()=>['task','leave','onboarding','case','doc'].flatMap(k=>coll(k).map(r=>norm(k,r)));
const cmpPr=(a,b)=>PRW[a.pr]-PRW[b.pr];
const cmpDue=(a,b)=>{const x=a.due||'9999',y=b.due||'9999';return x<y?-1:x>y?1:0};
const key=i=>i.kind==='task'&&i.cat==='request'?'request':i.kind;
const phrase=l=>{const c={};l.forEach(i=>{const k=key(i);c[k]=(c[k]||0)+1});return Object.entries(c).map(([k,n])=>`${n} ${NOUN[k][n===1?0:1]}`).join(', ')};
function buckets(){
  const t=today(),b={urgent:[],overdue:[],due:[],waiting:[],tsched:[],upcoming:[],other:[],done:[]};
  for(const it of items()){
    if(it.state==='done'){if(it.doneAt&&it.doneAt.slice(0,10)===t)b.done.push(it);continue}
    if(it.state==='waiting'){b.waiting.push(it);continue}
    if(it.pr==='urgent'){b.urgent.push(it);continue}
    if(it.kind==='task'&&it.time&&it.due===t){b.tsched.push(it);continue}
    if(it.due&&it.due<t)b.overdue.push(it);
    else if(it.due===t)b.due.push(it);
    else if(it.due&&it.due<=addDays(t,7))b.upcoming.push(it);
    else b.other.push(it);
  }
  b.urgent.sort((a,c)=>cmpDue(a,c));
  b.overdue.sort((a,c)=>cmpDue(a,c)||cmpPr(a,c));
  b.due.sort((a,c)=>cmpPr(a,c)||(a.time||'').localeCompare(c.time||''));
  b.waiting.sort((a,c)=>cmpDue(a,c)||cmpPr(a,c));
  b.upcoming.sort((a,c)=>cmpDue(a,c)||cmpPr(a,c));
  b.other.sort((a,c)=>cmpPr(a,c));
  b.events=db.events.filter(e=>e.date===t).sort((a,c)=>(a.time||'').localeCompare(c.time||''));
  b.sched=[...b.events.map(e=>({k:'event',time:e.time||'',e})),...b.tsched.map(i=>({k:'task',time:i.time,i}))].sort((a,c)=>a.time.localeCompare(c.time));
  return b;
}
function alerts(){
  const t=today(),a=[];
  const hasTask=title=>db.tasks.some(x=>x.title===title&&!x.done);
  db.employees.filter(e=>e.status!=='Exited').forEach(e=>{
    if(e.probationEnd){const n=diff(t,e.probationEnd),title='Probation review: '+e.name;
      if(n>=-7&&n<=14&&!hasTask(title))a.push({eid:e.id,hot:n<=3,text:n<0?`Probation ended ${-n} days ago. Is the outcome recorded?`:n===0?'Probation ends today':`Probation ends ${rel(e.probationEnd)}`,task:{title,due:e.probationEnd<t?t:e.probationEnd,priority:'high',eid:e.id}})}
    if(e.endDate){const n=diff(t,e.endDate),title='Exit checklist: '+e.name;
      if(n>=0&&n<=30&&!hasTask(title))a.push({eid:e.id,hot:n<=7,text:`Employment ends ${rel(e.endDate)}, ${fmtD(e.endDate)}`,task:{title,due:addDays(e.endDate,-3)<t?t:addDays(e.endDate,-3),priority:'high',eid:e.id}})}
    const sd=e.startDate?diff(t,e.startDate):null;
    if((e.status==='Onboarding'||(sd!==null&&sd>=0&&sd<=14))&&!db.onboarding.some(o=>o.employeeId===e.id))a.push({eid:e.id,hot:sd!==null&&sd<=3,text:sd!==null&&sd>=0?`Starts ${rel(e.startDate)} and has no onboarding yet`:'Marked onboarding but no workflow started',onb:true});
  });
  return a.sort((x,y)=>(y.hot?1:0)-(x.hot?1:0));
}

const layer=()=>$('#layer');
function showSheet(html,cls=''){const L=layer(),first=!L.firstChild;L.innerHTML=`<div class="scrim" data-act="${cls==='panel'||cls==='search'||cls==='menu'?'closeSheet':'noop'}"></div><aside class="sheet ${cls} ${first?'enter':''}" role="dialog" aria-modal="true">${html}</aside>`}

function ask(msg,ok='Confirm',danger=false){return new Promise(res=>{const d=$('#dlg');d.innerHTML=`<div class="scrim"></div><div class="dialog" role="alertdialog"><p>${esc(msg)}</p><div class="dlg-f"><button class="btn" data-dlg="0">Cancel</button><button class="btn ${danger?'danger solid':'primary'}" data-dlg="1">${esc(ok)}</button></div></div>`;d.onclick=e=>{const b=e.target.closest('[data-dlg]');if(!b)return;d.innerHTML='';d.onclick=null;res(b.dataset.dlg==='1')}})}
function fieldHtml(f){
  if(f.type==='heading')return `<h3 class="fh">${esc(f.label)}</h3>`;

}
function formSheet(o){
  ui.panel=null;ui.form=o;
  showSheet(`<form id="sheetForm" novalidate style="display:contents"><header class="sh-h"><div><h2>${esc(o.title)}</h2>${o.sub?`<div class="sub">${esc(o.sub)}</div>`:''}</div><button type="button" class="ico" data-act="formCancel" aria-label="Close">${ic('x')}</button></header><div class="sh-b"><div class="fgrid">${o.fields.map(fieldHtml).join('')}</div></div><footer class="sh-f">${o.del?`<button type="button" class="btn danger left" data-act="formDel">Delete</button>`:''}<button type="button" class="btn" data-act="formCancel">Cancel</button><button class="btn primary">${esc(o.submit||'Save')}</button></footer></form>`,'form');
  const f=$('#sheetForm input:not([type=checkbox]),#sheetForm select,#sheetForm textarea');if(f&&!o.noFocus)setTimeout(()=>f.focus(),30);
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='sheetForm')return;e.preventDefault();
  const F=ui.form;if(!F)return;const fd=new FormData(e.target),vals={};
  for(const f of F.fields){
    if(f.type==='heading')continue;
    if(f.type==='checkbox'){vals[f.name]=fd.get(f.name)==='on';continue}
    let v=(fd.get(f.name)??'').toString().trim();
    vals[f.name]=f.type==='number'?(v===''?null:Number(v)):v;
    if(f.required&&(vals[f.name]===''||vals[f.name]==null)){toast(`${f.label} is required`);const el=$('#f_'+f.name);if(el)el.focus();return}
  }
  const after=F.after;if(F.onSubmit(vals)===false)return;closeSheet();if(after)after();
});

/* ---------- workflow actions ---------- */
function guard(kind,it){
  const wf=WF[kind];
  if(kind==='leave'&&it.stage===3&&!it.decision)return{block:'Record a decision, approve or decline, before moving on.'};
  if(kind==='case'&&it.stage===4&&!(it.outcome||'').trim())return{block:'Write the outcome before closing this matter.'};
  const list=CHECKS[kind]?.[it.stage]||[],miss=list.filter((_,i)=>!it.checks?.[it.stage+':'+i]).length;
  if(miss)return{warn:`${miss} checklist item${miss>1?'s are':' is'} not ticked for "${wf.stages[it.stage]}". Move on anyway?`};
  if(kind==='doc'&&it.stage===2&&!(it.fileRef||'').trim())return{warn:'No filing reference is recorded, so nobody can tell where this document is stored. Move on anyway?'};
  return{};
}
function finish(kind,it){
  if(kind==='onboarding'){const e=emp(it.employeeId);if(e&&e.status==='Onboarding')e.status='Active';hist(it.employeeId,'Onboarding completed')}
}
async function advance(kind,id,fromToday){
  const it=find(kind,id);if(!it)return;const wf=WF[kind];
  if(it.stage>=wf.stages.length-1)return;
  if(it.stage>=wf.term&&kind!=='doc')return;
  const g=guard(kind,it);
  if(g.block){toast(g.block);if(fromToday)openPanel(kind,id);return}
  if(g.warn){if(fromToday){toast('Finish the checklist for this stage first');openPanel(kind,id);return}if(!await ask(g.warn,'Move on'))return}
  const from=it.stage;
  if(kind==='leave'&&from===4)recordLeave(it);
  it.stage=from+1;it.waiting=null;
  if(kind==='doc'&&it.stage===1)it.receivedOn=today();
  log(it,`${wf.stages[from]} done, now at ${wf.stages[it.stage]}`);
  if(it.stage===wf.term){it.completedAt=stamp();finish(kind,it)}
  hist(it.employeeId,`${KIND[kind]} "${itemTitle(kind,it)}" moved to ${wf.stages[it.stage]}`);
  save();render();
}
function stepBack(kind,id){
  const it=find(kind,id);if(!it||it.stage<=0)return;const wf=WF[kind],from=it.stage;
  if(kind==='leave'&&from===5)unrecordLeave(it);
  it.stage=from-1;it.waiting=null;if(it.stage<wf.term)it.completedAt=null;
  log(it,`Moved back to ${wf.stages[it.stage]}`);hist(it.employeeId,`${KIND[kind]} "${itemTitle(kind,it)}" moved back to ${wf.stages[it.stage]}`);save();render();
}
function toggleTask(id){
  const t=find('task',id);if(!t)return;t.done=!t.done;t.completedAt=t.done?stamp():null;if(t.done)t.waiting=null;
  log(t,t.done?'Marked done':'Reopened');if(t.employeeId)hist(t.employeeId,`${t.cat==='request'?'Request':'Task'} "${t.title}" ${t.done?'completed':'reopened'}`);save();render();
}
function openItem(kind,id){if(kind==='task')return taskForm(id);if(kind==='event')return eventForm(id);openPanel(kind,id)}
function openPanel(kind,id){ui.panel={kind,id};ui.form=null;paintPanel()}
function paintPanel(){
  const p=ui.panel;if(!p)return;const html=panelHtml(p.kind,p.id);
  if(html==null){closeSheet();return}
  const sb=$('.sh-b'),st=sb?sb.scrollTop:0;showSheet(html,'panel');const nb=$('.sh-b');if(nb)nb.scrollTop=st;
}
function panelHtml(kind,id){
  const it=find(kind,id);if(!it)return null;
  const wf=WF[kind],e=emp(it.employeeId),si=it.stage,fin=si>=wf.term;
  const dueLabel={leave:'Action by',onboarding:'Complete by',case:'Follow-up by',doc:'Due'}[kind];
  const hasWaitBtn=!(kind==='doc'&&si===0)&&!fin;
  const canNext=si<wf.stages.length-1&&!(si>=wf.term&&kind!=='doc');
  const nextLabel=kind==='doc'&&si===3?'Watch expiry':`Move to ${wf.stages[si+1]}`;
  const steps=wf.stages.map((s,i)=>`<li class="${i<si?'done':i===si?'cur':''}">${esc(s)}${i===si?` <small>${it.waiting?'Waiting on '+esc(it.waiting):fin?'':'You are here'}</small>`:''}</li>`).join('');
  return `<header class="sh-h"><div><div class="kind">${KIND[kind]}</div><h2>${esc(itemTitle(kind,it))}</h2><div class="sub">${e?`${empLink(e)} ${esc(e.position||'')}`:''}</div></div><button class="ico" data-act="closeSheet" aria-label="Close">${ic('x')}</button></header>
  <div class="sh-b">
   <div class="metarow"><div><label>Priority</label><div class="seg">${PR.map(p=>`<button class="${p} ${(it.priority||'normal')===p?'on':''}" data-act="setPr" data-kind="${kind}" data-id="${id}" data-v="${p}">${PRL[p]}</button>`).join('')}</div></div>
   <div><label for="dueIn">${dueLabel}</label><input id="dueIn" type="date" value="${esc(it.due||'')}" data-change="setf" data-field="due" data-kind="${kind}" data-id="${id}"></div></div>
   <ol class="vsteps">${steps}</ol>
   <div class="stagebox"><h4>${esc(wf.stages[si])}</h4><p>${esc(wf.guide[si])}</p>${stageWidget(kind,it)}${checklistHtml(kind,it)}</div>
   <h3 style="font-size:15px">Notes and history</h3>
   <div class="noteadd"><input id="noteIn" placeholder="Add a note to this record"><button class="btn" data-act="addNote" data-kind="${kind}" data-id="${id}">Add note</button></div>
   <ul class="timeline">${[...(it.log||[])].reverse().map(l=>`<li>${l.note?'<b>Note:</b> ':''}${esc(l.text)}<small>${fmtStamp(l.ts)}</small></li>`).join('')||'<li>No history yet</li>'}</ul>
  </div>
  <footer class="sh-f"><button class="btn danger left" data-act="delItem" data-kind="${kind}" data-id="${id}">Delete</button>
   <button class="btn" data-act="editItem" data-kind="${kind}" data-id="${id}">Edit details</button>
   ${it.waiting?`<button class="btn" data-act="resume" data-kind="${kind}" data-id="${id}">Resume</button>`:hasWaitBtn?`<button class="btn" data-act="wait" data-kind="${kind}" data-id="${id}">Mark waiting</button>`:''}
   ${si>0?`<button class="btn" data-act="stageBack" data-kind="${kind}" data-id="${id}">${fin?'Reopen':'Back a step'}</button>`:''}
   ${canNext?`<button class="btn primary" data-act="stageNext" data-kind="${kind}" data-id="${id}">${esc(nextLabel)}</button>`:''}</footer>`;
}
function checklistHtml(kind,it){
  const list=CHECKS[kind]?.[it.stage];if(!list)return '';
  return `<div>${list.map((x,i)=>`<label class="chk"><input type="checkbox" data-change="check" data-kind="${kind}" data-id="${it.id}" data-key="${it.stage}:${i}" ${it.checks?.[it.stage+':'+i]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`;
}
function stageWidget(kind,it){
  const e=emp(it.employeeId);let h='';
  if(kind==='leave'){
    const t=leaveType(it.type),d=leaveDays(it);
    h+=`<div class="kv"><div><span>Type</span>${esc(t.name)}</div><div><span>Dates</span>${fmtRange(it.start,it.end)}</div><div><span>Working days</span>${d}</div><div><span>Logged</span>${fmtD(it.created)}</div></div>`;
    if(it.reason)h+=`<div class="quote">${esc(it.reason)}</div>`;
    if(it.stage>=2&&it.stage<=3&&e){
      const al=t.allowance,used=leaveUsed(e.id,it.type,it.id),pend=leavePending(e.id,it.type,it.id),rem=al==null?null:al-used-pend-d;
      h+=`<div class="calc"><div><span>Allowance</span><b>${al==null?'No cap':al}</b></div><div><span>Taken</span><b>${used}</b></div><div><span>Other pending</span><b>${pend}</b></div><div><span>This request</span><b>${d}</b></div><div class="${rem!=null&&rem<0?'neg':''}"><span>Left after</span><b>${rem==null?'n/a':rem}</b></div></div>`;
      if(rem!=null&&rem<0)h+=`<div class="note bad">This would take ${e.name.split(' ')[0]} ${-rem} day${rem===-1?'':'s'} over the ${esc(t.name.toLowerCase())} allowance.</div>`;
      const clash=db.leave.filter(o=>o.id!==it.id&&o.decision!=='declined'&&o.stage<=6&&o.start<=it.end&&o.end>=it.start&&emp(o.employeeId)&&emp(o.employeeId).department===e.department&&o.employeeId!==e.id);
      if(clash.length)h+=`<div class="note">Overlaps in ${esc(e.department||'this department')}: ${clash.map(o=>`${esc(emp(o.employeeId).name)} (${fmtRange(o.start,o.end)})`).join(', ')}</div>`;
      const n=diff(today(),it.start);if(n<0)h+=`<div class="note">These dates have already started.</div>`;else if(n<=2)h+=`<div class="note">Short notice: leave starts ${rel(it.start)}.</div>`;
    }
    if(it.stage===3)h+=`<div class="seg" style="margin:8px 0"><button class="${it.decision==='approved'?'on normal':''}" data-act="decide" data-id="${it.id}" data-v="approved">Approve</button><button class="${it.decision==='declined'?'on urgent':''}" data-act="decide" data-id="${it.id}" data-v="declined">Decline</button></div><input placeholder="Decision note (optional)" value="${esc(it.decisionNote||'')}" data-change="setf" data-field="decisionNote" data-kind="leave" data-id="${it.id}">`;
    else if(it.decision)h+=`<p><span class="chip ${it.decision==='approved'?'ok':'late'}">${it.decision==='approved'?'Approved':'Declined'}</span> ${it.decisionNote?esc(it.decisionNote):''}</p>`;
    if(it.stage===4)h+=it.decision==='approved'?`<div class="note">${d} working day${d===1?'':'s'} will be marked as leave in attendance.</div>`:`<div class="note">Declined, so nothing will be written to attendance.</div>`;
  }
  if(kind==='onboarding'){
    const p=obProgress(it);
    h+=`<div class="kv"><div><span>Start date</span>${e?fmtD(e.startDate):'—'}</div><div><span>Checks done</span>${p.done} of ${p.total}</div></div>`;
    if(it.stage===2){
      const docs=db.docs.filter(d=>d.employeeId===it.employeeId);
      h+=docs.map(d=>`<div class="mini" data-act="open" data-kind="doc" data-id="${d.id}"><b>${esc(d.type)}</b><span class="chip ${d.stage>=3?'ok':d.stage===0?'wait':''}">${WF.doc.stages[d.stage]}</span></div>`).join('');
      h+=`<button class="btn sm" data-act="reqStdDocs" data-id="${it.id}">Request standard documents</button>`;
    }
  }
  if(kind==='case'){
    h+=`<div class="kv"><div><span>Type</span>${esc(it.type)}</div><div><span>Raised</span>${fmtD(it.created)}</div>${it.confidential?'<div><span>Handling</span>Confidential</div>':''}</div>`;
    if(it.description)h+=`<div class="quote">${esc(it.description)}</div>`;
    if(it.stage>=4)h+=`<label style="display:block;margin:6px 0 4px">Outcome</label><textarea rows="3" placeholder="What was decided and what happens next" data-change="setf" data-field="outcome" data-kind="case" data-id="${it.id}">${esc(it.outcome||'')}</textarea>`;
  }
  if(kind==='doc'){
    const n=it.expiry?diff(today(),it.expiry):null;
    h+=`<div class="kv"><div><span>Requested</span>${fmtD(it.requestedOn||it.created)}</div><div><span>Received</span>${fmtD(it.receivedOn)}</div><div><span>Expiry</span>${it.expiry?`${fmtD(it.expiry,true)} (${n<0?`${-n} days ago`:`${n} days left`})`:'None set'}</div></div>`;
    if(it.notes)h+=`<div class="quote">${esc(it.notes)}</div>`;
    if(it.stage>=2)h+=`<label style="display:block;margin:6px 0 4px">Where it is stored</label><input placeholder="Folder, cabinet or system reference" value="${esc(it.fileRef||'')}" data-change="setf" data-field="fileRef" data-kind="doc" data-id="${it.id}">`;
    if(it.stage>=3)h+=`<label style="display:block;margin:10px 0 4px">Expiry date</label><input type="date" value="${esc(it.expiry||'')}" data-change="setf" data-field="expiry" data-kind="doc" data-id="${it.id}">`;
    if(it.stage===4&&it.expiry)h+=`<div class="acts" style="margin-top:10px"><button class="btn sm" data-act="renewDoc" data-id="${it.id}">Request renewal</button><button class="btn sm" data-act="clearExpiry" data-id="${it.id}">No renewal needed</button></div>`;
  }
  return h;
}

/* ---------- views ---------- */
function navCounts(){
  const its=items(),b=buckets(),c={hot:{}};
  c.today=b.urgent.length+b.overdue.length+b.due.length;c.hot.today=b.urgent.length+b.overdue.length>0;
  const act=k=>its.filter(i=>i.kind===k&&i.state!=='done').length;
  c.leave=act('leave');c.onboarding=act('onboarding');c.matters=act('case');c.documents=act('doc');c.tasks=act('task');
  c.hot.matters=its.some(i=>i.kind==='case'&&i.state!=='done'&&i.pr==='urgent');
  return c;
}
function sideHtml(){
  const cur=ui.route[0],c=navCounts();
  return `<nav class="side ${ui.nav?'open':''}" aria-label="Main"><div class="brand">${logo()}<div><b>PIXEL OFFICE HR</b><span>by PixelProTech</span></div></div><div class="navlist">${NAV.map(([k,l])=>`<a class="nav ${cur===k?'on':''}" href="#/${k}" data-act="go" data-to="${k}">${ic(k)}<span>${l}</span>${c[k]?`<em class="${c.hot[k]?'hot':''}">${c[k]}</em>`:''}</a>`).join('')}</div><div class="sidefoot">${esc(db.settings.company||'')}<br>Data stays in this browser.</div></nav>`;
}
function topHtml(){
  return `<div class="topbar"><button class="ico hamb" data-act="navOpen" aria-label="Menu">${ic('menu')}</button><button class="searchbtn" data-act="search">${ic('search',16)}<span class="lbl">Search people and work</span></button><span class="grow"></span><button class="ico" data-act="theme" aria-label="Switch light or dark theme">${ic('moon',16)}</button><button class="btn primary" data-act="newMenu">${ic('plus',16)} New</button></div>`;
}
function view(){
  switch(ui.route[0]){
    case 'people':return peopleView();case 'leave':return leaveView();case 'onboarding':return onboardingView();case 'matters':return mattersView();
    case 'documents':return docsView();case 'tasks':return tasksView();case 'schedule':return scheduleView();case 'attendance':return attendanceView();case 'settings':return settingsView();
    default:return todayView();
  }
}
function render(){
  const app=$('#app');if(!app)return;const st=$('#main')?.scrollTop||0;
  app.innerHTML=sideHtml()+`<div class="main" id="main">${topHtml()}<div class="content">${view()}</div></div><div class="nav-scrim ${ui.nav?'show':''}" data-act="navClose"></div>`;
  const m=$('#main');if(m)m.scrollTop=st;
  if(ui.panel)paintPanel();
}

/* Today */
function section(id,cls,title,list,sub,body){
  if(!list.length)return '';
  return `<section class="tsec ${cls}" id="sec-${id}"><h3><i></i>${title} <em>${sub||''}</em></h3>${body||rowsOf(list)}</section>`;
}
function schedRow(s){
  if(s.k==='event'){const e=s.e,p=emp(e.employeeId);return `<div class="srow ${e.done?'done':''}" data-act="open" data-kind="event" data-id="${e.id}"><time>${esc(e.time||'All day')}</time><div class="rmain"><div class="rt"><b>${esc(e.title)}</b><span class="stg">${esc(e.type)}</span></div><div class="rs">${empLink(p)}</div></div></div>`}
  return rowHtml(s.i);
}
function todayView(){
  const b=buckets(),t=today(),hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',first=(db.settings.hrName||'').trim().split(/\s+/)[0];
  const dateLong=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const head=`<div class="hello"><h1>${greet}${first?', '+esc(first):''}</h1><p>${dateLong}. Your HR work today.</p></div>`;
  if(!db.employees.length&&!items().length&&!db.events.length){
    return head+`<div class="card start" style="margin-top:24px"><h2 style="font-size:22px">Set up your HR workspace</h2><ol><li>Add your first employee, or bring people in one at a time.</li><li>Check the departments, leave types and document types in Settings so they match your company.</li><li>Log leave, matters, documents and tasks. This page then shows what needs attention.</li></ol><div class="acts"><button class="btn primary" data-act="newEmp">Add an employee</button><button class="btn" data-act="go" data-to="settings">Open settings</button><button class="btn" data-act="loadSample">Load sample data to explore</button></div></div>`;
  }
  const doneEv=b.events.filter(e=>e.done).length,completed=b.done.length+doneEv,schedN=b.sched.length;
  const counts=[['urgent','Urgent',b.urgent.length,'s-urgent'],['overdue','Overdue',b.overdue.length,'s-overdue'],['due','Due today',b.due.length,'s-due'],['sched','Scheduled',schedN,'s-sched'],['wait','Waiting',b.waiting.length,'s-wait'],['done','Completed',completed,'s-done']];
  const sq=[...b.urgent.map(i=>['s-urgent',i.title]),...b.overdue.map(i=>['s-overdue',i.title]),...b.due.map(i=>['s-due',i.title]),...b.sched.map(s=>['s-sched',s.k==='event'?s.e.title:s.i.title]),...b.waiting.map(i=>['s-wait',i.title]),...b.done.map(i=>['s-done',i.title]),...b.events.filter(e=>e.done).map(e=>['s-done',e.title])].slice(0,120);
  const legend=`<div class="legend">${counts.map(([id,l,n,c])=>`<button class="${c}" data-act="jump" data-to="sec-${id}"><i></i><b>${n}</b>${l}</button>`).join('')}</div>`;
  const bar=sq.length?`<div class="daybar" role="img" aria-label="Today at a glance">${sq.map(([c,ti])=>`<i class="${c}" title="${esc(ti)}"></i>`).join('')}</div>`:'';
  const nextIt=[...b.urgent,...b.overdue,...b.due,...b.upcoming][0];
  let nextCard='';
  if(nextIt){
    const n=nextIt.due?diff(t,nextIt.due):null;
    const why=nextIt.pr==='urgent'?(n!=null&&n<0?`Urgent, ${-n} days overdue`:'Marked urgent'):n<0?`${-n} day${n===-1?'':'s'} overdue`:n===0?'Due today':'Due '+rel(nextIt.due);
    const more=b.urgent.length+b.overdue.length+b.due.length-1;
    nextCard=`<div class="next"><small>Do this next. ${esc(why)}</small><h2>${esc(nextIt.title)}</h2><p>${emp(nextIt.eid)?esc(emp(nextIt.eid).name)+', ':''}${esc(nextIt.stage)}${more>0?`. ${more} more need attention after it.`:'.'}</p><button class="btn" data-act="open" data-kind="${nextIt.kind}" data-id="${nextIt.id}">Open it</button></div>`;
  }else nextCard=`<div class="next"><small>Do this next</small><h2>Nothing is waiting on you</h2><p>No urgent, overdue or due work. ${b.waiting.length?`You are still waiting on ${b.waiting.length} thing${b.waiting.length===1?'':'s'}.`:'Use the time to plan ahead.'}</p><button class="btn plain" data-act="newMenu">Add something</button></div>`;
  const schedBody=`<div class="rows">${b.sched.map(schedRow).join('')}</div>`;
  const doneBody=rowsOf(b.done);
  const main=nextCard+
    section('urgent','s-urgent','Urgent',b.urgent,phrase(b.urgent)+' need attention')+
    section('overdue','s-overdue','Overdue',b.overdue,phrase(b.overdue))+
    section('due','s-due','Due today',b.due,phrase(b.due))+
    section('sched','s-sched','Scheduled',b.sched,`${schedN} today`,schedBody)+
    section('wait','s-wait','Waiting',b.waiting,phrase(b.waiting))+
    section('up','s-up','Coming up in the next 7 days',b.upcoming,phrase(b.upcoming))+
    (b.other.length?`<section class="tsec s-other" id="sec-other"><details><summary>Also open, no near date (${b.other.length})</summary>${rowsOf(b.other)}</details></section>`:'')+
    section('done','s-done','Completed today',b.done,`${completed} in total`,doneBody);
  const al=alerts();
  const awayList=db.leave.filter(l=>l.decision==='approved'&&l.end>=t&&l.start<=addDays(t,7)&&emp(l.employeeId)).sort((a,c)=>a.start.localeCompare(c.start));
  const expected=db.employees.filter(e=>e.status!=='Exited'&&(!e.startDate||e.startDate<=t)&&!awayOn(e.id,t)),marked=expected.filter(e=>db.attendance[t]?.[e.id]).length;
  const aside=`<div class="card"><h3>Heads-up</h3>${al.length?al.map((a,i)=>`<div class="li"><div>${empLink(emp(a.eid))}<small>${esc(a.text)}</small></div><button class="btn sm" data-act="${a.onb?'startOnb':'alertTask'}" data-id="${a.eid}" data-i="${i}">${a.onb?'Start onboarding':'Add task'}</button></div>`).join(''):'<small>No probation, exit or start dates need action.</small>'}</div>
   <div class="card"><h3>Away this week</h3>${awayList.length?awayList.map(l=>`<div class="li"><div>${empLink(emp(l.employeeId))}<small>${esc(leaveType(l.type).name)}, ${fmtRange(l.start,l.end)}</small></div>${l.start<=t?'<span class="chip wait">Away now</span>':''}</div>`).join(''):'<small>Nobody has approved leave in the next 7 days.</small>'}</div>
   <div class="card"><h3>Attendance today</h3><p style="margin:0 0 10px">${marked} of ${expected.length} marked${isBiz(t)?'':' (weekend)'}</p><button class="btn sm" data-act="go" data-to="attendance">Open attendance</button></div>`;
  return head+bar+legend+`<div class="todaygrid"><div>${main}</div><aside class="taside">${aside}</aside></div>`;
}

/* search */
function searchRes(q){
  q=q.trim().toLowerCase();if(!q)return '<small>Type a name, employee number, position or the title of a leave request, matter, document or task.</small>';
  const ppl=db.employees.filter(e=>[e.name,e.number,e.position,e.department,e.email].join(' ').toLowerCase().includes(q)).slice(0,8);
  const its=items().filter(i=>[i.title,emp(i.eid)?.name,i.stage].join(' ').toLowerCase().includes(q)).slice(0,10);
  const evs=db.events.filter(e=>e.title.toLowerCase().includes(q)).slice(0,4);
  if(!ppl.length&&!its.length&&!evs.length)return '<small>No results.</small>';

}

/* ---------- routing and boot ---------- */
function parseHash(){const p=(location.hash||'').replace(/^#\/?/,'').split('/').filter(Boolean);return p.length?p:['today']}
function go(path){ui.route=path.split('/');ui.nav=false;closeSheet();try{if(location.hash!=='#/'+path)location.hash='#/'+path}catch(e){}render();const m=$('#main');if(m)m.scrollTop=0}
window.addEventListener('hashchange',()=>{const r=parseHash();if(r.join('/')!==ui.route.join('/')){ui.route=r;render()}});
(function boot(){
  try{const th=localStorage.getItem('pixelofficehr.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
  ui.route=parseHash();render();
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
