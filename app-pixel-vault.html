<script>// Drop-in replacement for the Claude-artifact-only window.storage API,
// backed by real localStorage so this app works as a standalone deploy.
// Same contract: get/set/delete/list, get() throws on a missing key.

(function () {
  function nsPrefix(shared) {
    return shared ? "pv_shared::" : "pv_local::";
  }
  function nsKey(key, shared) {
    return nsPrefix(shared) + key;
  }

  window.storage = {
    async get(key, shared = false) {
      const raw = localStorage.getItem(nsKey(key, shared));
      if (raw === null) throw new Error(`storage key not found: ${key}`);
      return { key, value: raw, shared };
    },

    async set(key, value, shared = false) {
      localStorage.setItem(nsKey(key, shared), value);
      return { key, value, shared };
    },

    async delete(key, shared = false) {
      const k = nsKey(key, shared);
      const existed = localStorage.getItem(k) !== null;
      localStorage.removeItem(k);
      return { key, deleted: existed, shared };
    },

    async list(prefix = "", shared = false) {
      const base = nsPrefix(shared);
      const full = base + prefix;
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(full)) keys.push(k.slice(base.length));
      }
      return { keys, prefix, shared };
    },
  };
})();
</script>

      :root {
        --bg: #0a0a0f;
        --panel: #1a1a2e;
        --panel-alt: #201f38;
        --border: #322f52;
        --border-soft: #23223b;
        --blue: #7b2fff;
        --blue-dim: rgba(123,47,255,0.16);
        --gold: #00d4aa;
        --gold-dim: rgba(0,212,170,0.14);
        --text: #ffffff;
        --text-dim: #a3a1c2;
        --text-faint: #6b6890;
        --danger: #ff5d7a;
        --danger-dim: rgba(255,93,122,0.14);
        --success: #00d4aa;
        --grad: linear-gradient(90deg, #7b2fff, #00d4aa);
      }
      .sans { font-family: 'Inter', sans-serif; }
      .display { font-family: 'Space Grotesk', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      * { box-sizing: border-box; }
      ::selection { background: var(--blue-dim); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1c2530; border-radius: 4px; }
      .pv-input, .pv-textarea, .pv-select {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13.5px;
        font-family: 'Inter', sans-serif;
        width: 100%;
        outline: none;
        transition: border-color .15s;
      }
      .pv-input:focus, .pv-textarea:focus, .pv-select:focus { border-color: var(--blue); }
      .pv-textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
      .pv-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--text-faint);
        text-transform: uppercase;
        margin-bottom: 5px;
        display: block;
      }
      .pv-btn {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px;
        padding: 8px 14px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
        transition: all .15s; white-space: nowrap;
      }
      .pv-btn-primary { background: var(--grad); color: #ffffff; font-weight: 600; }
      .pv-btn-primary:hover { filter: brightness(1.12); }
      .pv-btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
      .pv-btn-ghost:hover { border-color: var(--blue); color: var(--text); }
      .pv-btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
      .pv-btn-danger:hover { background: var(--danger-dim); }
      .pv-card {
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 16px;
        transition: border-color .15s, transform .1s;
      }
      .pv-card:hover { border-color: var(--border); }
      .pv-chip {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        padding: 2px 8px;
        border-radius: 4px;
        letter-spacing: .03em;
        border: 1px solid var(--border);
        color: var(--text-dim);
      }
      .brand-grad-text {
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brand-grad-line {
        height: 2px;
        background: var(--grad);
        border-radius: 2px;
      }
      .pulse { animation: pv-pulse 1.8s ease-in-out infinite; }
      @keyframes pv-pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .crosshair { position: relative; }
      .crosshair::before, .crosshair::after {
        content: ''; position: absolute; width: 9px; height: 9px;
        border: 1px solid var(--blue); opacity: .55;
      }
      .crosshair::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .crosshair::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      .blueprint-grid {
        background-image:
          linear-gradient(var(--border-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .nav-item {

        border-left: 2px solid transparent; transition: all .12s;
      }
      .nav-item:hover { background: var(--panel-alt); color: var(--text); }
      .nav-item.active { background: var(--blue-dim); color: var(--blue); border-left-color: var(--blue); }
      @media (max-width: 760px) {
