<style>
:root{--ink:#07070A;--char:#101016;--char2:#17171F;--line:#25252E;--gold:#00D4AA;--gold2:#0A8F76;--white:#F1EEFA;--mute:#8E8AA3;--red:#b3392f;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--white);font:15px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.01em;margin:0 0 .5rem}
h1{font-size:1.7rem}h2{font-size:1.2rem;color:var(--gold)}h3{font-size:1rem}
p{margin:.4rem 0}
small,.mute{color:var(--mute)}
code,.mono{font-family:var(--mono);font-size:.85em}
#app{display:grid;grid-template-columns:1fr;min-height:100vh}
#rail{position:fixed;inset:0 28% 0 0;background:var(--char);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;z-index:30;overflow:auto;padding:18px 14px 90px}
#rail.open{transform:none}
#scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none}
#scrim.on{display:block}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brand img{width:38px;height:38px;border-radius:9px}
.brand b{font-family:var(--serif);letter-spacing:.14em;font-size:1.05rem}
.brand small{display:block;letter-spacing:.08em;font-size:.68rem}
.rgroup{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin:16px 6px 4px}
#rail a.nav{display:block;padding:9px 10px;border-radius:8px;color:var(--white);text-decoration:none;font-size:.92rem}
#rail a.nav:hover{background:var(--char2)}
#rail a.nav.on{background:var(--char2);box-shadow:inset 2px 0 var(--gold);color:var(--gold)}
main{padding:18px 16px 96px;max-width:860px;width:100%;margin:0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--char);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
#tabs a,#tabs button{flex:1;text-align:center;padding:12px 4px;background:none;border:0;color:var(--mute);font:inherit;font-size:.78rem;text-decoration:none;cursor:pointer}
#tabs a.on{color:var(--gold)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .sp{flex:1}
.card{background:var(--char);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card.gold{border-color:var(--gold2)}
.card.red{border-color:var(--red)}
.note{border-left:2px solid var(--gold2);padding:6px 10px;color:var(--mute);font-size:.85rem;margin:10px 0;background:#ffffff05}
.warn{border-left-color:var(--red);color:#e8b5b0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--char);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--white)}
.stat span{font-size:.78rem;color:var(--mute)}
.badge{display:inline-block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--mute);vertical-align:middle}
.badge.m{border-color:var(--gold2);color:var(--gold)}
button,.btn{font:inherit;cursor:pointer;border-radius:9px;padding:9px 14px;border:1px solid var(--gold2);background:transparent;color:var(--gold);text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#00D4AA18}
button.pri,.btn.pri{background:var(--gold);color:#07070A;border-color:var(--gold);font-weight:600}
button.dng{border-color:var(--red);color:#e0837b}
button.sm{padding:4px 9px;font-size:.8rem}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label{display:block;font-size:.78rem;color:var(--mute);margin:10px 0 3px;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--white);border-radius:8px;padding:9px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
input[type=checkbox]{width:auto;margin-right:8px}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;margin:8px 0;color:var(--white);font-size:.9rem}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.chip{display:inline-block;font-weight:700;letter-spacing:.12em;font-size:.78rem;padding:4px 12px;border-radius:99px;border:1px solid var(--line)}
.chip.trusted{border-color:var(--gold);color:var(--gold)}
.chip.verified-business{background:var(--gold);color:#07070A;border-color:var(--gold)}
.chip.unknown{color:var(--mute)}
.chip.commercial{border-color:var(--gold2);color:var(--white)}
.chip.suspicious{border-color:var(--red);color:#e0837b}
.chip.high-risk{border-color:var(--red);background:#b3392f33;color:#f0b5af}
.chip.confirmed-scam{background:var(--red);color:var(--white);border-color:var(--red)}
.verdict{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:520px){.verdict{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
canvas.dial{width:150px;height:150px;display:block;margin:0 auto}
canvas.hero{width:100%;height:260px;display:block}
.ev{list-style:none;margin:8px 0 0;padding:0}
.ev li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.ev .n{font-family:var(--mono);color:var(--gold2)}
.ev .st{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.st.for{color:var(--gold)}.st.against{color:#e0837b}.st.neutral{color:var(--mute)}.st.na{color:#6B6780}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--gold2);font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.tabsub{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.tabsub a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mute);text-decoration:none;font-size:.82rem}
.tabsub a.on{border-color:var(--gold);color:var(--gold)}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left}
.opts b{font-family:var(--mono);margin-right:8px;color:var(--gold)}
#lock{position:fixed;inset:0;background:var(--ink);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#lock.on{display:flex}
#lock .box{max-width:340px;width:100%;text-align:center}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--char2);border:1px solid var(--gold2);color:var(--white);padding:9px 16px;border-radius:99px;font-size:.85rem;z-index:200;display:none;max-width:90vw}
dialog{background:var(--char);color:var(--white);border:1px solid var(--gold2);border-radius:12px;max-width:480px;width:92vw;padding:16px}
dialog::backdrop{background:#000b}
video#vid{width:100%;max-height:260px;background:#000;border-radius:10px;transform:scaleX(-1)}
.big{font-family:var(--mono);font-size:1.6rem;letter-spacing:.3em;color:var(--gold)}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--mute)}
@media(min-width:900px){
#app{grid-template-columns:260px 1fr}
#rail{position:sticky;top:0;inset:auto;transform:none;height:100vh;padding-bottom:20px}
#tabs,#scrim{display:none!important}
main{padding:28px 32px 60px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

</nav>

    ctx.fillStyle = '#00D4AA';

  }
  requestAnimationFrame(frame);

}

<script>
/* CALLGUARD core — state, encrypted storage, lock, router, dialogs. Screens live in screens.js. */

function route() {
  if (!APP.S) return;
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const i = h.indexOf('/');
  const name = i < 0 ? h : h.slice(0, i);
  const arg = i < 0 ? '' : decodeURIComponent(h.slice(i + 1));
  const n = APP.VIEWS[name] ? name : 'home';
  if (!APP.S.onboarded && n !== 'welcome') { location.hash = '#/welcome'; return; }
  APP.UI.route = n; APP.UI.arg = arg;
  draw(false);
}
function draw(keep) {

  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === n));

  window.scrollTo(0, keep ? y : 0);
}
APP.rerender = () => { if (APP.S) draw(true); };
APP.go = h => { location.hash = '#/' + h; };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = APP.ACT[t.dataset.act]; if (!f) return;
  if (t.tagName === 'A') e.preventDefault();
  Promise.resolve(f(t, e)).catch(err => { console.error(err); toast('Error: ' + err.message); });
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const h = APP.FORM[f.dataset.form]; if (!h) return;
  Promise.resolve(h(f, new FormData(f))).catch(err => { console.error(err); toast('Error: ' + err.message); });
});
$('#more').onclick = () => { $('#rail').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
$('#scrim').onclick = () => { $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); };
window.addEventListener('hashchange', route);

function start() {
  buildRail();
  const sec = APP.getSec();
  // expire verified businesses lazily is handled in engine; log nothing here
  route();
  if (!location.hash) location.hash = APP.S.onboarded ? '#/home' : '#/welcome';
  if (sec.cred && !APP.UI.booted) { /* biometric re-lock only after backgrounding */ }
  APP.UI.booted = true;
}
async function boot() {
  const sec = APP.getSec();
  if (sec.enc && localStorage.getItem('cg.enc')) { showLock('pin'); return; }
  const raw = localStorage.getItem('cg.state');
  let st = {};
  try { st = raw ? JSON.parse(raw) : {}; } catch (_) { st = {}; }
  APP.S = merge(defaultState(), st);
  if (!raw) save();
  start();
}
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
APP.boot = boot;
window.addEventListener('DOMContentLoaded', () => { /* screens.js registers first; boot after */ });
})();

</script>
<script>
/* CALLGUARD screens — 16 views. */
(function () {
'use strict';
const A = window.APP, { esc, fmt, uid, toast, ask, confirmBox, ACT, FORM, VIEWS, AFTER, UI, $ } = A;
const S = () => A.S;
const DAY = A.DAY;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const slug = c => c.toLowerCase().replace(/ /g, '-');
const chip = c => `<span class="chip ${slug(c)}">${esc(c)}</span>`;
const ST = { for: 'Supports', against: 'Against', neutral: 'No signal', na: 'Unavailable' };
const evList = ev => `<ul class="ev">${ev.signals.map(s => `<li><span class="n">${String(s.id).padStart(2, '0')}</span><div><b>${esc(s.name)}</b> <span class="st ${s.status}">${ST[s.status]}</span><div class="mute">${esc(s.detail)}</div></div></li>`).join('')}</ul>`;
const segsOf = ev => ev.signals.map(s => s.status).join(',');
const toggle = (act, on, label, extra) => `<label class="chk" style="color:var(--white)"><input type="checkbox" data-act="${act}" ${extra || ''} ${on ? 'checked' : ''}>${label}</label>`;
const dl = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
const numLabel = n => { const x = CG.normalize(n); return esc(x.display || x.e164 || n); };
const known = () => [...S().allow, ...S().block, ...S().circle].map(x => `<option value="${esc(x.num)}">${esc(x.label || x.name || '')}</option>`).join('');
const badge = (t, m) => `<span class="badge ${m ? 'm' : ''}">${t}</span>`;
const bst = b => CG.bizState(b, Date.now());
const bchip = st => `<span class="chip ${st === 'verified' ? 'trusted' : st === 'pending' ? 'unknown' : 'suspicious'}">${esc(st.toUpperCase())}</span>`;

async function sign(msg) {
  const k = await crypto.subtle.importKey('raw', A.unb64(S().device.secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return A.b64(new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)))).replace(/[^A-Za-z0-9]/g, '').slice(0, 20);
}

/* ---------- result card ---------- */
function replyCard(ev) {
  const d = CG.decideReply(ev, S(), new Date());
  UI.reply = d.text ? { text: d.text, ruleId: d.ruleId, templateId: d.templateId, num: ev.norm.e164 } : null;
  if (d.ready) return `<div class="card"><h2>Auto-reply ready</h2><p>${esc(d.text)}</p><p class="mute">${esc(d.reason)}. Opens your SMS app; you press Send.</p><button data-act="reply-send">Prepare this SMS</button></div>`;
  if (d.suggest) return `<div class="card"><h2>Auto-reply (manual)</h2><p>${esc(d.text)}</p><p class="mute">${esc(d.reason)}</p><button data-act="reply-send">Prepare this SMS</button></div>`;
  return `<div class="card"><h2>Auto-reply</h2><p class="mute">None: ${esc(d.reason)}</p></div>`;
}
function resultCard(ev, callId) {
  const n = ev.norm, sev = ['SUSPICIOUS', 'HIGH RISK', 'CONFIRMED SCAM'].includes(ev.classification);
  const d = `data-call="${callId}" data-num="${esc(n.e164)}"`;
  let h = `<div class="card ${sev ? 'red' : 'gold'}"><div class="verdict"><canvas class="dial" data-gate="dial" data-segs="${segsOf(ev)}"></canvas><div>${chip(ev.classification)} ${badge('confidence: ' + ev.confidence)}<h2 style="margin-top:8px">${esc(n.display || n.e164 || 'Unknown')}</h2><p>${esc(ev.verdict)}</p><p class="mute mono">${esc(n.kind)}${n.valid ? '' : ' · invalid format'}</p></div></div>`;
  ev.notes.forEach(x => { h += `<div class="note">${esc(x)}</div>`; });
  h += evList(ev) + '</div>';
  if (ev.action !== 'allow' && !ev.norm.emergency && !ev.allowHit && !ev.circleHit) h += `<div class="note warn">Never share OTPs, PINs, passwords or card security codes with any caller.</div>`;
  if (UI.decision) h += `<div class="note">${esc(UI.decision)}</div>`;
  if (ev.action === 'block') {
    h += `<div class="card red"><b>Rejected by rule.</b> ${esc(ev.verdict)}<div class="row"><button class="sm" data-act="call-do" data-do="report" ${d}>Report</button><button class="sm" data-act="call-do" data-do="profile" ${d}>Profile</button></div></div>`;
  } else if (ev.action === 'offer-sms') {
    h += `<div class="card gold"><h2>Commercial caller detected</h2><p>Commercial caller detected. Would you prefer SMS verification before answering?</p><div class="opts">
<button data-act="call-do" data-do="sms-send" ${d}><b>A</b>Send SMS request</button>
<button data-act="call-do" data-do="answer" ${d}><b>B</b>Answer anyway</button>
<button data-act="call-do" data-do="block" ${d}><b>C</b>Block number</button>
<button data-act="call-do" data-do="report" ${d}><b>D</b>Report caller</button>
<button data-act="call-do" data-do="trust" ${d}><b>E</b>Add to trusted contacts</button></div></div>`;
  } else {
    h += `<div class="row"><button class="pri" data-act="call-do" data-do="answer" ${d}>Answer</button><button data-act="call-do" data-do="silence" ${d}>Silence</button><button class="dng" data-act="call-do" data-do="block" ${d}>Block</button><button data-act="call-do" data-do="report" ${d}>Report</button><button data-act="call-do" data-do="trust" ${d}>Trust</button><button data-act="call-do" data-do="profile" ${d}>Profile</button></div>`;
  }
  return h;
}
async function smsSend(num, callId) {
  const n = CG.normalize(num);
  if (!CG.smsCapable(n)) { toast('This number cannot receive SMS (landline, non-geographic or invalid).'); return; }
  if (!S().settings.smsConsent) {
    const ok = await confirmBox('Allow SMS requests?', 'CALLGUARD prepares the message and opens your SMS app. <b>You press Send.</b> It never sends silently. Turn this on?', 'Allow');
    if (!ok) return; S().settings.smsConsent = true;
  }
  const text = S().settings.smsTemplate;
  S().smsLog.unshift({ id: uid(), ts: Date.now(), num: n.e164, kind: 'request', text });
  const c = S().calls.find(x => x.id === callId); if (c) c.result = 'sms-requested';
  A.addEvent('sms', 'SMS-first request prepared for ' + n.display);
  UI.decision = 'SMS request prepared. Send it from your SMS app, then analyse the reply under SMS-first.';
  A.save(); A.rerender();
  location.href = 'sms:' + n.e164 + '?body=' + encodeURIComponent(text);
}
ACT['call-do'] = async t => {
  const { do: d, call, num } = t.dataset, c = S().calls.find(x => x.id === call);
  const done = r => { if (c) c.result = r; A.addEvent('decision', `${d}: ${num}`); UI.decision = 'Recorded: ' + r; A.save(); A.rerender(); };
  if (d === 'answer') return done('answered');
  if (d === 'silence') return done('silenced');
  if (d === 'block') { if (A.blockNumber(num)) done('blocked'); return; }
  if (d === 'trust') { A.trustNumber(num); return done('trusted'); }
  if (d === 'report') { UI.reportNum = num; return A.go('report'); }
  if (d === 'profile') return A.go('profile/' + encodeURIComponent(num));
  if (d === 'sms-send') return smsSend(num, call);
};
ACT['reply-send'] = () => {
  const r = UI.reply; if (!r) return;
  S().replyHistory.unshift({ id: uid(), ts: Date.now(), num: r.num, templateId: r.templateId, ruleId: r.ruleId, status: 'prepared', text: r.text });
  A.addEvent('reply', 'Auto-reply prepared for ' + r.num); A.save();
  location.href = 'sms:' + r.num + '?body=' + encodeURIComponent(r.text);
};

/* ---------- 1 welcome ---------- */
VIEWS.welcome = () => {
  const st = UI.wstep || 0;
  const hero = '<canvas class="hero" data-gate="hero"></canvas>';
  if (st === 0) return `${hero}<h1>CALLGUARD</h1><p class="mute">Know who is calling, with the evidence on the table.</p><div class="card"><ul style="padding-left:18px;margin:0"><li>No unknown caller receives automatic trust.</li><li>No legitimate caller is automatically treated as a criminal.</li><li>No business claim is accepted without verification.</li><li>No human check is presented as proof of honesty.</li><li>You keep control. Privacy is the foundation, not a premium.</li></ul></div><button class="pri" data-act="w-next">Continue</button>`;
  if (st === 1) return `${hero}<h1>What this build is</h1><div class="card"><p>A working <b>web prototype</b> of the CALLGUARD product, by PixelProTech Solutions. Every screen runs real logic on this device: the ten-signal evidence engine, SMS-first rules, reply rules, reporting with moderation, Business Passport, encrypted storage.</p><p><b>What it cannot do:</b> intercept real calls. A browser has no call-screening role. The incoming-call screen is a simulator. The Android app (Kotlin, CallScreeningService) is the production path.</p><p>Where a signal needs something this build does not have (carrier data, a registry lookup, an identity provider), it says <b>Unavailable</b> instead of faking a result.</p></div><div class="row"><button data-act="w-back">Back</button><button class="pri" data-act="w-next">Continue</button></div>`;
  return `<h1>Your settings</h1><form data-form="onboard" class="card"><label>Your own number (used to spot neighbour-spoofing, optional)</label><input name="own" inputmode="tel" placeholder="082 123 4567" value="${esc(S().profile.ownNumber)}"><label>Screening strictness</label><select name="strict"><option value="relaxed">Relaxed (flag only heavy evidence)</option><option value="balanced" selected>Balanced</option><option value="strict">Strict (flag on light evidence)</option></select><label class="chk"><input type="checkbox" name="usf">Offer SMS-first for unknown callers too</label><div class="row"><button type="button" data-act="w-back">Back</button><button class="pri" type="submit">Finish setup</button></div></form>`;
};
ACT['w-next'] = () => { UI.wstep = (UI.wstep || 0) + 1; A.rerender(); };
ACT['w-back'] = () => { UI.wstep = Math.max(0, (UI.wstep || 0) - 1); A.rerender(); };
FORM.onboard = (f, d) => {
  const own = (d.get('own') || '').trim();
  if (own && !CG.normalize(own).valid) { toast('That number format is not valid'); return; }
  S().profile.ownNumber = own ? CG.normalize(own).e164 : '';
  S().settings.strictness = d.get('strict'); S().settings.unknownSmsFirst = !!d.get('usf');
  S().onboarded = true; UI.wstep = 0; A.addEvent('setup', 'Onboarding completed'); A.save(); A.go('permissions');
};

/* ---------- 2 permissions ---------- */
VIEWS.permissions = () => {
  const cam = S().perms.camera, nt = ('Notification' in window) ? Notification.permission : 'unsupported';
  const row = (name, why, state, btn) => `<tr><td><b>${name}</b><div class="mute">${why}</div></td><td>${state}</td><td>${btn || ''}</td></tr>`;
  return `<h1>Permissions</h1><div class="note">Asked only when the feature needs it. Each can be revoked in your browser or phone settings.</div><div class="card"><table><tr><th>Permission</th><th>State</th><th></th></tr>
${row('Call-screening role', 'Android CallScreeningService. Needed to see incoming calls.', 'Native app only', '')}
${row('Contacts', 'Native app would read contacts to avoid flagging them. Here you keep your own allowlist.', 'Not used', '<a class="btn sm" href="#/lists">Lists</a>')}
${row('Send SMS', 'Used for SMS-first and replies. This build opens your SMS app and you press Send.', S().settings.smsConsent ? 'Consent given' : 'Off', `<button class="sm" data-act="sms-consent">${S().settings.smsConsent ? 'Turn off' : 'Allow'}</button>`)}
${row('Camera', 'Only for the human-presence challenge. Frames are never stored.', cam ? 'Granted once' : 'Not requested', '<button class="sm" data-act="perm-camera">Request</button>')}
${row('Notifications', 'Alerts when an Emergency Circle contact calls.', nt, nt === 'granted' || nt === 'unsupported' ? '' : '<button class="sm" data-act="perm-notif">Request</button>')}
${row('Biometric lock', 'Device biometrics to reopen the app.', A.getSec().cred ? 'Registered' : 'Off', '<a class="btn sm" href="#/security">Security</a>')}
</table></div>`;
};
ACT['sms-consent'] = () => { S().settings.smsConsent = !S().settings.smsConsent; A.addEvent('privacy', 'SMS consent ' + (S().settings.smsConsent ? 'granted' : 'withdrawn')); A.save(); A.rerender(); };
ACT['perm-camera'] = async () => {
  try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); S().perms.camera = true; A.save(); A.rerender(); }
  catch (e) { toast('Camera not granted: ' + e.message); }
};
ACT['perm-notif'] = async () => { try { await Notification.requestPermission(); } catch (e) { toast(e.message); } A.rerender(); };

/* ---------- 3 dashboard ---------- */
function stats() {
  const c = S().calls;
  return {
    screened: c.length, sim: c.filter(x => x.source === 'simulated').length, outg: c.filter(x => x.dir === 'out').length,
    susp: c.filter(x => ['SUSPICIOUS', 'HIGH RISK'].includes(x.cls)).length,
    scam: c.filter(x => x.cls === 'CONFIRMED SCAM' && x.result === 'blocked').length,
    comm: c.filter(x => x.cls === 'COMMERCIAL').length,
    sms: S().smsLog.filter(x => x.kind === 'request').length,
    hum: S().verifications.filter(v => v.result === 'pass').length,
    biz: c.filter(x => x.cls === 'VERIFIED BUSINESS').length
  };
}
VIEWS.home = () => {
  const s = stats(), last = UI.ev;
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span><div>${badge('measured', 1)}</div></div>`;
  const ev = S().events.slice(0, 5);
  return `<canvas class="hero" data-gate="hero" ${last ? `data-segs="${segsOf(last)}"` : ''}></canvas><h1>Security dashboard</h1>
<p class="mute">Counted from this device's log. ${s.sim} of ${s.screened} screenings were simulated; ${s.outg} were outgoing checks.</p>
<div class="grid">${stat(s.screened, 'Calls screened')}${stat(s.susp, 'Suspicious / high-risk detected')}${stat(s.scam, 'Confirmed-scam calls blocked')}${stat(s.comm, 'Commercial calls identified')}${stat(s.sms, 'SMS-first requests prepared')}${stat(s.hum, 'Human-presence checks passed')}${stat(s.biz, 'Verified businesses encountered')}</div>
<div class="note">Estimates: none shown. Figures like "scams prevented" or "money saved" cannot be measured from this device, so CALLGUARD does not invent them.</div>
<div class="row"><a class="btn pri" href="#/incoming">Screen a call</a><a class="btn" href="#/outgoing">Check before dialling</a><a class="btn" href="#/report">Report a number</a></div>
<div class="card"><h2>Recent security events</h2>${ev.length ? `<table>${ev.map(e => `<tr><td class="mono">${fmt(e.ts)}</td><td>${esc(e.text)}</td></tr>`).join('')}</table>` : '<p class="mute">Nothing yet.</p>'}</div>`;
};

/* ---------- 4 incoming ---------- */
VIEWS.incoming = () => `<h1>Incoming call screening</h1><div class="note">Simulator. A browser cannot see real calls; the Android app does that. Enter a number as if it were ringing.</div>
<form data-form="screen-in" class="card"><label>Calling number</label><input name="num" list="knownnums" inputmode="tel" placeholder="e.g. 087 555 0142 or +27 82 123 4567" value="${esc(UI.num || '')}" required><datalist id="knownnums">${known()}</datalist><label>What the caller says they want (optional)</label><textarea name="claimed" placeholder="e.g. 'We have an insurance offer for you'">${esc(UI.claimed || '')}</textarea><button class="pri" type="submit">Screen call</button></form>
${UI.ev ? resultCard(UI.ev, UI.callId) + replyCard(UI.ev) : ''}`;
FORM['screen-in'] = (f, d) => {
  UI.num = d.get('num'); UI.claimed = d.get('claimed') || '';
  const ev = A.evalNum(UI.num, UI.claimed), c = A.logCall(ev, 'in', 'simulated');
  if (ev.action === 'block') c.result = 'blocked';
  UI.ev = ev; UI.callId = c.id; UI.decision = ev.action === 'block' ? 'Rejected automatically by your rule.' : '';
  if (ev.circleHit && S().settings.notifyCircle && 'Notification' in window && Notification.permission === 'granted') new Notification('Emergency Circle', { body: ev.norm.display + ' is calling' });
  A.save(); A.rerender();
};

/* ---------- 5 outgoing ---------- */
VIEWS.outgoing = () => {
  const ev = UI.oev;
  return `<h1>Outgoing call screening</h1><div class="note">Check a number before you dial it.</div><form data-form="screen-out" class="card"><label>Number you are about to call</label><input name="num" list="knownnums" inputmode="tel" value="${esc(UI.onum || '')}" required><datalist id="knownnums">${known()}</datalist><button class="pri" type="submit">Check number</button></form>
${ev ? `<div class="card ${['SUSPICIOUS', 'HIGH RISK', 'CONFIRMED SCAM'].includes(ev.classification) ? 'red' : 'gold'}">${chip(ev.classification)} ${badge('confidence: ' + ev.confidence)}<h2 style="margin-top:8px">${esc(ev.norm.display || ev.norm.e164)}</h2><p>${esc(ev.verdict)}</p><details><summary>Evidence (10 signals)</summary>${evList(ev)}</details><div class="row"><button class="pri" data-act="out-call">Call now</button><button data-act="out-block">Block</button><button data-act="out-profile">Profile</button></div></div>` : ''}`;
};
FORM['screen-out'] = (f, d) => { UI.onum = d.get('num'); UI.oev = A.evalNum(UI.onum, ''); A.rerender(); };
ACT['out-call'] = async () => {
  const ev = UI.oev; if (!ev || !ev.norm.valid) { toast('Not a valid number'); return; }
  if (['HIGH RISK', 'CONFIRMED SCAM'].includes(ev.classification) && !(await confirmBox('Call anyway?', 'This number has serious warning signs. Do not share OTPs, PINs or card codes.', 'Call anyway', true))) return;
  const c = A.logCall(ev, 'out', 'web'); c.result = 'dialed'; A.save();
  location.href = 'tel:' + ev.norm.e164;
};
ACT['out-block'] = () => { if (UI.oev && A.blockNumber(UI.oev.norm.e164)) { A.save(); toast('Blocked'); } };
ACT['out-profile'] = () => A.go('profile/' + encodeURIComponent(UI.oev.norm.e164));

/* ---------- 6 profile ---------- */
VIEWS.profile = arg => {
  const form = `<form data-form="lookup" class="card"><label>Look up a number</label><input name="num" list="knownnums" value="${esc(arg || '')}" required><datalist id="knownnums">${known()}</datalist><button class="pri" type="submit">Open profile</button></form>`;
  if (!arg) {
    const recent = [...new Set(S().calls.map(c => c.num))].slice(0, 10);
    return `<h1>Caller intelligence</h1>${form}${recent.length ? `<div class="card"><h2>Recently seen</h2>${recent.map(n => `<div><a href="#/profile/${encodeURIComponent(n)}">${numLabel(n)}</a></div>`).join('')}</div>` : ''}`;
  }
  const ev = A.evalNum(arg, ''), e = ev.norm.e164;
  const calls = S().calls.filter(c => c.num === e).slice(0, 8);
  const reps = S().reports.filter(r => r.num === e);
  const d = `data-call="" data-num="${esc(e)}"`;
  return `<h1>Caller intelligence</h1>${form}${resultCard(ev, '').replace(/data-act="call-do" data-do="(answer|silence)"[^>]*>[^<]*<\/button>/g, '')}
<div class="card"><h2>Your history with this number</h2>${calls.length ? `<table>${calls.map(c => `<tr><td class="mono">${fmt(c.ts)}</td><td>${c.dir === 'in' ? 'Incoming' : 'Outgoing'}</td><td>${esc(c.cls)}</td><td>${esc(c.result)}</td></tr>`).join('')}</table>` : '<p class="mute">No calls logged.</p>'}</div>
<div class="card"><h2>Your reports</h2>${reps.length ? `<table>${reps.map(r => `<tr><td>${fmt(r.ts)}</td><td>${esc(r.category)}</td><td>${esc(r.status)}</td></tr>`).join('')}</table>` : '<p class="mute">None.</p>'}</div>
<div class="row"><button data-act="call-do" data-do="trust" ${d}>Trust</button><button class="dng" data-act="call-do" data-do="block" ${d}>Block</button><a class="btn" href="#/verify" data-act="v-for" data-num="${esc(e)}">Ask for human check</a></div>
<p class="mute">Profiles show behaviour and evidence. They never call a person a criminal.</p>`;
};
FORM.lookup = (f, d) => A.go('profile/' + encodeURIComponent(CG.normalize(d.get('num')).e164 || d.get('num')));
ACT['v-for'] = t => { UI.vnum = t.dataset.num; };

/* ---------- 7 human verification ---------- */
const CH_ACTIONS = ['Turn your head slowly left, then right', 'Nod twice', 'Look up, then look down', 'Blink slowly three times', 'Tilt your head to your left shoulder, then your right'];
VIEWS.verify = () => {
  const ch = UI.ch, v = UI.vres, rec = S().verifications.slice(0, 8);
  return `<h1>Human verification</h1><div class="note">Three separate levels. A phone call alone cannot scan a caller's face or prove who they are. This is for CALLGUARD-to-CALLGUARD checks only.</div>
<div class="card"><table><tr><th>Level</th><th>In this build</th></tr><tr><td>Human presence</td><td>Basic motion check below. Not a liveness-provider result.</td></tr><tr><td>Account ownership</td><td>Unavailable: needs an account backend</td></tr><tr><td>Legal identity</td><td>Unavailable: needs a trusted identity-verification provider</td></tr></table></div>
${v ? `<div class="card ${v.result === 'pass' ? 'gold' : 'red'}"><h2>Result: ${esc(v.result.toUpperCase())}</h2><p>Privacy token: <span class="mono">${esc(v.token)}</span></p><p class="mute">The token holds no image or biometric. No frames were stored. Result means movement was seen during the window, nothing more. A recorded video or a screen held to the camera would not be detected.</p></div>` : ''}
${ch ? `<div class="card gold"><h2>Challenge issued</h2><p>Code to say aloud: <span class="big">${esc(ch.code)}</span></p><p>When the camera starts: <b>${esc(ch.action)}</b></p><p class="mute">Expires ${new Date(ch.expires).toLocaleTimeString('en-ZA')} (2 minutes). The action is random so a pre-recorded clip is unlikely to match.</p><video id="vid" playsinline muted></video><p id="vstat" class="mute"></p><div class="row"><button class="pri" data-act="v-start">Start camera check</button><button data-act="v-decline">Decline</button></div></div>` :

FORM['v-issue'] = (f, d) => {
  const raw = (d.get('num') || '').trim(), n = raw ? CG.normalize(raw) : null;
  if (raw && !n.valid) { toast('Invalid number'); return; }
  const a = new Uint8Array(4); crypto.getRandomValues(a);
  const code = Array.from(a).map(x => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[x % 31]).join('');
  UI.ch = { id: uid(), num: n ? n.e164 : '', code, action: CH_ACTIONS[a[0] % CH_ACTIONS.length], expires: Date.now() + 120000 }; UI.vres = null; A.rerender();
};
async function recordVer(result, metrics) {
  const ch = UI.ch, ts = Date.now();
  const v = { id: uid(), num: ch.num, ts, result, level: 'presence', token: await sign(`${ch.id}|${ch.code}|${result}|${ts}`), metrics };
  S().verifications.unshift(v); UI.vres = v; UI.ch = null;
  A.addEvent('verify', `Human-presence check ${result}`); A.save(); A.rerender();
}
ACT['v-decline'] = () => recordVer('declined', null);
ACT['v-start'] = async () => {
  const ch = UI.ch; if (!ch) return;
  if (Date.now() > ch.expires) { toast('Challenge expired. Issue a new one.'); UI.ch = null; A.rerender(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 }, audio: false }); }
  catch (e) { toast('Camera unavailable: ' + e.message); return; }
  const vid = $('#vid'), st = $('#vstat'); vid.srcObject = stream; await vid.play().catch(() => {});
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 48; const cx = cv.getContext('2d', { willReadFrequently: true });
  for (let i = 3; i > 0; i--) { st.textContent = 'Get ready… ' + i; await sleep(1000); }
  st.textContent = 'Now: ' + ch.action;
  let prev = null; const diffs = [], t0 = Date.now();
  while (Date.now() - t0 < 5000) {
    cx.drawImage(vid, 0, 0, 64, 48); const px = cx.getImageData(0, 0, 64, 48).data, g = new Float32Array(64 * 48);
    for (let i = 0; i < g.length; i++) g[i] = px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11;
    if (prev) { let s = 0; for (let i = 0; i < g.length; i++) s += Math.abs(g[i] - prev[i]); diffs.push(s / g.length); }
    prev = g; await sleep(125);
  }
  stream.getTracks().forEach(t => t.stop()); vid.srcObject = null;
  const moving = diffs.filter(x => x > 4).length / Math.max(1, diffs.length), peak = Math.max(0, ...diffs);
  const pass = Date.now() <= ch.expires && moving >= 0.3 && peak > 8;
  await recordVer(pass ? 'pass' : 'fail', { moving: +moving.toFixed(2), peak: +peak.toFixed(1) });
};

async function verifyPin(pin) {
  const sec = A.getSec();
  try { await A.decObj(JSON.parse(localStorage.getItem('cg.enc')), await A.deriveKey(pin, A.unb64(sec.salt))); return true; } catch (_) { return false; }
}
VIEWS.security = () => {
  const sec = A.getSec(), fi = (() => { try { return JSON.parse(localStorage.getItem('cg.fail') || '{}'); } catch (_) { return {}; } })();

  return `<h1>Security settings</h1>
<div class="card ${sec.enc ? 'gold' : 'red'}"><h2>PIN and encryption ${badge(sec.enc ? 'on' : 'off', sec.enc)}</h2><p>${sec.enc ? 'Your data is encrypted on this device (AES-256-GCM, key from your PIN via PBKDF2, 310,000 rounds).' : 'Your data is stored unencrypted on this device. Set a PIN to encrypt it.'}</p><p class="mute">Strong PIN: 6+ digits, no repeats, no sequences. There is no recovery server: forget the PIN and the data is gone. Keep an encrypted backup.</p><div class="row"><button class="pri" data-act="pin-set">${sec.enc ? 'Change PIN' : 'Set PIN'}</button>${sec.enc ? '<button class="dng" data-act="pin-remove">Remove PIN</button>' : ''}</div></div>
<div class="card"><h2>Biometric re-lock ${badge(sec.cred ? 'on' : 'off', sec.cred)}</h2><p class="mute">After the app has been in the background for 60 seconds, device biometrics reopen it. This uses your phone's own fingerprint or face unlock (WebAuthn). It guards the screen; the PIN is what encrypts the data.</p><button data-act="${sec.cred ? 'bio-rm' : 'bio-reg'}">${sec.cred ? 'Turn off' : 'Register biometrics'}</button></div>
<div class="card"><h2>Devices and sessions</h2><table><tr><td><b>This device</b><div class="mute">${esc(S().device.name)} · ID ${esc(S().device.id.slice(0, 6))} · since ${fmt(S().device.created)}</div></td><td><button class="sm dng" data-act="dev-revoke">Revoke session</button></td></tr></table><p class="mute">Other devices: none. Multi-device trust needs the account backend, which this build does not have. Revoking clears the biometric registration and rotates this device's ID and signing key.</p></div>
<div class="card"><h2>Alerts</h2><p>Failed unlock attempts logged: <b>${(fi.log || []).length + sev.length}</b>. Lockout starts after 5 wrong PINs and doubles each time.</p>${sev.length ? `<table>${sev.map(e => `<tr><td class="mono">${fmt(e.ts)}</td><td>${esc(e.text)}</td></tr>`).join('')}</table>` : ''}<p class="mute">Alerts here are local. Real "new device signed in" alerts need a server.</p></div>
<div class="card"><h2>Encrypted backup</h2><div class="row"><button data-act="bk-export">Export backup</button><button data-act="bk-import">Restore backup</button></div><input type="file" id="bk-file" accept=".json,application/json" hidden></div>
<div class="card"><h2>Screening</h2><form data-form="sec-set"><label>Strictness</label><select name="strict">${['relaxed', 'balanced', 'strict'].map(x => `<option ${S().settings.strictness === x ? 'selected' : ''}>${x}</option>`).join('')}</select><label>Your own number</label><input name="own" value="${esc(S().profile.ownNumber)}"><label class="chk"><input type="checkbox" name="ab" ${S().settings.autoBlockConfirmed ? 'checked' : ''}>Auto-block CONFIRMED SCAM numbers</label><label class="chk"><input type="checkbox" name="usf" ${S().settings.unknownSmsFirst ? 'checked' : ''}>Offer SMS-first for unknown callers</label><button class="pri" type="submit">Save</button></form></div>
<div class="note">Not in this build (needs the secure backend): server-side rate limiting, secure account recovery, token management and secret storage. Required for the Android release.</div>`;
};
AFTER.security = () => {
  const f = $('#bk-file'); if (!f) return;
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const blob = JSON.parse(await file.text());
      const r = await ask({ title: 'Restore backup', body: '<p class="mute">This replaces everything on this device.</p>', fields: [{ name: 'p', label: 'Backup passphrase', type: 'password' }], ok: 'Restore', danger: true });
      if (!r) return;
      const st = await A.decObj(blob, await A.deriveKey(r.p, A.unb64(blob.salt)));
      A.S = Object.assign(JSON.parse(JSON.stringify(st)), {}); A.addEvent('security', 'Backup restored'); await A.saveNow(); toast('Restored'); location.reload();
    } catch (e) { toast('Restore failed: wrong passphrase or bad file'); }
    f.value = '';
  };
};
FORM['sec-set'] = (f, d) => {
  const own = (d.get('own') || '').trim(); if (own && !CG.normalize(own).valid) { toast('Invalid own number'); return; }
  S().profile.ownNumber = own ? CG.normalize(own).e164 : ''; S().settings.strictness = d.get('strict'); S().settings.autoBlockConfirmed = !!d.get('ab'); S().settings.unknownSmsFirst = !!d.get('usf');
  A.save(); toast('Saved');
};
ACT['pin-set'] = async () => {
  const sec = A.getSec(), fields = [];
  if (sec.enc) fields.push({ name: 'cur', label: 'Current PIN', type: 'password' });
  fields.push({ name: 'p1', label: 'New PIN', type: 'password' }, { name: 'p2', label: 'Repeat new PIN', type: 'password' });
  const r = await ask({ title: sec.enc ? 'Change PIN' : 'Set PIN', body: '<p class="mute">6+ digits. No repeats or sequences. Forgotten PINs cannot be recovered.</p>', fields, ok: 'Save PIN' });
  if (!r) return;
  if (sec.enc && !(await verifyPin(r.cur))) { toast('Current PIN is wrong'); return; }
  if (r.p1 !== r.p2) { toast('PINs do not match'); return; }
  const errs = CG.validatePin(r.p1); if (errs.length) { toast('PIN: ' + errs.join(', ')); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  A.KEY = await A.deriveKey(r.p1, salt); sec.enc = true; sec.salt = A.b64(salt); A.saveSec(sec);
  A.addEvent('security', 'PIN set; local data encrypted'); await A.saveNow(); toast('PIN set'); A.rerender();
};
ACT['pin-remove'] = async () => {
  const r = await ask({ title: 'Remove PIN', body: '<p>Your data will be stored unencrypted.</p>', fields: [{ name: 'cur', label: 'Current PIN', type: 'password' }], ok: 'Remove', danger: true });
  if (!r) return; if (!(await verifyPin(r.cur))) { toast('Wrong PIN'); return; }
  const sec = A.getSec(); sec.enc = false; delete sec.salt; A.saveSec(sec); A.KEY = null;
  A.addEvent('security', 'PIN removed'); await A.saveNow(); A.rerender();
};
ACT['bio-reg'] = async () => {
  if (!window.PublicKeyCredential) { toast('Biometrics not supported in this browser'); return; }
  try {
    const cred = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'CALLGUARD' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'local-user', displayName: 'CALLGUARD user' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    const sec = A.getSec(); sec.cred = A.b64(new Uint8Array(cred.rawId)); A.saveSec(sec); A.addEvent('security', 'Biometric re-lock registered'); A.rerender();
  } catch (e) { toast('Not registered: ' + e.message); }
};
ACT['bio-rm'] = () => { const sec = A.getSec(); delete sec.cred; A.saveSec(sec); A.addEvent('security', 'Biometric re-lock removed'); A.rerender(); };
ACT['dev-revoke'] = async () => {
  if (!(await confirmBox('Revoke this session?', 'Clears biometric registration and rotates this device ID and signing key. Old verification tokens can no longer be re-checked.', 'Revoke', true))) return;
  const sec = A.getSec(); delete sec.cred; A.saveSec(sec);
  S().device.id = uid(); S().device.secret = A.b64(crypto.getRandomValues(new Uint8Array(32))); S().device.created = Date.now();
  A.addEvent('security', 'Session revoked; device key rotated'); A.save(); A.rerender();
};
ACT['bk-export'] = async () => {
  const r = await ask({ title: 'Export encrypted backup', body: '<p class="mute">Choose a passphrase of 10+ characters. Without it the file cannot be opened.</p>', fields: [{ name: 'p', label: 'Passphrase', type: 'password' }], ok: 'Export' });
  if (!r) return; if (r.p.length < 10) { toast('Passphrase must be 10+ characters'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16)), enc = await A.encObj(S(), await A.deriveKey(r.p, salt));
  dl('callguard-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ v: 1, salt: A.b64(salt), iv: enc.iv, data: enc.data }));
  A.addEvent('security', 'Encrypted backup exported');
};
