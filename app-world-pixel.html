  <style>/* WORLD PIXEL, Gauteng edition. Hard edges, stepped corners, a dot grid and square signal bars.
   Palette is the PixelProTech corporate profile: ink #0A0A0F, violet #7B2FFF, teal #00D4AA, gold. */
:root {
  --bg: #0A0A0F;
  --surface: #14141D;
  --surface-2: #1A1A27;
  --text: #F3F0FF;        /* 17.9:1 on bg */
  --body: #C9C3DD;        /* 11.9:1 */
  --muted: #9D94BC;       /*  7.0:1 */
  --faint: #3A3556;       /* decorative only, never used for text */
  --edge: #7A72A0;        /*  4.4:1  borders of interactive controls (WCAG 1.4.11) */
  --line: #27243A;        /* hairlines */
  --teal: #00D4AA;        /* 10.6:1  the action colour */
  --violet: #7B2FFF;      /* decorative only */
  --violet-text: #B79CFF; /*  8.9:1 */
  --gold: #D8B96A;        /* 10.7:1 */
  --px: 6px;              /* the pixel: one step of every notched corner */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  color: var(--body); font: 1rem/1.55 var(--sans);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(123, 47, 255, .28) 1px, transparent 1.3px);
  background-size: 16px 16px;
  padding-bottom: env(safe-area-inset-bottom);
}
main { flex: 1; outline: none; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--teal); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -999px; top: 0; background: var(--teal); color: var(--bg); padding: .75rem 1rem; z-index: 10; }
.skip:focus { left: 0; }

.wrap { width: 100%; max-width: 66rem; margin-inline: auto; padding-inline: max(1.25rem, env(safe-area-inset-left)) max(1.25rem, env(safe-area-inset-right)); }
main.wrap { padding-block: 2rem 4rem; }

/* the pixel notch: every card, button and chip loses its four corner pixels */
.btn, .notice, .pxchip, .row__in, .pxmap-slot, .testbar {
  clip-path: polygon(0 var(--px), var(--px) var(--px), var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
    100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)));
}

/* ---------- chrome ---------- */
.bar { padding-top: env(safe-area-inset-top); border-bottom: 2px solid var(--line); background: rgba(10, 10, 15, .86); }
.bar__in { display: flex; align-items: center; justify-content: space-between; min-height: 3.5rem; }
.bar__brand { display: inline-flex; align-items: center; gap: .75rem; color: var(--text); text-decoration: none; font: 800 1rem/1 var(--mono); letter-spacing: .14em; min-height: 48px; }
.bar__module { display: inline-flex; align-items: center; gap: .625rem; color: var(--muted); font: 600 .75rem/1 var(--mono); letter-spacing: .18em; }
.bar__sep { width: 6px; height: 6px; background: var(--violet); }
.banner { background: var(--surface); border-bottom: 2px solid var(--gold); color: var(--gold); padding-block: .75rem; font-size: .9375rem; }
.foot-bar { border-top: 2px solid var(--line); background: rgba(10, 10, 15, .86); }
.foot-bar__in { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding-block: 1.25rem; }
.foot-bar__co { max-width: 46rem; line-height: 1.7; }
.foot-bar__co strong { color: var(--text); font-weight: 650; }

/* ---------- type ---------- */
.eyebrow { display: inline-flex; align-items: center; gap: .625rem; font: 700 .75rem/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--teal); }
.eyebrow__px { width: 8px; height: 8px; background: var(--teal); animation: blink 1.6s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.wordmark { margin-top: 1rem; font: 800 clamp(3rem, 15vw, 6rem)/.9 var(--mono); letter-spacing: .01em; color: var(--text); text-shadow: 4px 4px 0 var(--violet); }
.lede { margin-top: 1.5rem; font-size: clamp(1.375rem, 4.4vw, 1.875rem); line-height: 1.2; color: var(--text); font-weight: 650; max-width: 18ch; }
.sublede { margin-top: .75rem; max-width: 34ch; }
.stats { margin-top: 1.25rem; min-height: 1.5em; font: .8125rem/1.5 var(--mono); color: var(--muted); max-width: 40ch; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .625rem;
  min-height: 48px; padding: 0 1.125rem;
  font: 700 1rem/1 var(--sans); text-decoration: none; cursor: pointer;
  border: 0; -webkit-tap-highlight-color: transparent;
}
.btn--primary { background: var(--teal); color: var(--bg); }
.btn--primary:hover { background: #3CF0CB; }
.btn--line { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 2px var(--edge); }
.btn--line:hover { box-shadow: inset 0 0 0 2px var(--text); }
.btn--lg { width: 100%; min-height: 68px; font-size: 1.25rem; letter-spacing: .02em; }
.btn--sm { min-height: 44px; padding: 0 .875rem; font-size: .9375rem; }
.linkbtn { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; background: none; border: 0; padding: 0; color: var(--teal); font: inherit; text-align: left; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.back { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; margin-left: -.25rem; padding: 0 .25rem; background: none; border: 0; color: var(--muted); font: 600 .875rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.back:hover { color: var(--text); }
.actions { display: flex; flex-wrap: wrap; gap: .625rem; margin-top: 1rem; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
.home__panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-content: start; max-width: 30rem; min-width: 0; }
@media (min-width: 56rem) {
  main.wrap { padding-block: 3.5rem 5rem; }
  .home { grid-template-columns: minmax(0, 1fr) 28rem; gap: 4.5rem; align-items: start; }
}
.divider { display: flex; align-items: center; gap: 1rem; color: var(--muted); font: 600 .75rem/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; margin-block: .5rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.finder { display: grid; grid-template-columns: minmax(0, 1fr); gap: .625rem; }
.finder__row { display: flex; gap: .625rem; }
.field__label { color: var(--text); font-weight: 650; }
.field__input {
  flex: 1; min-width: 0; min-height: 48px; padding: 0 .875rem;
  background: var(--surface-2); color: var(--text); border: 2px solid var(--edge); border-radius: 0;
  font: 1rem var(--sans); /* 16px stops iOS zooming on focus */
}
.field__input::placeholder { color: var(--muted); opacity: 1; }
.field__input[aria-invalid="true"] { border-color: var(--gold); }
.field__error { color: var(--gold); }
.how summary { cursor: pointer; color: var(--muted); min-height: 44px; display: flex; align-items: center; }

        h("ul", { class: "alts" }, alternatives.map((a) => h(
          "li",
          null,
          h("button", { type: "button", class: "linkbtn", onClick: () => onPick(a) }, a.label)
        )))
      ) : null,
      meta.hasTestRecords ? h("p", { class: "testbar testbar--inline" }, h("strong", null, "Test mode. "), "Results are synthetic records, not real providers.") : null
    );
    if (search.status === "empty-index") {
      return h("div", { class: "results" }, head, message({
        kind: "empty",
        title: "The provider index is empty right now.",
        body: "There is nothing to show yet. No results are made up to fill the gap.",
        actions: [{ label: "Try another place", onClick: onBack, primary: true }]
      }));
    }
    if (search.status === "none") {
      return h("div", { class: "results" }, head, ladder(search), message({
        kind: "empty",
        title: `Nothing indexed within ${search.radiusKm} km of ${where}.`,
        body: "World Pixel covers Gauteng first. If you are inside Gauteng and know a computer school we missed, tell us and it goes in with its source.",
        actions: [{ label: "Try another place", onClick: onBack, primary: true }, { label: "Tell us about a school", href: MISSED_HREF }]
      }));
    }
    const first = search.ladder[0].km;
    const expanded = search.radiusKm !== first && search.startKm === first;
    const n = search.results.length;
    const summary = expanded ? [`No providers found within ${first} km.`, ` Showing providers within ${search.radiusKm} km.`] : [`${n} ${n === 1 ? "provider" : "providers"} within ${search.radiusKm} km.`];
    return h(
      "div",
      { class: "results" },
      head,
      ladder(search),
      h("p", { class: "summary", role: "status" }, summary),
      h("ol", { class: "rows" }, search.results.map(resultRow)),
      search.nextRadiusKm ? h("div", { class: "more" }, h(
        "button",
        { type: "button", class: "btn btn--line", onClick: () => onWiden(search.nextRadiusKm) },
        `Show providers within ${search.nextRadiusKm} km`,
        icon("arrow-right", { size: 18 })
      )) : null,
      results_area_note(search),
      h("p", { class: "muted small foot" }, meta.generatedAt ? `Provider index updated ${fmtDate(meta.generatedAt)}.` : "Provider index has no recorded update date.")
    );
  }
  function providerDetail({ provider: p, distanceKm, onBack }) {
    const v = effectiveVerification(p);
    const stale = isStale(p);
    const d = distanceKm == null ? null : distanceText(distanceKm, p.precision === "area");
    const locationParts = [p.suburb, p.city, p.municipality, p.district, p.province, p.country].filter(Boolean);
    const row = (term, value) => value ? [h("dt", null, term), h("dd", null, value)] : null;
    return h(
      "div",
      { class: "detail" },
      h("button", { type: "button", class: "back", onClick: onBack }, icon("back", { size: 18 }), "Back"),
      h(
        "header",
        null,
        h("h1", { class: "detail__name", tabindex: "-1", "data-focus": "" }, p.name),
        p.category ? h("p", { class: "row__cat" }, p.category) : null,
        h("p", { class: "chips" }, p.isTest ? chip("test", "Test data") : null, verificationChip(p))
      ),
      p.isTest ? h("p", { class: "testbar testbar--inline" }, h("strong", null, "Test record. "), "This is synthetic data used to exercise the engine. It is not a real provider.") : null,
      p.description ? h("p", { class: "detail__desc" }, p.description) : null,
      providerActions(p),
      h(
        "dl",
        { class: "facts" },
        d ? row("Distance", `${p.precision === "area" && !d.lt ? "About " : ""}${d.value} ${d.unit} from the place you searched`) : null,
        row("Location", locationParts.length ? [...new Set(locationParts)].join(", ") : null),
        row("Address", p.address),
        p.phone ? row("Phone", p.phoneHref ? h("a", { href: p.phoneHref }, p.phone) : p.phone) : null,
        p.email ? row("Email", h("a", { href: `mailto:${p.email}` }, p.email)) : null,
        p.website ? row("Official website", h("a", { href: p.website, target: "_blank", rel: "noopener noreferrer" }, p.websiteHost, h("span", { class: "sr-only" }, " (opens in a new tab)"))) : null,
        p.courses.length ? row("Courses", h("ul", { class: "plain" }, p.courses.map((c) => h("li", null, c)))) : null,
        p.note ? row("Good to know", p.note) : null
      ),
      h(
        "section",
        { class: "verify", "aria-labelledby": "verify-h" },
        h("h2", { id: "verify-h", class: "verify__h" }, "Verification"),
        h(
          "p",
          null,
          verificationChip(p),
          p.lastVerified ? h("span", { class: "verify__date" }, icon("clock", { size: 16 }), `Last checked: ${fmtDate(p.lastVerified)}`) : h("span", { class: "muted" }, " Never checked.")
        ),
        stale ? h("p", { class: "muted small" }, "This record was last checked more than a year ago and may be out of date.") : null,
        v.downgraded ? h("p", { class: "muted small" }, `This record is marked verified in the data, but it has ${v.reasons.join(", ")}, so it is shown as Unverified.`) : null,
        p.source ? h("p", { class: "muted small" }, `Source: ${p.source}`) : null
      )
    );
  }

  // pwa.js
  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {
      });
    });
  }
  function setupInstallButton(slot) {
    let deferred = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferred = e;
      slot.replaceChildren(h("button", { type: "button", class: "linkbtn", onClick: async () => {
        deferred.prompt();
        await deferred.userChoice.catch(() => null);
        deferred = null;
        slot.replaceChildren();
      } }, icon("install", { size: 16 }), "Install app"));
    });
    window.addEventListener("appinstalled", () => slot.replaceChildren());
  }
  function setupNetworkBanner(banner) {
    const sync = () => {
      banner.hidden = navigator.onLine;
    };
    window.addEventListener("online", sync);
    window.addEventListener("offline", sync);
    sync();
  }

  // app.js
  var view = document.getElementById("view");
  var live = document.getElementById("live");
  var state = {
    origin: null,
    // { lat, lon, label, source: 'device' | 'entered' | 'test' } — memory only, never persisted
    alternatives: [],
    startKm: CONFIG.radiiKm[0],
    index: null,
    indexPromise: null,
    geoToken: 0
  };
  var announce = (text) => {
    live.textContent = "";
    setTimeout(() => {
      live.textContent = text;
    }, 30);
  };
  var firstPaint = true;
  function mount(node, title) {
    view.replaceChildren(node);
    document.title = title ? `${title} \xB7 WORLD PIXEL` : "WORLD PIXEL \xB7 Where Gauteng learns computers.";
    if (!firstPaint) view.querySelector("[data-focus]")?.focus({ preventScroll: false });
    firstPaint = false;
    window.scrollTo(0, 0);
  }
  function ensureIndex() {
    state.indexPromise ?? (state.indexPromise = loadProviderIndex({ testMode: TEST_MODE }).then((idx) => state.index = idx).catch((e) => {
      state.indexPromise = null;
      throw e;
    }));
    return state.indexPromise;
  }
  function setOrigin(origin, alternatives = []) {
    state.origin = origin;
    state.alternatives = alternatives;
    state.startKm = CONFIG.radiiKm[0];
  }
  function navigate(hash) {
    if (location.hash === hash) route();
    else location.hash = hash;
  }
  function showHome({ notice = null, fieldError = null } = {}) {
    state.origin = null;
    state.alternatives = [];
    mount(home({ notice, fieldError, onNearMe: startDeviceLocation, onSearch: startManualSearch, onUseTestOrigin: useTestOrigin }), null);
    if (fieldError) document.getElementById("place")?.focus();
    Promise.all([ensureIndex(), loadPlaces()]).then(([idx, places]) => {
      if (!document.getElementById("pixel-map")) return;
      fillHome({ providers: idx.providers, places, meta: idx.meta, onPickCity: startManualSearch });
    }).catch(() => {
    });
  }
  var LOCATION_NOTICES = {
    denied: { title: "Location access was denied.", body: "Enter your town or city to continue. To use your device location instead, allow location for this site in your browser settings and try again." },
    unavailable: { title: "Your location could not be detected.", body: "Your device could not work out where you are. Enter your town or city to continue." },
    timeout: { title: "Finding your location took too long.", body: "Try again, or enter your town or city to continue." },
    unsupported: { title: "This browser cannot share its location.", body: "Enter your town or city to continue." },
    insecure: { title: "Location needs a secure connection.", body: "Open World Pixel over HTTPS to use your device location, or enter your town or city to continue." }
  };
  async function startDeviceLocation() {
    const token = ++state.geoToken;
    mount(loading({
      title: "Finding your location\u2026",
      body: "If your browser asks for permission, choose Allow to see providers near you.",
      cancelLabel: "Enter a town or city instead",
      onCancel: () => {
        state.geoToken++;
        showHome();
      }
    }), "Finding your location");
    try {
      const pos = await getDeviceLocation();
      if (token !== state.geoToken) return;
      setOrigin({ lat: pos.lat, lon: pos.lon, label: null, source: "device" });
      announce("Location detected.");
      reverseLabel(pos.lat, pos.lon).then((label) => {
        if (!label || state.origin?.source !== "device" || token !== state.geoToken) return;
        state.origin.label = label;
        const el = document.getElementById("origin-label");
        if (el) el.textContent = label;
      });
      navigate("#/near");
    } catch (e) {
      if (token !== state.geoToken) return;
      const code = e instanceof LocationError ? e.code : "unavailable";
      showHome({ notice: { kind: "error", ...LOCATION_NOTICES[code] } });
    }
  }
  async function startManualSearch(raw) {
    const query = String(raw || "").trim();
    if (query.length < 2) return showHome({ fieldError: "Enter at least two characters of a town or city." });
    state.geoToken++;
    mount(loading({ title: `Looking up ${query}\u2026` }), "Looking up place");
    try {
      const { results: results2 } = await geocode(query);
      if (!results2.length) {
        return showHome({ notice: { kind: "error", title: `No place matching \u201C${query}\u201D was found.`, body: "Check the spelling, or pick a Gauteng city from the list." } });
      }
      const [best, ...rest] = results2;
      setOrigin({ lat: best.lat, lon: best.lon, label: best.label, source: "entered" }, rest);
      navigate("#/near");
    } catch (e) {
      const network = e instanceof GeocodeError ? e.code === "network" : true;
      mount(message({
        kind: "error",
        title: network ? "World Pixel couldn\u2019t reach the location service." : "The location service sent an unreadable answer.",
        body: "Nothing was searched. Check your connection and try again.",
        actions: [{ label: "Try again", primary: true, onClick: () => startManualSearch(query) }, { label: "Back", onClick: () => showHome() }]
      }), "Location service unavailable");
    }
  }
  function useTestOrigin() {
    const t = CONFIG.test.origin;
    setOrigin({ lat: t.lat, lon: t.lon, label: t.label, source: "test" });
    navigate("#/near");
  }
  async function showResults() {
    if (!state.origin) return navigate("#/");
    mount(loading({ title: "Finding providers near you\u2026" }), "Finding providers");
    try {
      const idx = await ensureIndex();
      if (!state.origin) return;
      const search = nearbySearch(idx.providers, state.origin, { radii: CONFIG.radiiKm, startKm: state.startKm });
      mount(results({
        origin: state.origin,
        search,
        alternatives: state.alternatives,
        meta: idx.meta,
        onBack: () => navigate("#/"),
        onWiden: (km) => {
          state.startKm = km;
          showResults();
        },
        onPick: (a) => {
          setOrigin({ lat: a.lat, lon: a.lon, label: a.label, source: "entered" }, state.alternatives.filter((x) => x !== a));
          showResults();
        }
      }), "Providers near you");
    } catch {
      mount(message({
        kind: "error",
        title: "World Pixel couldn\u2019t reach the live provider data.",
        body: "Check your connection and try again. No providers are shown until the data loads.",
        actions: [{ label: "Try again", primary: true, onClick: showResults }, { label: "Back", onClick: () => navigate("#/") }]
      }), "Provider data unavailable");
    }
  }
  async function showProvider(id) {
    mount(loading({ title: "Loading provider\u2026" }), "Loading provider");
    const back = () => state.origin ? navigate("#/near") : navigate("#/");
    try {
      const idx = await ensureIndex();
      const provider = idx.providers.find((p) => p.id === id);
      if (!provider) throw new Error("not found");
      const distanceKm = state.origin && provider.coords ? haversineKm(state.origin, provider.coords) : null;
      mount(providerDetail({ provider, distanceKm, onBack: back }), provider.name);
    } catch {
      mount(message({
        kind: "error",
        title: "This provider\u2019s information could not be loaded.",
        body: "The record may have been removed, or the data could not be reached.",
        actions: [{ label: "Back", primary: true, onClick: back }]
      }), "Provider unavailable");
    }
  }
  function route() {
    const hash = location.hash || "#/";
    const near = liveModules().find((m2) => m2.id === "near-me").route;
    if (hash === near) return showResults();
    const m = hash.match(/^#\/provider\/(.+)$/);
    if (m) return showProvider(decodeURIComponent(m[1]));
    return showHome();
  }
  window.addEventListener("hashchange", route);
  setupNetworkBanner(document.getElementById("net-banner"));
  setupInstallButton(document.getElementById("install-slot"));
  registerServiceWorker();
  route();
})();
</script>
</body>
</html>
