.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em}
.btn{background:var(--em);color:var(--onem);font-weight:700;border-radius:999px;padding:12px 22px;min-height:46px}
.btn.ghost{background:none;color:var(--em);border:1.5px solid var(--em)}
.link{color:var(--em);font-weight:600;min-height:44px}
h1{font-size:clamp(2.8rem,15vw,4.6rem);line-height:.92;letter-spacing:-.045em;font-weight:900;margin:34px 0 18px}
h1 .dim{color:var(--mute);font-weight:800}
h2{font-size:1.5rem;letter-spacing:-.025em;line-height:1.15;margin:44px 0 6px;font-weight:800}
.lead{font-size:1.1rem;color:var(--mute);max-width:34ch;margin:0 0 22px}
.test{display:inline-block;color:var(--gold);font-weight:600;font-size:.85rem}
.road{list-style:none;margin:26px 0 0;padding:0}
.road li{position:relative;padding:0 0 30px 46px}
.road li:last-child{padding-bottom:0}
.road li::before{content:"";position:absolute;left:11px;top:28px;bottom:0;width:3px;background:var(--em);transform-origin:top;animation:draw .5s ease-out both;animation-delay:calc(var(--i)*.35s)}
.road li:last-child::before{display:none}
.road .node{position:absolute;left:0;top:2px;width:25px;height:25px;border-radius:50%;border:3px solid var(--em);background:var(--bg);animation:pop .3s ease-out both;animation-delay:calc(var(--i)*.35s - .1s)}
.road .on .node{background:var(--em);box-shadow:0 0 0 6px color-mix(in srgb,var(--em) 22%,transparent)}
.road .soon::before{background:repeating-linear-gradient(var(--emd) 0 6px,transparent 6px 12px)}
.road .soon .node{border-color:var(--emd)}
.road b{display:block;font-size:1.1rem;letter-spacing:-.01em}
.road span{color:var(--mute);font-size:.95rem}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.search{width:100%;font:inherit;color:var(--ink);background:none;border:0;border-bottom:2px solid var(--line);padding:12px 0;margin:10px 0 4px;border-radius:0}
.search:focus{outline:0;border-color:var(--em)}
.cats{display:flex;gap:22px;overflow-x:auto;margin:6px -20px 8px;padding:0 20px;scrollbar-width:none}
.cats button{padding:10px 0;white-space:nowrap;color:var(--mute);font-weight:600;border-bottom:3px solid transparent}
.cats button[aria-pressed=true]{color:var(--ink);border-color:var(--em)}
.job{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 0 18px 14px;border-left:3px solid var(--line);margin:6px 0;transition:border-color .15s,padding .15s}
.job:hover,.job:active{border-color:var(--em);padding-left:20px}
.job .t{flex:1}.job b{display:block;font-size:1.2rem;letter-spacing:-.02em;line-height:1.2}
.job small{color:var(--mute);font-size:.92rem}
.job .m{color:var(--em);font-size:.82rem;font-weight:600}
.empty{color:var(--mute);padding:20px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;margin:22px 0}
.facts dt{color:var(--mute);font-size:.85rem}.facts dd{margin:0;font-weight:700;font-size:1.05rem;line-height:1.3}
.warn{color:var(--gold);font-weight:600;font-size:.9rem}
.track{display:flex;margin:26px 0 8px}
.track button{flex:1;position:relative;text-align:center;padding-top:30px;font-size:.82rem;color:var(--mute);font-weight:600;min-height:64px}
.track button::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line)}
.track button::after{content:"";position:absolute;top:1px;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.track button.done::before{background:var(--em)}
.track button.done::after,.track button.cur::after{border-color:var(--em)}
.track button.cur::after{background:var(--em)}
.track button.cur{color:var(--ink)}
.track button:first-child::before{left:50%}.track button:last-child::before{right:50%}
.sec h3{font-size:1.2rem;margin:26px 0 8px;letter-spacing:-.02em}
.sec ul{padding-left:20px;margin:6px 0}.sec li{margin:6px 0}
.say{background:var(--panel);border-radius:14px;padding:16px;margin:12px 0;white-space:pre-wrap}
.say.no{border-left:4px solid var(--gold)}.say.yes{border-left:4px solid var(--em)}
.say i{display:block;font-style:normal;font-size:.8rem;color:var(--mute);margin-bottom:4px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
textarea:focus{outline:0;border-color:var(--em)}
details{margin:26px 0;color:var(--mute)}summary{cursor:pointer;color:var(--ink);font-weight:600;min-height:44px;display:flex;align-items:center}
details dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}details dd{margin:0}
.scene{padding:26px 0;border-top:1px solid var(--line)}
.scene p.q{font-size:1.35rem;font-weight:800;letter-spacing:-.025em;line-height:1.25;margin:0 0 14px}
.bar{display:flex;gap:4px;margin:12px 0}.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.bar i.f{background:var(--em)}
.app{padding:22px 0;border-top:1px solid var(--line)}.app b{font-size:1.15rem;letter-spacing:-.02em}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:.78rem;font-weight:600;color:var(--mute);min-height:58px;position:relative}
nav button[aria-current=page]{color:var(--em)}
nav button[aria-current=page]::before{content:"";position:absolute;top:-1px;width:36px;height:3px;background:var(--em);border-radius:0 0 3px 3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:56px;color:var(--mute);font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<nav aria-label="Main"><div id="nav"></div></nav>
<script>
const JOBS=[
{id:"t1",title:"Office cleaner",employer:"Test Employer A",category:"Cleaning",location:"Johannesburg, Gauteng",pay:"Not stated",hours:"Mon to Fri, early shift",type:"Permanent",licences:[],skills:["Reliable","Attention to detail"],experience:"None required",apply:"Email a short message"},
{id:"t2",title:"Warehouse packer",employer:"Test Employer B",category:"Warehousing",location:"Midrand, Gauteng",pay:"Not stated",hours:"Shifts, some Saturdays",type:"Contract",licences:[],skills:["Can stand and lift for long periods","Follows instructions"],experience:"Helpful, not required",apply:"Apply through the source link"},
{id:"t3",title:"Security officer",employer:"Test Employer C",category:"Security",location:"Pretoria, Gauteng",pay:"Not stated",hours:"12-hour shifts",type:"Permanent",licences:["PSIRA registration (check the current rules)"],skills:["Alert","Basic report writing"],experience:"Grade training may be required",apply:"Call the number on the source page"},
{id:"t4",title:"Kitchen assistant",employer:"Test Employer D",category:"Hospitality",location:"Sandton, Gauteng",pay:"Not stated",hours:"Evenings and weekends",type:"Temporary",licences:[],skills:["Food hygiene awareness","Teamwork"],experience:"None required",apply:"Walk in with your CV"},
{id:"t5",title:"Gardener",employer:"Test Employer E",category:"Gardening",location:"Randburg, Gauteng",pay:"Not stated",hours:"Mon to Fri, day shift",type:"Permanent",licences:[],skills:["Basic plant care","Tool handling"],experience:"Informal experience accepted",apply:"Email a short message"}
].map(j=>({...j,source:"Openway test data",link:"none",found:"2026-10-11",status:"Not verified. Test data.",limits:"Invented for development."}));
const SCAM=["You are asked to pay for the job, a uniform, a test or \"registration\".","There is no interview and no real person to speak to.","Only a free email address or WhatsApp number, and you cannot find the company.","They want your ID or bank details before any offer.","The pay sounds far too high for the work."];
const SCENES=[
{q:"Your supervisor says your work is not good enough, in front of others.",yes:"Thank you. Please show me what to change and I will fix it now.",no:"It is not my fault. Nobody showed me.",why:"You stay calm and get the fix. Later, in private, you can ask how to avoid it next time. If it keeps happening in public to humiliate you, write down the dates and raise it with someone senior."},
{q:"You think there is a quicker way to do the task.",yes:"I understand the current way. I have another idea that might help us finish sooner. May I explain it?",no:"You don't know what you're doing. My way is better.",why:"You give your opinion without attacking the person. Then you listen to the answer. If it stays no, you follow safe instructions."},
{q:"Your taxi is late and you will arrive after start time.",yes:"Good morning. My taxi is delayed. I will be there by 7:40. I am sorry, and I will leave earlier tomorrow.",no:"(Say nothing and arrive late.)",why:"Telling them early shows respect. Silence looks like you do not care."},
{q:"Interviewer: Why should we hire you without matric?",yes:"I do not have matric, but I am reliable, I learn quickly, and I have experience in [your real experience]. I am ready to show you.",no:"I don't know. I just need a job.",why:"Be honest, then point to what you can do. Use only true details."},
{q:"Payday passed and your money has not arrived.",yes:"Good afternoon. My pay for [month] has not come in. Can you tell me when I will receive it? Please confirm by message.",no:"Quit without saying anything.",why:"Ask politely and keep a written record. If it stays unpaid, contact the Department of Employment and Labour. Check the current process there."}
];
const STEPS=["The job","Get ready","Practise","Apply"],ST=["Applied","Followed up","Interview","Offer"];
const S={tab:"work",job:null,step:0,cat:"All",q:"",open:{}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const mark='<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="var(--em)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 9.5A10 10 0 1 0 23 22.5"/><path d="M13 11l6 5-6 5"/></svg>';
const chev='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const ICON={work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/>',practise:'<path d="M4 5h16v11H9l-5 4z"/>',apps:'<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>'};
const NAV=[["work","Work"],["practise","Practise"],["apps","My applications"]];

function go(t){S.tab=t;S.job=null;render();scrollTo(0,0)}
function openJob(id){S.job=id;S.step=0;render();scrollTo(0,0)}
function step(i){S.step=i;render()}
function filtered(){return JOBS.filter(j=>(S.cat==="All"||j.category===S.cat)&&(j.title+j.location+j.employer+j.category).toLowerCase().includes(S.q.toLowerCase()))}
function listHtml(){const l=filtered();return l.length?l.map(j=>`<button class="job" onclick="openJob('${j.id}')"><span class="t"><b>${esc(j.title)}</b><small>${esc(j.employer)}, ${esc(j.location)}</small><br><span class="m">Matric not listed as required</span></span>${chev}</button>`).join(""):`<p class="empty">No jobs match that search. Clear the words or choose All.</p>`}
function onSearch(v){S.q=v;$("list").innerHTML=listHtml()}

function work(){
 const cats=["All",...new Set(JOBS.map(j=>j.category))];
 const road=[["Find work","See jobs that do not list matric as a requirement.","on"],["Get ready","A CV checklist, a message to send and a scam check. It sits inside every job.","on"],["Practise","Say your answers out loud before the interview.","on"],["Start strong","Your first week at work. Coming soon.","soon"],["Move up","Skills, training and better pay. Coming soon.","soon"]];
 return `<h1><span class="dim">No matric.</span><br>Still a future.</h1>
 <p class="lead">Find work you can apply for, get ready for the interview, and learn how to keep the job.</p>
 <ol class="road" aria-label="Your road with Openway">${road.map((r,i)=>`<li class="${r[2]}" style="--i:${i}"><i class="node"></i><b>${r[0]}</b><span>${r[1]}</span></li>`).join("")}</ol>
 <h2 id="jobs">Jobs to look at</h2><span class="test">Test data for now. These are not real jobs.</span>
 <label class="sr" for="q" style="position:absolute;left:-9999px">Search jobs</label>
 <input id="q" class="search" type="search" placeholder="Search by job or place" value="${esc(S.q)}" oninput="onSearch(this.value)">
 <div class="cats" role="group" aria-label="Job type">${cats.map(c=>`<button aria-pressed="${c===S.cat}" onclick="S.cat='${c}';render()">${c}</button>`).join("")}</div>
 <div id="list">${listHtml()}</div>
 <p class="foot">Openway is a PixelProTech Solutions product. Registration 2026/622131/07.</p>`;
}
function jobBody(j){
 if(S.step===0)return `<div class="sec"><h3>What this means for you</h3><ul><li>The listing does not ask for matric. Confirm this with the employer.</li><li>Before you accept, ask the pay rate, how often you are paid, and the hours.</li>${j.licences.length?"<li>This job lists a licence or registration. Check the current rules with the body that issues it.</li>":""}</ul>
 <p>Skills they look for: ${esc(j.skills.join(", "))}.<br>Experience: ${esc(j.experience)}.</p><p>How to apply: <b>${esc(j.apply)}</b></p>
 <details><summary>Where this listing came from</summary><dl><dt>Source</dt><dd>${esc(j.source)}</dd><dt>Link</dt><dd>${esc(j.link)}</dd><dt>Found</dt><dd>${j.found}</dd><dt>Status</dt><dd>${esc(j.status)}</dd><dt>Limits</dt><dd>${esc(j.limits)}</dd></dl></details>
 <button class="link" onclick="alert('Thank you. In the full app this goes to our review team. In this prototype nothing is saved.')">Report this listing</button> <button class="btn" onclick="step(1)">Get ready</button></div>`;
 if(S.step===1)return `<div class="sec"><h3>Your CV, without matric</h3><ul><li>Your name, phone number and area.</li><li>One line: reliable, hardworking, available for ${esc(j.type.toLowerCase())} ${esc(j.category.toLowerCase())} work.</li><li>Real work counts, even informal: a family business, piece jobs, volunteering. Say what you did.</li><li>Skills that match: ${esc(j.skills.join(", "))}.</li><li>Education: your highest grade completed. Be honest.</li><li>Two people who can speak for you, with their permission.</li></ul>
 <h3>Message to the employer</h3><div class="say">Good day. I would like to apply for the ${esc(j.title.toLowerCase())} position. I am reliable and can start on [date]. I live in [area] and get to work by [transport]. May I send my CV or come in for an interview? Thank you. [Your name and number]</div>
 <h3>Stop if you see this</h3><ul>${SCAM.map(s=>`<li>${esc(s)}</li>`).join("")}</ul><p><button class="btn" onclick="step(2)">Practise answers</button></p></div>`;
 if(S.step===2)return `<div class="sec"><h3>Likely questions</h3><p style="color:var(--mute)">Say your answer out loud first. Then compare.</p></div>`+sceneHtml(3)+sceneHtml(2)+`<p><button class="btn" onclick="step(3)">I am ready to apply</button></p>`;
 const t=store.get("note_"+j.id,"");
 return `<div class="sec"><h3>Apply the way the listing says</h3><p>Openway never sends anything for you. Use the method on the listing: <b>${esc(j.apply)}</b>. Then record it here.</p>
 <label for="n" style="color:var(--mute);font-size:.9rem">Notes. Saved on this phone as you type.</label><textarea id="n" rows="4" oninput="store.set('note_${j.id}',this.value)">${esc(t)}</textarea>
 <p><button class="btn" onclick="track('${j.id}')">I applied</button></p><p style="color:var(--mute);font-size:.85rem">Browser storage can be cleared. Do not write ID numbers or bank details here.</p></div>`;
}
function job(){
 const j=JOBS.find(x=>x.id===S.job);
 return `<button class="link" onclick="go('work')">Back to jobs</button>
 <h1 style="font-size:clamp(2.2rem,11vw,3.4rem);margin:12px 0 6px">${esc(j.title)}</h1><div>${esc(j.employer)}</div><span class="test">Test data. Not a real job.</span>
 <dl class="facts"><div><dt>Pay</dt><dd>${esc(j.pay)}${j.pay==="Not stated"?'<br><span class="warn">Ask before you accept</span>':""}</dd></div><div><dt>Where</dt><dd>${esc(j.location)}</dd></div><div><dt>Hours</dt><dd>${esc(j.hours)}</dd></div><div><dt>Type</dt><dd>${esc(j.type)}</dd></div></dl>
 <div class="track" role="tablist">${STEPS.map((s,i)=>`<button role="tab" aria-selected="${i===S.step}" class="${i<S.step?"done":i===S.step?"cur":""}" onclick="step(${i})">${s}</button>`).join("")}</div>${jobBody(j)}`;
}
function sceneHtml(i){const c=SCENES[i],k="s"+i,o=S.open[k];return `<div class="scene"><p class="q">${esc(c.q)}</p>${o?`<div class="say yes"><i>A stronger answer</i>${esc(c.yes)}</div><div class="say no"><i>A weaker answer</i>${esc(c.no)}</div><p style="color:var(--mute)">${esc(c.why)}</p>`:`<button class="btn ghost" onclick="S.open['${k}']=1;render()">Show answers</button>`}</div>`}
function practise(){return `<h1 style="font-size:clamp(2.4rem,12vw,3.6rem)">Practise<br>what to say.</h1><p class="lead">Short moments from work and interviews. Say your answer out loud, then tap to compare.</p><p class="lead" style="font-size:.95rem">Respect your supervisor and keep your dignity. Raise safety problems, unpaid wages and harassment, even when it is uncomfortable.</p>${SCENES.map((_,i)=>sceneHtml(i)).join("")}`}
function track(id){const a=store.get("apps",[]);if(!a.find(x=>x.id===id))a.push({id,date:new Date().toISOString().slice(0,10),i:0});store.set("apps",a);go("apps")}
function adv(id){const a=store.get("apps",[]),x=a.find(x=>x.id===id);if(x&&x.i<3)x.i++;store.set("apps",a);render()}
function drop(id){store.set("apps",store.get("apps",[]).filter(x=>x.id!==id));render()}
function apps(){const a=store.get("apps",[]);return `<h1 style="font-size:clamp(2.4rem,12vw,3.6rem)">My applications</h1>`+(a.length?a.map(x=>{const j=JOBS.find(j=>j.id===x.id);return `<div class="app"><b>${esc(j.title)}</b><div style="color:var(--mute)">${esc(j.employer)}. Applied ${x.date}.</div><div class="bar" aria-hidden="true">${ST.map((_,k)=>`<i class="${k<=x.i?"f":""}"></i>`).join("")}</div><div><b style="font-size:1rem">${ST[x.i]}</b>${x.i===0?'<span style="color:var(--mute)"> Follow up politely after about a week.</span>':""}${x.i===3?'<span style="color:var(--mute)"> Well done. First-week guidance will appear here in a later version.</span>':""}</div><p>${x.i<3?`<button class="btn ghost" onclick="adv('${x.id}')">Mark as ${ST[x.i+1].toLowerCase()}</button> `:""}<button class="link" onclick="drop('${x.id}')">Remove</button></p></div>`}).join(""):`<p class="lead">Nothing here yet. Open a job, work through it, then tap I applied.</p><button class="btn" onclick="go('work')">Find work</button>`)}
function render(){
 $("app").innerHTML=`<div class="top"><span class="brand">${mark}Openway</span><button id="inst" class="link" hidden>Install</button></div>`+(S.job?job():S.tab==="work"?work():S.tab==="practise"?practise():apps());
 $("nav").innerHTML=NAV.map(([k,l])=>`<button ${S.tab===k&&!S.job||(S.job&&k==="work")?'aria-current="page"':""} onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join("");
 if(dp)$("inst").hidden=false;$("inst").onclick=install;
}
let dp=null;
async function install(){if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("inst").hidden=true}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;const b=$("inst");if(b)b.hidden=false});
addEventListener("appinstalled",()=>{dp=null;const b=$("inst");if(b)b.hidden=true});
render();
if("serviceWorker" in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script></body></html>
