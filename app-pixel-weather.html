<style>/* styles.css — Pixel Weather
   Design intent: an instrument, not a dashboard. The canvas atmosphere
   behind everything IS the interface; the UI is quiet, technical,
   monospace-numeric, and gets out of the way. Palette and states are
   taken directly from the product brief (this is a fixed brand, not a
   free design choice), applied through: a warm-white / cool-cyan /
   violet-storm trio, generous negative space, and a single distinct
   moment of motion (the hourly rain bars) rather than scattered
   hover/entrance animation.
*/

:root {
  --base: #0a0a0f;
  --surface: #1a1a2e;
  --surface-2: rgba(26, 26, 46, 0.6);
  --accent-teal: #00d4aa;
  --accent-violet: #7b2fff;
  --white: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.62);
  --text-faint: rgba(255, 255, 255, 0.38);
  --hairline: rgba(255, 255, 255, 0.1);
  --error: #ff6b6b;

  --font-display: "Inter", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--base);
  color: var(--white);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#atmosphereCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}

.app-shell {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---------- Dev / offline / error banners ---------- */

.dev-banner {
  position: relative;
  z-index: 5;
  background: var(--accent-violet);
  color: var(--white);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-align: center;
  padding: 6px 10px;
}

.error-banner {
  margin: 0 20px;
  padding: 10px 14px;
  border-radius: 4px;
  background: rgba(255, 107, 107, 0.12);
  border: 1px solid rgba(255, 107, 107, 0.35);
  color: #ffb4b4;
  font-size: 0.85rem;
}

/* ---------- Top bar ---------- */

.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 16px 8px;
}

.brand {
  flex: 1;
  min-width: 0;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-name {
  font-size: 0.68rem;
  letter-spacing: 0.22em;
  color: var(--text-faint);
  font-weight: 600;
}

.location-name {
  font-size: 0.95rem;
  color: var(--white);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-actions {
  display: flex;
  gap: 4px;
}

.icon-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  color: var(--white);
  border-radius: 50%;
  cursor: pointer;
}
.icon-button:hover { background: rgba(255, 255, 255, 0.08); }
.icon-button:focus-visible,
button:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent-teal);
  outline-offset: 2px;
}

/* ---------- Current conditions ---------- */

#mainContent {
  flex: 1;
  padding: 0 20px 48px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

.current-block {
  text-align: center;
  padding: 36px 0 20px;
}

.pixel-state {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  letter-spacing: 0.32em;
  color: var(--accent-teal);
  font-weight: 600;
  margin-bottom: 8px;
}

.current-temp {
  font-size: clamp(4.2rem, 18vw, 6.5rem);
  font-weight: 200;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.summary-line {
  margin: 6px auto 0;
  max-width: 34ch;
  color: var(--text-dim);
  font-size: 0.95rem;
  line-height: 1.5;
}

.status-line {
  margin-top: 18px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--text-faint);
}
.status-line[data-tone="stale"] { color: #f5c56b; }
.status-line[data-tone="error"] { color: var(--error); }

/* ---------- Metrics row ---------- */

.metrics-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 18px 4px;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 28px;
}

.metric {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.metric-label {
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  text-transform: uppercase;
}

.metric-value {
  font-family: var(--font-mono);
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}

/* ---------- Panels ---------- */

.panel { margin-bottom: 30px; }

.panel-title {
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  color: var(--text-faint);
  font-weight: 600;
  margin: 0 0 14px;
}

/* Hourly timeline — the "instrument" moment */

.hourly-track {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
}

.hour-col {
  flex: 0 0 auto;
  width: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.hour-time {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-faint);
}

.hour-rain-bar {
  width: 6px;
  height: 60px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.08);
  position: relative;
  overflow: hidden;
}
.hour-rain-bar::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--pct, 0%);
  background: linear-gradient(180deg, var(--accent-teal), var(--accent-violet));
  transition: height 0.4s ease;
}

.hour-temp {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
}

.hour-state {
  font-size: 0.58rem;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  text-align: center;
}

/* Decision windows ("CALLS") */

.decision-windows {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--hairline);
}

.decision-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 2px;
  border-bottom: 1px solid var(--hairline);
  gap: 16px;
}

.decision-label {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  flex: 0 0 auto;
}

.decision-value {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  text-align: right;
}

/* Daily forecast */

.daily-list {
  display: flex;
  flex-direction: column;
}

.daily-row {
  display: grid;
  grid-template-columns: 3.2rem 1fr auto 2.6rem;
  align-items: center;
  gap: 12px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.85rem;
}

.daily-day {
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--text-dim);
}

.daily-state {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  color: var(--accent-teal);
}

.daily-temps {
  font-variant-numeric: tabular-nums;
}

.daily-rain {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  text-align: right;
}

/* ---------- Footer ---------- */

.app-footer {
  text-align: center;
  padding-top: 20px;
  color: var(--text-faint);
  font-size: 0.7rem;
  line-height: 1.7;
}

/* ---------- Overlays (search / settings) ---------- */

.panel-overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(6, 6, 10, 0.72);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.panel-overlay.open { opacity: 1; pointer-events: auto; }

.panel-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 82vh;
  overflow-y: auto;
  background: var(--surface);
  border-top: 1px solid var(--hairline);
  border-radius: 16px 16px 0 0;
  padding: 18px 20px 28px;
  transform: translateY(12px);
  transition: transform 0.2s ease;
}
.panel-overlay.open .panel-sheet { transform: translateY(0); }

@media (min-width: 640px) {
  .panel-overlay { align-items: center; }
  .panel-sheet { border-radius: 16px; max-height: 70vh; }
}

.panel-sheet-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.panel-sheet-title {
  flex: 1;
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  color: var(--text-faint);
}

#locationInput {
  flex: 1;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  color: var(--white);
  padding: 10px 12px;
  font-size: 0.95rem;
}
#locationInput::placeholder { color: var(--text-faint); }

.use-location-button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--hairline);
  color: var(--accent-teal);
  padding: 12px 4px;
  font-size: 0.88rem;
  cursor: pointer;
}

.search-results {
  list-style: none;
  margin: 0;
  padding: 0;
}

.search-result {
  padding: 12px 4px;
  border-bottom: 1px solid var(--hairline);
  cursor: pointer;
  font-size: 0.9rem;
}
.search-result:hover, .search-result:focus-visible { color: var(--accent-teal); }

.search-empty {
  padding: 16px 4px;
  color: var(--text-faint);
  font-size: 0.85rem;
}

.settings-list { display: flex; flex-direction: column; }

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 2px;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.9rem;
}

.setting-row input[type="checkbox"] {
  width: 40px;
  height: 24px;
  appearance: none;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s ease;
}
.setting-row input[type="checkbox"]::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--white);
  transition: transform 0.15s ease;
}
.setting-row input[type="checkbox"]:checked { background: var(--accent-teal); }
.setting-row input[type="checkbox"]:checked::after { transform: translateX(16px); }

.settings-note {
  margin-top: 16px;
  font-size: 0.72rem;
  color: var(--text-faint);
  line-height: 1.6;
}

/* ---------- Accessibility ---------- */

@media (prefers-reduced-motion: reduce) {
  .panel-overlay, .panel-sheet, .hour-rain-bar::after { transition: none; }
}

@media (prefers-contrast: more) {
  :root { --text-dim: rgba(255,255,255,0.85); --text-faint: rgba(255,255,255,0.6); --hairline: rgba(255,255,255,0.3); }
}

/* ---------- Responsive ---------- */

@media (min-width: 900px) {
  #mainContent { max-width: 760px; }
  .current-temp { font-size: 7rem; }
}
</style>
</head>
<body>

<div id="devBanner" class="dev-banner" hidden role="status"></div>

<canvas id="atmosphereCanvas" aria-hidden="true"></canvas>

<div class="app-shell">

  <header class="top-bar">
    <button id="openSearch" class="icon-button" aria-label="Search for a location" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 105.29 14.03l4.84 4.84 1.41-1.41-4.84-4.84A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
    </button>

    <div class="brand">
      <span class="brand-name">PIXEL WEATHER</span>
      <span id="locationName" class="location-name">—</span>
    </div>

    <div class="top-actions">
      <button id="installButton" class="icon-button" hidden aria-label="Install Pixel Weather">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L12 13.17V3h0zM5 19h14v2H5z"/></svg>
