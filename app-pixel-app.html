<style>/* PixelProTech Pixel App — app.css
   Locked identity: #07070A core, #00D4AA signature teal (purposeful: active / selected / verified), #F1EEFA text. */
:root{
  --bg:#07070A; --accent:#00D4AA; --text:#F1EEFA;
  --s1:#0C0C11; --s2:#12121A; --s3:#1A1A24; --line:#24242F; --line2:#383846;
  --muted:#8E8B9E; --accent-dim:rgba(0,212,170,.13); --warn:#FFB454; --bad:#FF7A7A;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;--accent:var(--accent)}
.logo{width:30px;height:30px;flex:none}.logo.big{width:84px;height:84px;opacity:.9}

#app{display:grid;height:100vh;grid-template-rows:50px minmax(0,1fr) 26px;grid-template-columns:268px minmax(0,1fr) 310px;grid-template-areas:"top top top" "left stage right" "status status status"}
#topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
#left{grid-area:left;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#right{grid-area:right;background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);background-image:radial-gradient(rgba(241,238,250,.07) 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
#statusbar{grid-area:status;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:var(--bg);border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted);min-width:0}
#crumbs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#crumbs b{color:var(--accent);font-weight:600}#crumbs button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;font:inherit}#crumbs button:hover{color:var(--text)}

.brandmark{display:flex;align-items:center;gap:9px;margin-right:6px;flex:none}
.bm-text{display:flex;flex-direction:column;line-height:1.05}.bm-text b{font:700 13px var(--mono);letter-spacing:.14em}.bm-text small{font:9.5px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.projname{width:190px;min-width:90px;background:var(--s2);border:1px solid var(--line);padding:6px 9px;font-weight:600}
.pagesel{max-width:140px;background:var(--s2);border:1px solid var(--line);padding:6px 6px}
.spacer{flex:1}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 10px var(--mono);letter-spacing:.07em;color:var(--muted);padding:4px 7px;border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;background:var(--muted);flex:none}
.pill.ok{color:var(--text)}.pill.ok i{background:var(--accent)}
.pill.warn{color:var(--warn);border-color:rgba(255,180,84,.4)}.pill.warn i{background:var(--warn)}
.pill.bad{color:var(--bad);border-color:rgba(255,122,122,.5)}.pill.bad i{background:var(--bad)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--line2);padding:6px 11px;cursor:pointer;white-space:nowrap;position:relative}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);color:var(--bg)}
.btn.small{padding:4px 9px;font-size:12px}.btn.small .ic{width:15px;height:15px}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.badge{font:700 10px var(--mono);font-style:normal;background:var(--warn);color:var(--bg);padding:1px 5px;margin-left:2px}.badge.ok{background:var(--accent)}.badge.stale{opacity:.55}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--text);flex:none}
.ibtn:hover:not(:disabled){border-color:var(--line2);background:var(--s2);color:var(--accent)}
.ibtn:disabled{opacity:.3;cursor:not-allowed}.ibtn.sm{width:26px;height:26px}.ibtn.sm .ic{width:15px;height:15px}.ibtn.danger:hover{color:var(--bad)}
.tgroup{display:flex;border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line)}
.segb{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;border-right:1px solid var(--line);padding:5px 10px;cursor:pointer;color:var(--muted);font:600 11px var(--mono)}
.segb:last-child{border-right:0}.segb:hover{color:var(--text)}
.segb.on{background:var(--accent-dim);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.only-narrow{display:none}

/* panels */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--muted);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tab:hover{color:var(--text)}.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim)}
.panelbody{overflow:auto;flex:1;min-height:0;padding:10px 10px 28px}
.rhead{padding:11px 12px;border-bottom:1px solid var(--line);flex:none}
.gn{font:700 10px var(--mono);letter-spacing:.14em;color:var(--accent)}
.gh{display:flex;gap:8px;align-items:baseline;margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.grp{border:1px solid var(--line);background:var(--s1);padding:12px;margin-bottom:12px;position:relative}
.grp::before{content:"";position:absolute;left:-1px;top:-1px;width:9px;height:9px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
.sechead{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 2px 7px;display:flex;gap:8px}.sechead:first-child{margin-top:2px}.sechead span{color:var(--accent)}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;padding:8px 9px;background:var(--s2);border:1px solid var(--line);cursor:grab;text-align:left;font-size:12px}
.pitem:hover{border-color:var(--accent)}.pitem .ic{color:var(--text)}
.pitem.block{grid-column:1/-1}
.hintline{font-size:11px;color:var(--muted);margin:8px 2px}

/* layers */
.lrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
.lrow:hover{background:var(--s2)}.lrow.sel{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.lrow .ic{width:15px;height:15px;color:var(--muted)}.lrow.sel .ic{color:var(--accent)}
.lrow .lt{overflow:hidden;text-overflow:ellipsis;font-size:12px}
.twist{width:16px;height:18px;flex:none;padding:0;border:0;background:none;color:var(--muted);cursor:pointer;font:11px var(--mono);line-height:1}.twist:hover{color:var(--accent)}.twspace{width:16px;flex:none}
.lrow.dropb::before,.lrow.dropa::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent)}
.lrow.dropb::before{top:-1px}.lrow.dropa::after{bottom:-1px}.lrow.dropin{outline:2px dashed var(--accent);outline-offset:-2px}
.prow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:var(--s2)}
.prow.on{border-color:var(--accent);background:var(--accent-dim)}.prow small{color:var(--muted);font:10.5px var(--mono);display:block}

/* inspector */
.ihead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;position:sticky;top:-10px;background:var(--s1);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.ititle{display:flex;align-items:center;gap:8px;font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.iacts{display:flex}
.fld{margin-bottom:11px}.fl{display:block;font:600 10.5px var(--mono);letter-spacing:.05em;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.linkw select,.linkw input[type=text],.lkrow input[type=text]{width:100%;background:var(--s2);border:1px solid var(--line2);padding:6px 8px;min-width:0}
.fld textarea{resize:vertical;min-height:62px;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 1px var(--accent)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}.hint.bad{color:var(--bad)}
.ro{padding:6px 8px;border:1px dashed var(--line2);color:var(--muted);font:12px var(--mono)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}.chk input{accent-color:var(--accent);width:15px;height:15px}
.colorrow{display:flex;gap:6px;align-items:center}.colorrow input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line2);background:var(--s2);flex:none}.colorrow input[type=text]{flex:1;min-width:0;font-family:var(--mono)}
.linkw{display:flex;flex-direction:column;gap:6px}.linkslist{display:flex;flex-direction:column;gap:10px}
.lkrow{display:block;border:1px solid var(--line);padding:8px;background:var(--s2)}
.lhead{display:flex;gap:6px;margin-bottom:6px}.ltools{display:flex}
.assetw{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.assetw select{width:100%}
.thumb{max-width:100%;max-height:90px;border:1px solid var(--line2);background:var(--s2)}.thumb.sm{width:38px;height:38px;object-fit:cover}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ainfo{flex:1;min-width:0}.aname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* stage */
#ruler{height:22px;flex:none;position:relative;border-bottom:1px solid var(--line);background:var(--bg);overflow:hidden}
#ruler .rt{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font:9px var(--mono);color:var(--muted);padding-left:3px;line-height:22px}
#ruler .rt.minor{top:14px;border-color:var(--line)}
#frameWrap{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:stretch}
#frameBox{position:relative;height:100%;min-height:420px;width:100%;transition:width .18s ease;background:#fff;box-shadow:0 0 0 1px var(--line2),0 18px 50px rgba(0,0,0,.55)}
#canvas{display:block;width:100%;height:100%;border:0;background:#fff}
.reg{position:absolute;width:14px;height:14px;pointer-events:none;border-color:var(--accent);border-style:solid;border-width:0}
.reg.tl{left:-8px;top:-8px;border-left-width:2px;border-top-width:2px}.reg.tr{right:-8px;top:-8px;border-right-width:2px;border-top-width:2px}
.reg.bl{left:-8px;bottom:-8px;border-left-width:2px;border-bottom-width:2px}.reg.br{right:-8px;bottom:-8px;border-right-width:2px;border-bottom-width:2px}
.empty{position:absolute;inset:22px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);background:var(--bg);z-index:2}
body.has-project .empty{display:none}

/* toasts */
#toasts{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--s3);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:9px 14px;max-width:560px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}

/* dialogs */
dialog{background:var(--s1);color:var(--text);border:1px solid var(--line2);padding:0;max-width:min(980px,94vw);width:min(980px,94vw);max-height:90vh;box-shadow:0 30px 90px rgba(0,0,0,.7);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
dialog.narrow{width:min(520px,94vw)}
dialog::backdrop{background:rgba(3,3,6,.78)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--s1);z-index:3}
.dh h2{margin:0;font:700 13px var(--mono);letter-spacing:.14em;text-transform:uppercase}.dh h2 span{color:var(--accent)}
.db{padding:16px 18px 20px;overflow:auto;max-height:calc(90vh - 56px)}
.dtabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line)}
.dtab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.dtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cat{padding:8px 12px;border:1px solid var(--line2);background:var(--s2);cursor:pointer;font:600 11px var(--mono);letter-spacing:.06em}
.cat.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}.cat[disabled]{opacity:.5;cursor:not-allowed}.cat small{display:block;font-weight:400;color:var(--muted);letter-spacing:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{border:1px solid var(--line2);background:var(--s2);padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.tcard:hover{border-color:var(--accent)}
.tcard .sch{height:150px;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden;padding:8px}
.tcard .sch svg{width:100%;height:100%;display:block}
.tcard .tb{padding:10px 12px}.tcard b{display:block;font-size:13px}.tcard .pitch{color:var(--accent);font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:2px 0 6px}
.tcard p{margin:0 0 5px;font-size:11.5px;color:var(--muted)}
.sch .sn{fill:#2a2a36}.sch .sa{fill:#00D4AA}.sch .sl{fill:#4b4b5c}.sch .sb{fill:#00D4AA}.sch .si{fill:none;stroke:#4b4b5c;stroke-width:.4}.sch .ss{fill:none;stroke:#24242F;stroke-width:.3}.sch .ss2{fill:#14141c;stroke:#24242F;stroke-width:.3}.sch .sc{fill:#12121A;stroke:#383846;stroke-width:.3}
.plist{display:flex;flex-direction:column;gap:8px}
.prec{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);background:var(--s2)}.prec .pi{flex:1;min-width:0}.prec b{display:block}.prec small{color:var(--muted);font:11px var(--mono)}
.drop{border:1px dashed var(--line2);padding:26px;text-align:center;color:var(--muted)}
.pfsum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{font:700 10.5px var(--mono);letter-spacing:.08em;padding:3px 8px;border:1px solid var(--line2);white-space:nowrap}
.chip.PASS{color:var(--accent);border-color:rgba(0,212,170,.5);background:var(--accent-dim)}.chip.ISSUE{color:var(--warn);border-color:rgba(255,180,84,.5);background:rgba(255,180,84,.1)}.chip.NT{color:var(--muted)}
.pcheck{border:1px solid var(--line);margin-bottom:8px;background:var(--s2)}.pch{display:flex;gap:10px;align-items:center;padding:9px 12px}.pch b{flex:1;font-size:12.5px}.pch .id{font:10.5px var(--mono);color:var(--muted)}
.pcov{padding:0 12px 9px;font-size:11px;color:var(--muted)}
.pitems{border-top:1px solid var(--line);padding:6px 12px}
.pit{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:flex-start}.pit:last-child{border-bottom:0}
.pit .ic{color:var(--warn);margin-top:1px}.pit.nt .ic{color:var(--muted)}.pit .tx{flex:1;min-width:0}.pit .act{color:var(--muted);font-size:11.5px}.pit .act::before{content:"Fix: ";color:var(--accent);font-family:var(--mono)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:12px;margin-bottom:12px}.kv dt{color:var(--muted);font-family:var(--mono);font-size:11px}.kv dd{margin:0}
.kv .y{color:var(--accent)}.kv .n{color:var(--warn)}
.bar{height:6px;background:var(--s3);border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--accent)}
.flist{width:100%;border-collapse:collapse;font:12px var(--mono);margin:8px 0 14px}.flist td{padding:3px 6px;border-bottom:1px solid var(--line)}.flist td:last-child{text-align:right;color:var(--muted)}
.note{border-left:3px solid var(--line2);padding:6px 12px;color:var(--muted);font-size:12px;margin:10px 0}.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad);color:var(--text)}.note.ok{border-left-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kbd{font:11px var(--mono);border:1px solid var(--line2);padding:1px 5px;background:var(--s2)}

@media (max-width:1180px){.projname{width:140px}.pagesel{display:none}.btn span,.pills .pill:nth-child(3){display:none}.segb span{display:none}.bm-text small{display:none}}
@media (max-width:980px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "status"}
  #left,#right{position:fixed;top:50px;bottom:26px;z-index:50;width:min(320px,88vw);display:none}
  #left{left:0}#right{right:0}
  #app.show-left #left{display:flex}#app.show-right #right{display:flex}
  .only-narrow{display:inline-flex}.pills{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}

<script>/* PixelProTech Pixel App — components.js
   Component registry: schemas (editable props + style keys), HTML rendering and CSS generation.
   One renderer is shared by the editor canvas and the exporter so the export matches the canvas. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});

  /* ---------- helpers ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = (v) => {
    v = String(v == null ? '' : v).trim();
    return /^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\([\d\s.,%/]+\)|var\(--c-[a-z]+\))$/i.test(v) ? v : '';
  };
  const num = (v) => { if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
  let seq = 0;
  PX.uid = () => 'n' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 5) + (seq++).toString(36);
  PX.esc = esc;

  const BPS = ['base', 'tablet', 'mobile'];
  const BP_MEDIA = { tablet: '(max-width:900px)', mobile: '(max-width:600px)' };
  PX.BPS = BPS;
  PX.BP_WIDTH = { base: 0, tablet: 768, mobile: 375 };

  const FONT_STACKS = {
    system: ['System UI', 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif'],
    humanist: ['Humanist (Gill Sans / Calibri)', '"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif'],
    serif: ['Serif (Georgia)', 'Georgia,"Times New Roman",Times,serif'],
    mono: ['Mono (Consolas / Menlo)', 'ui-monospace,"SF Mono",Consolas,Menlo,"Courier New",monospace'],
    impact: ['Condensed display', '"Arial Narrow","Franklin Gothic Medium",Impact,"Helvetica Neue",Arial,sans-serif'],
  };
  PX.FONT_STACKS = FONT_STACKS;

  /* ---------- link model ----------
     href strings: ''  |  page:<pageId>  |  #anchor  |  https://…  |  mailto:…  |  tel:…            */
  function linkKind(h) {
    h = String(h || '');
    if (!h) return 'none';
    if (h.startsWith('page:')) return 'page';
    if (h.startsWith('#')) return 'anchor';
    if (/^https?:\/\//i.test(h)) return 'url';
    if (/^mailto:/i.test(h)) return 'mail';
    if (/^tel:/i.test(h)) return 'tel';
    return 'invalid';
  }
  PX.linkKind = linkKind;

  function pageFile(project, page) {
    const first = project.pages[0];
    return page === first ? 'index.html' : (page.slug || 'page') + '.html';
  }
  PX.pageFile = pageFile;

  /* Returns the resolved target or null when there is no valid target (export then emits no href at all,
     so a broken link is never disguised as a working "#" link; Pixel Preflight reports it). */
  function resolveHref(h, ctx) {
    const k = linkKind(h);
    if (ctx.edit) return '#';
    if (k === 'page') { const p = ctx.project.pages.find((x) => x.id === h.slice(5)); return p ? pageFile(ctx.project, p) : null; }
    if (k === 'anchor' || k === 'url' || k === 'mail' || k === 'tel') return h;
    return null;
  }
  const hrefAttr = (h, ctx) => { const r = resolveHref(h, ctx); return r == null ? '' : ` href="${esc(r)}"`; };

  /* ---------- style catalogue ---------- */
  const O = (a) => a.map((x) => (Array.isArray(x) ? x : [x, x]));
  const S = {
    bg: { label: 'Background', t: 'color', css: (v) => { v = safeColor(v); return v && `background-color:${v}`; } },
    bgImage: { label: 'Background image', t: 'asset' },
    color: { label: 'Text colour', t: 'color', css: (v) => { v = safeColor(v); return v && `color:${v}`; } },
    font: { label: 'Font', t: 'select', opts: O([['', 'Inherit'], ['head', 'Heading font'], ['body', 'Body font'], ['mono', 'Mono font']]), css: (v) => ['head', 'body', 'mono'].includes(v) && `font-family:var(--f-${v})` },
    fontSize: { label: 'Size (px)', t: 'number', min: 8, max: 220, css: (v) => num(v) != null && `font-size:${num(v)}px` },
    fontWeight: { label: 'Weight', t: 'select', opts: O([['', 'Default'], '400', '500', '600', '700', '800']), css: (v) => /^[1-9]00$/.test(v) && `font-weight:${v}` },
    align: { label: 'Text align', t: 'select', opts: O([['', 'Default'], 'left', 'center', 'right']), css: (v) => ['left', 'center', 'right'].includes(v) && `text-align:${v}` },
    padY: { label: 'Padding top/bottom', t: 'number', min: 0, max: 400, css: (v) => num(v) != null && `padding-top:${num(v)}px;padding-bottom:${num(v)}px` },
    padX: { label: 'Padding left/right', t: 'number', min: 0, max: 400, css: (v) => num(v) != null && `padding-left:${num(v)}px;padding-right:${num(v)}px` },

  PX.EDIT_CSS = `html{scroll-behavior:auto}body{min-height:100vh}
.px-hover{outline:1px dashed rgba(0,212,170,.75);outline-offset:-1px}
.px-inner:empty::before,.px-columns:empty::before,.px-stack:empty::before,.px-card:empty::before{content:'Empty — add components here';display:block;padding:22px;border:1px dashed rgba(0,212,170,.55);color:#8C8A9C;font:12px ui-monospace,Consolas,monospace;text-align:center}

#px-ov b{position:absolute;left:-2px;top:-23px;background:#00D4AA;color:#07070A;font:600 11px/1 ui-monospace,Consolas,monospace;padding:5px 7px;white-space:nowrap;letter-spacing:.04em}
#px-ov.in b{top:2px;left:2px}
#px-drop{position:absolute;pointer-events:none;z-index:99999;display:none;background:#00D4AA;box-shadow:0 0 0 1px #07070A}
#px-drop.box{background:rgba(0,212,170,.12);border:2px dashed #00D4AA;box-shadow:none}
body.px-dragging *{cursor:grabbing !important}`;

  function declsFor(n, bp, d) {
    const st = (n.style && n.style[bp]) || {};
    const own = [], inner = [];
    Object.keys(st).forEach((k) => {
      const def = S[k]; if (!def || !def.css) return;
      const v = st[k]; if (v === '' || v == null) return;
      const c = def.css(v); if (!c) return;
      ((d.inner || []).includes(k) ? inner : own).push(c);
    });
    return { own, inner, st };
  }

  PX.buildCss = function (project, ctx) {
    const t = project.tokens || {};
    const c = t.colors || {};
    const f = t.fonts || {};
    const stack = (k, fb) => (FONT_STACKS[k] || FONT_STACKS[fb])[1];
    let css = `:root{--c-bg:${safeColor(c.bg) || '#ffffff'};--c-surface:${safeColor(c.surface) || '#f5f5f5'};--c-text:${safeColor(c.text) || '#111111'};--c-muted:${safeColor(c.muted) || '#666666'};--c-accent:${safeColor(c.accent) || '#0a7'};--c-accent-text:${safeColor(c.accentText) || '#ffffff'};--c-line:${safeColor(c.line) || '#dddddd'};--f-head:${stack(f.head, 'system')};--f-body:${stack(f.body, 'system')};--f-mono:${stack(f.mono, 'mono')};--radius:${num(t.radius) != null ? num(t.radius) : 8}px;--base-size:${num(t.baseSize) || 16}px}\n` + BASE_CSS + '\n';
    const out = { base: [], tablet: [], mobile: [] };
    const visit = (n) => {
      const d = T[n.type]; if (!d) return;
      BPS.forEach((bp) => {
        const { own, inner, st } = declsFor(n, bp, d);
        const sel = '.n-' + n.id;
        if (bp === 'base' && d.propCss) { const p = d.propCss(n); if (p) own.push(p); }
        if (n.type === 'image' && bp !== 'base' && st.h == null) { /* keep ratio */ }
        if (n.type === 'image' && st.h != null && st.h !== '') own.push('aspect-ratio:auto');
        if (d.blockText && st.align) {
          own.push(st.align === 'center' ? 'margin-left:auto;margin-right:auto' : st.align === 'right' ? 'margin-left:auto;margin-right:0' : 'margin-left:0;margin-right:auto');
        }
        if (d.flex && st.align && !st.alignItems) {
          own.push('align-items:' + ({ left: 'flex-start', center: 'center', right: 'flex-end' }[st.align]));
          out[bp].push(`${sel}>.px-btn,${sel}>.px-link{align-self:${{ left: 'flex-start', center: 'center', right: 'flex-end' }[st.align]}}`);
        }
        if (n.type === 'section' && st.align) {
          const ai = { left: 'flex-start', center: 'center', right: 'flex-end' }[st.align];
          inner.push('align-items:' + ai);
          out[bp].push(`${sel}>.px-inner>.px-btn,${sel}>.px-inner>.px-link{align-self:${ai}}`);
        }
        if (n.type === 'section' && bp === 'base' && n.style.base.bgImage) { /* handled below */ }
        const bgId = st.bgImage;
        if (n.type === 'section' && bgId && ctx && ctx.assetUrl) {
          const u = ctx.assetUrl(bgId);
          if (u) own.push(`background-image:url("${String(u).replace(/"/g, '%22')}");background-size:cover;background-position:center`);
        }
        if (own.length) out[bp].push(`${sel}{${own.join(';')}}`);
        if (inner.length) out[bp].push(`${sel}>.px-inner{${inner.join(';')}}`);
      });
      (n.children || []).forEach(visit);
    };
    (project.pages || []).forEach((p) => (p.nodes || []).forEach(visit));
    css += out.base.join('\n') + '\n';
    ['tablet', 'mobile'].forEach((bp) => { if (out[bp].length) css += `@media ${BP_MEDIA[bp]}{\n${out[bp].join('\n')}\n}\n`; });
    return css;
  };

  /* All asset ids referenced by a node tree (props + style) */
  PX.assetRefs = function (n, acc) {
    acc = acc || [];
    if (n.props) { if (n.props.assetId) acc.push({ id: n.props.assetId, node: n }); if (n.props.logoAsset) acc.push({ id: n.props.logoAsset, node: n }); }
    BPS.forEach((bp) => { const v = n.style && n.style[bp] && n.style[bp].bgImage; if (v) acc.push({ id: v, node: n }); });
    (n.children || []).forEach((c) => PX.assetRefs(c, acc));
    return acc;
  };
  PX.walk = function (nodes, fn, parent, depth) {
    depth = depth || 0;
    (nodes || []).forEach((n) => { fn(n, parent || null, depth); PX.walk(n.children, fn, n, depth + 1); });
  };
  PX.clone = (o) => JSON.parse(JSON.stringify(o));
  PX.cloneTree = function (n) {
    const c = PX.clone(n);
    (function re(x) { x.id = PX.uid(); (x.children || []).forEach(re); })(c);
    return c;
  };
})();
</script>
<script>/* PixelProTech Pixel App — blueprints.js
   Category blueprints: which components a category leans on, layout conventions, and the validation rules
   Pixel Preflight runs for that category. Only categories that have complete, tested templates are "ready". */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});
  const N = PX.N;

  const H = (text, level, style) => N('heading', { text, level }, style);
  const P = (text, variant, style) => N('text', { text, variant }, style);
  const B = (label, href, variant, style) => N('button', { label, href, variant }, style);
  const SEC = (label, style, kids, props) => N('section', Object.assign({ label }, props || {}), style, kids);
  const COLS = (cols, kids, style) => {
    style = style || {};
    const hasBp = ['base', 'tablet', 'mobile'].some((k) => style[k]);
    const st = hasBp ? Object.assign({}, style, { base: Object.assign({ cols }, style.base) }) : { base: Object.assign({ cols }, style) };
    return N('columns', { label: 'Columns' }, st, kids);
  };
  const STACK = (kids, style, label) => N('stack', { label: label || 'Stack' }, style, kids);
  const CARD = (kids, style, label) => N('card', { label: label || 'Card' }, style, kids);
  PX.DSL = { H, P, B, SEC, COLS, STACK, CARD };

  /* Reusable blocks (real subtrees dropped into the page, not pictures) */
  const blocks = [
    { id: 'hero-center', name: 'Hero — centred', build: () => SEC('Hero', { base: { align: 'center', padY: 96 } }, [
      P('Short label', 'eyebrow'), H('A clear promise in one line', 1, { base: { maxW: 820 } }),
      P('Explain who this is for and what happens next in two sentences.', 'lead', { base: { maxW: 640 } }),
      STACK([B('Primary action', '', 'solid'), B('Secondary action', '', 'outline')], { base: { direction: 'row', justify: 'center', gap: 12 } }, 'Buttons')]) },
    { id: 'feature-trio', name: 'Feature trio', build: () => SEC('Features', {}, [
      H('What you get', 2), COLS('3', [1, 2, 3].map((i) => CARD([P('0' + i, 'eyebrow'), H('Feature ' + i, 3), P('One or two sentences describing this feature.')]))),
    ]) },
    { id: 'cta-band', name: 'Call-to-action band', build: () => SEC('Call to action', { base: { align: 'center', padY: 64, bg: '#111111', color: '#ffffff' } }, [
      H('Ready when you are', 2), P('One sentence that makes the next step obvious.', 'body'), B('Get in touch', '', 'solid')]) },
    { id: 'testimonial-pair', name: 'Testimonial pair', build: () => SEC('Testimonials', {}, [
      COLS('2', [CARD([N('quote', { text: 'A short quotation from a customer.', cite: 'Name, role' })]), CARD([N('quote', { text: 'A second short quotation.', cite: 'Name, role' })])])]) },
    { id: 'contact-details', name: 'Contact details', build: () => SEC('Contact', { base: {} }, [
      COLS('2fr 1fr', [STACK([H('Get in touch', 2), P('Tell visitors how and when you reply.')]), CARD([P('Contact', 'eyebrow'), N('link', { text: 'Email us', href: '' }), N('link', { text: 'Call us', href: '' })])])], { anchor: 'contact' }) },
    { id: 'faq-list', name: 'FAQ list', build: () => SEC('FAQ', { base: { maxW: 760 } }, [
      H('Questions people ask', 2), STACK([1, 2, 3].map((i) => CARD([H('Question ' + i, 4), P('Answer ' + i + ' goes here.')])), { base: { gap: 12 } }, 'Questions')]) },
  ];

  const categories = [
    { id: 'business', name: 'Business', status: 'ready',
      summary: 'Service businesses, practices, shops and local operators that need to be found, trusted and contacted.',
      components: ['nav', 'section', 'columns', 'card', 'heading', 'text', 'list', 'button', 'quote', 'footer'],
      conventions: ['Navigation first, contact route reachable from every page', 'One primary call-to-action per screen', 'Content grouped in sections with #anchors for the navigation'],
      rules: ['biz-contact', 'biz-cta', 'biz-nav'], templates: [] },
    { id: 'creative', name: 'Creative', status: 'planned', summary: 'Portfolios, studios, artists and showreels. Planned — no templates built yet.', components: ['image', 'columns', 'quote'], conventions: [], rules: [], templates: [] },
    { id: 'commerce', name: 'Commerce', status: 'planned', summary: 'Catalogues and storefronts. Planned — no templates built yet.', components: ['card', 'image', 'button'], conventions: [], rules: [], templates: [] },
    { id: 'publishing', name: 'Publishing', status: 'planned', summary: 'Blogs, newsletters and documentation. Planned — no templates built yet.', components: ['heading', 'text', 'quote'], conventions: [], rules: [], templates: [] },
    { id: 'personal', name: 'Personal', status: 'planned', summary: 'CVs, personal sites and link pages. Planned — no templates built yet.', components: ['heading', 'text', 'link'], conventions: [], rules: [], templates: [] },
  ];

  PX.Blueprints = {
    categories, blocks,
    get: (id) => categories.find((c) => c.id === id),
  };
})();
</script>
<script>/* PixelProTech Pixel App — templates.js
   Five structurally distinct Business templates. Each differs in page structure, component arrangement,
   content hierarchy and responsive strategy (not just colours). Contact targets are intentionally left empty:
   Pixel Preflight reports them until the real phone/email is entered. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});
  const { H, P, B, SEC, COLS, STACK, CARD } = PX.DSL;
  const N = PX.N;
  const L = (label, href) => ({ label, href });
  const NAV = (brand, links, style) => N('nav', { brand, links, sticky: true }, style);
  const FOOT = (text, links) => N('footer', { text, links: links || [] });
  const LIST = (items, marker) => N('list', { items, marker: marker || 'check' });
  const tokens = (c, f, radius, baseSize) => ({ colors: c, fonts: f, radius, baseSize: baseSize || 16 });
  const page = (id, title, slug, nodes) => ({ id, title, slug, nodes });
  const proj = (name, tpl, tk, pages) => ({ v: 1, name, category: 'business', templateId: tpl, tokens: tk, pages, settings: { lang: 'en', description: '' } });
  const rowCols = (cols, kids, tablet, mobile) => COLS(cols, kids, { tablet: { cols: tablet || cols }, mobile: { cols: mobile || '1' } });

  /* 1 — Field Crew: trades & field services. Split hero + checklist card, 3-up services, 4-step process, dense single page. */
  function fieldCrew() {
    const home = PX.uid();
    const tk = tokens({ bg: '#111315', surface: '#1A1D20', text: '#F2EFE8', muted: '#A39F94', accent: '#F5B301', accentText: '#141414', line: '#2B2F33' }, { head: 'impact', body: 'system', mono: 'mono' }, 4);
    return proj('Field Crew', 'biz-field', tk, [page(home, 'Home', 'home', [
      NAV('Your Trade Co.', [L('Services', '#services'), L('How it works', '#process'), L('Areas', '#area'), L('Get a quote', '#contact')]),
      SEC('Hero', { base: { padY: 96 } }, [
        rowCols('2fr 1fr', [
          STACK([P('Local crew · Add your trade', 'eyebrow'), H('Fast, dependable work on your property.', 1),
            P('Say what you fix, build or install, and how quickly people can expect a response.', 'lead', { base: { maxW: 560 } }),
            STACK([B('Request a quote', '#contact', 'solid'), B('See services', '#services', 'outline')], { base: { direction: 'row', gap: 12 } }, 'Buttons'),
            LIST('Add a qualification or licence you hold\nAdd a service guarantee you can honour\nAdd the areas you cover', 'check')], { base: { gap: 18 } }, 'Hero copy'),
          CARD([P('Before you call', 'eyebrow'), H('Have these ready', 3), LIST('A clear photo of the problem\nThe address of the job\nYour preferred time window', 'number')], {}, 'Checklist'),
        ], '1', '1')], { anchor: 'top' }),
      SEC('Services', { base: { bg: '#1A1D20' } }, [P('What we do', 'eyebrow'), H('Services', 2),
        COLS('3', [1, 2, 3].map((i) => CARD([H('Service ' + i, 3), P('Describe what is included, in plain language.'), LIST('Typical job one\nTypical job two', 'dot')], { base: { bg: '#111315' } })))], { anchor: 'services' }),
      SEC('Process', {}, [H('How a job works', 2),
        COLS('4', ['Request', 'Quote', 'Work', 'Sign-off'].map((s, i) => STACK([P('0' + (i + 1), 'eyebrow'), H(s, 3), P('One sentence on this step.', 'small')])), { tablet: { cols: '2' }, mobile: { cols: '1' } })], { anchor: 'process' }),
      SEC('Service area', { base: { bg: '#1A1D20' } }, [
        rowCols('2fr 1fr', [STACK([H('Where we work', 2), P('List the towns, suburbs or regions you cover and how far you will travel.'), LIST('Area one\nArea two\nArea three', 'dot')]), CARD([P('Hours', 'eyebrow'), LIST('Weekdays: add hours\nSaturday: add hours\nEmergencies: add policy', 'none')], { base: { bg: '#111315' } })], '1')], { anchor: 'area' }),
      SEC('Quote request', { base: { bg: '#F2EFE8', color: '#141414', align: 'center', padY: 72 } }, [
        H('Tell us about the job', 2), P('Give people one way to reach you today.', 'body', { base: { maxW: 520 } }),
        STACK([B('Call us', '', 'solid'), B('Email us', '', 'outline', { base: { color: '#141414' } })], { base: { direction: 'row', justify: 'center', gap: 12 } }, 'Contact buttons')], { anchor: 'contact' }),
      FOOT('Your Trade Co. All rights reserved.', [L('Services', '#services'), L('Areas', '#area')]),
    ])]);
  }

  /* 2 — Authority Brief: consultancy / expert practice. Centred editorial hero, figures band, alternating method rows. */
  function authorityBrief() {
    const home = PX.uid();
    const tk = tokens({ bg: '#F6F3EC', surface: '#FFFFFF', text: '#1B1B1F', muted: '#5E5B55', accent: '#0B5C4B', accentText: '#FFFFFF', line: '#D9D4C7' }, { head: 'serif', body: 'system', mono: 'mono' }, 2, 17);
    const fig = () => STACK([H('00', 2, { base: { fontSize: 56, color: '#0B5C4B' } }), P('Add the figure you can prove', 'small')], { base: { align: 'center', alignItems: 'center', gap: 4 } }, 'Figure');
    return proj('Authority Brief', 'biz-authority', tk, [page(home, 'Home', 'home', [
      N('nav', { brand: 'Your Practice', sticky: false, links: [L('Method', '#method'), L('Contact', '#contact')] }),
      SEC('Hero', { base: { align: 'center', padY: 120, gap: 20 }, mobile: { padY: 64 } }, [
        P('Independent advisory', 'eyebrow'), H('A measured argument for why people should trust you.', 1, { base: { maxW: 820 } }),
        P('Write the problem you solve and the outcome clients get, in two sentences.', 'lead', { base: { maxW: 640 } }), B('Start a conversation', '#contact', 'solid')]),
      SEC('Figures', { base: { bg: '#FFFFFF', padY: 56 } }, [COLS('4', [fig(), fig(), fig(), fig()], { tablet: { cols: '2' }, mobile: { cols: '2', gap: 16 } })]),
      SEC('Method', { base: { gap: 48 } }, [H('How the work runs', 2),
        rowCols('1fr 1fr', [STACK([H('1. Diagnose', 3), P('Describe how you establish the facts before recommending anything.')]), CARD([LIST('What you review\nWhat you ask the client for\nWhat the client receives', 'number')], {}, 'Deliverables')], '1'),
        rowCols('1fr 1fr', [CARD([LIST('How decisions are made\nWho is involved\nHow progress is reported', 'number')], {}, 'Cadence'), STACK([H('2. Advise', 3), P('Describe how recommendations are delivered and defended.')])], '1')], { anchor: 'method' }),
      SEC('Client notes', { base: { bg: '#FFFFFF' } }, [H('In clients’ words', 2), COLS('2', [CARD([N('quote', { text: 'Replace with a real quotation you have permission to use.', cite: 'Client name, role' })]), CARD([N('quote', { text: 'Replace with a second real quotation.', cite: 'Client name, role' })])], { mobile: { cols: '1' } })]),
      SEC('Contact', {}, [rowCols('2fr 1fr', [STACK([H('Begin with a conversation', 2), P('State how long you take to reply and what a first call covers.')]), CARD([P('Reach us', 'eyebrow'), N('link', { text: 'Email', href: '' }), N('link', { text: 'Phone', href: '' })])], '1')], { anchor: 'contact' }),
      FOOT('Your Practice. All rights reserved.'),
    ])]);
  }

  /* 3 — Counter: local storefront. Announcement strip, "today" card, price-row list, find-us pair. */
  function counter() {
    const home = PX.uid();
    const tk = tokens({ bg: '#FFF9F0', surface: '#FFFFFF', text: '#2B1D14', muted: '#7A6656', accent: '#C2410C', accentText: '#FFFFFF', line: '#EBDCC8' }, { head: 'humanist', body: 'humanist', mono: 'mono' }, 14);
    const row = (n) => rowCols('3fr 1fr', [STACK([H('Item or service ' + n, 3), P('A short line describing it.', 'small')], { base: { gap: 2 } }), P('Price', 'body', { base: { align: 'right', fontWeight: '600' }, mobile: { align: 'left' } })], '3fr 1fr', '1');
    return proj('Counter', 'biz-counter', tk, [page(home, 'Home', 'home', [
      SEC('Announcement', { base: { padY: 10, bg: '#C2410C', color: '#FFFFFF', align: 'center' } }, [P('Announce today’s offer, closure or event here', 'small', { base: { color: '#FFFFFF' } })]),
      NAV('Your Shop', [L('Offer', '#offer'), L('Find us', '#find')]),
      SEC('Hero', { base: { padY: 72 } }, [rowCols('3fr 2fr', [
        STACK([H('The place on your street for what you need.', 1), P('Say what you sell and what makes people come back.', 'lead'), B('Find us', '#find', 'solid')], { base: { gap: 18 } }, 'Hero copy'),
        CARD([P('Today', 'eyebrow'), H('Open now?', 3), LIST('Opening hours: add\nAddress: add\nPhone: add', 'none')], { base: { bg: '#FFFFFF' } }, 'Today card')], '1')]),
      SEC('Offer', { base: { gap: 12 } }, [H('What we offer', 2), row(1), N('divider'), row(2), N('divider'), row(3), N('divider'), row(4), N('divider'), row(5)], { anchor: 'offer' }),
      SEC('Find us', { base: { bg: '#FFFFFF' } }, [H('Find us', 2), COLS('2', [CARD([H('Address', 3), P('Street, suburb, city.\nLandmarks that help people find you.'), B('Get directions', '', 'outline')], {}, 'Address'), CARD([H('Opening hours', 3), LIST('Monday–Friday: add\nSaturday: add\nSunday: add', 'none')], {}, 'Hours')], { mobile: { cols: '1' } })], { anchor: 'find' }),
      FOOT('Your Shop. All rights reserved.'),
    ])]);
  }

  /* 4 — Practice: multi-page professional practice (Home / Services / Contact), shared nav + footer. */
  function practice() {
    const pHome = PX.uid(), pServ = PX.uid(), pCont = PX.uid();
    const tk = tokens({ bg: '#FFFFFF', surface: '#F1F5F9', text: '#0F172A', muted: '#475569', accent: '#1D4ED8', accentText: '#FFFFFF', line: '#E2E8F0' }, { head: 'system', body: 'system', mono: 'mono' }, 8);
    const nav = () => NAV('Your Practice', [L('Home', 'page:' + pHome), L('Services', 'page:' + pServ), L('Contact', 'page:' + pCont)]);
    const foot = () => FOOT('Your Practice. All rights reserved.', [L('Services', 'page:' + pServ), L('Contact', 'page:' + pCont)]);
    const service = (n) => rowCols('1fr 2fr', [STACK([P('Service 0' + n, 'eyebrow'), H('Service name', 2)]), STACK([P('Explain what the service is, who it is for and what the client receives.'), LIST('Included item one\nIncluded item two\nIncluded item three', 'check'), B('Enquire about this', 'page:' + pCont, 'outline')], { base: { gap: 16 } })], '1');
    return proj('Practice', 'biz-practice', tk, [
      page(pHome, 'Home', 'home', [nav(),
        SEC('Hero', { base: { bg: '#F1F5F9', padY: 96 } }, [rowCols('3fr 2fr', [STACK([P('Professional practice', 'eyebrow'), H('Plain advice from people who answer the phone.', 1), P('Say who you help and where you work.', 'lead'), B('Our services', 'page:' + pServ, 'solid')], { base: { gap: 18 } }, 'Hero copy'),
          CARD([H('Why clients stay', 3), LIST('Add a reason that you can prove\nAdd a second reason\nAdd a third reason', 'check')], { base: { bg: '#FFFFFF' } }, 'Reasons')], '1')]),
        SEC('Services at a glance', {}, [H('Services at a glance', 2), COLS('3', [1, 2, 3].map((i) => CARD([H('Service ' + i, 3), P('One sentence on what this service solves.'), N('link', { text: 'Learn more', href: 'page:' + pServ })])))]),
        SEC('Next step', { base: { align: 'center', bg: '#0F172A', color: '#FFFFFF', padY: 64 } }, [H('Ready to talk?', 2), B('Contact us', 'page:' + pCont, 'solid')]),

<script>/* PixelProTech Pixel App — engine.js

<script>/* PixelProTech Pixel App — storage.js

   and interrupted-session detection. Browser storage is never assumed to be permanent or unlimited. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});

  let db = null, mode = 'none', initError = null;

  let hb = null;

  function toFile(project, assets) { return JSON.stringify({ format: FORMAT, version: 1, savedAt: new Date().toISOString(), project, assets }); }

  const KEY = 'pixelapp.session';

<script>/* PixelProTech Pixel App — exporter.js
   Generates a real, editor-independent website as a FLAT set of files (HTML pages, site.css, site.js, assets),

(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});
  const esc = PX.esc;

  const SITE_JS = `/* Generated by PixelProTech Pixel App. Marks the current page in the navigation. */
(function () {
  'use strict';
  var file = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.px-nav-links a, .px-brand').forEach(function (a) {
    var h = (a.getAttribute('href') || '').split('#')[0];

    const v = verify(b.files);
    if (!v.ok) return { ok: false, stage: 'verify', errors: v.problems.map((p) => p.message), problems: v.problems, warnings: b.warnings, files: b.files };
    const warnings = b.warnings.slice();

<script>/* PixelProTech Pixel App — preflight.js
   Pixel Preflight: detectable-problem verification before export.
   Each check reports PASS / ISSUE / NOT TESTABLE with an explanation and a corrective action.
   A PASS means only "this specific check found nothing". It is not a claim of accessibility, SEO,
   security or browser compatibility. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});

  const MAX_ASSET = 1.5 * 1024 * 1024, MAX_TOTAL = 8 * 1024 * 1024;
  const TOKEN_KEYS = ['bg', 'surface', 'text', 'muted', 'accent', 'accentText', 'line'];
  const kb = (b) => (b / 1024 >= 1024 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB');

  function nodesOf(project) { const out = []; project.pages.forEach((p) => PX.walk(p.nodes, (n, parent) => out.push({ n, p, parent }))); return out; }
  function links(project) {
    const out = [];
    nodesOf(project).forEach(({ n, p }) => {
      if (n.type === 'button' || n.type === 'link') out.push({ href: n.props.href || '', label: n.props.label || n.props.text || '', n, p, kind: n.type });
      if (n.type === 'nav' || n.type === 'footer') (n.props.links || []).forEach((l) => out.push({ href: l.href || '', label: l.label || '', n, p, kind: n.type + ' link', empty: !(l.label || '').trim() }));
    });

    { id: 'P01', title: 'Required project data', covers: 'Project name, at least one page, page slugs valid and unique, language code, design tokens present.',

        if (!pr.pages || !pr.pages.length) it.push(issue('Project has no pages.', 'Add a page.'));
        if (!/^[a-z]{2,3}(-[A-Za-z0-9]+)*$/.test((pr.settings && pr.settings.lang) || '')) it.push(issue('Site language code is missing or invalid.', 'Set a language such as "en" under Site settings.'));

      run(c) {

        nodesOf(c.project).forEach(({ n, p }) => {
          PX.assetRefs({ props: n.props, style: n.style, children: [] }).forEach((r) => { const a = c.assets[r.id]; if (!a || !a.dataUrl) it.push(issue(`${PX.describe(n)} references an asset that is missing from the project.`, 'Re-upload the image or choose another one.', n, p)); });
          if (n.type === 'image' && !n.props.assetId && !n.props.src) it.push(issue('An image slot is empty.', 'Upload an image or remove the slot.', n, p));
        });
        return it;
      } },
    { id: 'P04', title: 'Internal references', covers: 'Page links point to existing pages; #anchor links point to a section anchor on the same page; anchors are unique.',
      run(c) {
        const it = [];
        links(c.project).forEach((l) => {
          const k = PX.linkKind(l.href);
          if (k === 'page' && !c.project.pages.some((x) => x.id === l.href.slice(5))) it.push(issue(`${l.kind} "${l.label}" links to a page that no longer exists.`, 'Choose an existing page.', l.n, l.p));
          if (k === 'anchor' && !anchorsOf(l.p).includes(l.href.slice(1))) it.push(issue(`${l.kind} "${l.label}" links to ${l.href}, but no section on "${l.p.title}" has that anchor id.`, 'Set the anchor id on the target section or change the link.', l.n, l.p));
        });
        c.project.pages.forEach((p) => { const a = anchorsOf(p); a.forEach((x, i) => { if (a.indexOf(x) !== i) it.push(issue(`Anchor id "${x}" is used more than once on "${p.title}".`, 'Anchor ids must be unique per page.', null, p)); if (!/^[A-Za-z][A-Za-z0-9-]*$/.test(x)) it.push(issue(`Anchor id "${x}" is not a valid id.`, 'Start with a letter; use letters, digits and dashes.', null, p)); }); });
        return it;
      } },
    { id: 'P05', title: 'Navigation & link targets', covers: 'Navigation entries, buttons and links have a label and a syntactically valid target (page, #anchor, http(s) URL, mailto:, tel:). Reachability of external sites is not tested.',
      run(c) {
        const it = [];
        links(c.project).forEach((l) => {
          if (l.empty) it.push(issue(`A ${l.kind} has no label.`, 'Enter a label.', l.n, l.p));
          const k = PX.linkKind(l.href);
          if (k === 'none') it.push(issue(`${l.kind} "${l.label}" has no target.`, 'Choose a page, section, URL, email or phone number.', l.n, l.p));
          else if (k === 'invalid') it.push(issue(`${l.kind} "${l.label}" has an unrecognised target "${l.href}".`, 'Use a page, #anchor, https:// URL, mailto: or tel:.', l.n, l.p));
          else if (k === 'url') { let ok = true; try { const u = new URL(l.href); ok = !!u.hostname && (u.hostname.includes('.') || u.hostname === 'localhost'); } catch (e) { ok = false; } if (!ok) it.push(issue(`${l.kind} "${l.label}" has a malformed URL.`, 'Check the address.', l.n, l.p)); }
          else if (k === 'mail' && !/^mailto:[^@\s]+@[^@\s]+\.[^@\s]+$/i.test(l.href)) it.push(issue(`${l.kind} "${l.label}" has an incomplete email address.`, 'Enter a full address.', l.n, l.p));
          else if (k === 'tel' && !/^tel:\+?[\d\s()-]{5,}$/i.test(l.href)) it.push(issue(`${l.kind} "${l.label}" has an incomplete phone number.`, 'Enter the full number.', l.n, l.p));
        });
        return it;
      } },
    { id: 'P06', title: 'Responsive overflow (375 px and 768 px)', covers: 'Each page is laid out in a real hidden browser frame at phone and tablet widths; reports horizontal overflow. Heights and visual quality are not judged.', async: true,
      async run(c) {
        const it = [];
        for (const p of c.project.pages) {
          const html = PX.Exporter.renderPageInline(c.project, c.assets, p);
          for (const w of [375, 768]) {
            const r = await measure(html, w);
            if (!r.ok) { it.push(nt(`Page "${p.title}" at ${w}px could not be measured: ${r.error}.`, 'Run Preflight in a desktop browser tab.')); continue; }
            if (r.overflow || r.offenders.length) {
              const ids = [...new Set(r.offenders.map((o) => o.id).filter(Boolean))];
              const first = ids[0] ? nodesOf(c.project).find((x) => x.n.id === ids[0]) : null;
              it.push({ kind: 'issue', message: `"${p.title}" overflows horizontally at ${w}px (content ${r.scrollW}px wide in a ${r.vw}px viewport${ids.length ? '; ' + ids.length + ' element(s) extend past the edge' : ''}).`, action: 'Reduce padding, switch columns to 1 at this size, or lower fixed widths for this breakpoint.', nodeId: first ? first.n.id : null, pageId: p.id });
            }
          }
        }
        return it;
      } },
    { id: 'P07', title: 'Oversized local media', covers: `Single image above ${kb(MAX_ASSET)} or total used media above ${kb(MAX_TOTAL)}. Externally hosted images cannot be sized.`,
      run(c) {
        const it = []; const used = new Set(); let ext = 0, total = 0;
        nodesOf(c.project).forEach(({ n }) => { PX.assetRefs({ props: n.props, style: n.style, children: [] }).forEach((r) => used.add(r.id)); if (n.type === 'image' && !n.props.assetId && n.props.src) ext++; });
        used.forEach((id) => { const a = c.assets[id]; if (!a) return; total += a.size || 0; if ((a.size || 0) > MAX_ASSET) it.push(issue(`Image "${a.name}" is ${kb(a.size)}.`, 'Resize or compress it (aim for well under 500 KB for web use).')); });
        if (total > MAX_TOTAL) it.push(issue(`Local media totals ${kb(total)}.`, 'Compress or remove images; large sites load slowly on mobile data.'));
        if (ext) it.push(nt(`${ext} image(s) use an external URL; their size and availability cannot be tested here.`, 'Upload the image to keep the site self-contained.'));
        return it;
      } },
    { id: 'P08', title: 'Required export files', covers: 'A dry-run export contains index.html, site.css, site.js, one HTML file per page and every used asset.',
      run(c) {
        const b = PX.Exporter.build(c.project, c.assets); const it = [];
        if (!b.ok) return b.errors.map((e) => issue('Export generation failed: ' + e, 'Fix the reported problem and run Preflight again.'));
        const names = new Set(b.files.map((f) => f.name));
        ['index.html', 'site.css', 'site.js'].forEach((n) => { if (!names.has(n)) it.push(issue(`Export is missing ${n}.`, 'This is an engine fault; report it.')); });
        c.project.pages.forEach((p, i) => { const fn = i === 0 ? 'index.html' : p.slug + '.html'; if (!names.has(fn)) it.push(issue(`Export has no file for page "${p.title}" (${fn}).`, 'Check the page file name.', null, p)); });
        b.warnings.forEach((w) => it.push(issue(w, 'Re-upload the asset.')));
        return it;
      } },
    { id: 'P09', title: 'Relative asset and page paths', covers: 'In the generated HTML/CSS, every local reference is a bare file name in the same folder (no leading "/", no "../", no backslashes, no file:// or drive paths).',
      run(c) {
        const b = PX.Exporter.build(c.project, c.assets); if (!b.ok) return [nt('Export could not be generated, so paths cannot be inspected.', 'Resolve P08 first.')];
        const it = []; const bad = (u) => /^(\/(?!\/)|\.\.\/|\.\/|[a-z]:\\|file:)/i.test(u) || u.includes('\\') || /localhost|127\.0\.0\.1/.test(u);
        b.files.filter((f) => f.name.endsWith('.html')).forEach((f) => {
          const d = new DOMParser().parseFromString(f.text, 'text/html');
          d.querySelectorAll('[href],[src]').forEach((el) => { const u = el.getAttribute('href') || el.getAttribute('src') || ''; if (u && !/^(https?:|mailto:|tel:|#|data:)/i.test(u) && bad(u)) it.push(issue(`${f.name} contains the non-relative path "${u}".`, 'Use files in the same folder only.')); });
        });
        const css = b.files.find((f) => f.name === 'site.css'); const re = /url\(\s*["']?([^"')]+)["']?\s*\)/g; let m;
        while (css && (m = re.exec(css.text))) if (!/^(data:|https?:)/.test(m[1]) && bad(m[1])) it.push(issue(`site.css contains the non-relative path "${m[1]}".`, 'Use files in the same folder only.'));
        return it;
      } },
    { id: 'P10', title: 'Export completeness', covers: 'Every local reference in the generated site resolves to a file inside the export; no file is empty; in-page anchors exist. External sites are not contacted.',
      run(c) { const b = PX.Exporter.build(c.project, c.assets); if (!b.ok) return [nt('Export could not be generated; completeness cannot be verified.', 'Resolve P08 first.')]; return PX.Exporter.verify(b.files).problems.map((p) => issue(`${p.file}: ${p.message}`, 'Fix the underlying link or asset in the editor.')); } },
    { id: 'P11', title: 'Image alt text present', covers: 'Presence of an alt attribute value on images that have a source. This does not judge whether the text is good, and is not an accessibility audit.',
      run(c) { const it = []; nodesOf(c.project).forEach(({ n, p }) => { if (n.type === 'image' && (n.props.assetId || n.props.src) && !String(n.props.alt || '').trim()) it.push(issue('An image has no alt text.', 'Describe the image, or leave it empty only if it is purely decorative.', n, p)); }); return it; } },
    { id: 'P12', title: 'Category rules — Business', covers: 'Business blueprint: a contact route (tel:, mailto: or a Contact page/anchor), a primary call-to-action button with a target, and navigation on every page.',
      run(c) {
        if (c.project.category !== 'business') return [nt(`No blueprint rules exist yet for category "${c.project.category}".`, 'Only the Business category has rules in this release.')];
        const it = []; const ls = links(c.project);
        const contact = ls.some((l) => { const k = PX.linkKind(l.href); if (k === 'tel') return /\d{5,}/.test(l.href); if (k === 'mail') return /@/.test(l.href); if (k === 'anchor') return /contact/i.test(l.href); if (k === 'page') { const t = c.project.pages.find((x) => x.id === l.href.slice(5)); return !!t && /contact/i.test(t.slug + ' ' + t.title); } return false; });
        if (!contact) it.push(issue('No working contact route found (no complete tel:/mailto: link, and no link to a Contact page or #contact section).', 'Add your phone number or email address to a button or link.'));
        const cta = ls.some((l) => l.kind === 'button' && PX.linkKind(l.href) !== 'none' && PX.linkKind(l.href) !== 'invalid');
        if (!cta) it.push(issue('No button with a target found, so there is no primary call-to-action.', 'Give at least one button a target.'));
        c.project.pages.forEach((p) => { if (!p.nodes.some((n) => n.type === 'nav')) it.push(issue(`Page "${p.title}" has no navigation.`, 'Add a Navigation component.', null, p)); });
        return it;
      } },
  ];

  function stateOf(items) { return items.some((i) => i.kind === 'issue') ? 'ISSUE' : items.some((i) => i.kind === 'nt') ? 'NOT TESTABLE' : 'PASS'; }

  async function run(project, assets, opts) {
    const results = []; const c = { project, assets: assets || {}, opts: opts || {} };
    for (const ch of checks) {
      let items;
      try { items = await ch.run(c); } catch (e) { items = [nt(`The check could not run: ${e && e.message || e}`, 'Report this fault.')]; }
      results.push({ id: ch.id, title: ch.title, covers: ch.covers, state: stateOf(items), items });
    }
    const summary = { pass: 0, issue: 0, nt: 0, issues: 0 };
    results.forEach((r) => { if (r.state === 'PASS') summary.pass++; else if (r.state === 'ISSUE') { summary.issue++; summary.issues += r.items.filter((i) => i.kind === 'issue').length; } else summary.nt++; });
    return { results, summary, at: Date.now(), total: results.length };
  }

  PX.Preflight = { run, checks, measure };
})();
</script>
<script>/* PixelProTech Pixel App — inspector.js
   Small DOM helpers + the property inspector. Every control writes to the engine; the canvas reacts to engine events. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});

  /* ---------- DOM helpers ---------- */
  function el(tag, attrs) {
    const e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach((k) => {
      const v = attrs[k]; if (v == null || v === false) return;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v);
    });
    for (let i = 2; i < arguments.length; i++) { const c = arguments[i]; if (c == null || c === false) continue; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
    return e;
  }
  const icon = (name, cls) => `<svg class="ic ${cls || ''}" aria-hidden="true" focusable="false"><use href="#${name}"/></svg>`;
  function iconBtn(name, label, onclick, cls) { return el('button', { type: 'button', class: 'ibtn ' + (cls || ''), title: label, 'aria-label': label, html: icon(name), onclick }); }
  PX.el = el; PX.icon = icon; PX.iconBtn = iconBtn;

  const E = () => PX.Engine;
  const OR = { origin: 'inspector' };

  function field(label, control, hint) {
    return el('div', { class: 'fld' }, el('label', { class: 'fl', text: label }), control, hint ? el('div', { class: 'hint', text: hint }) : null);
  }
  function group(title, body, num) {
    return el('section', { class: 'grp' }, el('h3', { class: 'gh' }, el('span', { class: 'gn', text: num || '' }), title), body);
  }
  const colorOk = (v) => /^#[0-9a-f]{6}$/i.test(v);

  /* ---------- widgets ---------- */
  function wText(get, set, multi) {
    const i = el(multi ? 'textarea' : 'input', multi ? { rows: 3 } : { type: 'text' });
    i.value = get() == null ? '' : get(); i.addEventListener('input', () => set(i.value)); return i;
  }
  function wSelect(opts, get, set) {
    const s = el('select');
    opts.forEach(([v, l]) => s.appendChild(el('option', { value: v, text: l })));
    s.value = String(get() == null ? '' : get()); if (s.value !== String(get() == null ? '' : get())) s.value = opts[0][0];
    s.addEventListener('change', () => set(s.value)); return s;
  }
  function wBool(get, set, label) {
    const i = el('input', { type: 'checkbox' }); i.checked = !!get(); i.addEventListener('change', () => set(i.checked));
    return el('label', { class: 'chk' }, i, el('span', { text: label || 'Enabled' }));
  }
  function wNumber(get, set, def, inherited) {
    const i = el('input', { type: 'number', inputmode: 'decimal' });
    if (def.min != null) i.min = def.min; if (def.max != null) i.max = def.max;
    const v = get(); i.value = v == null || v === '' ? '' : v; if (inherited != null) i.placeholder = String(inherited); else i.placeholder = 'auto';
    i.addEventListener('input', () => { if (i.value === '') return set(''); const n = Number(i.value); if (Number.isFinite(n)) set(Math.min(def.max != null ? def.max : n, Math.max(def.min != null ? def.min : n, n))); });
    return i;
  }
  function wColor(get, set, inherited) {
    const v = get() || ''; const pick = el('input', { type: 'color', 'aria-label': 'Pick colour' });
    const txt = el('input', { type: 'text', placeholder: inherited || 'inherit', spellcheck: 'false' });
    pick.value = colorOk(v) ? v : (colorOk(inherited || '') ? inherited : '#000000'); txt.value = v;
    pick.addEventListener('input', () => { txt.value = pick.value; set(pick.value); });
    txt.addEventListener('input', () => { const t = txt.value.trim(); if (t === '') return set(''); if (colorOk(t)) { pick.value = t; set(t); } });
    const clr = iconBtn('i-close', 'Clear (inherit)', () => { txt.value = ''; set(''); }, 'sm');
    return el('div', { class: 'colorrow' }, pick, txt, clr);
  }
  function wLink(get, set) {
    const eng = E(); const cur = String(get() || '');
    const kinds = [['none', '— none —'], ['page', 'Page'], ['anchor', 'Section on this page'], ['url', 'Web address'], ['mail', 'Email'], ['tel', 'Phone']];
    let kind = PX.linkKind(cur); if (kind === 'invalid') kind = 'url';
    const wrap = el('div', { class: 'linkw' }); const ksel = el('select', { 'aria-label': 'Target type' });
    kinds.forEach(([v, l]) => ksel.appendChild(el('option', { value: v, text: l }))); ksel.value = kind;
    const body = el('div', { class: 'linkb' });
    function build(k, init) {
      body.innerHTML = '';
      if (k === 'page') {
        const s = el('select', { 'aria-label': 'Page' }); eng.project.pages.forEach((p) => s.appendChild(el('option', { value: 'page:' + p.id, text: p.title || p.slug })));
        s.value = init && init.startsWith('page:') ? init : 'page:' + eng.project.pages[0].id; s.addEventListener('change', () => set(s.value)); body.appendChild(s); if (!init || !init.startsWith('page:')) set(s.value);
      } else if (k === 'anchor') {
        const anchors = []; PX.walk(eng.page().nodes, (n) => { if (n.type === 'section' && n.props.anchor) anchors.push(n.props.anchor); });
        if (!anchors.length) body.appendChild(el('div', { class: 'hint', text: 'No section on this page has an anchor id yet. Select a section and set one.' }));
        const s = el('select', { 'aria-label': 'Section' }); anchors.forEach((a) => s.appendChild(el('option', { value: '#' + a, text: '#' + a })));
        if (init && init.startsWith('#') && !anchors.includes(init.slice(1))) s.appendChild(el('option', { value: init, text: init + ' (missing)' }));
        s.value = init && init.startsWith('#') ? init : (anchors[0] ? '#' + anchors[0] : ''); if (anchors.length) { s.addEventListener('change', () => set(s.value)); if (!init) set(s.value); } body.appendChild(s);
      } else if (k === 'none') { /* nothing */ } else {
        const pre = { url: 'https://', mail: 'mailto:', tel: 'tel:' }[k]; const t = el('input', { type: 'text', placeholder: { url: 'https://example.com', mail: 'name@example.com', tel: '+27 12 345 6789' }[k], spellcheck: 'false' });
        t.value = init && init.toLowerCase().startsWith(pre) ? init.slice(pre.length) : (k === 'url' && init && /^https?:\/\//i.test(init) ? init : '');
        if (k === 'url' && init && /^https?:\/\//i.test(init)) t.value = init;
        t.addEventListener('input', () => { const v = t.value.trim(); set(v === '' ? '' : (k === 'url' ? (/^https?:\/\//i.test(v) ? v : 'https://' + v) : pre + v)); });
        body.appendChild(t);
      }
    }
    build(kind, cur);
    ksel.addEventListener('change', () => { set(''); build(ksel.value, ''); });
    wrap.appendChild(ksel); wrap.appendChild(body); return wrap;
  }
  function wLinks(get, set) {
    const root = el('div', { class: 'linkslist' });
    const draw = () => {
      root.innerHTML = ''; const arr = get().map((x) => Object.assign({}, x));
      arr.forEach((l, i) => {
        const row = el('div', { class: 'lkrow' });
        const lab = el('input', { type: 'text', placeholder: 'Label', value: l.label, 'aria-label': 'Link label' });
        lab.addEventListener('input', () => { const a = get().map((x) => Object.assign({}, x)); a[i].label = lab.value; set(a, true); });
        const tools = el('div', { class: 'ltools' },
          iconBtn('i-up', 'Move up', () => { if (i > 0) { const a = get().slice(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; set(a); draw(); } }, 'sm'),
          iconBtn('i-down', 'Move down', () => { if (i < arr.length - 1) { const a = get().slice(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; set(a); draw(); } }, 'sm'),
          iconBtn('i-trash', 'Remove link', () => { const a = get().slice(); a.splice(i, 1); set(a); draw(); }, 'sm'));
        row.appendChild(el('div', { class: 'lhead' }, lab, tools));
        row.appendChild(wLink(() => (get()[i] || {}).href, (v) => { const a = get().map((x) => Object.assign({}, x)); if (a[i]) { a[i].href = v; set(a, true); } }));
        root.appendChild(row);
      });
      root.appendChild(el('button', { type: 'button', class: 'btn small', html: icon('i-plus') + '<span>Add link</span>', onclick: () => { const a = get().slice(); a.push({ label: 'Link', href: '' }); set(a); draw(); } }));
    };
    draw(); return root;
  }
  function wAsset(get, set, done) {
    const eng = E(); const wrap = el('div', { class: 'assetw' });
    const sel = el('select', { 'aria-label': 'Choose stored image' }); sel.appendChild(el('option', { value: '', text: '— none —' }));
    Object.values(eng.assets).forEach((a) => sel.appendChild(el('option', { value: a.id, text: a.name })));
    sel.value = get() || ''; sel.addEventListener('change', () => { set(sel.value); done && done(); });
    const file = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml,image/avif', class: 'hidden' });
    const msg = el('div', { class: 'hint' });
    file.addEventListener('change', () => PX.uploadImage(file.files[0], msg).then((id) => { if (id) { set(id); done && done(); } }));
    const thumb = get() && eng.assets[get()] ? el('img', { class: 'thumb', src: eng.assets[get()].dataUrl, alt: '' }) : null;
    wrap.appendChild(sel); wrap.appendChild(el('button', { type: 'button', class: 'btn small', html: icon('i-import') + '<span>Upload image…</span>', onclick: () => file.click() }));
    wrap.appendChild(file); if (thumb) wrap.appendChild(thumb); wrap.appendChild(msg); return wrap;
  }

  /* Reads an image file into the project's asset store. Returns asset id or null. */
  PX.uploadImage = function (f, msgEl) {
    return new Promise((res) => {
      const say = (t, bad) => { if (msgEl) { msgEl.textContent = t; msgEl.className = 'hint' + (bad ? ' bad' : ''); } };
      if (!f) return res(null);
      if (!/^image\/(png|jpeg|webp|gif|svg\+xml|avif)$/.test(f.type)) { say('Unsupported file type: ' + (f.type || 'unknown'), true); return res(null); }
      if (f.size > 12 * 1024 * 1024) { say('File is larger than 12 MB — resize it first.', true); return res(null); }
      const r = new FileReader();
      r.onerror = () => { say('Could not read that file.', true); res(null); };
      r.onload = () => { const id = E().addAsset({ name: f.name, mime: f.type, size: f.size, dataUrl: r.result }); say(f.size > 1.5 * 1024 * 1024 ? `Added (${Math.round(f.size / 1024)} KB). Large — Preflight will flag it.` : 'Added.'); res(id); };
      r.readAsDataURL(f);
    });
  };

  /* ---------- node inspector ---------- */
  function nodeView(root, hooks) {
    const eng = E(); const f = eng.find(eng.selectedId); if (!f) return projectView(root, hooks);
    const n = f.node, def = PX.Types[n.type];
    root.appendChild(el('div', { class: 'ihead' },
      el('div', { class: 'ititle', html: icon(def.icon) + '<span>' + PX.esc(def.label) + '</span>' }),
      el('div', { class: 'iacts' },
        f.parent ? iconBtn('i-select', 'Select parent (Esc)', () => eng.select(f.parent.id), 'sm') : null,
        iconBtn('i-up', 'Move up (Alt+↑)', () => eng.moveBy(n.id, -1), 'sm'), iconBtn('i-down', 'Move down (Alt+↓)', () => eng.moveBy(n.id, 1), 'sm'),
        iconBtn('i-copy', 'Duplicate (Ctrl+D)', () => eng.duplicateNode(n.id), 'sm'), iconBtn('i-trash', 'Delete (Del)', () => eng.deleteNode(n.id), 'sm danger'))));
    if (def.fields.length) {
      const body = el('div');
      def.fields.forEach((fd) => {
        const get = () => n.props[fd.k]; const set = (v, noc) => eng.setProp(n.id, fd.k, fd.num ? Number(v) : v, OR);
        let w;

<script>/* PixelProTech Pixel App — canvas.js

<script>/* PixelProTech Pixel App — panels.js
   Left-hand panels: Add (components + reusable blocks), Layers (hierarchy tree with drag reorder), Pages.
   Also renders the selection breadcrumb in the status bar. Every control calls the engine; nothing here holds project state. */
(function () {
  'use strict';
  const PX = (window.PX = window.PX || {});
  const E = () => PX.Engine;
  const el = (...a) => PX.el(...a);

  let host = null, tab = 'add', hooks = {}, queued = false;
  const collapsed = new Set();
  const ORDER = ['Structure', 'Content', 'Site'];

  function init(hostEl, h) {
    host = hostEl; hooks = h || {};
    host.addEventListener('dragover', (e) => { const r = host.getBoundingClientRect(); if (e.clientY < r.top + 36) host.scrollTop -= 14; else if (e.clientY > r.bottom - 36) host.scrollTop += 14; });
  }
  const setTab = (t) => { tab = t; document.querySelectorAll('#left .tab').forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }); render(); };
  const currentTab = () => tab;

  /* ---------- Add ---------- */
  function addView() {
    const root = el('div');
    const groups = {};

      const grid = el('div', { class: 'palette' });

        const def = PX.Types[t];
        const b = el('button', { type: 'button', class: 'pitem', draggable: 'true', title: `Add ${def.label} — click to insert at the selection, or drag onto the page`, html: PX.icon(def.icon) + '<span>' + PX.esc(def.label) + '</span>' });
        b.addEventListener('click', () => { const id = E().insertSmart(t); if (!id && PX.UI) PX.UI.toast(`${def.label} could not be placed here.`, 'warn'); else if (id) PX.Canvas.reveal(id); });
        b.addEventListener('dragstart', (ev) => { PX.Canvas.setDrag({ kind: 'add', type: t }); try { ev.dataTransfer.setData('text/plain', 'px-add:' + t); ev.dataTransfer.effectAllowed = 'copy'; } catch (x) { /* ignore */ } });
        b.addEventListener('dragend', () => PX.Canvas.endDrag());
        grid.appendChild(b);
      });
      root.appendChild(grid);
    });
    root.appendChild(el('div', { class: 'sechead' }, el('span', { text: '▪' }), 'Reusable blocks'));

  /* ---------- Layers ---------- */
  function zoneFor(e, row, node) {

    const type = d.kind === 'move' ? ((E().find(d.id) || {}).node || {}).type : d.type; if (!type) return null;

<script>/* PixelProTech Pixel App — dialogs.js

      el('button', { type: 'button', class: 'btn danger', text: yesLabel || 'Confirm', onclick: () => { h.close(); onYes(); } }),
      el('button', { type: 'button', class: 'btn', text: 'Cancel', onclick: () => h.close() })));

  /* ---------- Projects: New / Saved / Files ---------- */
  function projects(startTab) {
    let tab = startTab || (E().project ? 'saved' : 'new'), cat = 'business';
    const body = el('div'); const h = dialog('Projects', body);
    const draw = async () => {
      body.innerHTML = '';

      });

      const c = PX.Blueprints.get(cat);
      body.appendChild(el('p', { class: 'note', text: c.summary + ' Contact links are left empty on purpose: Pixel Preflight will report them until you enter your real details.' }));
      const grid = el('div', { class: 'tgrid' });

        const card = el('button', { type: 'button', class: 'tcard', 'aria-label': 'Start from ' + t.name, html: '<div class="sch">' + sch + '</div><div class="tb"><b>' + PX.esc(t.name) + '</b><div class="pitch">' + PX.esc(t.pitch) + '</div><p>' + PX.esc(t.structure) + '</p><p><i>Responsive:</i> ' + PX.esc(t.responsive) + '</p></div>' });

    function drawFiles() {

  /* ---------- Preflight ---------- */
  function jumpTo(it, h) {

    if (it.pageId && E().pageId !== it.pageId) E().setPage(it.pageId);

  function renderReport(body, rep, h) {

      el('span', { class: 'chip PASS', text: s.pass + ' PASS' }),
      el('span', { class: 'chip ISSUE', text: s.issue + ' CHECK' + (s.issue === 1 ? '' : 'S') + ' WITH ISSUES (' + s.issues + ' item' + (s.issues === 1 ? '' : 's') + ')' }),

        el('dt', { text: 'Pixel Preflight' }), el('dd', { class: fresh && PX.App.report.rep.summary.issue === 0 ? 'y' : 'n', text: fresh ? (PX.App.report.rep.summary.issue === 0 ? 'No issues found in the last run' : PX.App.report.rep.summary.issues + ' issue item(s) in the last run — review before publishing') : 'Not run on this version of the project' }),
