<meta name="theme-color" content="#0b0f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1f;
    --bg-panel:#131a30;
    --bg-block:#0f1428;
    --line:#3a4266;
    --cyan:#7ee8e0;
    --violet:#b98bfa;
    --text:#f2f5f3;
    --text-dim:#8890b0;
    --paper:#ede3d0;
    --paper-ink:#241d12;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:-1px -1px;
    background-blend-mode:overlay;
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse 900px 600px at 50% -10%, rgba(40,30,70,0.5), transparent 60%);
    pointer-events:none; z-index:0;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}

  header.top{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:18px 24px; border-bottom:1px solid var(--line);
    background:rgba(11,15,31,0.75); backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{width:36px; height:36px; border-radius:9px; display:block;}
  .brand .names{display:flex; flex-direction:column; line-height:1.15;}
  .brand h1{font-size:1.05rem;}
  .brand .sub{font-size:0.7rem; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;}

  main{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:22px 20px 60px;}
  .layout{display:grid; grid-template-columns:220px 1fr; gap:20px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }

  .lesson-rail{display:flex; flex-direction:column; gap:8px;}
  .lesson-tab{
    text-align:left; background:var(--bg-panel); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:3px 10px 3px 3px; position:relative; width:100%;
  }
  .lesson-tab:hover{border-color:var(--cyan);}
  .lesson-tab.active{border-color:var(--violet); box-shadow:0 0 0 1px var(--violet) inset;}
  .lesson-tab .num{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--text-dim); display:block;}
  .lesson-tab .title{font-size:0.86rem; font-weight:600; margin-top:2px; display:block; padding-right:44px;}
  .lesson-tab .status{position:absolute; top:9px; right:10px; font-size:0.6rem; font-family:'IBM Plex Mono',monospace; padding:2px 6px; border-radius:3px;}
  .status.todo{color:var(--text-dim); border:1px solid var(--line);}
  .status.done{color:var(--bg); background:var(--cyan);}

  .workbench{display:flex; flex-direction:column; gap:16px;}
  .brief{background:var(--paper); color:var(--paper-ink); border-radius:4px 14px 4px 4px; padding:16px 18px; box-shadow:0 10px 24px rgba(0,0,0,0.35);}
  .brief .num{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; opacity:0.65;}
  .brief h2{font-size:1.1rem; margin:3px 0 8px;}
  .brief p{font-size:0.88rem; line-height:1.55; margin:0 0 8px;}
  .brief p:last-child{margin-bottom:0;}

  .split{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){ .split{grid-template-columns:1fr;} }

  .editor-panel, .bench-panel{background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column;}
  .panel-label{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--text-dim); margin-bottom:8px;}

  textarea#codeInput{
    width:100%; min-height:220px; resize:vertical; background:var(--bg-block); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:12px; font-family:'IBM Plex Mono', monospace;
    font-size:0.84rem; line-height:1.5; tab-size:2;
  }
  textarea#codeInput:focus{outline:none; border-color:var(--cyan);}

  .run-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  #runBtn{background:var(--violet); border:none; color:#161022; font-weight:700; padding:9px 18px; border-radius:6px; font-size:0.85rem;}
  #runBtn:hover{background:var(--cyan);}
  #resetLessonBtn{background:none; border:1px solid var(--line); color:var(--text-dim); padding:8px 14px; border-radius:6px; font-size:0.78rem;}
  #resetLessonBtn:hover{border-color:var(--violet); color:var(--text);}

  svg.bench{width:100%; height:auto; display:block;}

  #console{
    margin-top:10px; background:var(--bg-block); border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--text-dim);
    min-height:40px; max-height:120px; overflow:auto;
  }
  #console .ok{color:var(--cyan);}
  #console .err{color:var(--violet);}

  .verdict{
    border-radius:8px; padding:12px 14px; font-size:0.86rem; line-height:1.5; border:1px solid var(--line); background:var(--bg-panel);
  }
  .verdict.pass{border-color:var(--cyan);}
  .verdict .tag{display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; padding:2px 7px; border-radius:3px; margin-bottom:6px;}
  .verdict.pass .tag{color:var(--bg); background:var(--cyan);}
  .verdict:not(.pass) .tag{color:var(--text-dim); border:1px solid var(--line);}

  footer.brandfoot{
    max-width:1180px; margin:30px auto 0; padding:16px 20px 0; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--text-dim);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  .reset-btn{background:none; border:1px solid var(--line); color:var(--text-dim); padding:4px 10px; border-radius:4px; font-size:0.68rem; font-family:'IBM Plex Mono', monospace;}
  .reset-btn:hover{border-color:var(--violet); color:var(--text);}
</style>
</head>
<body>

<script>(function(){
  "use strict";

  /* ---------------- Bench state & renderer ---------------- */
  const FREQ_MIN = 80, FREQ_MAX = 110;

  function freshBenchState(){
    return { frequency:null, label:"", signal:null, locked:null, bars:null, stations:null };
  }
  let benchState = freshBenchState();
  let consoleLines = [];

  function freqToAngle(f){
    const clamped = Math.max(FREQ_MIN, Math.min(FREQ_MAX, f));
    const t = (clamped - FREQ_MIN) / (FREQ_MAX - FREQ_MIN);
    return -110 + t * 220; // degrees, -110 (left) to 110 (right)
  }

  function polar(cx, cy, r, angleDeg){
    const a = (angleDeg - 90) * Math.PI/180;
    return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
  }

  function renderBench(){
    const svg = document.getElementById("benchSvg");
    const cx = 240, cy = 150, r = 110;

    // dial arc
    const start = polar(cx,cy,r,-110), end = polar(cx,cy,r,110);
    let dialArc = '<path d="M '+start.x+' '+start.y+' A '+r+' '+r+' 0 1 1 '+end.x+' '+end.y+'" fill="none" stroke="#3a4266" stroke-width="6"/>';

    // station ticks
    let stationMarks = "";
    if(benchState.stations && Array.isArray(benchState.stations)){
      benchState.stations.forEach(f=>{
        if(typeof f !== "number") return;
        const ang = freqToAngle(f);
        const p1 = polar(cx,cy,r-10,ang), p2 = polar(cx,cy,r+8,ang);
        stationMarks += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="#7ee8e0" stroke-width="3"/>';
      });
    }

    // needle
    let needle = "";
    if(typeof benchState.frequency === "number"){
      const ang = freqToAngle(benchState.frequency);
      const tip = polar(cx,cy,r-6,ang);
      needle = '<line x1="'+cx+'" y1="'+cy+'" x2="'+tip.x+'" y2="'+tip.y+'" stroke="#b98bfa" stroke-width="4" stroke-linecap="round"/>'+
               '<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#b98bfa"/>';
    }

    const freqLabel = typeof benchState.frequency === "number" ? benchState.frequency.toFixed(1)+" MHz" : "— MHz";
    const nameLabel = benchState.label || "no signal";

    // lock lamp
    const lampOn = benchState.locked === true;
    const lampFill = lampOn ? "#7ee8e0" : "#232a44";
    const lampGlow = lampOn ? 'filter="drop-shadow(0 0 6px #7ee8e0)"' : "";

    // signal meter (vertical bar, 0-100)
    let meter = "";
    if(typeof benchState.signal === "number"){
      const s = Math.max(0, Math.min(100, benchState.signal));
      const h = (s/100)*90;
      meter = '<rect x="410" y="'+(300-h)+'" width="20" height="'+h+'" rx="3" fill="#7ee8e0"/>';
    }

    // equalizer bars
    let eq = "";
    if(benchState.bars && Array.isArray(benchState.bars)){
      const n = benchState.bars.length;
      const bw = Math.min(22, 360/Math.max(n,1) - 6);
      benchState.bars.forEach((v,i)=>{
        const val = Math.max(0, Math.min(100, Number(v)||0));
        const h = (val/100)*80;
        const x = 60 + i*(bw+6);
        eq += '<rect x="'+x+'" y="'+(400-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="url(#eqGrad)"/>';
      });
    }

    svg.innerHTML =
      '<defs><linearGradient id="eqGrad" x1="0" y1="1" x2="0" y2="0">'+
      '<stop offset="0%" stop-color="#b98bfa"/><stop offset="100%" stop-color="#7ee8e0"/></linearGradient></defs>'+
      dialArc + stationMarks + needle +
      '<text x="240" y="200" text-anchor="middle" fill="#f2f5f3" font-family="IBM Plex Mono, monospace" font-size="18">'+freqLabel+'</text>'+
      '<text x="240" y="222" text-anchor="middle" fill="#8890b0" font-family="IBM Plex Sans, sans-serif" font-size="12">'+nameLabel+'</text>'+
      '<circle cx="60" cy="60" r="12" fill="'+lampFill+'" '+lampGlow+' stroke="#3a4266" stroke-width="2"/>'+
      '<text x="60" y="90" text-anchor="middle" fill="#8890b0" font-family="IBM Plex Mono, monospace" font-size="10">LOCK</text>'+
      '<rect x="405" y="205" width="30" height="95" rx="4" fill="none" stroke="#3a4266" stroke-width="2"/>'+
      meter +
      '<text x="420" y="318" text-anchor="middle" fill="#8890b0" font-family="IBM Plex Mono, monospace" font-size="10">SIG</text>'+
      '<line x1="40" y1="400" x2="440" y2="400" stroke="#3a4266" stroke-width="2"/>'+
      eq;
  }

  function benchAPI(){
    return {
      setFrequency:(f)=>{ benchState.frequency = Number(f); },
      setLabel:(t)=>{ benchState.label = String(t); },
      setSignal:(s)=>{ benchState.signal = Number(s); },
      setLock:(b)=>{ benchState.locked = !!b; },
      drawBars:(arr)=>{ benchState.bars = Array.isArray(arr) ? arr.slice(0,24) : null; },
      setStations:(arr)=>{ benchState.stations = Array.isArray(arr) ? arr.slice(0,16) : null; },
      log:(msg)=>{ consoleLines.push({kind:"ok", text:String(msg)}); }
    };
  }

  /* ---------------- Lessons ---------------- */
  const LESSONS = [
    {
      id:"vars", num:"LESSON 01", title:"Variables & Values",
      brief:"A variable is a labelled box that holds a value. Numbers hold measurements, like a frequency. Strings hold text, like a station name. Set the dial's frequency and label below.",
      starter:
`// The dial reads whatever frequency you give it.
let frequency = 91.8;
let label = "Coastal Static";

bench.setFrequency(frequency);
bench.setLabel(label);
`,
      check:(s)=> typeof s.frequency === "number" && s.frequency >= 60 && s.frequency <= 130 && !!s.label,
      passText:"The needle moved because `frequency` is a number, and the readout below it came from `label`. That's the whole idea of a variable — a name that stands in for a value."
    },
    {
      id:"ops", num:"LESSON 02", title:"Operators & Math",
      brief:"Operators combine values into new ones. A signal strength reading is just peak level minus noise floor. Compute it and send it to the meter.",
      starter:
`let peak = 82;
let noiseFloor = 19;

let strength = peak - noiseFloor;
bench.setSignal(strength);
`,
      check:(s)=> typeof s.signal === "number" && s.signal >= 0 && s.signal <= 100,
      passText:"`strength` didn't exist until you subtracted one variable from another. Every meter, score, or total in a real app is built the same way — values combined with operators."
    },
    {
      id:"cond", num:"LESSON 03", title:"Conditionals",
      brief:"An `if` statement lets code make a decision. The lock lamp should only light up when the dial is close enough to the target frequency — within a small tolerance either way.",
      starter:
`let frequency = 91.8;
let target = 91.8;
let tolerance = 0.3;

bench.setFrequency(frequency);

if (Math.abs(frequency - target) <= tolerance) {
  bench.setLock(true);
} else {
  bench.setLock(false);
}
`,
      check:(s)=> s.locked === true || s.locked === false,
      passText:"`if / else` is how a program picks between two paths. Try changing `frequency` to something further from `target` — the lamp should turn off, because the condition is now false."
    },
    {
      id:"loops", num:"LESSON 04", title:"Loops",
      brief:"A `for` loop repeats an action a set number of times. Build a 12-bar equalizer by pushing one bar height per turn of the loop instead of writing twelve lines by hand.",
      starter:
`let bars = [];

for (let i = 0; i < 12; i++) {
  let height = Math.random() * 100;
  bars.push(height);
}

bench.drawBars(bars);
`,
      check:(s)=> Array.isArray(s.bars) && s.bars.length >= 6,
      passText:"Twelve bars, one loop, one line doing the pushing. Without the loop you'd need to repeat that push line twelve times by hand — this is why loops exist."
    },
    {
      id:"arrays", num:"LESSON 05", title:"Arrays",
      brief:"An array is a single variable holding a list of values in order. Store a small set of known stations, then loop over the list to mark each one on the dial.",
      starter:
`let stations = [88.1, 91.8, 96.4, 102.7];

for (let i = 0; i < stations.length; i++) {
  bench.log("Station found at " + stations[i] + " MHz");
}

bench.setStations(stations);
`,
      check:(s)=> Array.isArray(s.stations) && s.stations.length >= 2,
      passText:"`stations.length` let the loop adapt to however many stations are in the list, without you counting them yourself. Arrays and loops almost always show up together."
    },
    {
      id:"funcs", num:"LESSON 06", title:"Functions — Capstone",
      brief:"A function packages up steps you'll want to repeat. Write `tuneTo`, combining what you've built so far — set the frequency, check it against a target, and light the lamp — then call it.",
      starter:
`function tuneTo(freq, target, tolerance) {
  bench.setFrequency(freq);
  let locked = Math.abs(freq - target) <= tolerance;
  bench.setLock(locked);
  return locked;
}

tuneTo(91.8, 91.8, 0.3);
`,
      check:(s)=> typeof s.frequency === "number" && (s.locked === true || s.locked === false),
      passText:"One function, reused as many times as you like with different numbers. Every lesson so far — variables, math, a condition — is doing real work inside `tuneTo` now."
    }
  ];

  const STORE_KEY = "pixelCodeState_v1";
  let state = loadState();
  let currentIndex = 0;

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) throw 0;
      const parsed = JSON.parse(raw);
      return { completed: new Set(parsed.completed || []), code: parsed.code || {} };
    }catch(e){
      return { completed:new Set(), code:{} };
    }
  }
  function saveState(){
    localStorage.setItem(STORE_KEY, JSON.stringify({ completed:[...state.completed], code:state.code }));
  }

  function currentLesson(){ return LESSONS[currentIndex]; }

  function renderRail(){
    const rail = document.getElementById("lessonRail");
    rail.innerHTML = "";
    LESSONS.forEach((l, i)=>{
      const done = state.completed.has(l.id);
      const btn = document.createElement("button");
      btn.className = "lesson-tab" + (i===currentIndex ? " active" : "");
      btn.innerHTML = '<span class="num">'+l.num+'</span>'+
                      '<span class="title">'+l.title+'</span>'+
                      '<span class="status '+(done?"done":"todo")+'">'+(done?"DONE":"TODO")+'</span>';
      btn.addEventListener("click", ()=>{ currentIndex = i; loadLessonIntoEditor(); renderAll(); });
      rail.appendChild(btn);
    });
  }

  function renderBrief(){
    const l = currentLesson();
    document.getElementById("brief").innerHTML =
      '<span class="num">'+l.num+'</span><h2>'+l.title+'</h2><p>'+l.brief+'</p>';
  }

  function loadLessonIntoEditor(){
    const l = currentLesson();
    const saved = state.code[l.id];
    document.getElementById("codeInput").value = (typeof saved === "string") ? saved : l.starter;
    consoleLines = [];
    benchState = freshBenchState();
    resetVerdict();
    renderConsole();
    renderBench();
  }

  function resetVerdict(){
    document.getElementById("verdict").innerHTML =
      '<span class="tag">NOT RUN YET</span><p style="margin:6px 0 0;">Write your code and hit Run.</p>';
  }

  function renderConsole(){
    const box = document.getElementById("console");
    if(consoleLines.length === 0){
      box.innerHTML = '<span style="opacity:0.5;">Nothing logged yet.</span>';
      return;
    }
    box.innerHTML = consoleLines.map(l=>'<div class="'+l.kind+'">'+escapeHtml(l.text)+'</div>').join("");
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function runCode(){
    const l = currentLesson();
    const code = document.getElementById("codeInput").value;
    state.code[l.id] = code;
    saveState();

    consoleLines = [];
    benchState = freshBenchState();

    try{
      const fn = new Function("bench", code);
      fn(benchAPI());
    }catch(err){
      consoleLines.push({kind:"err", text:(err && err.message) ? err.message : String(err)});
    }
    renderConsole();
    renderBench();

    const passed = (() => {
      try{ return !!l.check(benchState); }catch(e){ return false; }
    })();

    const verdict = document.getElementById("verdict");
    if(passed){
      state.completed.add(l.id);
      saveState();
      verdict.className = "verdict pass";
      verdict.innerHTML = '<span class="tag">LESSON PASSED</span><p style="margin:6px 0 0;">'+l.passText+'</p>';
      renderRail();
    } else {
      verdict.className = "verdict";
      verdict.innerHTML = '<span class="tag">NOT YET</span><p style="margin:6px 0 0;">The bench did not get what this lesson is checking for. Read the brief again and see what the starter code is doing before you change it.</p>';
    }
  }

  function renderAll(){
    renderRail();
    renderBrief();
    renderConsole();
    renderBench();
  }

  document.getElementById("runBtn").addEventListener("click", runCode);
  document.getElementById("resetLessonBtn").addEventListener("click", ()=>{
    const l = currentLesson();
    delete state.code[l.id];
    state.completed.delete(l.id);
    saveState();
    loadLessonIntoEditor();
    renderRail();
  });
  document.getElementById("resetAllBtn").addEventListener("click", ()=>{
    if(confirm("Reset all Pixel Code progress? This can't be undone.")){
      localStorage.removeItem(STORE_KEY);
      state = loadState();
      currentIndex = 0;
      loadLessonIntoEditor();
      renderAll();
    }
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
  }

  loadLessonIntoEditor();
  renderAll();
})();
</script>
</body>
</html>
