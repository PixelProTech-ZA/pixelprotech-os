<style>/* PIXEL WiFi — NETWORK X-RAY
   Design tokens: graphite/black base, gold structural accent, technical green = healthy,
   amber = degraded, red = failed. No gradients-as-decoration; every glow ties to state. */

:root{
  --bg:#0a0c0e;
  --bg-2:#0d1013;
  --surface:#14171a;
  --surface-2:#1a1e22;
  --surface-3:#20252a;
  --border:#272c31;
  --border-soft:#1d2226;

  --gold:#d4af37;
  --gold-soft:#f2e6bb;
  --gold-dim:#8a7331;

  --green:#28d17c;
  --green-dim:#163a29;
  --amber:#e8a33d;
  --amber-dim:#3a2c14;
  --red:#e6483c;
  --red-dim:#3a1815;
  --unknown:#6b7680;
  --unknown-dim:#22262a;

  --text:#f2f1ec;
  --text-dim:#a7adb3;
  --text-faint:#6b7178;

  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;

  --radius: 10px;
  --radius-sm: 6px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(212,175,55,0.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--gold-dim);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

a{color:var(--gold);text-decoration:none;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.hidden{display:none !important;}

/* ---------- Shell ---------- */
#app-shell{display:flex;min-height:100vh;}

#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  background:rgba(10,12,14,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
#topbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
#topbar .brand img{width:30px;height:30px;border-radius:7px;}
#topbar .brand .word{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:0.02em;}
#topbar .brand .word b{color:var(--gold);}
#topbar .brand .sub{font-size:10px;color:var(--text-faint);letter-spacing:0.14em;text-transform:uppercase;margin-top:-2px;}

#topbar .transport-chip{
  margin-left:auto;
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12px;
  padding:6px 12px;border-radius:100px;
  border:1px solid var(--border);
  background:var(--surface);
}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.dot.bad{background:var(--red);box-shadow:0 0 8px var(--red);}
.dot.unk{background:var(--unknown);}

/* ---------- Nav ---------- */
#nav{
  width:220px;flex:none;
  border-right:1px solid var(--border-soft);
  padding:16px 10px;
  position:sticky;top:57px;align-self:flex-start;
  height:calc(100vh - 57px);
  overflow-y:auto;
}
#nav button{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:none;border:none;color:var(--text-dim);
  padding:10px 12px;border-radius:var(--radius-sm);
  font-size:13.5px;cursor:pointer;margin-bottom:2px;
  transition:background .15s, color .15s;
}
#nav button:hover{background:var(--surface);color:var(--text);}
#nav button.active{background:var(--surface-2);color:var(--gold-soft);}
#nav button .ic{width:16px;text-align:center;font-family:var(--mono);color:var(--gold);}
#nav .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-faint);padding:16px 12px 6px;}
#nav .nav-group-label:first-child{padding-top:4px;}

#mobile-nav-toggle{display:none;}

main{flex:1;min-width:0;padding:24px 28px 80px;max-width:1180px;}

/* ---------- Typography ---------- */
h1.page-title{font-family:var(--mono);font-size:22px;margin:0 0 4px;letter-spacing:0.01em;}
p.page-tag{color:var(--text-dim);margin:0 0 24px;font-size:14px;max-width:640px;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block;}
h2.section-title{font-size:17px;margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
h2.section-title:first-child{margin-top:0;}
h3{font-size:14.5px;margin:0 0 6px;}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
}
.card.tight{padding:12px 14px;}
.card.state-good{border-color:rgba(40,209,124,0.35);}
.card.state-warn{border-color:rgba(232,163,61,0.35);}
.card.state-bad{border-color:rgba(230,72,60,0.4);}

.metric-card .label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-faint);}
.metric-card .value{font-family:var(--mono);font-size:26px;margin:6px 0 4px;}
.metric-card .status{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;padding:3px 8px;border-radius:5px;display:inline-block;}
.status.good{color:var(--green);background:var(--green-dim);}
.status.slow,.status.warn{color:var(--amber);background:var(--amber-dim);}
.status.bad,.status.failed{color:var(--red);background:var(--red-dim);}
.status.unknown,.status.na{color:var(--unknown);background:var(--unknown-dim);}
.metric-card{cursor:pointer;transition:transform .12s, border-color .12s;}
.metric-card:hover{transform:translateY(-1px);border-color:var(--gold-dim);}

.btn{
  font-family:var(--mono);font-size:12.5px;
  background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 16px;cursor:pointer;letter-spacing:0.02em;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--gold-dim);background:var(--surface-3);}
.btn.primary{background:var(--gold);color:#161300;border-color:var(--gold);font-weight:600;}
.btn.primary:hover{background:var(--gold-soft);}
.btn.small{padding:6px 11px;font-size:11.5px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}

/* ---------- X-Ray diagram ---------- */
#xray-diagram{display:flex;flex-direction:column;gap:0;max-width:480px;margin:20px auto;}
.xray-node{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;border:1px solid var(--border);background:var(--surface);
  border-radius:var(--radius-sm);cursor:pointer;position:relative;
  transition:border-color .15s;
}
.xray-node:hover{border-color:var(--gold-dim);}
.xray-node .nname{font-family:var(--mono);font-size:13px;flex:1;}
.xray-node .nstate{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:5px;}
.xray-connector{width:2px;height:18px;background:var(--border);margin:0 auto;position:relative;}
.xray-connector.ok{background:linear-gradient(var(--green),var(--border));}
.xray-connector.bad{background:linear-gradient(var(--red),var(--border));}
.xray-connector.warn{background:linear-gradient(var(--amber),var(--border));}

/* ---------- Explanation block ---------- */
.explain-block h4{
  font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--gold);margin:16px 0 6px;
}
.explain-block h4:first-child{margin-top:0;}
.explain-block p{margin:0 0 4px;font-size:14px;line-height:1.55;color:var(--text);}
.explain-block ul{margin:4px 0;padding-left:18px;font-size:14px;color:var(--text-dim);}
.explain-block li{margin-bottom:3px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(6,7,8,0.72);backdrop-filter:blur(3px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 20px;overflow-y:auto;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  max-width:620px;width:100%;padding:24px 26px;position:relative;
}
.modal .close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;font-family:var(--mono);}
.modal .close-x:hover{color:var(--text);}

/* ---------- Timeline ---------- */
#event-timeline{
  font-family:var(--mono);font-size:12.5px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;max-height:280px;overflow-y:auto;
}
.event-line{padding:3px 0;color:var(--text-dim);border-bottom:1px dashed var(--border-soft);}
.event-line:last-child{border-bottom:none;}
.event-line .t{color:var(--text-faint);margin-right:10px;}
.event-line.ev-good{color:var(--green);}
.event-line.ev-warn{color:var(--amber);}
.event-line.ev-bad{color:var(--red);}

/* ---------- Capability panel ---------- */
.cap-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.cap-row:last-child{border-bottom:none;}
.cap-row .cdot{font-size:12px;}
.cap-row .cname{flex:1;}
.cap-row .cnote{color:var(--text-faint);font-size:11.5px;font-family:var(--mono);}

/* ---------- Lab / concept list ---------- */
.concept-list{display:flex;flex-direction:column;gap:8px;}
.concept-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);cursor:pointer;
}
.concept-row:hover{border-color:var(--gold-dim);}
.concept-row .cr-title{font-size:14px;}
.concept-row .cr-arrow{color:var(--gold);font-family:var(--mono);}
.your-value-box{
  margin:12px 0;padding:10px 14px;background:var(--green-dim);border:1px solid rgba(40,209,124,0.3);
  border-radius:var(--radius-sm);font-family:var(--mono);font-size:13px;color:var(--green);
}
.your-value-box.unk{background:var(--unknown-dim);border-color:var(--border);color:var(--text-dim);}

/* ---------- Troubleshoot ---------- */
.problem-btn{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 16px;color:var(--text);font-size:14px;cursor:pointer;margin-bottom:8px;
}
.problem-btn:hover{border-color:var(--gold-dim);}
.flow-step{
  border-left:2px solid var(--border);padding:4px 0 4px 16px;margin-bottom:4px;position:relative;
}
.flow-step::before{content:'';position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
.flow-step .fs-label{font-family:var(--mono);font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;}
.flow-step p{margin:2px 0 10px;font-size:13.5px;color:var(--text-dim);}

/* ---------- Report ---------- */
#report-output{
  font-family:var(--mono);font-size:12px;white-space:pre-wrap;
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;max-height:420px;overflow-y:auto;line-height:1.6;
}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-3);border:1px solid var(--gold-dim);color:var(--gold-soft);
  padding:10px 18px;border-radius:100px;font-family:var(--mono);font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Offline banner ---------- */
#offline-banner{
  display:none;background:var(--amber-dim);color:var(--amber);
  font-family:var(--mono);font-size:12.5px;text-align:center;padding:8px;
  border-bottom:1px solid rgba(232,163,61,0.3);
}
#offline-banner.show{display:block;}

/* ---------- Mode toggle ---------- */
.mode-toggle{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:3px;width:fit-content;}
.mode-toggle button{background:none;border:none;color:var(--text-dim);font-family:var(--mono);font-size:11.5px;padding:6px 13px;border-radius:100px;cursor:pointer;}
.mode-toggle button.active{background:var(--gold);color:#161300;font-weight:600;}

/* ---------- Sparkline ---------- */
svg.spark{display:block;width:100%;height:52px;}

/* ---------- Responsive shell ---------- */
@media (max-width:880px){
  #nav{
    position:fixed;left:0;top:57px;bottom:0;z-index:60;
    background:var(--bg);transform:translateX(-100%);transition:transform .2s;
    width:250px;box-shadow:20px 0 40px rgba(0,0,0,0.4);
  }
  #nav.open{transform:translateX(0);}
  #mobile-nav-toggle{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--gold);cursor:pointer;font-family:var(--mono);
  }
  main{padding:18px 16px 70px;}
  #topbar .brand .sub{display:none;}
}
@media (max-width:520px){
  .metric-card .value{font-size:21px;}
  #topbar .transport-chip span.chip-text{display:none;}
}

footer.company-footer{
  margin-top:60px;padding-top:20px;border-top:1px solid var(--border-soft);
  font-size:11.5px;color:var(--text-faint);font-family:var(--mono);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
footer.company-footer b{color:var(--text-dim);}
</style>
</head>

<script>/* PIXEL WiFi — concept & troubleshooting data
   Every concept entry can optionally bind to a live value key so the education
   screen can show "YOUR CURRENT VALUE" pulled from the diagnostics engine. */

const PIXEL_LABS = [
  {
    id: 'fundamentals',
    name: 'Wi-Fi Fundamentals',
    icon: 'F',
    concepts: [
      {
        id: 'what-is-wifi',
        title: 'What is Wi-Fi?',
        what: 'Wi-Fi is a way for devices to exchange data over radio waves instead of cables, using the IEEE 802.11 family of standards.',
        why: 'It exists so phones, laptops and other devices can reach a network without being physically wired to it.',
        affects: 'Range, speed and reliability all depend on radio conditions rather than a fixed cable, which is why Wi-Fi behaves differently room to room.',
        do: 'Think of Wi-Fi as a shared radio conversation — the more devices and obstacles involved, the more that conversation has to compete for airtime.'
      },
      {
        id: 'access-point',
        title: 'Access Point',
        what: 'An access point (AP) is the device that turns a wired network into a wireless one your devices can join.',
        why: 'It is the "base station" your device is actually talking to over the air — often built into a home router.',
        affects: 'Its placement, antenna design and load (how many devices are connected) directly affect the signal you receive.',
        do: 'If you can see or move the access point, central and elevated placement usually improves coverage.'
      },
      {
        id: 'router-modem',
        title: 'Router vs Modem',
        what: 'A modem connects your home to your Internet Service Provider\'s network. A router directs traffic between your devices and, via the modem, the internet.',
        why: 'Many home devices combine both roles in a single box, which can make the two functions look like one thing.',
        affects: 'Problems can originate in either device — a modem issue looks like "no internet", a router issue can look like "no local network".',
        do: 'When troubleshooting, it helps to know whether your home device is a combined modem-router or two separate boxes.',
        liveKey: null
      },
      {
        id: 'ssid-bssid',
        title: 'SSID & BSSID',
        what: 'The SSID is the network name you pick from a list ("Home-WiFi"). The BSSID is the physical MAC address of the specific radio you connected to.',
        why: 'One SSID can be broadcast by several physical access points (as in mesh systems) — each with its own BSSID.',
        affects: 'If a device seems to "hop" between good and bad performance in the same room, it may be roaming between BSSIDs under one SSID.',
        do: 'BSSID/SSID detail is only exposed to native apps with location permission on most platforms — browsers generally cannot read it.',
        liveKey: 'ssid'
      },
      {
        id: 'client-device',
        title: 'Client / Device',
        what: 'Your phone, laptop or tablet is the "client" — the end of the wireless conversation opposite the access point.',
        why: 'Every client has its own radio hardware, antenna quality and driver, which is why two devices on the same network can perform differently.',
        affects: 'An older device with a weaker antenna will show a worse signal in the same spot than a newer one.',
        do: 'When comparing "my phone is slow but my laptop is fine", account for hardware differences before assuming the network is at fault.'
      },
      {
        id: 'channel',
        title: 'Channel',
        what: 'A channel is a narrow slice of radio frequency that an access point transmits on within a band.',
        why: 'Nearby networks on the same or overlapping channel compete for airtime, which shows up as congestion.',
        affects: 'Crowded channels (common at 2.4 GHz in apartment buildings) increase retries and reduce throughput.',
        do: 'Browsers cannot scan channels — this requires native OS or router-level tools.',
        liveKey: null
      },
      {
        id: 'channel-width',
        title: 'Channel Width',
        what: 'Channel width is how much spectrum a single channel uses — wider channels carry more data per second but are more prone to interference.',
        why: 'Modern Wi-Fi standards can use 20, 40, 80 or 160 MHz-wide channels depending on hardware and band.',
        affects: 'A wide channel in a crowded 2.4 GHz environment can perform worse than a narrower, cleaner one.',
        do: 'This is configured on the access point/router, not the browser — check router admin settings if available.'
      },
      {
        id: 'frequency-24',
        title: '2.4 GHz Band',
        what: 'The original Wi-Fi band. Lower frequency waves travel further and penetrate walls better.',
        why: 'It is also used by many other devices (microwaves, some cordless phones, Bluetooth), which increases interference.',
        affects: 'Expect longer range but a greater chance of congestion, especially in dense housing.',
        do: 'Good default for devices far from the access point or with thick walls in between.'
      },
      {
        id: 'frequency-5',
        title: '5 GHz Band',
        what: 'A higher-frequency band offering more usable channels and generally higher throughput than 2.4 GHz.',

      connectionApi: { available: !!conn, note: conn ? 'Network Information API' : 'not supported by this browser' },
      effectiveType: { available: !!(conn && conn.effectiveType), note: 'connection.effectiveType' },
      downlinkEstimate: { available: !!(conn && typeof conn.downlink === 'number'), note: 'connection.downlink' },
      rttEstimate: { available: !!(conn && typeof conn.rtt === 'number'), note: 'connection.rtt' },
      transportType: { available: !!(conn && conn.type), note: conn && conn.type ? 'connection.type' : 'most browsers withhold this for privacy' },
      saveData: { available: !!(conn && typeof conn.saveData === 'boolean'), note: 'connection.saveData' },
      resourceTiming: { available: typeof performance !== 'undefined' && !!performance.getEntriesByType, note: 'Resource Timing API' },
      serviceWorker: { available: 'serviceWorker' in navigator, note: 'installability / offline caching' },
      indexedDB: { available: 'indexedDB' in window, note: 'local history storage' },
      rssiScan: { available: false, note: 'no browser exposes raw signal strength' },
      channelScan: { available: false, note: 'no browser exposes Wi-Fi channel/BSSID' },
      gatewayPing: { available: false, note: 'browsers cannot send ICMP or address the LAN gateway directly' },
      macAddress: { available: false, note: 'never exposed to web pages, by design' }
    };
  }

  /* ---------- Basic connection state ---------- */
  function getConnectionInfo(){
    const nav = navigator;
    const conn = nav.connection || nav.mozConnection || nav.webkitConnection || null;
    const online = typeof nav.onLine === 'boolean' ? nav.onLine : null;
    let transport = 'UNKNOWN';
    let transportCertain = false;
    if (online === false){
      transport = 'OFFLINE';
      transportCertain = true;
    } else if (conn && conn.type && conn.type !== 'unknown'){
      const map = { wifi:'WI-FI', cellular:'MOBILE DATA', ethernet:'ETHERNET', bluetooth:'BLUETOOTH', wimax:'WIMAX', none:'OFFLINE', other:'OTHER' };
      transport = map[conn.type] || conn.type.toUpperCase();
      transportCertain = true;
    }
    return {
      online,
      transport,
      transportCertain,
      effectiveType: conn && conn.effectiveType ? conn.effectiveType : null,
      downlink: conn && typeof conn.downlink === 'number' ? conn.downlink : null,
      rttHint: conn && typeof conn.rtt === 'number' ? conn.rtt : null,
      saveData: conn && typeof conn.saveData === 'boolean' ? conn.saveData : null
    };
  }

  function watchConnectionChanges(cb){
    window.addEventListener('online', () => cb(getConnectionInfo(), 'online'));
    window.addEventListener('offline', () => cb(getConnectionInfo(), 'offline'));
    const nav = navigator;
    const conn = nav.connection || nav.mozConnection || nav.webkitConnection || null;
    if (conn && conn.addEventListener){
      conn.addEventListener('change', () => cb(getConnectionInfo(), 'change'));
    }
  }

  /* ---------- Timed request primitive ---------- */
  async function timedRequest(url, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 6000);
    const t0 = performance.now();
    try{
      await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
      const t1 = performance.now();
      clearTimeout(timer);
      return { ok: true, ms: Math.round(t1 - t0) };
    } catch(e){
      clearTimeout(timer);
      const t1 = performance.now();
      return { ok: false, ms: Math.round(t1 - t0), error: e.name === 'AbortError' ? 'timeout' : 'network_error' };
    }
  }

  /* ---------- Resource-timing-backed request (for DNS breakdown where exposed) ---------- */
  async function timedRequestWithBreakdown(url, timeoutMs){
    const bustUrl = url + (url.includes('?') ? '&' : '?') + '_px=' + Date.now() + Math.random().toString(36).slice(2);
    const res = await timedRequest(bustUrl, timeoutMs);
    let dnsMs = null, dnsExposed = false;
    try{
      const entries = performance.getEntriesByName(bustUrl);
      if (entries && entries.length){
        const e = entries[entries.length - 1];
        if (e.domainLookupEnd > 0 && e.domainLookupStart >= 0 && (e.domainLookupEnd - e.domainLookupStart) > 0){
          dnsMs = Math.round(e.domainLookupEnd - e.domainLookupStart);
          dnsExposed = true;
        }
      }
    } catch(_e){ /* resource timing may be pruned or unavailable; fall through */ }
    return { ...res, dnsMs, dnsExposed };
  }

  /* ---------- Latency / jitter / loss over N samples ---------- */
  async function runLatencySamples(count, endpoint){
    const url = endpoint || PIXEL_PROBE_ENDPOINTS[0];
    const samples = [];
    for (let i = 0; i < count; i++){
      const r = await timedRequest(url, 5000);
      samples.push(r);
      await new Promise(res => setTimeout(res, 120));
    }
    const okSamples = samples.filter(s => s.ok).map(s => s.ms);
    const lossCount = samples.filter(s => !s.ok).length;
    const lossPct = Math.round((lossCount / samples.length) * 100);
    let avg = null, jitter = null;
    if (okSamples.length){
      avg = Math.round(okSamples.reduce((a,b)=>a+b,0) / okSamples.length);
      if (okSamples.length > 1){
        const diffs = [];
        for (let i = 1; i < okSamples.length; i++) diffs.push(Math.abs(okSamples[i] - okSamples[i-1]));
        jitter = Math.round(diffs.reduce((a,b)=>a+b,0) / diffs.length);
      } else {
        jitter = 0;
      }
    }
    return { samples, avg, jitter, lossPct, sampleCount: samples.length };
  }

  /* ---------- DNS-ish timing ---------- */
  async function runDnsCheck(){
    const results = [];
    for (const url of PIXEL_PROBE_ENDPOINTS.slice(0,2)){
      const r = await timedRequestWithBreakdown(url, 5000);
      results.push({ url, ...r });
    }
    const anyExposed = results.some(r => r.dnsExposed);
    return { results, anyExposed };
  }

  /* ---------- Internet reachability ---------- */
  async function checkInternetReachable(){
    const r = await timedRequest(PIXEL_PROBE_ENDPOINTS[0], 5000);
    return r;
  }

  /* ---------- Public IP (opt-in, explicit call only) ---------- */
  async function getPublicIp(){
    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(PIXEL_IP_ENDPOINT, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) return { available: false, reason: 'lookup service returned an error' };
      const data = await res.json();
      const family = data.ip && data.ip.includes(':') ? 'IPv6' : 'IPv4';
      return { available: true, ip: data.ip, family };
    } catch(e){
      return { available: false, reason: 'lookup request failed or timed out' };
    }
  }

  /* ---------- Full "Find The Problem" sequence ---------- */
  async function runFullAssessment(onProgress){
    const steps = [];
    function report(step){ steps.push(step); if (onProgress) onProgress(step, steps.length); }

    // 1. Interface / online state
    const connInfo = getConnectionInfo();
    report({ id:'interface', label:'Interface', status: connInfo.online === false ? 'failed' : (connInfo.online === true ? 'good' : 'unknown'),
      detail: connInfo.online === null ? 'Browser did not report an online state.' : (connInfo.online ? 'Device reports an active network interface.' : 'Device reports no network connection.') });

    if (connInfo.online === false){
      report({ id:'connection', label:'Connection', status:'failed', detail:'Device is offline — remaining tests skipped.' });
      return { steps, connInfo, aborted:true };
    }

    // 2. Transport
    report({ id:'transport', label:'Active Transport', status: connInfo.transportCertain ? 'good' : 'unknown',
      detail: connInfo.transportCertain ? `Detected as ${connInfo.transport}.` : 'This browser does not expose which transport (Wi-Fi vs mobile data) is active.' });

    // 3. Local network / gateway — honestly not testable
    report({ id:'gateway', label:'Local Gateway', status:'not_testable',
      detail:'Browsers cannot address your router/gateway directly or send ICMP pings. Local-network health is inferred indirectly from whether internet tests below succeed at all.' });

    // 4. DNS
    const dns = await runDnsCheck();
    const dnsOkAny = dns.results.some(r => r.ok);
    const dnsAvgMs = dns.results.filter(r=>r.ok).length ? Math.round(dns.results.filter(r=>r.ok).reduce((a,r)=>a+r.ms,0) / dns.results.filter(r=>r.ok).length) : null;
    report({ id:'dns', label:'DNS', status: !dnsOkAny ? 'failed' : 'good',
      detail: dnsOkAny ? `Lookups completed. ${dns.anyExposed ? 'Isolated DNS timing was available for at least one request.' : 'Isolated DNS timing was not exposed for these endpoints — timing reflects the full request instead.'}` : 'Name-resolution-dependent requests failed.',
      value: dnsAvgMs });

    // 5. Internet reachability
    const reach = await checkInternetReachable();
    report({ id:'internet', label:'Internet Reachability', status: reach.ok ? 'good' : 'failed',
      detail: reach.ok ? `Reached a public endpoint in ${reach.ms} ms.` : 'Could not reach a public endpoint before timing out.' });

    // 6. Latency / jitter / loss
    const lat = await runLatencySamples(6);
    let latStatus = 'unknown';
    if (lat.avg !== null){
      latStatus = lat.avg < 60 ? 'good' : (lat.avg < 150 ? 'good' : (lat.avg < 300 ? 'slow' : 'failed'));
    }
    report({ id:'latency', label:'Latency', status: latStatus, detail: lat.avg !== null ? `Average ${lat.avg} ms across ${lat.sampleCount} samples.` : 'No samples succeeded.', value: lat.avg });
    report({ id:'jitter', label:'Jitter', status: lat.jitter === null ? 'unknown' : (lat.jitter < 20 ? 'good' : (lat.jitter < 60 ? 'slow' : 'failed')),
      detail: lat.jitter !== null ? `Average variation between samples: ${lat.jitter} ms.` : 'Not enough successful samples to compute jitter.', value: lat.jitter });
    report({ id:'loss', label:'Packet Loss (approx.)', status: lat.lossPct === 0 ? 'good' : (lat.lossPct <= 5 ? 'slow' : 'failed'),
      detail: `${lat.lossPct}% of ${lat.sampleCount} timed HTTP requests failed or timed out. This approximates loss — it is not a true ICMP ping test, which browsers cannot perform.`, value: lat.lossPct });

    return { steps, connInfo, dns, reach, lat, aborted:false };
  }

  /* ---------- Desktop Bridge (optional native companion) ----------
     Never assumed present. A short-timeout probe against localhost only —
     if nothing answers, this fails fast and silently and the app carries on
     exactly as it does without the bridge installed. */
  async function checkBridge(){
    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 900);
      const res = await fetch(PIXEL_BRIDGE_URL + '/health', { cache:'no-store', signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) return { available:false };
      const data = await res.json();
      return { available:true, platform: data.platform, version: data.version };
    } catch(e){
      return { available:false };
    }
  }

  async function getBridgeWifiInfo(){
    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      const res = await fetch(PIXEL_BRIDGE_URL + '/wifi-info', { cache:'no-store', signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) return { available:false, reason:'Bridge responded with an error.' };
      return await res.json();
    } catch(e){
      return { available:false, reason:'Bridge did not respond — it may have been closed.' };
    }
  }

  return {
    detectCapabilities,
    getConnectionInfo,
    watchConnectionChanges,
    timedRequest,
    runLatencySamples,
    runDnsCheck,
    checkInternetReachable,
    getPublicIp,
    runFullAssessment,
    checkBridge,
    getBridgeWifiInfo,
    PROBE_ENDPOINTS: PIXEL_PROBE_ENDPOINTS,
    BRIDGE_URL: PIXEL_BRIDGE_URL
  };
})();
</script>
<script>/* PIXEL WiFi — Explanation Engine
   MEASUREMENT -> INTERPRETATION -> STATUS -> EXPLANATION -> POSSIBLE CAUSES -> NEXT ACTION
   Never states a cause as proven — uses MEASURED / SUGGESTS / POSSIBLE / NOT CONFIRMED language. */

const PixelExplain = (function(){

  const LIBRARY = {
    device: {
      title: 'Device',
      what: () => 'This is the device you are currently using to run Pixel WiFi.',
      why: 'Every measurement in this app starts from your device\'s own network stack — its hardware, drivers and browser all shape what can be tested.',
      causes: ['N/A'],
      next: 'Compare results across devices if you suspect a device-specific rather than network-wide issue.'
    },
    interface: {
      title: 'Network Interface',
      what: (v) => v.status === 'failed' ? 'This device currently has no active network interface.' : 'This device has an active network interface.',
      why: 'The interface is the base layer everything else depends on — no interface means no possible connectivity, regardless of Wi-Fi or cellular state above it.',
      causes: ['Airplane mode enabled', 'Wi-Fi/cellular radio turned off', 'Adapter driver issue', 'Hardware switch disabled'],
      next: 'Check that Wi-Fi or mobile data is turned on, and airplane mode is off.'
    },
    transport: {
      title: 'Active Transport',
      what: (v) => v.detail,
      why: 'Knowing whether you are on Wi-Fi, mobile data, or ethernet changes which of the tests below are even meaningful — a mobile-data issue is diagnosed differently from a Wi-Fi issue.',
      causes: ['Browser privacy settings withholding transport type (very common)', 'Multiple interfaces active at once'],
      next: 'If unknown, check your device\'s own network/Wi-Fi settings screen directly — it always knows even when the browser does not say.'
    },
    gateway: {
      title: 'Local Gateway',
      what: () => 'Pixel cannot directly test your router/gateway from a browser tab — this is a genuine browser security boundary, not a missing feature.',
      why: 'Browsers are deliberately sandboxed from sending ICMP pings or addressing arbitrary local-network IPs, to prevent web pages from scanning your home network.',
      causes: ['N/A — this is a platform limitation, not a fault'],
      next: 'If you suspect the gateway itself, check your router\'s own status lights/admin page, or use your OS\'s native network diagnostics.'
    },
    dns: {
      title: 'DNS',
      what: (v) => v.value !== null && v.value !== undefined ? `Name-resolution-dependent requests completed with average timing around ${v.value} ms.` : 'DNS-dependent requests did not complete successfully.',
      why: 'Almost every connection starts with DNS. Slow DNS delays the start of every new site, even when the rest of your network is healthy.',
      causes: ['ISP resolver under load', 'Local router-level resolver issue', 'General network congestion adding to overall request time'],
      next: 'If consistently slow, this is worth comparing against a different DNS resolver at the router/device level.'
    },
    internet: {
      title: 'Internet Reachability',
      what: (v) => v.detail,
      why: 'This confirms whether your device can actually reach the open internet, distinct from just having a local network connection.',
      causes: ['ISP outage', 'Modem/router needing a restart', 'Local network fine but upstream path broken', 'Public test endpoint temporarily unavailable (rare)'],
      next: 'If this fails while your device shows "online", restart your modem/router and re-test before assuming a wider outage.'
    },
    latency: {
      title: 'Latency',
      what: (v) => v.value !== null && v.value !== undefined ? `Measured average round-trip time: ${v.value} ms.` : 'Not enough successful samples to measure.',
      why: 'Latency affects anything interactive — calls, gaming, remote desktop — more than it affects bulk downloads.',
      causes: ['Distance to the remote server', 'Local Wi-Fi conditions', 'Router or ISP congestion', 'Background devices saturating the connection'],
      next: 'Compare this against a local-only measurement where possible to see whether delay is local or upstream.'
    },
    jitter: {
      title: 'Jitter',
      what: (v) => v.value !== null && v.value !== undefined ? `Average variation between consecutive samples: ${v.value} ms.` : 'Not enough successful samples to measure.',
      why: 'Inconsistent timing disrupts real-time audio/video even when average latency looks fine.',
      causes: ['Wi-Fi interference causing intermittent retries', 'Congested link with variable queueing delay', 'Background traffic from other devices'],
      next: 'Watch the Live Event Timeline to see if jitter spikes align with anything else happening on the network.'
    },
    loss: {
      title: 'Packet Loss (approximate)',
      what: (v) => `${v.value ?? 0}% of timed requests failed or timed out during this test.`,
      why: 'Even small loss percentages are very noticeable for real-time audio/video, since retransmission cannot smooth those out the way it can for downloads.',
      causes: ['Weak or unstable Wi-Fi signal', 'Congested channel', 'ISP-side congestion', 'Temporary network blip'],
      next: 'Re-run the test — a one-off spike may be transient. A repeated non-zero result across several runs is more meaningful than a single sample.'
    },
    rssi: {
      title: 'Signal (RSSI)',
      what: (v) => v.available ? `Desktop Bridge reports your current signal as ${v.text}.` : 'Not available — this needs the optional PIXEL WiFi Desktop Bridge running on this machine, since browsers cannot read raw signal strength on their own.',
      why: 'RSSI is the actual radio signal strength your adapter is receiving from the access point, in dBm or as a normalized percentage depending on your OS.',
      causes: ['Distance from the access point', 'Walls/obstacles', 'Antenna position', 'Interference'],
      next: 'If weak, try moving closer to the access point and re-check — the Bridge refreshes this live.'
    },
    ssid: {
      title: 'Network Name (SSID)',
      what: (v) => v.available ? `Desktop Bridge reports you are connected to "${v.text}".` : 'Not available — browsers never expose SSID directly. This needs the optional PIXEL WiFi Desktop Bridge running locally.',
      why: 'The SSID confirms which network your device actually joined, useful when multiple similarly-named networks are nearby.',
      causes: ['N/A'],
      next: 'Install/run the Desktop Bridge (see Capability Detection) if you want this shown without it.'
    },
    effectiveType: {
      title: 'Effective Connection Type',
      what: (v) => v.value ? `The browser classifies this connection as roughly "${v.value}" based on recent timing/throughput.` : 'Not exposed by this browser.',
      why: 'This is the browser\'s own rough estimate, useful as a sanity check but not a precise measurement of your actual link.',
      causes: ['Classification is a heuristic, not a direct measurement — treat it as approximate'],
      next: 'Use the dedicated latency/DNS/internet tests for precise numbers instead of relying on this classification alone.'
    }
  };

  function explain(metricId, valueObj){
    const entry = LIBRARY[metricId];
    if (!entry){
      return { title: metricId, what: 'No explanation registered for this metric.', why: '', causes: [], next: '' };
    }
    return {
      title: entry.title,
      what: typeof entry.what === 'function' ? entry.what(valueObj || {}) : entry.what,
      why: entry.why,
      causes: entry.causes,
      next: entry.next
    };
  }

  return { explain, LIBRARY };
})();
</script>
<script>/* PIXEL WiFi — App Controller */
(function(){

const STORE_HISTORY = 'pixel_history_v1';
const STORE_EVENTS = 'pixel_events_v1';
const MAX_HISTORY = 720;   // ~ enough for a rolling day at typical sample rates
const MAX_EVENTS = 300;

const state = {
  caps: null,
  connInfo: null,
  lastAssessment: null,
  liveValues: { latency:null, jitter:null, loss:null, dns:null, ipFamily:null, ssid:null, rssi:null },
  mode: localStorage.getItem('pixel_mode') || 'live', // live | low | manual
  liveTimer: null,
  bridge: { checked:false, available:false, platform:null },
  bridgeInfo: null, // last /wifi-info payload from the bridge, or null
  history: loadJSON(STORE_HISTORY, []),
  events: loadJSON(STORE_EVENTS, []),
  deferredInstallPrompt: null
};

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(_e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); } catch(_e){ /* storage full or unavailable — fail silently, non-critical */ }
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------------- Event log ---------------- */
function logEvent(text, level){
  const entry = { t: Date.now(), text, level: level || 'info' };
  state.events.push(entry);
  if (state.events.length > MAX_EVENTS) state.events = state.events.slice(-MAX_EVENTS);
  saveJSON(STORE_EVENTS, state.events);
  renderTimelineIfVisible();
}
function pushHistory(sample){
  state.history.push({ t: Date.now(), ...sample });
  if (state.history.length > MAX_HISTORY) state.history = state.history.slice(-MAX_HISTORY);
  saveJSON(STORE_HISTORY, state.history);
}

/* ---------------- Time formatting ---------------- */
function fmtTime(ts){
  const d = new Date(ts);
  return d.toTimeString().slice(0,8);
}

/* ---------------- Status dot helper ---------------- */
function statusClass(status){
  if (status === 'good') return 'ok';
  if (status === 'slow' || status === 'warn') return 'warn';
  if (status === 'failed' || status === 'bad') return 'bad';
  return 'unk';
}
function statusLabel(status){
  const map = { good:'GOOD', slow:'SLOW', warn:'DEGRADED', failed:'FAILED', bad:'FAILED', unknown:'UNKNOWN', not_testable:'NOT TESTABLE', na:'N/A' };
  return map[status] || status.toUpperCase();
}

/* ---------------- Topbar transport chip ---------------- */
function updateTransportChip(){
  const info = PixelDiag.getConnectionInfo();
  state.connInfo = info;
  const chip = document.getElementById('transport-chip');
  const dot = chip.querySelector('.dot');
  const text = chip.querySelector('.chip-text');
  let cls = 'unk';
  if (info.online === false) cls = 'bad';
  else if (info.transportCertain) cls = 'ok';
  dot.className = 'dot ' + cls;
  text.textContent = info.online === false ? 'OFFLINE' : info.transport;
  document.getElementById('offline-banner').classList.toggle('show', info.online === false);
}

/* ---------------- Modal ---------------- */
function openModal(html){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal"><button class="close-x" aria-label="Close">✕</button>${html}</div>`;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.close-x').addEventListener('click', close);
  function close(){ backdrop.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
  return close;
}

function explainModal(metricId, valueObj){
  const ex = PixelExplain.explain(metricId, valueObj || {});
  const causes = (ex.causes || []).map(c => `<li>${c}</li>`).join('');
  openModal(`
    <div class="explain-block">
      <h1 class="page-title" style="font-size:18px;margin-bottom:14px;">${ex.title}</h1>
      <h4>What This Means</h4><p>${ex.what}</p>
      <h4>Why It Matters</h4><p>${ex.why}</p>
      <h4>Possible Causes</h4><ul>${causes || '<li>None listed</li>'}</ul>
      <h4>What To Do Next</h4><p>${ex.next}</p>
    </div>
  `);
}

/* ---------------- Nav / routing ---------------- */
const STATIC_NAV = [
  { group:'Overview', items:[
    { id:'home', label:'Home', ic:'◆' },
    { id:'xray', label:'Network X-Ray', ic:'✕' },
    { id:'find-problem', label:'Find The Problem', ic:'▶' },
    { id:'history', label:'History', ic:'▤' }
  ]},
  { group:'Learn', items:[
    { id:'troubleshoot', label:'Why Is My Wi-Fi Bad?', ic:'?' }
  ]},
  { group:'System', items:[
    { id:'capabilities', label:'Capability Detection', ic:'⚙' },
    { id:'report', label:'Network Report', ic:'▦' },
    { id:'privacy', label:'Privacy', ic:'●' }
  ]}
];

function buildNav(){
  const nav = document.getElementById('nav');
  let html = '';
  STATIC_NAV.forEach(g => {
    if (g.group === 'Learn'){
      // insert labs after this group's own items
    }
    html += `<div class="nav-group-label">${g.group}</div>`;
    g.items.forEach(it => {
      html += `<button data-route="${it.id}"><span class="ic">${it.ic}</span>${it.label}</button>`;
    });
    if (g.group === 'Overview'){
      html += `<div class="nav-group-label">Wi-Fi Lab</div>`;
      PIXEL_LABS.forEach(lab => {
        html += `<button data-route="lab/${lab.id}"><span class="ic">${lab.icon}</span>${lab.name}</button>`;
      });
    }
  });
  nav.innerHTML = html;
  nav.querySelectorAll('button[data-route]').forEach(btn => {
    btn.addEventListener('click', () => { location.hash = '#' + btn.dataset.route; document.getElementById('nav').classList.remove('open'); });
  });
}

function setActiveNav(route){
  document.querySelectorAll('#nav button[data-route]').forEach(b => {
    b.classList.toggle('active', route === b.dataset.route || route.startsWith(b.dataset.route + '/'));
  });
}

/* ---------------- Screens ---------------- */
function screenHome(){
  const info = PixelDiag.getConnectionInfo();
  const v = state.liveValues;
  const bi = state.bridgeInfo;
  const cards = [
    { id:'transport', label:'Active Transport', value: info.online === false ? 'OFFLINE' : info.transport, status: info.online === false ? 'failed' : (info.transportCertain ? 'good' : 'unknown') },
    { id:'effectiveType', label:'Effective Type', value: info.effectiveType ? info.effectiveType.toUpperCase() : 'NOT EXPOSED', status: info.effectiveType ? 'good' : 'unknown' }
  ];
  if (bi && bi.available){
    cards.push({ id:'ssid', label:'Network Name', value: bi.ssid || 'UNKNOWN', status: bi.ssid ? 'good' : 'unknown' });
    const sigVal = bi.signalDbm !== null && bi.signalDbm !== undefined ? bi.signalDbm + ' dBm' : (bi.signalPercent !== null && bi.signalPercent !== undefined ? bi.signalPercent + '%' : '—');
    const sigStatus = bi.signalDbm !== null ? (bi.signalDbm > -60 ? 'good' : (bi.signalDbm > -75 ? 'slow' : 'failed'))
      : (bi.signalPercent !== null ? (bi.signalPercent > 60 ? 'good' : (bi.signalPercent > 30 ? 'slow' : 'failed')) : 'unknown');
    cards.push({ id:'rssi', label:'Signal', value: sigVal, status: sigStatus });
  }
  cards.push(
    { id:'latency', label:'Latency', value: v.latency !== null ? v.latency + ' ms' : '—', status: v.latency === null ? 'unknown' : (v.latency < 150 ? 'good' : (v.latency < 300 ? 'slow' : 'failed')) },
    { id:'jitter', label:'Jitter', value: v.jitter !== null ? v.jitter + ' ms' : '—', status: v.jitter === null ? 'unknown' : (v.jitter < 20 ? 'good' : (v.jitter < 60 ? 'slow' : 'failed')) },
    { id:'loss', label:'Packet Loss (approx.)', value: v.loss !== null ? v.loss + '%' : '—', status: v.loss === null ? 'unknown' : (v.loss === 0 ? 'good' : (v.loss <= 5 ? 'slow' : 'failed')) },
    { id:'dns', label:'DNS', value: v.dns !== null ? v.dns + ' ms' : '—', status: v.dns === null ? 'unknown' : (v.dns < 100 ? 'good' : 'slow') },
    { id:'internet', label:'Internet', value: state.lastAssessment ? (state.lastAssessment.reach.ok ? 'REACHABLE' : 'UNREACHABLE') : '—', status: state.lastAssessment ? (state.lastAssessment.reach.ok ? 'good' : 'failed') : 'unknown' },
    { id:'gateway', label:'Local Gateway', value: 'NOT TESTABLE', status: 'not_testable' }
  );

  const cardHtml = cards.map(c => `
    <div class="card metric-card state-${c.status==='good'?'good':(c.status==='failed'?'bad':(c.status==='slow'?'warn':''))}" data-explain="${c.id}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="status ${c.status === 'not_testable' ? 'unknown' : c.status}">${statusLabel(c.status)}</div>
    </div>`).join('');

  return `
    <span class="eyebrow">Network X-Ray</span>
    <h1 class="page-title">PIXEL WiFi</h1>
    <p class="page-tag">See your connection. Understand your network. Know what to do next.</p>

    <div class="mode-toggle" id="mode-toggle">

      <button data-mode="low">LOW POWER</button>
      <button data-mode="manual">MANUAL</button>
    </div>

    ${bridgeStatusStrip()}

    <div class="grid cols-4" style="margin-top:16px;">${cardHtml}</div>

    <div class="btn-row">
      <button class="btn primary" id="btn-find-problem">FIND THE PROBLEM</button>
      <button class="btn" id="btn-run-sample">RUN A TEST NOW</button>
      <button class="btn" id="btn-open-xray">VIEW NETWORK X-RAY</button>
    </div>

    <h2 class="section-title">Live Event Timeline</h2>
    <div id="event-timeline"></div>

    ${companyFooter()}
  `;
}

async function checkBridgeAndUpdate(announce){
  const wasAvailable = state.bridge.available;
  const result = await PixelDiag.checkBridge();
  state.bridge = { checked:true, available: result.available, platform: result.platform || null };
  if (result.available){
    state.bridgeInfo = await PixelDiag.getBridgeWifiInfo();
    if (!wasAvailable && announce) { logEvent('Desktop Bridge connected — real SSID/signal now available.', 'good'); toast('Desktop Bridge connected.'); }

/* ---------------- Sampling / live mode ---------------- */
function setMode(mode){
  state.mode = mode;
  localStorage.setItem('pixel_mode', mode);
  document.querySelectorAll('#mode-toggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  scheduleLiveLoop();

function scheduleLiveLoop(){
  if (state.liveTimer) clearInterval(state.liveTimer);
  if (state.mode === 'manual') return;
  const interval = state.mode === 'live' ? 20000 : 60000;
  state.liveTimer = setInterval(() => { if (navigator.onLine) runQuickSample(false); }, interval);
}

let lastQuickSample = null;
async function runQuickSample(userInitiated){
  if (!navigator.onLine){
    if (userInitiated) toast('Offline — live network tests unavailable offline.');
    return;
  }
  if (userInitiated) toast('Running test…');
  const lat = await PixelDiag.runLatencySamples(5);
  const dns = await PixelDiag.runDnsCheck();
  const dnsOk = dns.results.filter(r=>r.ok);
  const dnsAvg = dnsOk.length ? Math.round(dnsOk.reduce((a,r)=>a+r.ms,0)/dnsOk.length) : null;

  const prev = lastQuickSample;
  state.liveValues.latency = lat.avg;
  state.liveValues.jitter = lat.jitter;
  state.liveValues.loss = lat.lossPct;
  state.liveValues.dns = dnsAvg;
  pushHistory({ latency: lat.avg, jitter: lat.jitter, loss: lat.lossPct, dns: dnsAvg });

  if (prev){
    if (prev.latency !== null && lat.avg !== null && Math.abs(lat.avg - prev.latency) >= Math.max(40, prev.latency*0.6)){
      logEvent(`Internet latency changed: ${prev.latency} ms → ${lat.avg} ms.`, lat.avg > prev.latency ? 'warn' : 'good');
    }
    if (prev.loss !== lat.lossPct && lat.lossPct > 0){
      logEvent(`Packet loss detected: ${lat.lossPct}%.`, 'warn');
    } else if (prev.loss > 0 && lat.lossPct === 0){
      logEvent('Packet loss returned to 0%.', 'good');
    }
  } else {
    logEvent(`Baseline sample recorded: latency ${lat.avg ?? '—'} ms, loss ${lat.lossPct}%.`, 'info');
  }
  lastQuickSample = { latency: lat.avg, loss: lat.lossPct };
  if (userInitiated) toast('Test complete.');
  if (location.hash === '#home' || location.hash === '' || location.hash === '#'){ renderRoute(); }
}

  }
  const nodes = [

    { id:'interface', label:'NETWORK INTERFACE', status: stateFor('interface'), explain:'interface' },
    { id:'transport', label:'WI-FI / CELLULAR', status: stateFor('transport'), explain:'transport' },

    { id:'dns', label:'DNS', status: stateFor('dns'), explain:'dns' },

async function runFullAssessmentUI(){
  const stepsEl = document.getElementById('assessment-steps');
  const resultEl = document.getElementById('assessment-result');
  resultEl.innerHTML = '';
  stepsEl.innerHTML = '<div class="dim">Starting…</div>';
  if (!navigator.onLine){
    stepsEl.innerHTML = '<div style="color:var(--red)">Device is offline — live network tests unavailable offline.</div>';
    return;
  }
  const lines = [];
  const result = await PixelDiag.runFullAssessment((step) => {
    lines.push(`<div>[<span class="status ${statusClass(step.status)==='ok'?'good':(statusClass(step.status)==='bad'?'failed':(statusClass(step.status)==='warn'?'slow':'unknown'))}" style="margin-right:6px;">${statusLabel(step.status)}</span>] ${step.label} — ${step.detail}</div>`);
    stepsEl.innerHTML = lines.join('');
  });
  state.lastAssessment = result;
  if (result.aborted){
    resultEl.innerHTML = `<h2 class="section-title">Result</h2><div class="card state-bad">Device appears offline. Reconnect and re-run the assessment.</div>`;
    return;
  }
  // sync liveValues from this assessment
  state.liveValues.latency = result.lat.avg;
  state.liveValues.jitter = result.lat.jitter;
  state.liveValues.loss = result.lat.lossPct;
  pushHistory({ latency: result.lat.avg, jitter: result.lat.jitter, loss: result.lat.lossPct, dns: null });

  const findingParts = [];
  const failing = result.steps.filter(s => s.status === 'failed');
  const slow = result.steps.filter(s => s.status === 'slow');
  if (!failing.length && !slow.length){
    findingParts.push('All testable layers currently measure healthy.');
  } else {
    if (failing.length) findingParts.push(`MEASURED failures at: ${failing.map(s=>s.label).join(', ')}.`);
    if (slow.length) findingParts.push(`SUGGESTS degraded performance at: ${slow.map(s=>s.label).join(', ')}.`);
  }
  const nextAction = failing.length ? `Start with ${failing[0].label} — ${LIBRARYNext(failing[0].id)}`
    : (slow.length ? `Start with ${slow[0].label} — ${LIBRARYNext(slow[0].id)}` : 'No action required based on current measurements. Re-run periodically or enable LIVE mode to catch intermittent issues.');

  resultEl.innerHTML = `
    <h2 class="section-title">Pixel Network Assessment</h2>
    <div class="grid cols-3">
      ${result.steps.map(s => `<div class="card tight" data-explain2="${s.id}"><div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;">${s.label}</div><div class="status ${statusClass(s.status)==='ok'?'good':(statusClass(s.status)==='bad'?'failed':(statusClass(s.status)==='warn'?'slow':'unknown'))}" style="margin-top:6px;">${statusLabel(s.status)}</div></div>`).join('')}
    </div>
    <div class="explain-block" style="margin-top:16px;">
      <h4>Finding</h4><p>${findingParts.join(' ')} NOT CONFIRMED beyond what was directly measured.</p>
      <h4>Next Action</h4><p>${nextAction}</p>
    </div>
  `;
  resultEl.querySelectorAll('[data-explain2]').forEach(c => {
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => {
      const step = result.steps.find(s => s.id === c.dataset.explain2);
      explainModal(step.id, { value: step.value, detail: step.detail });
    });
  });
  logEvent(`Find The Problem completed — ${failing.length} failed, ${slow.length} degraded.`, failing.length ? 'bad' : (slow.length ? 'warn' : 'good'));
}
function LIBRARYNext(id){
  const ex = PixelExplain.explain(id, {});
  return ex.next;
}

  lines.push('');
  lines.push('CONNECTION');
  lines.push('  Online: ' + (info.online === null ? 'unknown' : info.online));
  lines.push('  Transport: ' + info.transport + (info.transportCertain ? '' : ' (uncertain — not exposed by this browser)'));
  lines.push('  Effective type: ' + (info.effectiveType || 'not exposed'));
  lines.push('  Downlink estimate: ' + (info.downlink !== null ? info.downlink + ' Mbps (browser estimate)' : 'not exposed'));
  lines.push('  RTT hint: ' + (info.rttHint !== null ? info.rttHint + ' ms (browser estimate)' : 'not exposed'));
  lines.push('');
  lines.push('LAST MEASURED VALUES');
  lines.push('  Latency: ' + (v.latency !== null ? v.latency + ' ms' : 'not measured yet'));
  lines.push('  Jitter: ' + (v.jitter !== null ? v.jitter + ' ms' : 'not measured yet'));
  lines.push('  Packet loss (approx.): ' + (v.loss !== null ? v.loss + '%' : 'not measured yet'));
  lines.push('  DNS timing: ' + (v.dns !== null ? v.dns + ' ms' : 'not measured yet'));
  lines.push('');
  if (a){
    lines.push('LAST FULL ASSESSMENT');
    a.steps.forEach(s => lines.push('  ' + s.label + ': ' + statusLabel(s.status) + ' — ' + s.detail));
    lines.push('');
  }
  lines.push('LIMITATIONS');
  lines.push('  - Raw Wi-Fi signal strength (RSSI), channel, BSSID and SSID are not exposed to web browsers.');
  lines.push('  - The local router/gateway cannot be pinged or addressed directly from a browser tab.');
  lines.push('  - Packet loss is approximated from repeated timed HTTP requests, not true ICMP ping.');
  lines.push('');
  lines.push('This report was generated locally on your device by PIXEL WiFi (PixelProTech Solutions).');
  return lines.join('\n');
}
function screenReport(){
  return `
    <span class="eyebrow">Exportable Summary</span>
    <h1 class="page-title">Pixel Network Report</h1>
    <p class="page-tag">Everything below reflects only what has actually been measured this session. Nothing is sent anywhere unless you choose to share it.</p>
    <div class="btn-row">
      <button class="btn" id="btn-report-refresh">REFRESH</button>
      <button class="btn primary" id="btn-report-copy">COPY REPORT</button>
      <button class="btn" id="btn-report-download">DOWNLOAD .TXT</button>
      <button class="btn" id="btn-report-share">SHARE</button>
    </div>
    <div id="report-output"></div>
    ${companyFooter()}
  `;
}
function bindReportEvents(){
  function refresh(){ document.getElementById('report-output').textContent = buildReportText(); }
  refresh();
  document.getElementById('btn-report-refresh').addEventListener('click', refresh);
  document.getElementById('btn-report-copy').addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(buildReportText()); toast('Report copied.'); }
    catch(_e){ toast('Copy failed — select the text manually.'); }
  });
  document.getElementById('btn-report-download').addEventListener('click', () => {
    const blob = new Blob([buildReportText()], { type:'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pixel-network-report.txt'; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btn-report-share').addEventListener('click', async () => {
    const text = buildReportText();
    if (navigator.share){
      try{ await navigator.share({ title:'Pixel Network Report', text }); }
      catch(_e){ /* user cancelled share sheet — no action needed */ }
    } else {
      toast('Sharing not supported here — use Copy or Download instead.');
    }
  });
}

/* ---------------- Privacy ---------------- */

    <span class="eyebrow">Data Handling</span>

    <div class="explain-block">
      <h4>What Stays Local</h4>

/* ---------------- History ---------------- */
function screenHistory(){
  return `
    <span class="eyebrow">Measured Over Time</span>
    <h1 class="page-title">History</h1>
    <p class="page-tag">Only values Pixel actually measured on this device are shown here — nothing is backfilled or estimated.</p>
    <div class="mode-toggle" id="history-range">
      <button data-range="all" class="active">ALL SAVED</button>
      <button data-range="hour">LAST HOUR</button>
      <button data-range="today">TODAY</button>
    </div>
    <div id="history-charts" style="margin-top:16px;"></div>
    ${companyFooter()}
  `;
}
function sparkSvg(values, color){
  if (!values.length) return `<div class="faint" style="padding:20px 0;">No data points in this range yet.</div>`;
  const w = 600, h = 52, pad = 4;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max - min) || 1;
  const step = values.length > 1 ? (w - pad*2) / (values.length - 1) : 0;
  const pts = values.map((v,i) => {
    const x = pad + i*step;
    const y = h - pad - ((v - min) / range) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}
function bindHistoryEvents(){
  function render(range){
    const now = Date.now();
    let cutoff = 0;
    if (range === 'hour') cutoff = now - 3600*1000;
    if (range === 'today') { const d = new Date(); d.setHours(0,0,0,0); cutoff = d.getTime(); }
    const rows = state.history.filter(h => h.t >= cutoff);
    const el = document.getElementById('history-charts');
    if (!rows.length){
      el.innerHTML = `<div class="card faint">No saved measurements in this range yet. Run a test or leave LIVE mode on for a while.</div>`;
      return;
    }
    const latency = rows.filter(r=>r.latency!==null && r.latency!==undefined).map(r=>r.latency);
    const jitter = rows.filter(r=>r.jitter!==null && r.jitter!==undefined).map(r=>r.jitter);
    const loss = rows.filter(r=>r.loss!==null && r.loss!==undefined).map(r=>r.loss);
    el.innerHTML = `
      <div class="card" style="margin-bottom:12px;"><h3>Latency (ms) — ${rows.length} samples</h3>${sparkSvg(latency, 'var(--gold)')}</div>
      <div class="card" style="margin-bottom:12px;"><h3>Jitter (ms)</h3>${sparkSvg(jitter, 'var(--green)')}</div>
      <div class="card"><h3>Packet Loss (%)</h3>${sparkSvg(loss, 'var(--red)')}</div>
    `;
  }
  document.querySelectorAll('#history-range button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#history-range button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render(b.dataset.range);
    });
  });
  render('all');
}

/* ---------------- Router ---------------- */
function renderRoute(){
  const hash = (location.hash || '#home').slice(1);
  const parts = hash.split('/');
  const route = parts[0] || 'home';
  setActiveNav(route === 'lab' ? 'lab/' + parts[1] : (route === 'troubleshoot' ? 'troubleshoot' : route));
  const main = document.getElementById('main-content');

  if (route === 'home'){ main.innerHTML = screenHome(); bindHomeEvents(); }
  else if (route === 'xray'){ main.innerHTML = screenXray(); bindXrayEvents(); }
  else if (route === 'find-problem'){ main.innerHTML = screenFindProblem(); bindFindProblemEvents(); }
  else if (route === 'history'){ main.innerHTML = screenHistory(); bindHistoryEvents(); }
  else if (route === 'troubleshoot' && parts[1]){ main.innerHTML = screenTroubleshootDetail(parts[1]); bindTroubleshootDetail(); }
  else if (route === 'troubleshoot'){ main.innerHTML = screenTroubleshootList(); bindTroubleshootList(); }
  else if (route === 'lab' && parts[1]){ main.innerHTML = screenLab(parts[1]); bindLabEvents(parts[1]); }
  else if (route === 'capabilities'){ main.innerHTML = screenCapabilities(); bindCapabilitiesEvents(); }
  else if (route === 'report'){ main.innerHTML = screenReport(); bindReportEvents(); }
  else if (route === 'privacy'){ main.innerHTML = screenPrivacy(); }
  else { main.innerHTML = screenHome(); bindHomeEvents(); }

  window.scrollTo(0,0);
}

/* ---------------- Init ---------------- */
function init(){
  buildNav();
  updateTransportChip();
  PixelDiag.watchConnectionChanges((info, kind) => {
    updateTransportChip();
    if (kind === 'online') logEvent('Connection restored.', 'good');
    if (kind === 'offline') logEvent('Device went offline.', 'bad');
    if (kind === 'change') logEvent(`Transport reported as ${info.transport}.`, 'info');
    if (location.hash === '#home' || location.hash === '' || location.hash === '#') renderRoute();
  });
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
  scheduleLiveLoop();
  if (navigator.onLine) runQuickSample(false);
  checkBridgeAndUpdate(true);
  setInterval(() => checkBridgeAndUpdate(true), 30000);

  document.getElementById('brand-home').addEventListener('click', () => { location.hash = '#home'; });
  document.getElementById('mobile-nav-toggle').addEventListener('click', () => document.getElementById('nav').classList.toggle('open'));

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    state.deferredInstallPrompt = e;
    document.getElementById('install-btn').classList.remove('hidden');
  });
  document.getElementById('install-btn').addEventListener('click', async () => {
    if (!state.deferredInstallPrompt) return;
    state.deferredInstallPrompt.prompt();
    await state.deferredInstallPrompt.userChoice;
    state.deferredInstallPrompt = null;
    document.getElementById('install-btn').classList.add('hidden');
  });

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(() => { /* offline caching just won't be available — app still works online */ });
  }
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
