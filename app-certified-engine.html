<style>
  :root{
    --bg:#050505;
    --gold:#D4AF37;
    --gold-bright:#FFD966;
    --ink:#F0EDE6;
    --ink-dim:#8a8580;
    --panel-line:#231c26;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  body{
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #globeStage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;cursor:grab;touch-action:none;}
  #globeStage:active{cursor:grabbing;}

  .overlay-top{
    position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:20px 22px;pointer-events:none;z-index:5;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.02em;text-shadow:0 2px 12px #000;}
  .brand .mark span{color:var(--gold);}
  .brand .tagline{font-size:10px;letter-spacing:0.16em;color:var(--ink-dim);text-transform:uppercase;}
  .seal{
    border:1px solid var(--gold);border-radius:999px;
    padding:5px 12px;font-size:10px;letter-spacing:0.1em;color:var(--gold);
    text-transform:uppercase;white-space:nowrap;background:rgba(5,5,5,0.4);
  }

  .odometer{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:0.04em;color:var(--gold-bright);
    background:rgba(5,5,5,0.5);border:1px solid rgba(212,175,55,0.35);border-radius:999px;padding:6px 14px;
    pointer-events:none;z-index:5;white-space:nowrap;
  }
  .odometer b{color:var(--ink);font-weight:600;}

  .emotion-badge{
    position:fixed;top:58px;left:50%;transform:translateX(-50%);
    text-align:center;pointer-events:none;z-index:5;
  }
  .emotion-badge .word{
    font-family:Georgia,'Times New Roman',serif;
    font-size:28px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--gold-bright);text-shadow:0 2px 20px rgba(212,175,55,0.4);
    transition:color .3s ease, text-shadow .3s ease;
  }
  .emotion-badge .sub{
    margin-top:5px;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.1em;
    color:var(--ink-dim);text-transform:uppercase;
  }

  .hint{
    position:fixed;bottom:104px;left:50%;transform:translateX(-50%);
    font-family:'Space Grotesk',sans-serif;font-size:10.5px;color:var(--ink-dim);
    background:rgba(5,5,5,0.5);border:1px solid var(--panel-line);border-radius:999px;padding:6px 14px;
    pointer-events:none;z-index:5;white-space:nowrap;
  }

  .profile-select{
    position:fixed;top:64px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:5;align-items:flex-end;
  }
  .chip{
    font-family:'Space Grotesk',sans-serif;
    border:1px solid var(--panel-line);background:rgba(5,5,5,0.5);color:var(--ink-dim);
    padding:6px 12px;border-radius:999px;font-size:11.5px;cursor:pointer;transition:all .15s ease;
    display:inline-flex;align-items:center;
  }
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0;}
  .chip.active{border-color:var(--gold);color:var(--gold-bright);background:rgba(212,175,55,0.1);}
  .chip:hover{color:var(--ink);}

  .transport-bar{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;z-index:6;
  }
  button.btn{
    font-family:'Space Grotesk',sans-serif;
    background:rgba(15,12,18,0.7);border:1px solid var(--panel-line);color:var(--ink);
    padding:11px 18px;border-radius:999px;font-size:13px;cursor:pointer;transition:all .15s ease;
    backdrop-filter:blur(6px);
  }
  button.btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  button.btn:disabled{opacity:.35;cursor:default;pointer-events:none;}
  button.btn.primary{
    background:linear-gradient(180deg, #e6c65c, var(--gold));color:#0d0a05;font-weight:600;border:none;
  }
  button.btn.primary:hover{filter:brightness(1.08);}
  button.btn.round{padding:11px 16px;}
  button.btn.evolve{border-color:rgba(212,175,55,0.5);}

  .export-menu{
    position:fixed;bottom:20px;right:20px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  }
  .export-panel{
    display:none;flex-direction:column;gap:6px;background:rgba(10,8,12,0.85);border:1px solid var(--panel-line);
    border-radius:12px;padding:10px;backdrop-filter:blur(6px);
  }
  .export-panel.open{display:flex;}
  .export-panel button{font-size:12px;padding:8px 14px;}

  .seed-row{
    position:fixed;bottom:56px;left:20px;z-index:6;display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  }
  .seed-input-wrap{display:flex;gap:6px;}
  .seed-input-wrap input{
    font-family:'Space Grotesk',sans-serif;font-size:11px;width:140px;
    background:rgba(5,5,5,0.5);border:1px solid var(--panel-line);color:var(--ink);
    border-radius:999px;padding:8px 12px;outline:none;
  }
  .seed-input-wrap input:focus{border-color:var(--gold);}
  .seed-input-wrap input.bad{border-color:#d9534f;}
  .seed-input-wrap button{font-size:11px;padding:8px 12px;}

  .cta-corner{
    position:fixed;bottom:20px;left:20px;z-index:6;
    font-family:'Space Grotesk',sans-serif;font-size:11px;
  }

  let a = seed >>> 0;

// ---------- Motif-based melody ----------
function generateMotif(rng, emotion){
  const len = randInt(rng,3,6);
  const cell = [];
  let deg = 0;
  const usedSteps = new Set();
  for(let i=0;i<len;i++){
    let step = randInt(rng,0,7), guard=0;
    while(usedSteps.has(step) && guard<8){ step=(step+1)%8; guard++; }
    usedSteps.add(step);
    if(i>0){ const move = pick(rng,[-2,-1,-1,0,1,1,2]); deg += move; }
    cell.push({ step, deg, longer: rng() < Math.min(0.55, 0.22*emotion.noteLenMul) });
  }
  cell.sort((a,b)=>a.step-b.step);
  return cell;
}

function varyMotif(rng, motif, emotion){
  return motif.map(n=>{
    const c = { step:n.step, deg:n.deg, longer:n.longer };
    if(rng() < 0.40) c.deg += pick(rng,[-1,0,0,1]);
    if(rng() < 0.25) c.step = Math.max(0, Math.min(7, c.step + pick(rng,[-1,1])));
    if(rng() < 0.20) c.longer = !c.longer;
    return c;
  });
}

function nearestChordDegree(deg, rootDeg, tones){
  let best = rootDeg, bd = 99;
  for(const oct of [-7,0,7]){
    for(const t of tones){
      const c = rootDeg + t + oct;
      const d = Math.abs(c - deg);
      if(d < bd){ bd = d; best = c; }
    }
  }
  return best;
}

function generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, rootMidi, progression, barDur, swing){
  const events = [];
  const stepDur = barDur/8;
  const lo = genre.leadRange[0], hi = genre.leadRange[1];
  let activeMotif = motif;
  progression.forEach((chord, barIdx)=>{
    if(rng() < emotion.restProb*0.6) return; // phrase breathing: whole-bar rest
    if(rng() < emotion.motifVaryProb) activeMotif = varyMotif(rng, activeMotif, emotion);
    const density = Math.min(1, 0.7*emotion.densityMul);
    const tones = [0,2,4]; if(chord.size >= 4) tones.push(6);
    activeMotif.forEach(note=>{
      if(rng() > density) return;
      let deg = chord.degree + note.deg;
      // strong beats and long notes land on chord tones so the line always agrees with the harmony
      if(note.step === 0 || note.step === 4 || note.longer) deg = nearestChordDegree(deg, chord.degree, tones);
      let start = barIdx*barDur + note.step*stepDur;
      if(note.step % 2 === 1) start += swing*stepDur;
      let pitch = rootMidi + scaleDegreeToSemitone(scaleArr, deg) + genre.octaves.lead;
      pitch = foldInto(pitch, lo, hi);
      const dur = stepDur * (note.longer ? 1.8*emotion.noteLenMul : 0.9*emotion.noteLenMul);
      let vel = emotion.velBase + (rng()*2-1)*emotion.velRange + (note.step % 4 === 0 ? 0.06 : 0);
      vel = clamp(vel, 0.05, 1);
      events.push({ time: humanizeTime(rng,start), midi: pitch, freq: midiToFreq(pitch), dur, vel: humanizeVel(rng,vel) });
    });
  });
  // monophonic line: a note never rings through the next one
  events.sort((a,b)=>a.time-b.time);
  for(let i=0;i<events.length-1;i++){
    const gap = events[i+1].time - events[i].time;
    events[i].dur = Math.max(0.08, Math.min(events[i].dur, gap + 0.02));
  }
  return events;
}

      chord.notes.forEach((note, ni)=>{
        const strum = ni*(0.008 + rng()*0.014);
        const time = Math.max(0, t0 + h.b*beat + strum + (offbeat ? swing*beat/2 : 0) + (rng()-0.5)*0.008);
        const midi = note + oct;
        ev.push({
          time, dur: h.l*beat, midi, freq: midiToFreq(midi),
          vel: clamp(emotion.velBase*0.9*h.v + (rng()-0.5)*0.08, 0.05, 1),
          pan: (n > 1 ? (ni/(n-1) - 0.5) : 0) * 0.5,
        });
      });
    });
  });
  ev.sort((a,b)=>a.time-b.time);
  return ev;
}

// ---------- Genre-specific bass patterns ----------
function generateBass(rng, genre, emotion, progression, barDur, swing){
  const events = [];
  const beatDur = barDur/4;
  const lo = genre.bassLo;
  const baseVel = Math.min(1, 0.72*(emotion.densityMul*0.6+0.4));
  const roots = progression.map(c => foldInto(c.notes[0] + genre.octaves.bass, lo, lo+11));
  progression.forEach((chord, barIdx)=>{
    const root = roots[barIdx];
    const nextRoot = roots[(barIdx+1) % roots.length];
    const third = root + mod12(chord.notes[1] - chord.notes[0]);
    const fifth = root + mod12(chord.notes[2] - chord.notes[0]);
    const t0 = barIdx*barDur;
    function addNote(beatPos, pitch, lenBeats, vel){
      let start = t0 + beatPos*beatDur;
      const twice = Math.round(beatPos*2);
      if(Math.abs(beatPos*2 - twice) < 1e-6 && twice % 2 === 1) start += swing*beatDur/2;
      events.push({ time:humanizeTime(rng,start), midi:pitch, freq:midiToFreq(pitch), dur:beatDur*lenBeats, vel:humanizeVel(rng,vel) });
    }
    switch(genre.bassStyle){
      case 'sustained-root-fifth':
        addNote(0, root, 1.9, baseVel);
        if(rng()<0.5) addNote(2, fifth, 1.8, baseVel*0.85);
        break;
      case 'walking':
      case 'walking-lite':
        addNote(0, root, 0.9, baseVel);
        addNote(1, third, 0.85, baseVel*0.85);
        addNote(2, fifth, 0.85, baseVel*0.85);
        // chromatic approach into the next chord's root
        if(genre.bassStyle==='walking' || rng()<0.6) addNote(3, nextRoot + (rng()<0.5?-1:1), 0.85, baseVel*0.8);
        break;
      case 'sparse-sub':
        addNote(0, root, 2.6, baseVel*1.1);
        if(rng()<0.3) addNote(2.5, root, 1.0, baseVel*0.7);
        break;
      case 'vinyl-groove':
        addNote(0, root, 0.5, baseVel);
        if(rng()<0.7) addNote(0.75, root, 0.3, baseVel*0.6);
        addNote(1.5, fifth, 0.45, baseVel*0.8);
        if(rng()<0.5) addNote(2.5, root, 0.4, baseVel*0.7);
        if(rng()<0.4) addNote(3.5, third, 0.4, baseVel*0.65);
        break;
      case 'driving-pulse':
        for(let e=0;e<8;e++){
          const onBeat = e % 2 === 0;
          if(!onBeat && rng() < 0.12) continue;
          const pitch = (e % 4 === 3 && rng() < 0.5) ? root + 12 : root;
          addNote(e*0.5, pitch, 0.42, baseVel*(onBeat ? 1 : 0.72));
        }
        break;
      default:
        addNote(0, root, 1.8, baseVel);
    }
  });
  events.sort((a,b)=>a.time-b.time);
  return events;
}

// ---------- Idea generation & evolution ----------
// The genre is a pure function of the seed, so a seed code always means the same idea.
function genreOfSeed(seed){
  return GENRE_KEYS[Math.floor(mulberry32(seed)() * GENRE_KEYS.length)];
}

function generateBaseIdea(seed){
  const rng = mulberry32(seed);
  const genreKey = pick(rng, GENRE_KEYS);
  const genre = GENRES[genreKey];
  const emoPool = (rng() < 0.85) ? genre.moods : Object.keys(EMOTIONS);
  const emotionKey = pick(rng, emoPool);
  const emotion = EMOTIONS[emotionKey];
  const scaleKey = pick(rng, genre.scales);
  const scaleArr = SCALES[scaleKey];
  const rootMidi = randInt(rng, genre.rootRange[0], genre.rootRange[1]);
  let tempo = Math.round(randRange(rng, genre.tempoRange[0], genre.tempoRange[1]) + emotion.tempoBias);
  tempo = clamp(tempo, 56, 128);
  const barDur = 60/tempo*4;
  const chordSize = randInt(rng, genre.chordSizeRange[0], genre.chordSizeRange[1]);
  const degrees = pick(rng, genre.progressions);
  const progression = generateProgression(rootMidi, scaleArr, degrees, chordSize);
  const swing = randRange(rng, genre.swingRange[0], genre.swingRange[1]) * emotion.swingMul;
  const motif = generateMotif(rng, emotion);
  const melodyEvents = generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, rootMidi, progression, barDur, swing);
  const bassEvents = generateBass(rng, genre, emotion, progression, barDur, swing);
  const chordEvents = generateChordEvents(mulberry32((seed ^ 0xA5A5A5A5) >>> 0), genre, emotion, progression, barDur, swing);
  return {
    seed, genreKey, emotionKey, scaleKey, rootMidi, tempo, barDur,
    loopDur: barDur*progression.length, progression, chordEvents, melodyEvents, bassEvents,
    motif, swing, chordSize, evolveGen:0,
  };
}

// "Evolve" keeps genre, emotion, scale, key, tempo, harmony and chord comping identical and
// regenerates melody + bass from a motif variation, so the idea keeps its identity while it develops.
function evolveIdea(idea){
  const g = (idea.evolveGen||0) + 1;
  const rng = mulberry32((idea.seed + Math.imul(0x9E3779B1, g)) >>> 0);
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  const scaleArr = SCALES[idea.scaleKey];
  const motif = varyMotif(rng, idea.motif, emotion);
  const melodyEvents = generateMelodyFromMotif(rng, motif, genre, emotion, scaleArr, idea.rootMidi, idea.progression, idea.barDur, idea.swing);
  const bassEvents = generateBass(rng, genre, emotion, idea.progression, idea.barDur, idea.swing);
  return Object.assign({}, idea, { motif, melodyEvents, bassEvents, evolveGen:g });
}

function generateIdea(seed, evolveGen){
  seed = seed >>> 0;
  let idea = generateBaseIdea(seed);
  const n = clamp(evolveGen|0, 0, 64);
  for(let i=0;i<n;i++) idea = evolveIdea(idea);
  return idea;
}
function ideaCode(idea){ return idea.evolveGen ? `${idea.seed}:${idea.evolveGen}` : `${idea.seed}`; }
function parseSeedCode(raw){
  const m = /^\s*(\d{1,10})(?::(\d{1,2}))?\s*$/.exec(raw || '');
  if(!m) return null;
  const seed = Number(m[1]);
  if(seed > 4294967295) return null;
  const gen = m[2] ? Number(m[2]) : 0;
  if(gen > 64) return null;
  return { seed, gen };
}

function effectiveTimbre(genre, emotion){
  return {
    padCutoff: genre.timbre.padCutoff*emotion.filterMul,
    leadCutoff: genre.timbre.leadCutoff*emotion.filterMul,
    bassCutoff: genre.timbre.bassCutoff*Math.min(1.15, emotion.filterMul),
  };
}

// ---------- DSP helpers ----------
// Envelopes are built from explicit linear / exponential ramps (never chained setTargetAtTime,
// which behaves differently between engines and can jump at note-off).
// shape(): the param already sits at v0 at time t0. It decays exponentially to sv (same slope as a
// time-constant "tau" decay), holds, then releases exponentially to floor. Returns the release end time.
function shape(param, t0, hold, v0, sv, tau, r, floor){
  sv = Math.max(sv, floor);
  v0 = Math.max(v0, floor);
  let vRel = v0;
  const dd = (v0 > sv*1.0001) ? tau*Math.log(v0/sv) : 0;
  if(dd > 0){
    if(hold < dd){
      vRel = v0*Math.pow(sv/v0, hold/dd);
      param.exponentialRampToValueAtTime(Math.max(vRel, floor), t0 + hold);
    } else {
      param.exponentialRampToValueAtTime(sv, t0 + dd);
      param.setValueAtTime(sv, t0 + hold);
      vRel = sv;
    }
  }
  const rEnd = t0 + hold + r*1.25;
  if(vRel > floor*1.0001) param.exponentialRampToValueAtTime(floor, rEnd);
  return rEnd;
}
// Attack / decay / sustain / release on a gain. Returns the time the voice may be stopped.
function adsr(param, t, dur, peak, a, d, s, r){
  const hold = Math.max(dur, a + 0.01);
  peak = Math.max(peak, 0.0002);
  param.setValueAtTime(0, t);
  param.linearRampToValueAtTime(peak, t + a);
  const rEnd = shape(param, t + a, hold - a, peak, peak*s, Math.max(0.005, d/3), r, 0.0001);
  param.linearRampToValueAtTime(0, rEnd + 0.01);
  return rEnd + 0.03;
}

const _noiseCache = new WeakMap();
function getNoise(ctx){
  let b = _noiseCache.get(ctx);
  if(b) return b;
  const len = Math.floor(ctx.sampleRate*1.0);
  b = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = b.getChannelData(0);
  const rng = mulberry32(0xBEEF);
  for(let i=0;i<len;i++) d[i] = rng()*2 - 1;
  _noiseCache.set(ctx, b);
  return b;
}
function makeNoiseSource(ctx, t){
  const s = ctx.createBufferSource();
  s.buffer = getNoise(ctx); s.loop = true;
  return s;   // started (and stopped) by finishVoice
}
const _shaperCache = new WeakMap();
function makeShaper(ctx, drive){
  let m = _shaperCache.get(ctx);
  if(!m){ m = {}; _shaperCache.set(ctx, m); }
  const key = String(drive);
  const ws = ctx.createWaveShaper();
  if(!m[key]){
    const n = 2048, curve = new Float32Array(n), norm = Math.tanh(drive);
    for(let i=0;i<n;i++){ const x = i/(n-1)*2 - 1; curve[i] = Math.tanh(drive*x)/norm; }
    m[key] = curve;
  }
  ws.curve = m[key];
  try{ ws.oversample = '2x'; }catch(e){}
  return ws;
}
function makePanner(ctx, v){
  if(!ctx.createStereoPanner) return null;
  const p = ctx.createStereoPanner(); p.pan.value = clamp(v, -1, 1);
  return p;
}
function makeLP(ctx, hz, q){
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.value = clamp(hz, 40, ctx.sampleRate*0.45); f.Q.value = q;
  return f;
}
function finishVoice(ctx, srcs, t, end){
  srcs.forEach(s=>{ s.start(t); s.stop(end); });
}
function outTo(ctx, amp, dest, pan){
  if(pan){ const p = makePanner(ctx, pan); if(p){ amp.connect(p); p.connect(dest); return; } }
  amp.connect(dest);
}

// ---------- Voice kinds ----------
function fmVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan){
  const ks = clamp(600/freq, 0.25, 1.4);                    // brightness keytracking
  const modF = freq*p.ratio;
  const dev = Math.min(p.index*(0.5 + 0.7*vel)*ks*modF, 4500);  // peak frequency deviation (Hz)
  const hold = Math.max(dur, p.a + 0.02);
  const car = ctx.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
  const mod = ctx.createOscillator(); mod.type = 'sine'; mod.frequency.value = modF;
  const modG = ctx.createGain();
  modG.gain.setValueAtTime(dev, t);
  shape(modG.gain, t, hold, dev, dev*p.idxSus, Math.max(0.01, p.idxDecay/3), p.r, 0.01);
  mod.connect(modG); modG.connect(car.frequency);
  const lp = makeLP(ctx, cutoff, 0.5);
  car.connect(lp);
  const srcs = [car, mod];
  if(p.tine && freq*p.tine.ratio < 12000){
    const to = ctx.createOscillator(); to.type = 'sine'; to.frequency.value = freq*p.tine.ratio;
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(Math.max(p.tine.amt*vel, 0.0002), t);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + p.tine.decay*2);
    to.connect(tg); tg.connect(lp);
    srcs.push(to);
  }
  const amp = ctx.createGain();
  lp.connect(amp);
  const end = adsr(amp.gain, t, dur, p.level*(0.25 + vel), p.a, p.d, p.s, p.r);
  outTo(ctx, amp, dest, pan);
  finishVoice(ctx, srcs, t, end);
}

function subVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan){
  const fe = p.f;
  const hold = Math.max(dur, p.a + 0.02, fe.atk + 0.02);
  const lp = makeLP(ctx, cutoff*fe.start, p.q);
  lp.frequency.setValueAtTime(cutoff*fe.start, t);
  lp.frequency.linearRampToValueAtTime(cutoff*fe.peak, t + fe.atk);
  shape(lp.frequency, t + fe.atk, hold - fe.atk, cutoff*fe.peak, cutoff*fe.sus, 0.6, p.r, cutoff*fe.start);
  const srcs = [];
  p.oscs.forEach(o=>{
    const osc = ctx.createOscillator();
    osc.type = o.t;
    osc.frequency.value = freq*Math.pow(2, o.oct||0);
    osc.detune.value = o.c || 0;
    const g = ctx.createGain(); g.gain.value = o.g;
    osc.connect(g);
    const pn = (o.p !== undefined) ? makePanner(ctx, o.p) : null;
    if(pn){ g.connect(pn); pn.connect(lp); } else g.connect(lp);
    srcs.push(osc);
  });
  const amp = ctx.createGain();
  lp.connect(amp);
  const end = adsr(amp.gain, t, dur, p.level*(0.25 + vel), p.a, p.d, p.s, p.r);
  outTo(ctx, amp, dest, pan);
  finishVoice(ctx, srcs, t, end);
}

function leadVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan){
  const hold = Math.max(dur, p.a + 0.03, 0.1);
  const f = p.f;
  const lp = makeLP(ctx, cutoff*f.start, p.q);
  lp.frequency.setValueAtTime(cutoff*f.start, t);
  lp.frequency.linearRampToValueAtTime(cutoff*f.peak, t + 0.08);
  shape(lp.frequency, t + 0.08, hold - 0.08, cutoff*f.peak, cutoff*f.sus, 0.15, p.r, cutoff*f.start*0.6);
  const srcs = [];
  let lfo = null, lfoG = null;
  if(p.vib && p.vib.depth > 0){
    lfo = ctx.createOscillator(); lfo.frequency.value = p.vib.rate;
    lfoG = ctx.createGain();
    lfoG.gain.setValueAtTime(0, t);
    lfoG.gain.setValueAtTime(0, t + p.vib.delay);
    lfoG.gain.linearRampToValueAtTime(p.vib.depth, t + p.vib.delay + 0.25);
    lfo.connect(lfoG);
    srcs.push(lfo);
  }
  p.oscs.forEach(o=>{
    const osc = ctx.createOscillator();
    osc.type = o.t;
    osc.frequency.value = freq*Math.pow(2, o.oct||0);
    if(p.scoop){
      osc.detune.setValueAtTime((o.c||0) + p.scoop, t);
      osc.detune.linearRampToValueAtTime(o.c||0, t + 0.06);
    } else osc.detune.value = o.c || 0;
    if(lfoG) lfoG.connect(osc.detune);
    const g = ctx.createGain(); g.gain.value = o.g;
    osc.connect(g); g.connect(lp);
    srcs.push(osc);
  });
  if(p.breath > 0){
    const ns = makeNoiseSource(ctx, t);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = clamp(freq*3, 800, 6000); bp.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(p.breath*vel*8, t);
    ng.gain.exponentialRampToValueAtTime(p.breath*vel*2, t + 0.15);
    ns.connect(bp); bp.connect(ng); ng.connect(lp);
    srcs.push(ns);
  }
  const amp = ctx.createGain();
  lp.connect(amp);
  const end = adsr(amp.gain, t, dur, p.level*(0.25 + vel), p.a, p.d, p.s, p.r);
  outTo(ctx, amp, dest, pan);
  finishVoice(ctx, srcs, t, end);
}

function bassVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan){
  const hold = Math.max(dur, p.a + 0.02);
  const lp = makeLP(ctx, cutoff*p.f0, 0.9);
  lp.frequency.setValueAtTime(cutoff*p.f0, t);
  shape(lp.frequency, t, hold, cutoff*p.f0, cutoff*p.f1, Math.max(0.01, p.fd/3), p.r, cutoff*Math.min(p.f0, p.f1)*0.9);
  const mix = ctx.createGain();
  const srcs = [];
  p.oscs.forEach(o=>{
    const osc = ctx.createOscillator();
    osc.type = o.t;
    const f = freq*Math.pow(2, o.oct||0);
    if(p.drop){
      osc.frequency.setValueAtTime(f*p.drop, t);
      osc.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    } else osc.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = o.g;
    osc.connect(g); g.connect(mix);
    srcs.push(osc);
  });
  let shaped = mix;
  if(p.drive > 0){ shaped = makeShaper(ctx, p.drive); mix.connect(shaped); }
  shaped.connect(lp);
  const amp = ctx.createGain();
  lp.connect(amp);
  const end = adsr(amp.gain, t, dur, p.level*(0.25 + vel), p.a, p.d, p.s, p.r);
  outTo(ctx, amp, dest, pan);
  if(p.click){
    const ns = makeNoiseSource(ctx, t);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(Math.max(p.click*vel*p.level, 0.00002), t);
    cg.gain.exponentialRampToValueAtTime(0.00001, t + 0.04);
    ns.connect(bp); bp.connect(cg); cg.connect(dest);
    srcs.push(ns);
  }
  finishVoice(ctx, srcs, t, Math.max(end, t + 0.2));
}

function playVoice(ctx, dest, name, freq, t, dur, vel, cutoff, pan){
  const p = VOICES[name];
  if(!p || !isFinite(freq) || !isFinite(t)) return;
  t = Math.max(0, t);
  dur = Math.max(0.05, dur);
  switch(p.kind){
    case 'fm':   return fmVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan);
    case 'sub':  return subVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan);
    case 'lead': return leadVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan);
    case 'bass': return bassVoice(ctx, dest, p, freq, t, dur, vel, cutoff, pan);
  }
}

// ---------- Effects chain ----------
const _irCache = new WeakMap();
function getImpulse(ctx, seconds, damp){
  let m = _irCache.get(ctx);
  if(!m){ m = {}; _irCache.set(ctx, m); }
  const key = seconds + '|' + damp;
  if(m[key]) return m[key];
  const sr = ctx.sampleRate, len = Math.floor(sr*seconds);
  const buf = ctx.createBuffer(2, len, sr);
  const preDelay = Math.floor(sr*0.012), fadeIn = Math.floor(sr*0.006);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    const rng = mulberry32(0xF00D + ch*7919 + Math.round(seconds*100));
    let lp = 0;
    for(let i=preDelay; i<len; i++){
      const t = i/len;
      const c = Math.max(0.05, 0.9*(1 - damp*Math.pow(t, 0.6)));   // darker as the tail decays
      lp += ((rng()*2 - 1) - lp)*c;
      const env = Math.exp(-6.9*t);                                  // -60 dB at the end
      const fi = Math.min(1, (i - preDelay)/fadeIn);
      d[i] = lp*env*fi;
    }
  }
  m[key] = buf;
  return buf;
}

function buildChorus(ctx, amount){
  const input = ctx.createGain(), out = ctx.createGain();
  const nodes = [input, out], lfos = [];
  const dry = ctx.createGain(); dry.gain.value = 1 - amount*0.35;
  input.connect(dry); dry.connect(out); nodes.push(dry);
  if(amount > 0){
    const wet = ctx.createGain(); wet.gain.value = amount*0.6;
    wet.connect(out); nodes.push(wet);
    [[0.019, 0.31, -0.85],[0.026, 0.43, 0.85]].forEach(([base, rate, pan])=>{
      const d = ctx.createDelay(0.1); d.delayTime.value = base;
      const l = ctx.createOscillator(); l.frequency.value = rate;
      const lg = ctx.createGain(); lg.gain.value = 0.0035*(0.5 + amount);
      l.connect(lg); lg.connect(d.delayTime); l.start(0);
      input.connect(d);
      const p = makePanner(ctx, pan);
      if(p){ d.connect(p); p.connect(wet); nodes.push(p); } else d.connect(wet);
      nodes.push(d, lg); lfos.push(l);
    });
  }
  return { input, out, nodes, lfos };
}

function buildChain(ctx, genre, tempo){
  const fx = genre.fx;
  const nodes = [], lfos = [];
  const G = (v)=>{ const g = ctx.createGain(); g.gain.value = v; nodes.push(g); return g; };
  const padIn = G(1), leadIn = G(1), bassIn = G(1), sum = G(1);
  bassIn.connect(sum);
  const chor = buildChorus(ctx, fx.chorus);
  nodes.push(...chor.nodes); lfos.push(...chor.lfos);
  padIn.connect(chor.input); chor.out.connect(sum);
  leadIn.connect(sum);
  // reverb (algorithmic impulse response, real convolution)
  const conv = ctx.createConvolver(); conv.buffer = getImpulse(ctx, fx.revTime, fx.revDamp); nodes.push(conv);
  const padRev = G(fx.padRev), leadRev = G(fx.leadRev), revRet = G(1);
  chor.out.connect(padRev); padRev.connect(conv);
  leadIn.connect(leadRev); leadRev.connect(conv);
  conv.connect(revRet); revRet.connect(sum);
  // tempo-synced dotted-eighth delay on the lead
  const dly = ctx.createDelay(2); dly.delayTime.value = clamp(60/tempo*0.75, 0.05, 1.9); nodes.push(dly);
  const dlySend = G(fx.dlySend), dlp = makeLP(ctx, fx.dlyTone, 0.5), fb = G(fx.dlyFb), dlyRet = G(1), dlyRev = G(0.35);
  nodes.push(dlp);
  leadIn.connect(dlySend); dlySend.connect(dly); dly.connect(dlp);
  dlp.connect(fb); fb.connect(dly);
  dlp.connect(dlyRet); dlyRet.connect(sum);
  dlp.connect(dlyRev); dlyRev.connect(conv);
  // master dynamics: rumble filter, glue compressor, brickwall-ish limiter
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 25; hp.Q.value = 0.5; nodes.push(hp);
  const glue = ctx.createDynamicsCompressor();
  glue.threshold.value = -20; glue.knee.value = 10; glue.ratio.value = 2.5; glue.attack.value = 0.02; glue.release.value = 0.3;
  const makeup = G(0.9);
  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.06;
  // safety: smooth clip so nothing can ever exceed full scale (a compressor alone can overshoot)
  const clip = ctx.createWaveShaper();
  const cc = new Float32Array(4096);
  for(let i=0;i<cc.length;i++){
    const x = i/(cc.length-1)*2 - 1, a = Math.abs(x);
    cc[i] = (a < 0.85 ? x : Math.sign(x)*(0.85 + 0.14*Math.tanh((a-0.85)/0.14)));
  }
  clip.curve = cc;
  const out = G(1);
  nodes.push(glue, lim, clip);
  sum.connect(hp); hp.connect(glue); glue.connect(makeup); makeup.connect(lim); lim.connect(clip); clip.connect(out);
  return {
    padIn, leadIn, bassIn, out,
    dispose(){
      lfos.forEach(l=>{ try{ l.stop(); }catch(e){} });
      nodes.forEach(n=>{ try{ n.disconnect(); }catch(e){} });
    },
  };
}

// ---------- Scheduling ----------
const ALL_PARTS = ['chords','melody','bass'];
function scheduleLoop(ctx, chain, idea, t0, parts){
  parts = parts || ALL_PARTS;
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  const tb = effectiveTimbre(genre, emotion);
  if(parts.includes('chords')) idea.chordEvents.forEach(ev => playVoice(ctx, chain.padIn, genre.timbre.pad, ev.freq, t0+ev.time, ev.dur, ev.vel, tb.padCutoff, ev.pan));
  if(parts.includes('melody')) idea.melodyEvents.forEach(ev => playVoice(ctx, chain.leadIn, genre.timbre.lead, ev.freq, t0+ev.time, ev.dur, ev.vel, tb.leadCutoff, 0.05));
  if(parts.includes('bass'))   idea.bassEvents.forEach(ev => playVoice(ctx, chain.bassIn, genre.timbre.bass, ev.freq, t0+ev.time, ev.dur, ev.vel, tb.bassCutoff, 0));
}

// ---------- Offline render (same chain as live playback) ----------
// Renders two passes and keeps the second, so reverb / delay / release tails wrap
// around and the file loops seamlessly.
async function renderLoopOffline(idea, parts){
  const OfflineCtx = (typeof OfflineAudioContext !== 'undefined') ? OfflineAudioContext : webkitOfflineAudioContext;
  const sr = 44100;
  const loopLen = Math.round(idea.loopDur*sr);
  const off = new OfflineCtx(2, loopLen*2 + 2048, sr);
  const genre = GENRES[idea.genreKey];
  const chain = buildChain(off, genre, idea.tempo);
  chain.out.connect(off.destination);
  scheduleLoop(off, chain, idea, 0, parts);
  scheduleLoop(off, chain, idea, idea.loopDur, parts);
  const rendered = await off.startRendering();
  const chans = [];
  for(let c=0;c<rendered.numberOfChannels;c++){
    chans.push(rendered.getChannelData(c).slice(loopLen, loopLen*2));
  }
  return { channels: chans, sampleRate: sr };
}

// ---------- File encoders ----------
function encodeWavBytes(channels, sampleRate){
  const numCh = channels.length, n = channels[0].length;
  const dataLen = n*numCh*2;
  const buf = new ArrayBuffer(44 + dataLen);
  const view = new DataView(buf);
  const ws = (off, s)=>{ for(let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); view.setUint32(4, 36 + dataLen, true); ws(8,'WAVE');
  ws(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*numCh*2,true); view.setUint16(32,numCh*2,true); view.setUint16(34,16,true);
  ws(36,'data'); view.setUint32(40, dataLen, true);
  let o = 44;
  for(let i=0;i<n;i++){
    for(let c=0;c<numCh;c++){
      let s = channels[c][i];
      if(!isFinite(s)) s = 0;
      s = Math.max(-1, Math.min(1, s));
      view.setInt16(o, s<0 ? s*0x8000 : s*0x7FFF, true);
      o += 2;
    }
  }
  return new Uint8Array(buf);
}

let _crcTable = null;
function crc32(bytes){
  if(!_crcTable){
    _crcTable = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); _crcTable[n] = c >>> 0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// store-only ZIP (WAV does not compress meaningfully)
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), size = f.data.length, crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  let centralSize = 0; central.forEach(c=>{ centralSize += c.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true);
  end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,centralSize,true); end.setUint32(16,offset,true); end.setUint16(20,0,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type:'application/zip' });
}

// ---------- MIDI ----------
function writeVarLen(value){
  const bytes = [value & 0x7F];
  value >>>= 7;
  while(value > 0){ bytes.unshift((value & 0x7F) | 0x80); value >>>= 7; }
  return bytes;
}
function int32(n){ return [(n>>>24)&0xFF,(n>>>16)&0xFF,(n>>>8)&0xFF,n&0xFF]; }
function int16(n){ return [(n>>8)&0xFF, n&0xFF]; }

function buildMidiTrack(events, ppq, bpm, channel, name, withTempo){
  const secToTick = (s)=> Math.round(s * ppq * (bpm/60));
  const bytes = [];
  const nameBytes = Array.from(new TextEncoder().encode(name));
  bytes.push(0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes);
  if(withTempo){
    const mpq = Math.round(60000000/bpm);
    bytes.push(0x00, 0xFF, 0x51, 0x03, (mpq>>16)&0xFF, (mpq>>8)&0xFF, mpq&0xFF);
    bytes.push(0x00, 0xFF, 0x58, 0x04, 4, 2, 24, 8);
  }
  const noteEvents = [];
  events.forEach(ev=>{
    const note = clamp(ev.midi, 0, 127);
    const vel = clamp(Math.round(ev.vel*127), 1, 127);
    const on = secToTick(ev.time);
    const off = Math.max(on + 1, secToTick(ev.time + ev.dur));
    noteEvents.push({ tick:on, order:1, status:0x90 | channel, note, vel });
    noteEvents.push({ tick:off, order:0, status:0x80 | channel, note, vel:0 });
  });
  noteEvents.sort((a,b)=> a.tick - b.tick || a.order - b.order);   // note-offs before note-ons on the same tick
  let last = 0;
  noteEvents.forEach(ne=>{
    bytes.push(...writeVarLen(ne.tick - last), ne.status, ne.note, ne.vel);
    last = ne.tick;
  });
  bytes.push(0x00, 0xFF, 0x2F, 0x00);
  return [0x4D,0x54,0x72,0x6B, ...int32(bytes.length), ...bytes];
}
function buildMidiFile(idea){
  const ppq = 480;
  const t1 = buildMidiTrack(idea.chordEvents, ppq, idea.tempo, 0, 'Chords', true);
  const t2 = buildMidiTrack(idea.melodyEvents, ppq, idea.tempo, 1, 'Melody', false);
  const t3 = buildMidiTrack(idea.bassEvents, ppq, idea.tempo, 2, 'Bass', false);
  const head = [0x4D,0x54,0x68,0x64, ...int32(6), ...int16(1), ...int16(3), ...int16(ppq)];
  return new Uint8Array([...head, ...t1, ...t2, ...t3]);
}

// ---------- App state ----------
let audioCtx = null, masterGain = null, analyser = null;
let chain = null;
let lockedGenreKey = null;
let idea = null;
let isPlaying = false;
let schedulerTimer = null, nextLoopBoundary = 0;
let history = [];
let historyIdx = -1;
let exporting = false;
const MAX_HISTORY = 300;

function $(id){ return document.getElementById(id); }

let toastTimer = null;
function showToast(msg, ms){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  if(ms) toastTimer = setTimeout(()=>el.classList.remove('show'), ms);
}

function ensureAudio(){
  if(audioCtx) return true;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC({ latencyHint:'playback' });
  }catch(e){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e2){ audioCtx = null; showToast('Web Audio is not available in this browser', 4000); return false; }
  }
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
  masterGain.connect(analyser); analyser.connect(audioCtx.destination);
  return true;
}

// ---------- History ----------
function pushHistory(newIdea){
  history = history.slice(0, historyIdx+1);
  history.push(newIdea);
  if(history.length > MAX_HISTORY) history.shift();
  historyIdx = history.length-1;
}

function pickSeed(){
  let seed = randomSeed();
  if(lockedGenreKey){
    for(let i=0;i<400 && genreOfSeed(seed) !== lockedGenreKey;i++) seed = randomSeed();
  }
  return seed;
}

function setIdea(newIdea){
  idea = newIdea;
  refreshUI();
  if(isPlaying) beginIdea();
}
function newIdeaRandom(){
  const i = generateIdea(pickSeed(), 0);
  pushHistory(i);
  setIdea(i);
}
function evolveClicked(){
  if(!idea){ newIdeaRandom(); return; }
  const i = evolveIdea(idea);
  pushHistory(i);
  setIdea(i);
}
function nextIdea(){
  if(historyIdx < history.length-1){ historyIdx++; setIdea(history[historyIdx]); }
  else newIdeaRandom();
}
function prevIdea(){
  if(historyIdx > 0){ historyIdx--; setIdea(history[historyIdx]); }
}

function loadSeedFromInput(){
  const input = $('seedInput');
  const parsed = parseSeedCode(input.value);
  if(!parsed){
    input.classList.add('bad');
    showToast('Enter a seed like 123456 or 123456:2', 2500);
    return;
  }
  input.classList.remove('bad');
  const i = generateIdea(parsed.seed, parsed.gen);
  if(lockedGenreKey && i.genreKey !== lockedGenreKey) lockedGenreKey = null;   // the seed decides the world
  pushHistory(i);
  setIdea(i);
  if(!isPlaying) startPlayback();
}

// ---------- Playback ----------
function retireChain(fade){
  if(!chain || !audioCtx) { chain = null; return; }
  const c = chain; chain = null;
  const now = audioCtx.currentTime;
  try{
    c.out.gain.cancelScheduledValues(now);
    c.out.gain.setValueAtTime(c.out.gain.value, now);
    c.out.gain.linearRampToValueAtTime(0, now + fade);
  }catch(e){}
  setTimeout(()=>c.dispose(), (fade + 0.15)*1000);
}

// (re)start the loop on a fresh signal chain; the old one fades out
function beginIdea(){
  if(!audioCtx) return;
  retireChain(0.3);
  const genre = GENRES[idea.genreKey];
  chain = buildChain(audioCtx, genre, idea.tempo);
  const now = audioCtx.currentTime;
  chain.out.gain.setValueAtTime(0, now);
  chain.out.gain.linearRampToValueAtTime(1, now + 0.04);
  chain.out.connect(masterGain);
  nextLoopBoundary = now + 0.08;
  schedulerTick();
}

function schedulerTick(){
  if(!isPlaying || !chain || !audioCtx) return;
  const now = audioCtx.currentTime;
  if(nextLoopBoundary < now - 0.05) nextLoopBoundary = now + 0.05;   // resumed after a stall
  let guard = 0;
  while(nextLoopBoundary - now < 2.0 && guard++ < 4){
    scheduleLoop(audioCtx, chain, idea, nextLoopBoundary);
    nextLoopBoundary += idea.loopDur;
  }
}

function startPlayback(){
  if(!ensureAudio()) return;
  if(audioCtx.state !== 'running') audioCtx.resume();
  if(!idea) newIdeaRandom();
  isPlaying = true;
  clearInterval(schedulerTimer);
  beginIdea();
  schedulerTimer = setInterval(schedulerTick, 100);
  $('btnPlay').textContent = 'Stop';
}
function stopPlayback(){
  isPlaying = false;
  clearInterval(schedulerTimer);
  retireChain(0.25);
  $('btnPlay').textContent = 'Play';
}

// ---------- The Globe: full-screen, audio-reactive, tap-to-discover, per-world visual identity ----------
let globeStarted = false;
let rotY = 0.4, rotX = 0.35;
const autoSpin = 0.0022;
let dragging = false, lastPX=0, lastPY=0, dragVX=0, lastMoveT=0;
let nodePoints = [];
let flashT = 0;
let timeData = null;
let smoothE = 0;

function fibonacciSphere(n){
  const pts=[];
  const offset = 2/n;
  const increment = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = ((i*offset)-1)+(offset/2);
    const r = Math.sqrt(Math.max(0,1-y*y));
    const phi = i*increment;
    pts.push({ x:Math.cos(phi)*r, y:y, z:Math.sin(phi)*r });
  }
  return pts;
}

function rotatePoint(p, rx, ry){
  const y = p.y*Math.cos(rx) - p.z*Math.sin(rx);
  const z = p.y*Math.sin(rx) + p.z*Math.cos(rx);
  const x = p.x;
  const x2 = x*Math.cos(ry) + z*Math.sin(ry);
  const z2 = -x*Math.sin(ry) + z*Math.cos(ry);
  return { x:x2, y:y, z:z2 };
}

// real signal level from the analyser (0 when nothing is playing)
function audioEnergy(){
  if(!analyser) return 0;
  if(!timeData) timeData = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(timeData);
  let sum=0;
  for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; sum += v*v; }
  return Math.sqrt(sum/timeData.length);
}

function startGlobe(){
  if(globeStarted) return;
  globeStarted = true;
  nodePoints = fibonacciSphere(260);

  const canvas = $('globeStage');
  const ctx2d = canvas.getContext('2d');
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth*dpr);
    canvas.height = Math.round(window.innerHeight*dpr);
  }
  resize(); window.addEventListener('resize', resize);

  function frame(){
    requestAnimationFrame(frame);
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const R = Math.min(w,h)*0.4;
    const visual = GENRES[idea.genreKey].visual;
    const accent = visual.accent, accent2 = visual.accent2;

    ctx2d.fillStyle = visual.bg || '#000';
    ctx2d.fillRect(0,0,w,h);

    const grad = ctx2d.createRadialGradient(cx,cy,R*0.1,cx,cy,R*1.6);
    grad.addColorStop(0, accent+'2e');
    grad.addColorStop(0.6, accent2+'14');
    grad.addColorStop(1, '#00000000');
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0,0,w,h);

    const target = (audioCtx && isPlaying) ? clamp(audioEnergy()*3.2, 0, 1) : 0;
    smoothE += (target - smoothE)*(target > smoothE ? 0.5 : 0.08);
    const energy = smoothE;

    if(!dragging){ rotY += autoSpin*(visual.pulseSpeed||1) + dragVX; dragVX *= 0.94; }

    ctx2d.lineWidth = Math.max(1, dpr*0.7);
    ctx2d.strokeStyle = accent + '30';
    for(let lat=-60; lat<=60; lat+=30){
      ctx2d.beginPath();
      for(let lon=0; lon<=360; lon+=6){
        const rad = lat*Math.PI/180, lonr = lon*Math.PI/180;
        const p = { x:Math.cos(rad)*Math.cos(lonr), y:Math.sin(rad), z:Math.cos(rad)*Math.sin(lonr) };
        const rp = rotatePoint(p, rotX, rotY);
        const px = cx + rp.x*R, py = cy + rp.y*R*0.95;
        if(lon===0) ctx2d.moveTo(px,py); else ctx2d.lineTo(px,py);
      }
      ctx2d.stroke();
    }
    for(let lon=0; lon<360; lon+=30){
      ctx2d.beginPath();
      for(let lat=-90; lat<=90; lat+=6){
        const rad = lat*Math.PI/180, lonr = lon*Math.PI/180;
        const p = { x:Math.cos(rad)*Math.cos(lonr), y:Math.sin(rad), z:Math.cos(rad)*Math.sin(lonr) };
        const rp = rotatePoint(p, rotX, rotY);
        const px = cx + rp.x*R, py = cy + rp.y*R*0.95;
        if(lat===-90) ctx2d.moveTo(px,py); else ctx2d.lineTo(px,py);
      }
      ctx2d.stroke();
    }

    const projected = nodePoints.map((p,i)=>{
      const rp = rotatePoint(p, rotX, rotY);
      const depth = (rp.z+1.3)/2.3;
      return { x: cx + rp.x*R, y: cy + rp.y*R*0.95, depth, alt: i%3===0 };
    }).sort((a,b)=>a.depth-b.depth);

    const glowMul = 0.6 + (visual.glow||0.5);
    projected.forEach(n=>{
      const pulse = 1 + energy*1.8*glowMul*n.depth;
      const size = (0.8 + n.depth*2.4) * pulse * dpr;
      const alpha = (0.15 + n.depth*0.85) * (0.6+energy*0.4);
      ctx2d.beginPath();
      ctx2d.arc(n.x, n.y, Math.max(0.4,size), 0, Math.PI*2);
      ctx2d.fillStyle = n.alt ? accent2 : accent;
      ctx2d.globalAlpha = Math.min(1,alpha);
      ctx2d.fill();
    });
    ctx2d.globalAlpha = 1;

    if(flashT > 0){
      ctx2d.fillStyle = accent + '38';
      ctx2d.globalAlpha = Math.min(1, flashT*0.6);
      ctx2d.fillRect(0,0,w,h);
      ctx2d.globalAlpha = 1;
      flashT -= 0.04;
    }
  }
  requestAnimationFrame(frame);

  let downX=0, downY=0, moved=false;
  canvas.addEventListener('pointerdown', e=>{
    dragging = true; moved = false; dragVX = 0;
    lastPX = downX = e.clientX; lastPY = downY = e.clientY; lastMoveT = performance.now();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  canvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
    if(Math.abs(e.clientX-downX)>4 || Math.abs(e.clientY-downY)>4) moved = true;
    rotY += dx*0.006;
    rotX = clamp(rotX + dy*0.004, -1.2, 1.2);
    dragVX = dx*0.006; lastMoveT = performance.now();
    lastPX = e.clientX; lastPY = e.clientY;
  });
  function endDrag(e, cancelled){
    if(!dragging) return;
    dragging = false;
    if(performance.now() - lastMoveT > 80) dragVX = 0;   // held still before letting go: no fling
    if(!moved && !cancelled){
      if(!ensureAudio()) return;
      nextIdea(); flashT = 1;
      if(!isPlaying) startPlayback();
    }
  }
  canvas.addEventListener('pointerup', e=>endDrag(e,false));
  canvas.addEventListener('pointercancel', e=>endDrag(e,true));
}

// ---------- Exports ----------
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function fileTag(){ return `${idea.genreKey}-${idea.emotionKey}-seed${ideaCode(idea).replace(':','e')}-${idea.tempo}bpm`; }

async function runExport(label, fn){
  if(exporting) return;
  exporting = true;
  $('exportPanel').classList.remove('open');
  showToast(`Rendering ${label}…`);
  try{ await fn(); showToast(`${label} saved`, 2200); }
  catch(e){ console.error(e); showToast(`Export failed: ${(e && e.message) || e}`, 5000); }
  finally{ exporting = false; }
}

function exportWav(){
  const snap = idea;
  return runExport('WAV', async ()=>{
    const r = await renderLoopOffline(snap, ALL_PARTS);
    downloadBlob(new Blob([encodeWavBytes(r.channels, r.sampleRate)], { type:'audio/wav' }), `frequency-oasis-${fileTag()}-loop.wav`);
  });
}
function exportStems(){
  const snap = idea, tag = fileTag();
  return runExport('stems', async ()=>{
    const files = [];
    for(const [part, name] of [['chords','chords'],['melody','melody'],['bass','bass']]){
      const r = await renderLoopOffline(snap, [part]);
      files.push({ name:`frequency-oasis-${tag}-${name}.wav`, data: encodeWavBytes(r.channels, r.sampleRate) });
    }
    downloadBlob(makeZip(files), `frequency-oasis-${tag}-stems.zip`);
  });
}
function exportMidi(){
  downloadBlob(new Blob([buildMidiFile(idea)], { type:'audio/midi' }), `frequency-oasis-${fileTag()}.mid`);
  showToast('MIDI saved', 1800);
}
function exportSeed(){
  const payload = {
    seedCode: ideaCode(idea), seed: idea.seed, evolve: idea.evolveGen || 0,
    genre: idea.genreKey, emotion: idea.emotionKey, scale: idea.scaleKey,
    rootMidi: idea.rootMidi, key: NOTE_NAMES[mod12(idea.rootMidi)], tempo: idea.tempo, chordSize: idea.chordSize,
    swing: Number(idea.swing.toFixed(3)),
  };
  downloadBlob(new Blob([JSON.stringify(payload,null,2)], { type:'application/json' }), `frequency-oasis-seed-${ideaCode(idea).replace(':','e')}.json`);
  showToast('Seed saved', 1800);
}

// ---------- UI wiring ----------
function refreshUI(){
  const genre = GENRES[idea.genreKey];
  const emotion = EMOTIONS[idea.emotionKey];
  $('emotionWord').textContent = emotion.label;
  $('emotionSub').textContent =
    `${genre.label} · ${idea.tempo} bpm · ${NOTE_NAMES[mod12(idea.rootMidi)]} ${scaleLabel(idea.scaleKey)}` +
    (idea.evolveGen ? ` · evolve ${idea.evolveGen}` : '');
  $('odometer').innerHTML =
    `Discovery <b>${historyIdx+1}</b> · Seed <b>${ideaCode(idea)}</b> of <b>4,294,967,296</b> possible worlds`;
  $('seedInput').value = ideaCode(idea);
  $('seedInput').classList.remove('bad');
  $('btnPrev').disabled = historyIdx <= 0;
  renderGenreChips();
}
function renderGenreChips(){
  const wrap = $('genreSelect');
  wrap.innerHTML = '';
  const choose = (key)=>{
    if(!ensureAudio()) return;
    lockedGenreKey = key;
    newIdeaRandom();
    if(!isPlaying) startPlayback();
  };
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (!lockedGenreKey ? ' active' : '');
  allChip.textContent = 'All Worlds';
  allChip.onclick = ()=>choose(null);
  wrap.appendChild(allChip);
  GENRE_KEYS.forEach(key=>{
    const g = GENRES[key];
    const chip = document.createElement('button');
    chip.className = 'chip' + (lockedGenreKey===key ? ' active' : '');
    chip.innerHTML = `<span class="dot" style="background:${g.visual.accent}"></span>${g.label}`;
    chip.onclick = ()=>choose(key);
    wrap.appendChild(chip);
  });
}

$('btnPlay').onclick = ()=>{ if(isPlaying) stopPlayback(); else startPlayback(); };
$('btnNext').onclick = ()=>{ if(!ensureAudio()) return; nextIdea(); if(!isPlaying) startPlayback(); };
$('btnPrev').onclick = ()=>{ if(!ensureAudio()) return; prevIdea(); if(!isPlaying) startPlayback(); };
$('btnEvolve').onclick = ()=>{ if(!ensureAudio()) return; evolveClicked(); if(!isPlaying) startPlayback(); };
$('btnLoadSeed').onclick = ()=> loadSeedFromInput();
$('seedInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadSeedFromInput(); });
$('btnExportToggle').onclick = ()=>{ $('exportPanel').classList.toggle('open'); };
$('btnExportWav').onclick = ()=>{ exportWav(); };
$('btnExportStems').onclick = ()=>{ exportStems(); };
$('btnExportMidi').onclick = ()=>{ exportMidi(); $('exportPanel').classList.remove('open'); };
$('btnExportSeed').onclick = ()=>{ exportSeed(); $('exportPanel').classList.remove('open'); };

// keyboard: Space play/stop, ← → previous/next, E evolve
document.addEventListener('keydown', e=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.code === 'Space'){ e.preventDefault(); $('btnPlay').click(); }
  else if(e.key === 'ArrowRight'){ $('btnNext').click(); }
  else if(e.key === 'ArrowLeft'){ $('btnPrev').click(); }
  else if(e.key === 'e' || e.key === 'E'){ $('btnEvolve').click(); }
});

// if the browser suspended audio (tab switch, phone call, iOS interruption), resume on the next touch
document.addEventListener('pointerdown', ()=>{
  if(audioCtx && isPlaying && audioCtx.state !== 'running'){ try{ audioCtx.resume(); }catch(e){} }
}, true);

// ---------- Init ----------
idea = generateIdea(randomSeed(), 0);
history = [idea]; historyIdx = 0;
refreshUI();
startGlobe(); // the globe renders immediately; audio starts on the first interaction
</script>
</body>
