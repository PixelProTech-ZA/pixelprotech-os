<style>
:root{--bg:#17191c;--s:#22262b;--s2:#2b3036;--ln:#394047;--tx:#e8e6e1;--mu:#a3a8ad;--ac:#e0a43a;--rd:#e5675a;--ok:#6fbf8b}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:rgba(23,25,28,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
header img{width:34px;height:34px}header b{display:block;line-height:1.1}header small{color:var(--mu)}header .inst{margin-left:auto}header [data-a=lock]{margin-left:8px}header .inst[hidden]+[data-a=lock]{margin-left:auto}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{overscroll-behavior-y:none}#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .6s}#lock,#shell{position:relative;z-index:1}.hero{min-height:24vh;display:flex;flex-direction:column;justify-content:flex-end}@media(max-width:380px){header small{display:none}}nav button{min-height:56px}
main{max-width:780px;margin:0 auto;padding:16px 14px}
h1{font-size:1.45rem;margin:.2em 0 .4em}h2{font-size:1.1rem;margin:1.2em 0 .5em}h3{font-size:1rem;margin:0}
.card{background:rgba(34,38,43,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}.warn{border-left:3px solid var(--ac);padding-left:10px;color:#f0d9a8}.urg{border-left:3px solid var(--rd)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;max-width:100%}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#17191c;border-color:var(--ac);font-weight:600}button.d{border-color:var(--rd);color:var(--rd)}
input,select,textarea{width:100%;margin:2px 0 10px}input[type=checkbox]{width:auto;margin:0}label{display:block;font-size:.88rem;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.grid .card{margin:0;text-align:left;cursor:pointer}
.grid .card i{font-style:normal;color:var(--ac);font-weight:700;font-size:.8rem;letter-spacing:.08em}
.bar{height:6px;background:var(--s2);border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 2px;font-size:.78rem;color:var(--mu)}nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ln)}.step:last-child{border:0}.step.done span{text-decoration:line-through;color:var(--mu)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.tag.r{border-color:var(--rd);color:var(--rd)}
#lock{max-width:380px;margin:12vh auto;padding:0 18px;text-align:center}#lock img{width:84px}#lock input{text-align:center;letter-spacing:.4em;font-size:1.4rem}
a{color:var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
@media print{#fx{display:none}body{background:#fff;color:#000;padding:0}header,nav,.np{display:none!important}.card{background:#fff;border:1px solid #888;color:#000}.mu,.warn{color:#333}a{color:#000}}
</style></head><body>
